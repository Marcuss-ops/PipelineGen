# docker-compose.test-postgres.yml — standalone PostgreSQL 18 + pgvector
# for local media-domain parity/integration tests.
#
# Usage:
#   docker compose -f docker-compose.test-postgres.yml up -d --wait
#   TEST_POSTGRES_DSN=postgres://pipelinegen:pipelinegen@localhost:16432/pipelinegen_media_test?sslmode=disable \
#     go test ./internal/platform/postgres/media/...
#   docker compose -f docker-compose.test-postgres.yml down --volumes
#
# Port 16432 avoids colliding with any production PostgreSQL (5432).
# This mirrors the docker-compose.test-qdrant.yml precedent: ephemeral
# lifecycle (no host volume binding), test-only, not part of the main
# PipelineGen stack. Persistence uses a named volume so --wait health
# checks survive restarts within one test session; `down --volumes`
# clears it.
#
# Image: pgvector/pgvector:pg18 — PostgreSQL 18 + pgvector 0.8.x in one
# image (the current stable major per the PostgreSQL versioning policy;
# PostgreSQL 19 remains beta).
#
# Make target: make test-postgres

services:
  postgres-test:
    image: pgvector/pgvector:pg18
    container_name: pipelinegen-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: pipelinegen
      POSTGRES_PASSWORD: pipelinegen
      POSTGRES_DB: pipelinegen_media_test
    ports:
      - "16432:5432"
    volumes:
      # PostgreSQL 18+ image convention: mount /var/lib/postgresql (not
      # .../data) so pg_upgrade --link works across major upgrades.
      - postgres-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelinegen -d pipelinegen_media_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-test-data:
    # Fresh name per test-infra generation; `make test-postgres-down`
    # clears it with --volumes.
