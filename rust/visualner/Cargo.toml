[package]
name = "visualner"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "visualner"
path = "src/main.rs"

[dependencies]
rust_icu_sys = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
rust_icu_uloc = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
rust_icu_unum = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
