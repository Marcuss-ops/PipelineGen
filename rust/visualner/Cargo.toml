[package]
name = "visualner"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "visualner"
path = "src/main.rs"

[dependencies]
# ICU4C is the SINGLE spellout backend (see rust/README.md, "Decision: ICU is
# the single spellout backend"): deliberately NOT behind an optional feature,
# because disabling it would silently degrade number-word entity extraction.
rust_icu_sys = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
rust_icu_uloc = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
rust_icu_unum = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }
serde = { workspace = true }
serde_json = { workspace = true }
ndjson-stdio = { workspace = true }
semantic-core = { workspace = true }
udpipe-rs = "0.1"
rust_icu_ubrk = { version = "5.8.0", default-features = false, features = ["icu_version_in_env", "renaming"] }

[lints]
workspace = true
