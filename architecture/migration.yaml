      status_note: "Onda 5 PR 2 landed. Exit gate satisfied: no references to internal/jobs/, internal/outboxhandlers/, internal/application/jobbroker/, or internal/application/workerassets/ remain in the codebase. Four files in-scope: cmd/worker/main.go (worker subpkg import + appjobs.Broker + WorkerCapabilities/RegisterWorkerCommand/HeartbeatCommand migrated to appjobs.*), internal/infrastructure/jobs/local/broker.go (job.Store/Command types to appjobs.*, StatusCancelled to domainjob.*), internal/infrastructure/remote/jobbrokerclient/client.go (HTTP client migrated to appjobs.* — symmetric to handler.go Broker interface), internal/api/workers/handler.go (workerassets alias to internal/application/jobs/assets; Broker interface and body migrated to appjobs.*). Note: cmd/server/main.go does not exist at HEAD — the actual server wiring is internal/app/dependencies.go + internal/app/bootstrap.go (both already use appjobs and required no edits). Pre-existing build errors in internal/api/job.go and internal/infrastructure/database/sqlite/workernodes_repository.go are PR1 residue (perl-sed syntax issues) and not in PR2 scope per migration.yaml needs_list."
      fixed:
