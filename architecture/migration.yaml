    - internal/application/assets
  exit_gate: "rg 'internal/(assets|artifacts|core/assetop|core/audio|core/destination|core/embedding|core/processor|core/scoring)' --type go | grep -vE ':\\s*\\d+\\s*:\\s*//' returns zero (7 doc-only residuals listed below)."
  residuals:
