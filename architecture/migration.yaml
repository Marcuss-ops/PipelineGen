# PipelineGen — Active Migration Plan
# -----------------------------------------------------------------------------
# Each wave maps a current legacy path to its canonical owner (see
# ownership.yaml). Status decreases monotonically: pending → in_progress → done.
#
# Rules:
#   - The number of `pending` entries MUST decrease over time.
#   - Each wave carries an exit_gate that the ratchet checker can verify.
#   - No backwards entry: once a wave is done, it does not reappear.
#
# Last baseline: cleanup-wave-00-final.
# Version: 1 (YAML list of waves; metadata embedded in comment header above).
# Policy ref: architecture/ownership.yaml.
# Note: top-level is a YAML LIST (not a mapping) so the per-wave `- id:` flow stays valid.
# -----------------------------------------------------------------------------

# ── Wave 0 — Baseline snapshot ───────────────────────────────────────────────

- id: 0
  title: Baseline snapshot
  status: in_progress
  artifacts:
    - architecture/ownership.yaml
    - architecture/migration.yaml
    - architecture/packages-before.txt
    - architecture/imports-before.txt
    - scripts/archcheck/baseline.json
  exit_gate: "All artifacts present; archcheck captures baseline.json."

# ── Wave 1 — Ratchet guardrail ───────────────────────────────────────────────

- id: 1
  title: Ratcheting cleanup guard
  status: done
  description: |
    scripts/archcheck runs in ratchet mode: accepts current violations only,
    forbids new directories, new aliases, new wrappers, new os/exec calls.
    ratchet count is monotone-decreasing per rule.
  implemented_in: scripts/archcheck/main.go
  exit_gate: "go run ./scripts/archcheck exits 0 baseline-on-baseline."
  blocked_by: [0]

# ── Wave 2 — Empty directories removal ───────────────────────────────────────

- id: 2
  title: Empty directories removal
  status: in_progress
  candidates:
    - ./internal/admin
    - ./internal/media/repository
    - ./.blackboxcli  # kept: external tool artifact, not part of repo
  exit_gate: "find . -type d -empty -not -path './.git/*' -not -path './data/*' returns only ./.blackboxcli."

# ── Wave 3 — Mega-package infrastructure → pkg/* ─────────────────────────────

- id: 3
  title: infrastructure root → pkg/*
  status: done
  rationale: |
    Files at internal/infrastructure/<root>.go (corid, retry, ptrutil, defaults,
    sliceutil, sqlutil, textutil, timeutil, urlutil, group, safe, concurrent,
    similarity, etc.) were extracted into pkg/<x> with zero wrappers.
  pkg_packages:
    - pkg/concurrent
    - pkg/corid
    - pkg/defaults
    - pkg/hashutil
    - pkg/pathutil
    - pkg/ptrutil
    - pkg/retry
    - pkg/similarity
    - pkg/sliceutil
    - pkg/sqlutil
    - pkg/testutil
    - pkg/textutil
    - pkg/timeutil
    - pkg/urlutil
    - pkg/veloxclient
  exit_gate: "find internal/infrastructure -maxdepth 1 -name '*.go' returns empty."

# ── Wave 4A — Asset/Media domain unification ─────────────────────────────────

- id: "4A"
  title: Canonical asset model + ports
  status: pending
  from:
    - internal/assets
    - internal/artifacts
    - internal/domain/media
    - internal/core/assetop
    - internal/core/audio
    - internal/core/destination
    - internal/core/embedding
    - internal/core/processor
    - internal/core/scoring
  to:
    - internal/domain/asset
    - internal/application/assets
  exit_gate: "rg 'internal/(assets|artifacts|domain/media|core/assetop|core/audio|core/destination|core/embedding|core/processor|core/scoring)' --type go returns zero."

