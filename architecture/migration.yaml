  title: Remove internal/core + internal/domain/media
  status: done
  description: |
    internal/core/ rimosso come root legacy. I quattro sotto-package
    pianificati sono stati migrati:
      • internal/core/lifecycle    → internal/application/assets/lifecycle/
      • internal/core/maintenance  → internal/application/assets/maintenance/
