# PipelineGen — Active Migration Plan
# -----------------------------------------------------------------------------
# Each wave maps a current legacy path to its canonical owner (see
# ownership.yaml). Status decreases monotonically: pending → in_progress → done.
#
# Rules:
#   - The number of `pending` entries MUST decrease over time.
#   - Each wave carries an exit_gate that the ratchet checker can verify.
#   - No backwards entry: once a wave is done, it does not reappear.
#
# Last baseline: cleanup-wave-00-final.
# Version: 1 (YAML list of waves; metadata embedded in comment header above).
# Policy ref: architecture/ownership.yaml.
# Note: top-level is a YAML LIST (not a mapping) so the per-wave `- id:` flow stays valid.
# -----------------------------------------------------------------------------

# ── Wave 0 — Baseline snapshot ───────────────────────────────────────────────

- id: 0
  title: Baseline snapshot
  status: in_progress
  artifacts:
    - architecture/ownership.yaml
    - architecture/migration.yaml
    - scripts/archcheck/grandfathered_allowlist.json
  exit_gate: "All artifacts present; archcheck focused gate passes."

# ── Wave 1 — Ratchet guardrail ───────────────────────────────────────────────

- id: 1
  title: Ratcheting cleanup guard
  status: done
  verified_zero: true
  description: |
    scripts/archcheck runs in ratchet mode: accepts current violations only,
    forbids new directories, new aliases, new wrappers, new os/exec calls.
    ratchet count is monotone-decreasing per rule.
  implemented_in: scripts/archcheck/main.go
  exit_gate: "go run ./scripts/archcheck exits 0 baseline-on-baseline."
  blocked_by: [0]

# ── Wave 2 — Empty directories removal ───────────────────────────────────────

