      introduction_date: 2026-04
      removal_date: never
      tracking_issue: documentation-only
      compatibility_test: |
        `state.Valid()` returns false on every legacyState* value (covered by
        index_state_test.go). Constants exist solely so future anti-corruption
        tests can reference them by name.
      usage_metric: |
        0 callers. Private package-level visibility; appear only in comments
        within the same file.
