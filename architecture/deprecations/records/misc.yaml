        Cross-refs:
          - AGENTS.md Git-Lesson-2: direct-to-main workflow.
          - AGENTS.md Pattern 9 (Dispatcher.Enqueue): typed job emission.
          - AGENTS.md Pattern 11 (Atomic CompleteJob + idempotency): the
