        must explicitly reject pre-migration values. CI gate does NOT flag
        never-removal entries.
    - id: PR-JOB-STATUS-DEFENSIVE
      owner_capability: internal/platform/health
      exact_symbol: jobs_checker.go::livenessQuery LOWER(status) IN ('running','leased','pending')
      file: internal/platform/health/jobs_checker.go
      file_line: "78"
      replacement: |
        livenessQuery no LOWER() fold; rely on canonical migration 066/070
        uppercase job statuses (PENDING|LEASED|RUNNING|SUCCEEDED|FAILED|CANCELLED)
      introduction_date: 2026-04
      removal_date: 2026-Q3
      tracking_issue: 'PR-JOB-STATUS-UPPERCASE-MIGRATION (owner: internal/platform/sqlite/jobs)'
      compatibility_test: |
        After data migration writes all jobs.status as UPPERCASE, remove the
        LOWER() fold in livenessQuery and re-run `go test ./internal/platform/health/... -short`.
      usage_metric: |
        Until the data migration ships, zero usages of legacy lowercase status
        literals remain in application code; the SQL fold is the only defensive read.
      migration_phase: BACKFILL
      status: in_progress
      notes: |
        Per godlike/07 §"Forbidden compatibility techniques", the defensive READ
        is tracked for elimination via the data migration ticket, not via permanent
        SQL logic. Pre-flight: `SELECT COUNT(*) FROM jobs WHERE LOWER(status) IN
        ('running','failed','completed')` MUST return 0 before CUTOVER.
