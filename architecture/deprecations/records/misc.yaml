    - id: REMOTE-COMPLETE-LEGACY
      owner_capability: internal/application/jobs/worker
      exact_symbol: |
        tools.Complete (the legacy fallback path in runner.go::runLease
        for artifact-producing jobs). Called when
        `r.registry.ProducesArtifacts(job.Type)` returns false OR when
        the registry is nil/unwired:
          `return tools.Complete(jobCtx, resultJSON)`  // runner.go:289
        Post-Azione 7 (July 2026), artifact-producing jobs MUST branch
        through `tools.CompleteWithArtifacts` instead — the legacy
        `tools.Complete` path silently drops asset records, locations,
        and outbox events (no fake-availability per godlike/07).
      file: internal/application/jobs/worker/runner.go + internal/application/jobs/worker/tools.go
      file_line: runner.go:289 (tools.Complete call), runner.go:599 (Azione 7 ProducesArtifacts branch), tools.go:46 (Complete method body)
      replacement: |
        tools.CompleteWithArtifacts (Azione 6 + Azione 7, July 2026).
        The registry-driven branch at runner.go:599 routes artifact-producing
        jobs through the JobFinalizer spine:
          1. UpdateJobToSucceededCAS (atomic status flip)
          2. InsertResultOnConflict (idempotency on jobID+attempt+resultHash)
          3. PersistArtifactMap (job_artifacts rows)
          4. InsertAssetLocations (asset_locations rows, one per artifact)
          5. InsertOutboxEnvelope (job.completed + artifact.<kind>.uploaded events)
        All 5 steps execute in a single SQLite TX; partial failure rolls back
        the entire batch per godlike/07 no-fake-availability.
        Callers: the runner.go::runLease Azione 7 branch reads
        `r.registry.ProducesArtifacts(job.Type)` and calls
        `tools.CompleteWithArtifacts(jobCtx, resultJSON, publishedJSON, nil)`.
      introduction_date: 2026-04
      removal_date: "2026-09-26"
      tracking_issue: |
        CUTOVER-COMPLETE-WITH-ARTIFACTS Azione 16c (this deprecation record).
        Sibling Azioni:
          - Azione 6: CompleteWithArtifactsService (shipped, commit 2bf7e865).
          - Azione 7: Runner terminal branch via ProducesArtifacts (CUTOVER phase).
        Wave-tracker: architecture/current.yaml#CUTOVER-COMPLETE-WITH-ARTIFACTS.
        Cross-ref: architecture/action-plans/2026-07-04-CUTOVER-COMPLETE-WITH-ARTIFACTS.md.
      compatibility_test: |
        Five-layer defence mirroring DRIVE-005-FIELDS / PR-CLIP-RAW-MUTATIONS:
          (a) `rg 'tools\.Complete\(jobCtx, resultJSON\)' internal/application/jobs/worker/`
              returns 1 hit (the legacy fallback at runner.go:289). After CONTRACT
              (2026-09-26), the same ripgrep returns 0 hits for artifact-producing
              callers.
          (b) `rg 'tools\.CompleteWithArtifacts\(' internal/application/jobs/worker/`
              returns 1 hit (the Azione 7 branch at runner.go:599). This is the
              canonical path; drift away from it is a build failure.
          (c) `rg 'ProducesArtifacts' internal/application/jobs/worker/` returns
              1 hit (the registry-driven branch). The registry is the SSOT for
              the artifact-vs-legacy decision per godlike/06.
          (d) `go build ./internal/application/jobs/worker/...` exits 0
              pre- and post-CUTOVER (the legacy Complete method stays available
              for non-artifact jobs; only the ARTIFACT-PRODUCING branch is
              deprecated).
          (e) `scripts/ci-architectural-checks.sh` Check 53/54 forward-prevention
              bans raw-string `job.Type == "script.generate"` patterns after
              Azione 7 lands (enforces the registry-driven branch).
      usage_metric: |
        Audit baseline (2026-07-04, post-Azione 6, pre-Azione 7):
          - tools.Complete(jobCtx, resultJSON) calls at runner.go:289 : 1
            (the legacy fallback for ALL non-artifact jobs + artifact
            jobs when ProducesArtifacts is unwired).
          - tools.CompleteWithArtifacts(...) calls at runner.go:599 : 1
            (the Azione 7 branch for artifact jobs).
          - r.registry.ProducesArtifacts(job.Type) reads : 1 (the branch gate).
        Post-CUTOVER (2026-09-01): the legacy Complete path serves only
        non-artifact jobs (ProducesArtifacts=false). Artifact-producing
        jobTypes always route through CompleteWithArtifacts.
        Post-CONTRACT (2026-09-26): the legacy Complete fallback for
        artifact jobs is physically removed; tools.Complete remains
        available for non-artifact-producing jobTypes only.
      migration_phase: EXPAND
      status: in_progress
      notes: |
        Per godlike/07 §"Migration sequence", this record enters at EXPAND
        because the canonical replacement (CompleteWithArtifacts) already
        exists (Azione 6 shipped as commit 2bf7e865 on origin/main) AND
        the legacy path still serves non-artifact jobs. The CUTOVER phase
        (Azione 7) flips the branch to registry-driven; CONTRACT (2026-09-26)
        removes the legacy artifact-producing fallback entirely.

        godlike/06 SSOT: the Tools.Complete and Tools.CompleteWithArtifacts
        methods are the single canonical owner of "worker-side job completion"
        fact. CompleteWithArtifacts is the sole path for artifact-producing
        jobs; Complete is the sole path for non-artifact jobs.

        godlike/07 no-fake-availability: the pre-Azione-7 runner.go always
        called tools.Complete regardless of job type — artifact jobs silently
        completed without asset records, locations, or outbox events. The
        Azione 7 branch (ProducesArtifacts → CompleteWithArtifacts) closes
        this gap: artifact jobs now fail-closed if the registry is unwired
        (typed ErrHandlerNotRegistered, not a silent drop of artifacts).

        Sibling-record delineation:
          - DRIVE-005-FIELDS (record #16 above): DriveBundle raw SDK removal.
            Same CONTRACT deadline (2026-09-26, Wave 14 gate).
          - CUTOVER-COMPLETE-WITH-ARTIFACTS (architecture/current.yaml):
            wave-tracker entry with 18 linked_issues; this deprecation
            record is Azione 16c within that wave.

        Cross-refs:
          - AGENTS.md Git-Lesson-2: direct-to-main workflow.
          - AGENTS.md Pattern 9 (Dispatcher.Enqueue): typed job emission.
          - AGENTS.md Pattern 11 (Atomic CompleteJob + idempotency): the
            Single-TX chain that CompleteWithArtifacts extends.
