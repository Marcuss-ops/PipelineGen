      migration_phase: CONTRACT
      status: removed
      notes: |
        Three legacy port stragglers are GO-TYPE-ALIASED to the
        canonical Fase 9 SSOT in internal/application/translation/legacy.go.
        Go 1.9+ type aliases on interfaces are structurally
        transparent — the alias and the canonical declaration
        share identical method sets, so existing compile-time
        assertions like `var _ MetadataTranslator = (*mockTranslatorFailingTranslate)(nil)`
        compile unchanged because Mock satisfies both identically.

        The OllamaTranslator concrete satisfies all 4 ports by
        implementing 4 method bodies internally (3 thin delegations
        to gen.TranslateTextWithModel on the legacy port + 1 DTO-in/
        DTO-out translation method on the canonical port). This
        ONE-concrete design is the godlike/06 "one owner per fact"
        pattern at the translation boundary — no two adapters
        implement overlapping translation logic.

        Why a single umbrella ID rather than 3 split IDs:
          - All 3 legacy ports share the same OllamaTranslator concrete.
          - All 3 are declared as type aliases in the same commit.
          - All 3 reach the same CUTOVER-phase trigger gate
            (zero pre-removal callers of the legacy methods).
          - Splitting into 3 IDs would triple the audit-footprint
            without adding information; the umbrella ID keeps the
            manifest scan-readable.

        Cross-refs (chain of closures):
          - godlike/06 §"One owner per fact" : *application/translation.OllamaTranslator
            is the canonical owner of the ollama-translation fact.
            The 3 legacy interfaces + the canonical TranslationPort
            are 4 views onto the SAME concrete, exercising the
            implicit-interface rule.
          - godlike/07 §"Migration sequence" : EXPAND phase begins
            with the alias declarations + canonical concrete ship
            + composition-root wire-up. BACKFILL / CUTOVER / CONTRACT
            unfold as the migration window matures.
          - godlike/07 §"No fake availability" : the legacy methods
            on OllamaTranslator (TranslateText +
            TranslateTextWithModel + GenerateVideoMetadataWithModel)
            delegate to gen transparently — no separate "adapter
            doing partial work" layer.

        Migration-window scheduling (per Fase 9 step roadmap, post-closure):
          - EXPAND      : shipped (2026-07-08) — canonical TranslationPort +
            3-typed-alias legacy surface + OllamaTranslator canonical
            concrete + composition-root wire-up.
          - BACKFILL    : shipped (Fase 9 step 3, 2026-07-08) — honour
            Temperature / MaxTokens + cmd.ModelHints typed-errors +
            voiceover typewriter aliases retired.
          - CUTOVER     : shipped (Fase 9 step 4, 2026-07-08) — drop
            legacy field population at composition root.
          - CONTRACT    : shipped (Fase 9 step 5, 2026-07-08) — physical
            removal of legacy.go + 3 of the legacy methods on
            OllamaTranslator + alias type declarations.
