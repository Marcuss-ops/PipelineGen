deprecations:
    - id: DRIVE-ADMIN-TO-FILELIFECYCLE-MIGRATION
      owner_capability: internal/infrastructure/drive
      exact_symbol: |
        Admin.TrashFile / Admin.DeleteFile / Admin.RenameFile — deprecated call sites
        in 4 application-layer adapters migrated to drive.FileLifecycle.{Trash,Delete,Rename}.
        PR-DRIVE-CLEANUP (July 2026): the 4 adapters FAIL-CLOSED with hard-error typed-sentinel
        when FileLifecycle is nil (no graceful Admin fallback remains). The scanner
        `percheck_driveaccess.go` enforces NO direct `drive.Admin` / `*drive.Admin` /
        `drive.NewDriveServiceFromFiles(` references in internal/application/** or
        internal/api/** (allowlisted only at internal/app/ and infrastructure/drive/).
      file: |
        internal/app/clips_adapters_drive.go + internal/app/adapters_voiceover_publisher.go +
        internal/app/adapters_infra.go + internal/app/module_media_ingest.go +
        cmd/archcheck/scan/percheck_driveaccess.go (scanner enforcement) +
        architecture/deprecations.yaml (this entry).
      file_line: various (4 adapters + 3 construction sites + scanner + manifest)
      replacement: |
        drive.FileLifecycle.{Trash,Delete,Rename} — the canonical Pattern 0 port for
        file-lifecycle Drive ops. All 4 adapters route through FileLifecycle strictly;
        any nil-lifecycle call fails closed with the typed sentinel
        `ErrLifecycleNotWired` (or per-adapter equivalent) per godlike/07
        NO-FAKE-AVAILABILITY. The composition root (internal/app/) is the SOLE
        wire site for both Admin (folder-CRUD) and FileLifecycle (file ops).
      introduction_date: "2026-07-06"
      removal_date: never
      tracking_issue: DRIVE-UPLOAD-ANALYSIS-2026-07-06 P1-3 (shipped 2026-07-06) + PR-DRIVE-CLEANUP (July 2026) CUTOVER commit
      compatibility_test: |
        rg 'clipsDriveAdapter\.TrashFile|driveAdminAdapter\.RenameFile|storageDriveAdapter\.RenameFile' --type go internal/app/
        returns the new FileLifecycle-first routes — FAIL-CLOSED hard-error when lifecycle
        is nil. rg 'voiceoverDriveAdapter' --type go internal/app/ returns 0 hits (removed upstream).
        rg 'drive\.Admin\b|\*drive\.Admin|drive\.NewDriveServiceFromFiles\(' --type go internal/application/ internal/api/
        returns 0 hits in production code (allowlisted: internal/app/ composition root +
        internal/application/assets/catalogsync/ for the forward-pointer uploaddrive alias only).
        go test ./cmd/archcheck/scan/... -run TestScanDriveAccessSSOT exits 0
        (7 hermetic fixture tests pin the scanner's allowlist precedence: 1 PASS-clean, 3 FAIL,
        3 PASS-allowlist-or-exemption).
      usage_metric: |
        Pre-migration: 4 adapters calling Admin.{TrashFile,DeleteFile,RenameFile} directly.
        Post-BACKFILL (2026-07-06): 4 adapters calling FileLifecycle.{Trash,Delete,Rename} with nil→Admin fallback.
        Post-CUTOVER (PR-DRIVE-CLEANUP, July 2026): 4 adapters calling FileLifecycle.{Trash,Delete,Rename}
        with HARD-ERROR fail-closed (no nil→Admin fallback); scanner ensures no future drift.
        voiceoverDriveAdapter removed entirely by upstream ce0c6396.
        Catalogsync now consumes the canonical drive.Reader port; no application concrete
        Drive exception remains.
      migration_phase: CUTOVER
      status: in_progress
      notes: |
        PR-DRIVE-CLEANUP (July 2026) flips the migration from EXPAND to CUTOVER. The
        4 adapters now FAIL-CLOSED with hard-error typed-sentinel (per godlike/07
        NO-FAKE-AVAILABILITY) when FileLifecycle is nil; the legacy nil→Admin fallback
        was REMOVED at the same commit. Forward-prevention is enforced by
        `cmd/archcheck/scan/percheck_driveaccess.go` (Check 74, PR-DRIVE-CLEANUP extension):
          - banned patterns: drive.Admin / *drive.Admin / drive.NewDriveServiceFromFiles(
            + drive.NewFileLifecycleAdapter( + drive.Uploader (pre-existing) +
            uploaddrive.Uploader / uploaddrive.Admin (aliased-import coverage).
          - allowlist precedence: internal/infrastructure/drive/** > internal/app/**
            > internal/application/assets/delivery/** > internal/application/assets/
            no application subtree.
          - _test.go files are exempt.
        Forward-pointers:
          (1) Catalogsync uses drive.Reader directly; the concrete Drive allowlist was
              removed from percheck_driveaccess.go.
        Cross-refs: CHANGELOG.md P1-3-BACKFILL + P1-3-CUTOVER (new) + AGENTS.md
        §"Simplicity & Minimalism" + godlike/07 §"Migration sequence" + §"No fake
        availability".
