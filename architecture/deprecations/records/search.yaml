deprecations:
    - id: PR-SEARCH-LEGACY-MEDIASEARCH
      owner_capability: internal/api/mediasearch
      exact_symbol: 'resultToMediaSearchResponse + X-Deprecation: true header + legacy MediaSearchResponse envelope'
      file: internal/api/mediasearch/cutover.go + internal/api/mediasearch/handler.go
      file_line: 37 (resultToMediaSearchResponse func body), 205-208 (X-Deprecation headers in handler.go)
      replacement: Clients consume canonical search.Result shape directly; handler responds with search.Result JSON (no translation layer, no lossy field drop)
      introduction_date: 2026-06
      removal_date: 2026-Q3
      tracking_issue: Wave 21 PR 10 CUTOVER follow-up (mediasearch cutover to Aggregator); tracked in architecture/current.yaml#Wave 21
      compatibility_test: |
        Post-CONTRACT:
          (a) `rg 'resultToMediaSearchResponse' internal/` returns zero hits.
          (b) `rg 'mediasearchapp.MediaSearchResponse' internal/api/` returns zero hits
              (the legacy DTO is no longer constructed in the handler layer).
          (c) `rg 'X-Deprecation.*true' internal/api/mediasearch/` returns zero hits
              (the migration-window header is removed).
          (d) Handler responds with canonical search.Result JSON directly;
              wire-equivalence test must be byte-stable for the new shape.
      usage_metric: |
        Today (audit baseline, 2026-06-27):
          - resultToMediaSearchResponse() : 1 caller (handler.go::Search, line ~203).
          - X-Deprecation: true header     : 1 site (handler.go::Search, lines 205-208).
          - mediasesearchapp.MediaSearchResponse : constructed in 1 API site
            (cutover.go::resultToMediaSearchResponse) + consumed by
            internal/app/search_backends.go::semanticSearchBackend.Search
            (the mediasearch.Service still returns the legacy envelope
            as its internal contract; that internal contract is a
            separate deprecation — see follow-up ticket).
        Post-CONTRACT metric: zero callers of the translator,
        zero construction of the legacy DTO in the API layer,
        zero X-Deprecation headers on the mediasearch route.
      migration_phase: BACKFILL
      status: in_progress
      notes: |
        Per godlike/07 §"Migration sequence", this entry is at CUTOVER.

        Lossy translation (documented in cutover.go package doc):
        the canonical search.Candidate has a NARROWER field set than
        the legacy SearchHit. Fields dropped in the CUTOVER translation:
        Tags, Language, DurationMs, Width, Height, MatchedChannels,
        Reason, RequestID. Clients consuming these fields MUST migrate
        before the CONTRACT deadline (Q3 2026).

        The mediasearch.Service's internal return type
        (*mediasearchapp.MediaSearchResponse) is a separate concern —
        it is consumed by internal/app/search_backends.go as the
        semantic backend's internal contract. That internal contract
        persists independently of this API-layer deprecation;
        collapsing it is a follow-up ticket (not in scope for
        PR-SEARCH-LEGACY-MEDIASEARCH which covers the API transport
        layer only).
