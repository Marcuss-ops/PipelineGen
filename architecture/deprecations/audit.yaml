# Deprecation registry audit — derived from records/ (godlike/06 SSOT:
# the records/*.yaml shards are the source of truth; these counts are
# re-derived, never hand-authored as the primary fact).
#
# ── CAPABILITY MIGRATION (Aug 2026) ────────────────────────────────────────
# voiceover and youtube owner_capability paths migrated from the
# application layer to the capabilities layer:
#   internal/application/voiceover  →  internal/capabilities/voiceover
#   internal/application/youtube    →  internal/capabilities/youtube
#   internal/application/scripts    →  internal/capabilities/scripts
# The prefix→bucket map that produced the buckets below lived in
# scripts/archcheck/categorize_deprecations.go (subsystemPrefixes), and the
# generator/migrator was `go run ./scripts/archcheck -migrate-deprecations`.
# Both were part of the legacy-burndown binary `scripts/archcheck`, which NO
# make target or workflow ever invoked; it was demolished 2026-09-12.
#
# RESTORED 2026-11-26: the validator now lives in
# cmd/archcheck/scan/governance/percheck_deprecation_registry.go and runs as
# `percheck_deprecation_registry`. It re-derives every count below from
# records/*.yaml and fails when they drift; an expired removal_date is reported
# as a warning on every archcheck run. Hand-edit the counts only together with
# the records they summarise.
audit:
    manifest_version: sharded-migration-v1
    total_records: 6
    by_status:
        removed: 0
        in_progress: 4
        keep: 1
        other: 1
    by_migration_phase:
        BACKFILL: 2
        CONTRACT: 1
        CUTOVER: 0
        EXPAND: 2
        not applicable: 1
    ci_gate_impact: ""
