# PipelineGen — Capability Inventory (Blocco C1 ratchet baseline)
# -----------------------------------------------------------------------------
# Schema (zero-fabrication, machine-parseable, slim per architecture/current.yaml lineage):
#   version           — schema version, integer, monotone.
#   generated_at      — UTC RFC3339; used by archcheck to detect rotation age.
#   source_scan_root  — root ripgrep walked to enumerate capabilities.
#   excludes          — directories / file globs the scan intentionally skipped
#                       and the reason. Re-additions must be justified.
#
#   gates_baseline    — flat ratchet thresholds for the upcoming C2 CI gates.
#                       Each entry is `current: N`, `target_zero: yes`,
#                       `gate_id: <C2-X>`, `owner_capability: <cape>` so each
#                       gate can be promoted independently. current is the
#                       snapshot at C1-Step 1; each migration commit must
#                       decrement it. The C2 gate fails iff current > 0 once
#                       `enforce_zero: true` is flipped.
#
#   api_capabilities / application_capabilities:
#     Each capability entry exposes:
#       - name            : canonical short id (used by gates).
#       - path            : repo-relative directory.
#       - has_build_signature : whether the canonical
#                              `func Build(deps Dependencies) (api.Descriptor, error)`
#                              lives anywhere under `path`.
#       - direct_register_calls : list of evidence records (0..N). Empty
#                              array (not absent) when zero.
#       - concrete_constructors : list of evidence records (0..N). Empty
#                              array when zero.
#     Each evidence record is:
#       - symbol         : exact call/import surface (api.Registry.Register,
#                          sqlite.Open, drive.NewUploader, qdrant.NewClient).
#       - file_line      : file:line of the offending site, 0-indexed lines.
#       - is_test        : true if the site lives in *_test.go (not ratcheted).
#     The downstream C2 gates re-scan the tree on every CI run; this file is
#     the SNAPSHOT, not the live counter. Drift between snapshot and live
#     scan triggers a re-baseline commit (Step "refresh").
#
# Zero-baseline rule (godlike/07 + godlike/08): target_zero is required.
# Each current>0 entry carries a migration owner (the capability that owns
# the deprecation). The gate C1-Step2 (capability_registry.go) will further
# remap the direct_register_calls counter to ZERO by hoisting every call
# into the canonical composition point.
# -----------------------------------------------------------------------------

