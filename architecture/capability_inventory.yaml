# PipelineGen capability inventory manifest.
# Each section is independently parseable. Repeated list sections are merged in
# the order below by cmd/capability-inventory-aggregate.
version: 2
source_scan_root: internal/
sections:
  - capability_inventory/baseline.yaml
  - capability_inventory/api.yaml
  - capability_inventory/application-assets.yaml
  - capability_inventory/application-services.yaml

normalization:
  - "assets/artlist is a sibling of assets/clips"
  - "content is a sibling of assets/youtube"
  - "system is a sibling of script"
