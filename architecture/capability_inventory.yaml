# PipelineGen — Capability Inventory (Blocco C1 ratchet baseline)
# -----------------------------------------------------------------------------
# Schema (zero-fabrication, machine-parseable, slim per architecture/current.yaml lineage):
#   version           — schema version, integer, monotone.
#   generated_at      — UTC RFC3339; used by archcheck to detect rotation age.
#   source_scan_root  — root ripgrep walked to enumerate capabilities.
#   excludes          — directories / file globs the scan intentionally skipped
#                       and the reason. Re-additions must be justified.
#
#   gates_baseline    — flat ratchet thresholds for the upcoming C2 CI gates.
#                       Each entry is `current: N`, `target_zero: yes`,
#                       `gate_id: <C2-X>`, `owner_capability: <cape>` so each
#                       gate can be promoted independently. current is the
#                       snapshot at C1-Step 1; each migration commit must
#                       decrement it. The C2 gate fails iff current > 0 once
#                       `enforce_zero: true` is flipped.
#
#   api_capabilities / application_capabilities:
#     Each capability entry exposes:
#       - name            : canonical short id (used by gates).
#       - path            : repo-relative directory.
#       - has_build_signature : whether the canonical
#                              `func Build(deps Dependencies) (api.Descriptor, error)`
#                              lives anywhere under `path`.
#       - direct_register_calls : list of evidence records (0..N). Empty
#                              array (not absent) when zero.
#       - concrete_constructors : list of evidence records (0..N). Empty
#                              array when zero.
#     Each evidence record is:
#       - symbol         : exact call/import surface (api.Registry.Register,
#                          sqlite.Open, drive.NewUploader, qdrant.NewClient).
#       - file_line      : file:line of the offending site, 0-indexed lines.
#       - is_test        : true if the site lives in *_test.go (not ratcheted).
#     The downstream C2 gates re-scan the tree on every CI run; this file is
#     the SNAPSHOT, not the live counter. Drift between snapshot and live
#     scan triggers a re-baseline commit (Step "refresh").
#
# Zero-baseline rule (godlike/07 + godlike/08): target_zero is required.
# Each current>0 entry carries a migration owner (the capability that owns
# the deprecation). The gate C1-Step2 (capability_registry.go) will further
# remap the direct_register_calls counter to ZERO by hoisting every call
# into the canonical composition point.
# -----------------------------------------------------------------------------

version: 1
generated_at: "2026-06-29T18:25:55Z"
source_scan_root: internal/
excludes:
  - path: pkg/**
    reason: leaf utility layer — not a capability (godlike/04 §"Leaf-only").
  - path: tests/**
    reason: integration fixtures, not capabilities.
  - path: scripts/**
    reason: operational tooling + analyses outside the capability tree.
  - path: cmd/**
    reason: composition-entry binaries; only cmd/server + cmd/worker +
            cmd/admin are composition roots, not capabilities.

# ── Ratchet baselines (snapshots on C1-Step 1 day-1) ────────────────────────
# Each gate's `current` matches rg evidence above. Each migration step
# decrements `current`; once 0 the corresponding `enforce_zero` may flip.
gates_baseline:
  - gate_id: C2-A
    name: "Register calls only in capability_registry.go"
    target_zero: true
    enforce_zero: true                 # promoted to hard gate by Blocco C1-Step 2 (capability_registry_gate_test.go enforces invocation)
    current: 0                          # observed via rg \.Registry\.Register\b after type-prefix in internal/app/** excluding capability_registry.go (C1-Step-2 closure, June 2026)
    legacy_observation: 23              # historical pre-Step-2 inventory total (variable-name + typed-mixed; superseded by canonical hoist)
    scope: "internal/app + capabilities that call Registry.Register"
    migration_owner: internal/app/capability_registry.go
    enforcing_test: internal/app/capability_registry_gate_test.go::TestRegisterGate_NoDirectRegistryRegisterOutsideCapabilityRegistry
    ratchet_status: closed_at_step_2  # forward-protection only; PRs that re-introduce typed-punctuated Register calls outside the canonical point fail the gate
  - gate_id: C2-B
    name: "no concrete constructors outside internal/app/"
    target_zero: true
    enforce_zero: false
    current_api_prod: 12              # api/* excluding *_test.go: 4 db + 4 drive + 4 misc spread across clips + script/handler_test.go flagged is_test=true (1)
    current_app_prod: 84              # application/* production files: db = 3+25+4+30+4+3 = 69 prod + drive = 1+2+9+1+19+2 = 34 prod + qdrant = 5+12+1 = 18 prod
    scope: "internal/api/** + internal/application/** excluding *_test.go"
    migration_owner: internal/app/build_*.go               # C1-Step-16 hoist site
  - gate_id: C2-C
    name: "no source-type switch outside Source Catalog"
    target_zero: true
    enforce_zero: false
    current: 7                        # case "artlist" / case "youtube" / case SourceCatalog outside the Catalog dispatcher
    scope: "internal/**/*.go excluding *_test.go and the Source Catalog packages"
    migration_owner: internal/application/assets/artifacts/source_resolver.go
  - gate_id: C2-D
    name: "no local job policy (MaxRetries/queue/backoff)"
    target_zero: true
    enforce_zero: false
    current: 0                        # already centralised through jobs.Registry + jobs.Policy
    scope: "internal/**/service.go excluding *_test.go and internal/application/jobs/**"
    migration_owner: internal/application/jobs
  - gate_id: C2-E
    name: "route ≡ manifest ≡ ACTIVE_API_GENERATED.md"
    target_zero: true
    enforce_zero: false
    current: 0
    scope: "internal/api/** RegisterRoutes + cmd/server/main.go + docs/api/ACTIVE_API_GENERATED.md"
    migration_owner: internal/app/registry.go + docs/api/ACTIVE_API_GENERATED.md
  - gate_id: C2-F
    name: "no `if svc == nil { return nil }` fallback in capabilities"
    target_zero: true
    enforce_zero: false
    current: 0                        # healtcheck pass @ C1-Step 1; subsequent PRs that re-introduce fallbacks get caught
    scope: "internal/api/** + internal/application/**/*.go excluding *_test.go"
    migration_owner: internal/app/bootstrap.go             # composition-root fail-closed

