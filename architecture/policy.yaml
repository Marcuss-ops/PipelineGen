# ── Lint Gates (CI ratchet, Wave 20 cross-reference) ───────────────────────
# Cross-reference: architecture/current.yaml::Wave 20 (QDRANT-005D hygiene).
#
# Each CI ratchet gate has exactly ONE owning script file. The ratchet
# enforces:
#   1. Every gate is exposed by scripts/ci-architectural-checks.sh.
#   2. Every Check carries explicit exit semantics + structured log line
#      + FAIL remediation text.
#   3. Each gate's allowlist (where applicable) is a separate file under
#      docs/architecture/godlike/ or docs/migrations/.
#
# Maintenance cadence: when a Check is added/modified, update this block
# in the same commit (single-source-of-truth principle per
# docs/architecture/godlike/06_DATA_AND_CONFIG_OWNERSHIP.md
# §"One owner per fact").

# §"One owner per fact").
lint_gates:
  - check: 5
    name: same-package duplicate-type-declaration lint
    owner_script: scripts/ci-architectural-checks.sh (Check 5 block — duplicate-types)
    gate_maintainer: qdrant-hygiene work stream (RW-PROD-013 dependency chain)
    allowlist: docs/architecture/godlike/duplicate-types-allowlist.txt
    log_line_on_pass: "Check 5: 0 same-package type-redeclarations detected across internal/"
    references_business_rule: QDRANT-RECOVERY-001 forward-prevention
    references_ticket: "QDRANT-RECOVERY-001 (resolved by commits 2b67d701 + 38187ded; runbook 05 removed July 2026)"
    owner_wave: 20
    rationale: |
      Go cannot distinguish file-level types from package-level types —
      two .go files in the SAME package declaring `type X struct{...}`
      produces a build error: "<X> redeclared in this block". This
      lint catches the pattern at pre-CI time so a new type
      declaration cannot land with a colliding same-package symbol.
      Historically observed as the SnapshotDescription / PointPayload
      duplicate in internal/infrastructure/qdrant/types.go + types_dr.go,
      fixed by commits 2b67d701 + 38187ded (see docs/operations/05).
    documented_exceptions: |
      The wire-mirror + canonical-in-application pattern (e.g.
      qdrant.SnapshotDescription (wire in types_dr.go) +
      dr.SnapshotDescription (canonical application-layer in
      internal/application/qdrant/dr/types.go)) is NOT a same-package
      redeclaration — Go's package = (directory, name) tuple
      distinguishes them. The lint enforces zero; the allowlist
      exists ONLY for transitional cases per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
      §"Zero-baseline rule".

