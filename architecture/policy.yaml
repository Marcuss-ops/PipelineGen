# ── Prometheus boundary (generic pkg-layer governance, June 2026) ─────────────
# Hoisted out of the now-removed pkg_workerstats governance block
# (Blocco 2.B, 2026-06-30: chore(workerstats): eliminate non-compiling
# package) so future leaf-pkg introductions reference a self-standing
# rule rather than re-discovering the lesson from scratch. The rule
# codifies Option B (the now-architected "metric definitions stay in
# internal/infrastructure/observability/; caller bridges POJO into
# metric values field-by-field at the application boundary").
prometheus_boundary:
  rule: |
    ANY leaf pkg (`pkg/<x>/`) MUST NOT IMPORT `github.com/prometheus/client_golang`
    and MUST NOT define Prometheus metric var collectors (Gauge/Counter/Histogram
    struct literals tagged for auto-registration). The leaf pkg layer is for
    pure-data utilities (math, hashing, file I/O, defaults, retry, BM25, etc.)
    and must not couple to the global `prometheus.DefaultRegisterer`; doing so
    would leak OS-coupled concerns (system-level polling, globally-stateful
    metric emission, test-fixture auto-registration, etc.) into the facade code
    paths consumed by every other pkg + every application pass.

    Metric definitions (collector name, label cardinality, help text, label
    values) live canonically in `internal/infrastructure/observability/`.
    The application-layer caller bridges a leaf pkg's pure-data POJO into
    metric values field-by-field (one section per Collector, projecting
    POJO fields onto GaugeVec.WithLabelValues calls at the bridge).

    Historical case the rule was extracted from: pkg/workerstats
    (eliminated 2026-06-30, Blocco 2.B, deprecation record
    `architecture/deprecations.yaml#PR-WORKERSTATS-ELIMINATE-FAKE-AVAIL`)
    was the FIRST detailed entry under leaf pkg governance because Option
    A (aliasing metric vars into the sampler pkg) was a tempting shim.
    The Option B decision codified here forecloses Option A permanently.

    Enforcement: phase-0 documentation-only; no Check 22 / archcheck
    family enforces this rule today. Promotion to a hard CI gate
    (`rg -n 'prometheus/client_golang' pkg/` returning zero hits, or
    equivalent in scripts/ci-architectural-checks.sh) is a future wave
    entry to be tracked via architecture/current.yaml#follow_up_tickets.
  cross_refs:
    origin_record: architecture/deprecations.yaml#PR-WORKERSTATS-ELIMINATE-FAKE-AVAIL
    metrics_home: internal/infrastructure/observability/worker_metrics.go
    pkg_layer:    pkg/ (the leaf-utility gate per `pkg:` rule above)

