# PipelineGen — Target Tree Policy (Phase 0)
# -----------------------------------------------------------------------------
# Machine-readable rules governing the target structure documented in
# ARCHITECTURE.md §11.5. Read by `go run ./cmd/archcheck` (stdlib parser, no
# external dependencies). Hand-comments above each key are stripped at parse
# time; the parser treats lines starting with `#` as comments and skips them.
#
# Phase 0 report-only (exits 0 even when violations exist). Phase N will
# promote specific rules to hard gates via the `--strict` flag.

# File size and population caps.
#
# Package-size regime:
#   normal package:      ≤ 40 production .go files
#   registered hotspot:  temporarily > 40 (tracked in architecture/package_hotspots.json,
#                         each with owner + deadline + target subzones)
#   emergency ceiling:   NEVER exceed 65 (this executable value)
#
# The 40/65 regime makes both numbers canonical. History in policy.history.yaml.
max_files_per_package: 65
# File line cap. Files exceeding this limit are reported as violations
# (exceptions must be named per-file in architecture/policy.history.yaml).
max_lines_per_file: 1000

# Strict per-file LOC soft-warning cap (godlike/08 §"Forward-prevention gates").
# Distinct from the legacy max_lines_per_file=1000 hard cap: this fires BEFORE
# files cross the 1000-LOC hard line, giving operators a chance to split
# proactively. Files in the corresponding allowlist are exempt (per godlike/07
# §"Temporary deprecation record" — each allowlist entry must carry
# owner + deadline + removal_trigger per godlike/08 zero-baseline rule).
# Setting this to 0 opts the rule family out. The default (600) gives a
# 400-LOC safety margin between the soft warning and the hard ceiling.
max_lines_per_file_strict: 600
# Path (relative to root) of the per-file allowlist for the strict cap.
# Format: same plain-text convention as admin-sql-allowlist.txt and
# duplicate-types-allowlist.txt — one repo-root-relative forward-slashed path
# per line; `#`-prefixed comments + blank lines are ignored. Inline
# `# owner=...` annotations document per-entry governance metadata (parser
# does not consume them but operators must keep them in sync with the
# canonical baselined metadata in docs/migrations/archcheck-strict-baseline.json).
max_lines_strict_allowlist: docs/migrations/max-lines-strict-allowlist.txt
cmd_main_max_lines: 200

# Constructor dependency cap (per CI-gates doc §"Complexity budgets").
# Phase 1 scan: counts parameters in func New<X>(...) signatures
# (including context.Context). Default 8.
max_constructor_deps: 8

max_struct_deps: 8

# PR-CLIPINGEST-PIPELINE step 8 (July 2026): per-struct allowance for the canonical
# 9-component ClipIngestPipeline wiring. The 9-component shape is the SOLE canonical
# owner; the percheck_clip_ingest_pipeline_canonical_1 forward-prevention gate enforces
# this at the type level. Without this per-struct allowance the 9-component shape
# would be a max_struct_deps violation.
max_clip_ingest_pipeline_fields: 9

# Target-tree warning residue budget. This is a monotone ratchet: warnings
# may decrease, but a run may not exceed the committed ceiling without a
# hard-gated cleanup. The budget applies only to warnings collected in
# cmd/archcheck/report.Report.Warnings; route-generator diagnostics and
# missing route descriptions are separate generator/route-surface checks,
# not silently folded into this count.
# Current baseline is measured from the deterministic cmd/archcheck report.
max_warnings: 77

# Generic dumping-ground dirs forbidden as top-level package names
# (per the proposal §"internal/capabilities").
forbidden_top_level_dirs: service, repository, models, utils, helpers

# Allowed kernel subzones (target: internal/kernel/<x>).
# Types belong in kernel only when ≥2 real capabilities need the same
# semantic contract (per proposal §"internal/kernel").
kernel_subzones: asset, job, script, event, errors, observability, embedding, semanticdoc, digest, media, stocksupply, assembly, delivery, primitives, transcript

# Canonical data/config ownership doc (path relative to project root) — the
# single source of truth for the data+config ownership axis (DB rules,
# Qdrant projection sequence, Drive authority, configuration boot pipeline,
# EXPAND/BACKFILL/CUTOVER/CONTRACT). Enforced by cmd/archcheck via the
# rule family `data_ownership_doc` (`data_ownership_doc_missing` for an
# absent file, `data_ownership_doc_incomplete` for a missing required H2
# section header — both warn, so --strict promotes either failure to a
# hard CI gate). Promotion from godlike/ design-state: June 2026.
#
# Scope (Phase 0): existence + required-section presence. Cross-package
# contradiction detection (Per-package `// owns:` comments vs. the 8-domain
# ownership table in §"One owner per fact") is deferred to Phase 1+.
# Leave empty to opt out (Phase 0 only).
data_ownership_doc: docs/architecture/godlike/06_DATA_AND_CONFIG_OWNERSHIP.md

# Canonical zero-legacy-policy doc (path relative to project root) — the
# single source of truth for deprecation-record requirements and the
# EXPAND/BACKFILL/CUTOVER/CONTRACT migration sequence. Enforced by
# cmd/archcheck via the rule family `legacy_policy_doc`
# (`legacy_policy_doc_missing` warn + `legacy_policy_doc_incomplete`
# warn). Promotion: June 2026. Leave empty to opt out (Phase 0 only).
legacy_policy_doc: docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md

# Canonical CI-gates manifest (path relative to project root) — the
# single source of truth for executable architecture rules and CI gate
# definitions. The on-disk enforcement lives in scripts/ci-architectural-
# checks.sh (legacy ratchets) and cmd/archcheck/main.go::scanCIGatesDoc
# (this doc). Promotion: June 2026. Leave empty to opt out.
ci_gates_doc: docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md

# Canonical agent execution playbook (path relative to project root) —
# the single source of truth for AI-agent code-modification boundaries
# and the EXPAND/BACKFILL/CUTOVER/CONTRACT migration method. Working
# with AGENTS.md Git-Lessons and ARCHITECTURE.md structural diagram.
# Promotion: June 2026.
agent_playbook_doc: docs/architecture/godlike/11_AGENT_EXECUTION_PLAYBOOK.md

# Canonical feature-removal checklist (path relative to project root) —
# the single source of truth for the 7-phase teardown sequence of a
# superseded feature. Working with godlike/07 zero-legacy policy.
# Promotion: June 2026.
removal_doc: docs/architecture/godlike/13_FEATURE_REMOVAL_CHECKLIST.md

# Stems that must not appear as bare prose references in *.go source files
# (catches `module_jobs_test.go`-style mentions: stem references NOT
# followed by a literal `.`). Such references typically indicate an
# obsolete pre-Wave-16 path the user-regex cleanup pass missed — the
# user-regex `compose_voiceover\.` / `module_jobs\.` etc. only catches
# `.go`-suffix mentions, leaving `module_jobs_test.go` and prose-style
# `compose_images bundle` mentions through. Day-1 expected violations:
# 4 in `internal/app/composition_test.go` pointing at the surviving
# `module_jobs_test.go` (real test file; addressed in a doc-only
# follow-up). Each match emits one warn-severity
# `stale_prose_paths_<stem>` violation per (file, line) in any *.go file
# under `internal/`. --strict promotes the family to os.Exit(1).
# Promotion from godlike/ design-state: June 2026. Leave empty to opt
# out (Phase 0 only).
stale_prose_paths:
  - compose_voiceover
  - module_artlist
  - module_fullimages
  - compose_content
  - compose_images
  - module_ingest
  - module_jobs
  - module_stock
  - module_youtube
  - subject_bindings
# Migration-boundary application areas are explicit DoD scope. Every production
# Go file under these paths must remain free of direct internal/infrastructure
# imports while the root migration is in progress; the composition root owns
# concrete adapter wiring. This is a guarded migration surface, not a second
# target architecture.
canonical_application_areas:
  - internal/application/assets/artifacts
  - internal/application/assets/catalogsync

# Expected capability slices (target: internal/capabilities/<x>).
# Each owns module.go, contract.go, service.go, http.go, jobs.go,
# events.go, repository.go, adapters.go per proposal §"internal/capabilities".
capabilities: assets, artlist, youtube, scripts, images, voiceover, content, channels, jobs, system

# ── Platform adapter ownership (2026-08-23 Cleanup Day) ───────────────
# Each on-disk subzone maps to exactly one technology concern. Ownership is
# exclusive: a platform adapter belongs to one subzone only.
#
# On-disk subzones (governed by policy):
#
#   config         — config loading, decoding (multilingual, scripts, worker)
#   sqlite         — connection pool, migration runner, PRAGMA policy
#   drive          — Google Drive publisher, reader, location verifier
#   qdrant         — Qdrant collection schemas, transport, verification
#   process        — process-level health, readiness probes, worker caps
#   filesystem     — SQLite-backed folder memory, file staging helpers
#   checksum       — legacy MD5 checksum bridge (compatibility surface)
#   youtube        — YouTube cached-whisper, subtitle normalization
#   cas            — content-addressed storage (SHA-256 keyed blob store)
#   embeddings     — embedding adapters (HTTP, Python, Ollama)
#   overlays       — GPU gate, render cache, media contract prober
#   media          — Rust media execution executor (rustexec/VideoProcessor)
#   renderinggen   — RenderingGen queue client (HTTP → external overlay render)
#   delivery       — delivery registry, startup validators, transport contracts
#
# Deferred migrations (remaining api-root cutovers; infrastructure/ is deleted as of 2026-08-24):
#
#   httpserver     — HTTP server/router lives in internal/api/ (Gin).
#                     No standalone package yet. Target: platform/httpserver
#                     after api root migration.
#
#   ffmpeg         — FFmpeg execution lives in platform/media/rustexec/.
#                     No standalone ffmpeg package needed; subsumed by
#                     rustexec.VideoProcessor.
#
#   nvidia         — GPU/NVIDIA capability probing lives in
#                     platform/overlays/gpu_gate.go and app/workerruntime.
#                     No standalone nvidia package needed.
platform_subzones: config, sqlite, drive, qdrant, process, filesystem, checksum, youtube, cas, embeddings, media, overlays, renderinggen, delivery, observability, ollama

# CANONICAL LAYOUT (binding): target_internal_roots
#
# This is the sole target architecture. New production structure belongs only
# under these four roots. The legacy list below exists solely so the scanner can
# govern the migration surface; it is not a second supported architecture.
target_internal_roots: app, kernel, capabilities, platform

# MIGRATION-ONLY ROOTS (binding): existing code is tolerated only while it is
# being migrated or removed. These roots are forbidden homes for new
# capabilities, public contracts, providers, routes, files, or packages. Every
# exception must be an existing owner/deadline/target entry in
# architecture/package_hotspots.json::root_migrations. The migration registry
# is governance metadata, not permission to extend a legacy root.
legacy_internal_roots: application, api

# Known grandfathered violations (Phase 0 reports, Phase 1+ gates). Each
# entry is a free-form comment consumed by the human reviewer; the binary
# only checks the structural rules above. Grandfathering never authorizes new
# code in a migration-only root.
known_grandfathered: []


# ── DEBT BUDGET ─────────────────────────────────────────────────────────
# Caps the cumulative open/in-progress carry-forward surface.
# History and procedure live in architecture/policy.history.yaml.
debt_budget:
  max_pre_existing_open: 9
  catalog_file: architecture/issues.yaml
  counter_id_prefix: "PRE-EXISTING-"
  counter_status_includes: ["open", "in_progress"]
  ci_gate: scripts/ci-architectural-checks.sh (Check 64)

# Wave-22 hard-gate promotion (godlike/08 evolution PR2,
# post-Wave 22 per architecture/current.yaml). The canonical
# list of rule IDs whose violations ALWAYS exit ExitViolations
# from cmd/archcheck, regardless of the --strict flag. The
# runner's pre-exit evaluation pass (cmd/archcheck/runner.go)
# builds a lookup set from this list; every violation whose
# Rule matches is severity-escalated to report.SeverityError
# and the exit decision is widened to `hasHardGate ||
# (strict && len>0)`. Covers:
#   - the 5 godlike docs (the canonical promotion scope of
#     Wave 22); every `_doc_missing` and `_doc_incomplete`
#     are fail-closed forward-prevention guards.
#   - the Wave-5 typed metadata registry (map[string]any ban)
#     already in pre-Wave-22 promotion.
#   - the Wave-22 forward-prevention gate for low-level
#     infrastructure imports in the API layer (Go-side mirror
#     of scripts/ci/architecture/checks/check_19); both the
#     hit rule and the fail-closed missing-allowlist rule are
#     in the set.
# SSOT for Wave-22 gate promotion. Bypassing requires an
# explicit SSOT-marker demotion in architecture/current.yaml
# (no in-tree override).
hard_gates:
  # 5 godlike docs (Wave-22 promotion scope). Both missing-
  # file and missing-section variants are hard gates so a
  # future agent who deletes either an H2 from the canonical
  # doc OR deletes the doc entirely surfaces as a CI build
  # failure on the next push, not as an operator trap.
  - data_ownership_doc_missing
  - data_ownership_doc_incomplete
  - legacy_policy_doc_missing
  - legacy_policy_doc_incomplete
  - ci_gates_doc_missing
  - ci_gates_doc_incomplete
  - agent_playbook_doc_missing
  - agent_playbook_doc_incomplete
  - removal_doc_missing
  - removal_doc_incomplete
  # Wave-5 typed metadata registry (pre-Wave-22 promotion).
  - percheck_metadata_registry
  # Wave-22 forward-prevention: banned infrastructure imports
  # in the API layer (Go-side mirror of Check 19). The hit
  # rule and the fail-closed missing-allowlist rule are
  # both in the set — operators must keep the canonical
  # allowlist on disk (godlike/07 NO-FAKE-AVAILABILITY).
  - percheck_api_infrastructure_imports
  - percheck_api_infrastructure_imports_allowlist_missing
  # Brain capability hard gates: the brain must never import
  # infrastructure or spawn processes, and each canonical
  # brain component must have exactly one production implementation.
  - percheck_brain_infra_ban
  - percheck_brain_single_impl
  # Wave-25 (P1-7 + P1-4 step 1/2 retirement) forward-prevention
  # gate: any *.go import of a deleted legacy root (canonical
  # enumeration in cmd/archcheck/scan/percheck_legacy_root_ban.go
  # legacyRootImportBanned) is a hard CI failure.
  - percheck_legacy_root_ban
  # Retired duplicate SQLite assets/clips implementation: only the idempotency
  # adapter remains in that directory; new implementation files and imports fail.
  - percheck_sqlite_assets_clips_duplicate
  - percheck_sqlite_assets_clips_import
  # Migration-only roots may be edited for cutover/removal/fixes, but new files
  # in those roots are forbidden. Added-file detection is fail-closed in CI.
  - percheck_legacy_root_new_code
  # P0 ownership integrity: every declared job must map to a canonical
  # runtime registry entry and a production handler binding.
  - percheck_job_ownership
  # Wave-24 forward-prevention: max_lines_per_file_strict promoted
  # from soft-warning (godlike/08 §"Mandatory checks" — Phase 0
  # report-only) to hard gate (Wave-24 evolution, see
  # architecture/policy.history.yaml::max_lines_per_file_strict).
  # Distinct from the legacy max_lines_per_file=1000 hard cap: the
  # 600-LOC threshold fires BEFORE files cross the 1000 hard line,
  # giving operators a 400-LOC safety margin to split cohesively.
  # Allowlist path = docs/migrations/max-lines-strict-allowlist.txt
  # (the canonical escape hatch per godlike/07 §"Temporary
  # deprecation record" + godlike/08 §"Zero-baseline rule").
  # Setting pol.MaxLinesPerFileStrict=0 opts the rule family out;
  # default 600 enforces a fail-closed forward-prevention gate.
  - max_lines_per_file_strict
  # Kernel layout integrity: every on-disk internal/kernel subzone must be
  # declared here, and every declared subzone must exist on disk.
  - kernel_subzone_undeclared
  - kernel_subzone_missing
  # Video encoding is an infrastructure policy decision. Keep concrete
  # encoder names in the canonical resolver; active FFmpeg/render paths
  # fail closed when they introduce a hardcoded encoder literal.
  - percheck_video_encoder_policy
  # Warning residue cannot grow silently; reduce the budget as warnings are
  # removed rather than raising it to mask new architectural drift.
  - warning_budget
  # Canonical application areas have a zero-baseline direct-infrastructure
  # import contract. Missing declarations/paths and malformed production Go
  # files fail closed alongside the import rule.
  - percheck_canonical_application_infrastructure_imports
  - percheck_canonical_application_infrastructure_imports_missing_area
  - percheck_canonical_application_infrastructure_imports_parse_error
  # Final legacy cutover: the four media-pipeline SSOTs and the two
  # sole-writer contracts are promoted from report-only to hard gates now
  # that every legacy caller has been migrated (each rule has zero
  # production-code violations).
  #   Project derivation      → only internal/kernel/script.ArtifactRoutingContext
  #   Duration probing        → only the canonical media probe capability
  #   Evidence precedence     → only internal/kernel/asset.ResolveEvidence
  #   TTS timing              → only BuildSpeechTimingArtifact
  #   Direct Qdrant writes    → only the projection writer / indexing handler
  #   Direct media_assets writes → only the MediaCommitter chain
  - percheck_project_derivation_ssot
  - percheck_duration_probe_ssot
  - percheck_evidence_precedence_ssot
  - percheck_speech_timing_ssot
  # Digest SSOT (August 2026): crypto/sha256 is owned by internal/kernel/digest.
  # Any production import outside the SSOT root, the TLS/protocol exemptions
  # (pkg/hmacsign, pkg/tlsload, internal/platform/delivery) or the
  # transitional allowlist fails closed. The allowlist ratchets to zero as
  # files migrate to digest; each entry is removed in the same change.
  - percheck_digest_sha256_ban
  - percheck_digest_sha256_ban_allowlist_missing
  # MD5 checksum SSOT (August 2026): crypto/md5 is owned by
  # internal/platform/checksum (compatibility-only — legacy columns,
  # legacy import, provider-supplied Drive md5Checksum). Any production
  # import outside the SSOT root or the transitional allowlist fails
  # closed. The allowlist ratchets to zero as files migrate.
  - percheck_digest_md5_ban
  - percheck_digest_md5_ban_allowlist_missing
  - percheck_legacy_hotspot_growth
  - percheck_upsert_points_sole_owner
  - percheck_frame_concept_projection_writer
  - percheck_control_plane_sql_writes
  - percheck_asset_committer_event_ssot
