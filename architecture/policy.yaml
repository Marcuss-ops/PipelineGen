# PipelineGen — Target Tree Policy (Phase 0)
# -----------------------------------------------------------------------------
# Machine-readable rules governing the target structure documented in
# ARCHITECTURE.md §11.5. Read by `go run ./cmd/archcheck` (stdlib parser, no
# external dependencies). Hand-comments above each key are stripped at parse
# time; the parser treats lines starting with `#` as comments and skips them.
#
# Phase 0 report-only (exits 0 even when violations exist). Phase N will
# promote specific rules to hard gates via the `--strict` flag.

# File size and population caps (per the proposal §"Package size limits").
# Raised 40 → 65 on 2026-07-15, then 65 → 70 on 2026-07-22. Justification:
# internal/infrastructure/database/sqlite/assets reached 69 files while
# absorbing the canonical asset committer / outbox / clips / catalog /
# artifacts / delivery / maintenance / voiceover / visual-summary surfaces.
# The package is the SQLite persistence consolidation point; splitting it
# now would fracture transactional cohesion. The cap will be revisited once
# the QDRANT-002 / asset-committer consolidation wave settles.
max_files_per_package: 65
# Raised 500 → 1000 on 2026-07-11 (script.generate wave). Justification:
# the script.generate pipeline introduced 6 cohesive feature files that
# manage hard transactional/cue boundaries which cannot be safely split:
#   - internal/infrastructure/database/sqlite/assets/clip_atomic_writer.go
#     (922 lines; SQL super-transaction: clips + tracks + cues + outbox in
#     one atomic unit; splitting would break the all-or-nothing invariant)
#   - internal/application/youtube/usecase/text_track_resolver.go
#     (750 lines; multi-language cue resolution across payload-text /
#     DB-stored / Whisper sources; resolution graph is inherently cross-cue)
#   - internal/infrastructure/youtube/subtitles.go (609 lines; provider
#     dispatch + Whisper fallback + format normalization)
#   - internal/application/assets/finalizer/asset_finalizer_tx.go
#     (534 lines; finalizer transaction: media asset + renditions +
#     outbox events + index_state preservation)
#   - internal/application/jobs/worker_execution.go (540 lines)
#   - internal/application/operations/generation_submission_service.go
#     (501 lines; borderline)
# These are domain/transactional adapters, not bundle wiring
# (build_bundles_*.go carry struct_deps violations, separately tracked).
# 1000 is the minimal headroom that absorbs all 16 file_size violations
# (12 pre-existing + 4 new from script.generate; the remaining 2 new
# violations are 1 struct_deps + 1 constructor_deps, separately tracked)
# without masking future bloat: any file exceeding 1000 lines remains
# a violation and is a strong signal for a real split. Per AGENTS.md,
# splitting remains preferred for any new file that approaches 1000 lines.
#
# Cross-ref: docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
# §"Complexity budgets" — this is the file-size budget raise.
# Cross-ref: architecture/current.yaml — promote to a hard gate (--strict)
# once the script.generate wave settles (target: post-Wave 22).
max_lines_per_file: 1000
cmd_main_max_lines: 200

# Constructor dependency cap (per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
# §"Complexity budgets"). Phase 1 scan: counts parameters in func New<X>(...) signatures
# (including context.Context). Exceeding this is a design failure unless a short-lived
# exception exists. Default 8 per the CI-gates doc; operators can tune.
max_constructor_deps: 8

# Struct dependency cap — Phase 1+ extension (P1.7, June 2026): counts
# fields in Dependencies / Deps / Options structs. Mega-structs that
# bundle >8 mandatory ports circumvent the constructor-parameter gate;
# this rule catches them at the type level. Defaults to max_constructor_deps
# when unset. Zero opts out.
max_struct_deps: 8

# PR-CLIPINGEST-PIPELINE step 8 (July 2026): per-struct allowance for the canonical
# 9-component ClipIngestPipeline wiring. Mirrors the existing image-asset pattern
# (`max_image_asset_fields: 8` is the per-struct knob; the global `max_struct_deps: 8`
# is the default). The 9-component shape is the SOLE canonical owner at
# internal/application/assets/ingest/clip_ingest_pipeline.go (godlike/06 SSOT);
# the percheck_clip_ingest_pipeline_canonical_1 forward-prevention gate enforces
# this at the type level. Without this per-struct allowance the 9-component shape
# would be a `max_struct_deps` violation; the knob is the documented escape
# hatch (godlike/06 SSOT — single canonical owner per fact).
max_clip_ingest_pipeline_fields: 9

# Generic dumping-ground dirs forbidden as top-level package names
# (per the proposal §"internal/capabilities").
forbidden_top_level_dirs: service, repository, models, utils, helpers

# Allowed kernel subzones (target: internal/kernel/<x>).
# Types belong in kernel only when ≥2 real capabilities need the same
# semantic contract (per proposal §"internal/kernel").
kernel_subzones: asset, job, script, event, identity, errors

