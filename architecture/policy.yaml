wave_qdrant_005d_hygiene:
  owner: qdrant-hygiene work stream
  owner_secondary: scripts/ci-architectural-checks.sh maintainer
  rationale: |
    Forward-prevention half of QDRANT-RECOVERY-001. Owns:
