# PipelineGen — observability measurement classification matrix
# Status: current-code inventory for the Job–Attempt–Run migration.
# Authority: internal/kernel/observability for canonical types and semantics.
#
# SSOT (data ownership) rule — normative, see
# docs/architecture/job-attempt-run-observability-contract.md §1.1:
#   OPERATIONAL METRICS SSOT = observability database
#   CANONICAL TABLES  = run_observability, run_stage_observations,
#                       run_operation_observations, run_artifact_observations,
#                       run_child_observations
#   CANONICAL WRITER  = SQLiteRecorder
#   PERFORMANCE_*     = derived analytics/benchmark projection
#   PROMETHEUS        = derived live projection
# A boundary is measured exactly once into the observability DB; every other
# surface (performance_*, Prometheus, API) projects those canonical facts and
# never re-measures time.
#
# This file records current implementation surfaces; it does not claim that
# the target wrappers, persistence tables, or removal gates already exist.
#
# Required columns on every measurement:
# current_symbol, current_owner, current_writer, current_storage, current_metric,
# canonical_type, canonical_stage, canonical_component, canonical_operation,
# migration_adapter, removal_condition.
#
# Classification vocabulary:
#   canonical_type: run | attempt | stage | operation | artifact | child_run |
#                   counter | infrastructure_metric | wait_observation
#   current_metric: exact Prometheus family, durable column, result field, or
#                   "none" when the value exists only in memory/logs.
#   removal_condition: explicit, testable condition; compilation alone is not
#                      sufficient to remove a legacy surface.

version: 2
status: inventory
last_reviewed: 2026-08-05
source_of_truth: internal/kernel/observability
data_authority: >-
  observability database (run_observability + run_stage_observations +
  run_operation_observations + run_artifact_observations +
  run_child_observations). performance_* tables and Prometheus are derived
  projections of those canonical facts, never a second measurement.
inventory_scope: >-
  Static inventory of timing, latency, wait, retry, cache, artifact, byte,
  content-duration, and related metric writers found under internal plus the
  durable SQLite/result surfaces they write. Health/probe and media-content
  durations are retained as separate categories so they cannot be mistaken for
  business-job execution timing.

