    canonical_component: "runtime or phase owner"
    canonical_operation: ""
    migration_adapter: "Map only runtime attempt queue wait to RunReport.QueueWaitMs; classify internal phase waits as semaphore/rate-limit/dependency waits"
    removal_condition: "Queue wait is persisted once at attempt scope and phase records no longer expose a competing queue wait"

