    current_writer: "ClaimNext and worker execution envelope"
    current_storage: "jobs SQLite row; RunInfo.QueueWaitMs calculation"
    current_metric: "queue_wait_ms on kernel RunReport (currently created_at to StartedAt)"
    canonical_type: attempt
    canonical_stage: ""
    canonical_component: "runtime"
    canonical_operation: "claim"
    migration_adapter: "Create durable AttemptID and AttemptAvailableAt; calculate queue wait from availability, not retry_count/lease proxy"
    removal_condition: "EVERY_ATTEMPT_HAS_ATTEMPT_ID and retry attempts use retry_available_at as their availability boundary"

