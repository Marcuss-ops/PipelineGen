coverage_notes:
  current_code_searches:
    - "StageDurations, PipelineResult, processmetrics, process_phase_metrics, VidRushTimingMetrics"
    - "time.Since, DurationMs, duration_ms, QueueWaitMs, queue_wait_ms"
    - "Prometheus New* collectors and Observe/Inc/Add writers under internal"
  intentionally_separate:
    - "media/content duration_ms is Artifact metadata, not execution timing"
    - "health/readiness/admin diagnostics are infrastructure probes, not business Runs"
    - "worker resource/network bytes are infrastructure gauges, not job byte counters"
    - "outbox handler retry is distinct from a new job Attempt"
  known_target_gaps: >-
    ObservedDrivePublisher, ObservedSQLiteExecutor, ObservedQdrantClient,
    ObservedProcessRunner, ObservedFFmpeg, ObservedDownloader,
    ObservedArtlistProvider, ObservedOllamaClient, ObservedTTSProvider,
    ObservedNLPProvider, ObservedTranscriptionProvider, ObservedImageProvider,
    and ObservedGoogleDocsPublisher are target adapters named by the contract;
    the matrix records their current call boundaries even where the concrete
    wrapper does not yet exist.
