    canonical_component: "process_type owner"
    canonical_operation: ""
    migration_adapter: "ProcessMetricsAdapter maps Metric fields to StageReport, Counters, and nested OperationReport where provider/phase ownership is technical"
    removal_condition: "All processmetrics readers use RunReport and the canonical SQLite recorder; process_phase_metrics writer disabled after parity and query migration"

  - current_symbol: "processmetrics.Metric.QueueWaitMs"
