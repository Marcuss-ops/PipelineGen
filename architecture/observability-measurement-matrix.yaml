    current_metric: "Attempt identity compatibility field"
    canonical_type: attempt
    canonical_stage: ""
    canonical_component: "runtime"
    canonical_operation: "claim"
    migration_adapter: "Generate and persist a new AttemptID at claim; keep LeaseID as a separate fence and link it only as execution metadata"
    removal_condition: "EVERY_ATTEMPT_HAS_ATTEMPT_ID=PASS and no runtime path assigns AttemptID from lease_id"

  - current_symbol: "RunInfo.QueueWaitMs / worker claim calculation"
    current_owner: "internal/kernel/observability.RunInfo and internal/application/jobs worker runtime"
    current_writer: "Worker.runJob and worker.Runner.runLease"
    current_storage: "In-memory RunReport.QueueWaitMs"
    current_metric: "queue_wait_ms derived from jobs.created_at to StartedAt"
    canonical_type: wait_observation
    canonical_stage: ""
    canonical_component: "runtime"
    canonical_operation: "claim"
    migration_adapter: "Use AttemptAvailableAt: job_created_at for the first attempt and retry_available_at for later attempts; persist the resulting attempt queue wait"
    removal_condition: "QUEUE_WAIT_PERSISTED=PASS and retry backoff is excluded from the next attempt queue wait"

  - current_symbol: "jobs.created_at → jobs.StartedAt"
