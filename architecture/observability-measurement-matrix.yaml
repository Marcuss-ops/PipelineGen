# PipelineGen — observability measurement classification matrix
# Status: architectural inventory for the initial observability migration.
# Authority: internal/kernel/observability for canonical types and semantics.
# This is an inventory of current code surfaces, not a claim that migration is complete.
#
# Required columns from the approved architecture decision:
# current_symbol, current_owner, current_writer, current_storage, current_metric,
# canonical_type, canonical_stage, canonical_component, canonical_operation,
# migration_adapter, removal_condition.
#
# Classification vocabulary:
#   canonical_type: run | attempt | stage | operation | artifact | child_run |
#                   counter | infrastructure_metric | wait_observation
#   removal_condition: explicit, testable condition; no legacy type is removed
#                      merely because the kernel package compiles.

version: 1
status: inventory
last_reviewed: 2026-08-05
source_of_truth: internal/kernel/observability

measurements:
  - current_symbol: "PipelineResult.StageDurations"
    current_owner: "internal/application/scripts/adapters.PipelineResult"
    current_writer: "PostProcessorRegistry.Run / postprocessor_composite_run.go"
    current_storage: "In-memory map[string]int64; JSON field stage_durations"
    current_metric: "None directly; consumed by script generation timings"
    canonical_type: stage
    canonical_stage: "processor-specific stage, mapped through observability.Registry"
    canonical_component: "script"
    canonical_operation: ""
    migration_adapter: "StageDurationsAdapter: emit one stable Stage observation per processor execution; preserve repeated processor executions with observation IDs"
    removal_condition: "All script consumers read RunReport.Stages; parity passes for success, failure, empty output, and repeated processors; no writer reads or populates StageDurations"

  - current_symbol: "PipelineResult.StageProgress"
    current_owner: "internal/application/scripts/adapters.PipelineResult"
    current_writer: "postprocessor_progress.go"
    current_storage: "In-memory map[string]job.StageProgress; progress projection"
    current_metric: "Job progress/events, not canonical elapsed timing"
    canonical_type: stage
    canonical_stage: "processor-specific stage"
    canonical_component: "script"
    canonical_operation: ""
    migration_adapter: "Project status and item counters into StageReport; do not treat progress events as duration measurements"
    removal_condition: "All operator/API progress consumers distinguish progress from observability timing and read canonical stage status"

  - current_symbol: "VidRushTimingMetrics.ObserveProcessorDuration"
