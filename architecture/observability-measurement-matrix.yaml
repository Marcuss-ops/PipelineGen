    canonical_component: "vidrush"
    canonical_operation: ""
    migration_adapter: "Canonical observer stage close projects a low-cardinality processor/stage metric; retain the existing metric only as a projection"
    removal_condition: "Canonical observer is the sole timer; VidRush adapter no longer accepts a separate timing interface; parity and dashboard migration pass"

