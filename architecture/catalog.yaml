- id: SSOT-JOBS-CONTRACTION
  status: in_progress
  owner: internal/capabilities/jobs
  deadline: '2026-09-15T00:00:00Z'
  rationale: >-
    Materialise the job layer per capabilities_jobs.target_subdirs. The root
    jobs package stays a thin compatibility facade/orchestration boundary;
    reusable policy is promoted into lower layers that depend ONLY on kernel
    contracts + stdlib (never on the root, no import cycles): enqueue into
    jobs/queue, scheduling/prioritisation (resource speculation + preparation
    planning) into jobs/scheduling, finalization (Finalizer + JobCompletionBus
    + workflow-step handlers) into jobs/finalize. Each increment is compile +
    test verified.
  follow_up_tickets:
    - id: JOBS-QUEUE
      note: "DONE 2026-08-31: jobs/queue owns GenerateJobID + ValidateEnqueueRequest + MaxPayloadSize; root enqueue_id.go + enqueue_validate.go are thin adapters. go test ./internal/capabilities/jobs/queue/ green."
    - id: JOBS-SCHEDULING
      note: "DONE 2026-08-31: jobs/scheduling owns ResourceScheduler/SpeculationScheduler + JobPreparationRegistry/PreparationUnit/PreparationPlan (Validate co-located); root speculation_scheduler.go + preparation_registry.go re-export via type aliases + forwarders. go test ./internal/capabilities/jobs/scheduling/ green."
    - id: JOBS-FINALIZE
      note: "DONE 2026-08-31: jobs/finalize owns the 6-file Finalizer unit + completionbus.go (JobCompletionBus/Event/Subscription/ErrWaitTimedOut) + workflow_step_{completed,failed}.go; root finalize_facade.go re-exports. Cycles broken by layering."
    - id: JOBS-POLICY-ORDER
      note: "Deadline gate: align cmd/archcheck + ownership generated view to the materialised subdomains and land the four legacy-governance cleanups (ownership split, legacy-path comments, drive-token wrapper) that keep the SSOT single-owner."
- id: MEDIA-CUTOVER-DEMO-LITION-DEBT
  status: in_progress
  owner: media-postgres-cutover
  deadline: '2026-12-31T00:00:00Z'
  rationale: >-
    Demolition debt from the PostgreSQL + pgvector media cutover (September
    2026). The replacement is ENFORCED by the Go gate suite, NOT by the
    historical certificate: scripts/ci/certify-media-cutover.sh was deleted
    by commit 7e6965aab, and the `make certify-media-cutover` target (with its
    certify-storage / certify-data-layer / certify-rust-migration siblings and
    their -json twins) was RETIRED on 2026-09-13 — a target that can only fail
    closed is not a gate and it kept stale certificate claims alive. The live
    enforcement is `go run ./cmd/archcheck
    --strict` (percheck_media_assets_writer_canonical,
    percheck_asset_committer_event_ssot, percheck_indexed_state_writer_ssot,
    percheck_upsert_points_sole_owner) plus
    `TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/`. The
    design goal remains: PostgresMediaCommitter is the canonical
    writer, MediaSearcher is the canonical VectorStorePort, and
    PostgresIndexWorker (with its composition-root drain loop, E5 sidecar
    embedder via ClipIndexer.ServerURL, and family bootstrap via
    EnsureEmbeddingFamily) is the canonical asset.index.requested consumer.
    This ticket tracks the REMOVAL of the superseded SQLite media writer
    family — removal is mandatory work once the exit condition is met, not
    an option.
  follow_up_tickets:
    - id: DEMO-SQLITE-MEDIA-COMMITTER
      note: "DEMOLITION COMPLETE (September 2026). OWNER: media-postgres-cutover. REASON: the SQLite media writer family (SQLiteMediaCommitter/SQLiteAssetCommitter and the asset_committer* files of internal/platform/sqlite/assets/imagesregistry) has been REMOVED — PostgreSQL + pgvector is the sole production writer of media_assets; only the non-media mutation primitives survive in media_asset_mutations.go (no commit, no outbox emission). REMOVED: the Qdrant media compatibility branch in registerOutboxCoreHandlers (no media index handler is registered on the SQLite outbox in ANY mode), the artlist publish SQLite atomic writer, and the old SQLite-outbox→Qdrant projection sync tests (replaced by the TestCutover_/TestWorker_/TestHNSW_ suites on the live PG DSN). EXIT CONDITION: partially met — enforced structurally by the Go gates (percheck_media_assets_writer_canonical, allowlist = PG family + surviving primitives only; percheck_indexed_state_writer_ssot; percheck_asset_committer_event_ssot). The script-based certificate (SQLITE_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_COMPATIBILITY=0) was NOT re-run since scripts/ci/certify-media-cutover.sh was deleted (commit 7e6965aab), so those three counters are currently UNVERIFIED. EQUIVALENCE GATE: TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/ -count=1 plus go run ./cmd/archcheck --strict. STATUS: structurally closed; certificate MISSING (restore the driver or promote the three counters into cmd/archcheck). AUDIT 2026-09-13: the gate suite is now GREEN and the counters are covered structurally — percheck_media_assets_writer_canonical scans `cmd/` in addition to `internal/`, so the documented repo-wide ban is actually enforced (previously the claim was false for cmd/admin), and its DELETE branch no longer requires a SET/( trailer, so `DELETE FROM media_assets` is caught. The two remaining cmd/admin media writers (maintenance/unify_catalogs.go INSERT OR IGNORE, maintenance/stock_reset.go DELETE) were retired to fail-closed stubs: a SQLite media write would desynchronise the PostgreSQL SSOT while the Drive-side effects still ran. The registry 'current' counts were also found stale for four hotspots and regenerated via scripts/regen_hotspots.py. OPEN ITEM (P2-9 Phase 2, NOT closed by this audit): the fresh-install SQLite baseline 000_baseline_267.sql STILL creates the quarantined media_assets + media_assets_pipeline_events tables (and migration 033 re-declares media_assets), because the SQLite migration test suite asserts their existence (internal/platform/sqlite boot_test.go + migrations_helpers_test.go::essentialTables, migrations_152/157/158/197). Regenerating to 000_baseline_268.sql without media-authoritative tables therefore requires the SQLite media-reader fixtures to be rehomed first; migration 268's marker is the current fresh-install guard. AUDIT 2026-09-13 follow-up: the guard is no longer prose-only — internal/platform/sqlite/migrations_268_test.go now ASSERTS the marker table exists exactly once with the canonical note (before that the marker was written and never read, so the migration's own 'lets runtime and CI gates assert' claim was true only on paper). REGENERATION CONSTRAINT (2026-09-13): `cmd/gen_baseline/main.go` hard-codes `000_baseline_267.sql` (lines 103 and 146) and rebuilds it from a clean `RunMigrationsOnDB` boot, so it RE-EMITS `media_assets` + `media_assets_pipeline_events` from the incremental migrations themselves; producing `000_baseline_268.sql` without media-authoritative tables therefore requires (a) rehoming the SQLite media-reader fixtures — `internal/platform/sqlite/boot_test.go:108`, `migrations_helpers_test.go:54` (`essentialTables`), `migrations_152_test.go:41,54`, `migrations_157_test.go:27`, and the `migrations_158_test.go` / `migrations_197_test.go` cases — (b) teaching gen_baseline to drop the quarantined media DDL, and (c) retiring or re-scoping the `migrations/sqlite/*media*` files plus the `media_assets` re-declaration in `033_media_assets_youtube_video_id_index.sql`. NOT REACHABLE IN THIS PASS: this is a schema-generation project with its own fixture migration, not a doc/gate fix, so it stays OPEN and is tracked here as the single blocking item of this ticket."
    - id: DEMO-QDRANT-MEDIA-PROJECTION
      note: "Demolition-debt card (smaller sibling, same exit condition). OWNER: media-postgres-cutover. REASON: Qdrant media indexing/search adapters (internal/platform/qdrant/search + indexing + collections used by the MEDIA plane) are bypassed in PG mode but still compile and stay wired for staged-migration mode. PRECISION (2026-09-12 audit): the outbox-driven consumer (internal/capabilities/jobs.IndexingHandler) has ZERO production callers, the `media.reindex` job binding (clipindexer.Service.RegisterJobHandler → jobmedia.TypeReindex → HandleJob → IndexClip → Qdrant UpsertPoints) has been REMOVED together with media.TypeReindex, the job policy entry and the clipindexer batch handler; what remains of *clipindexer.Service is a compatibility seam only — SetCanonicalIndexRequester (wired at composition.go) short-circuits IndexClip/IndexAsset into the PostgreSQL outbox. Any claim that 'no Qdrant media write is reachable' is therefore FALSE only for the retired indexAsset implementation, which no production entry point reaches. EXIT CONDITION: same as DEMO-SQLITE-MEDIA-COMMITTER. REMOVAL SCOPE: media-plane Qdrant wiring in build_process_qdrant.go/build_bundles_qdrant_gates.go/adapters_qdrant_transport_health.go, the recover-registry-from-qdrant emergency tool once certified no longer needed, and the media collections schema. NOT in scope (legitimate non-media users, do NOT delete): qdrant/indexing/mediamemory (frame concepts), capabilities/maintenance DR adapter, cmd/admin audit/reconcile tooling FOR NON-MEDIA COLLECTIONS. AUDIT 2026-09-13: the cmd/admin media Qdrant WRITE path is retired — `reindex-qdrant` (SQLite→Qdrant rebuild of the `media_assets` production collection) plus its apply/dry-run/golden-query implementation and the orphaned CollectionManager.PrepareProductionCollection/ActivateProductionCollection pair were removed and replaced by a typed fail-closed stub; the SQLite→Qdrant media parity ticker (projection-reconciler) and its metric family + config key were removed from the composition root; the media Qdrant runbooks that instructed operators to run the retired rebuild were deleted. STATUS: ACTIVE (read-side compatibility seam + DR/retention surface remain)."
