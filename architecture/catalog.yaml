- id: MEDIA-CUTOVER-DEMO-LITION-DEBT
  status: in_progress
  owner: media-postgres-cutover
  deadline: '2026-12-31T00:00:00Z'
  rationale: >-
    Demolition debt from the PostgreSQL + pgvector media cutover (September
    2026). The replacement is ENFORCED by the Go gate suite, NOT by the
    historical certificate: scripts/ci/certify-media-cutover.sh was deleted
    by commit 7e6965aab, and the `make certify-media-cutover` target (with its
    certify-storage / certify-data-layer / certify-rust-migration siblings and
    their -json twins) was RETIRED on 2026-09-13 — a target that can only fail
    closed is not a gate and it kept stale certificate claims alive. The live
    enforcement is `go run ./cmd/archcheck
    --strict` (percheck_media_assets_writer_canonical,
    percheck_asset_committer_event_ssot, percheck_indexed_state_writer_ssot,
    percheck_upsert_points_sole_owner) plus
    `TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/`. The
    design goal remains: PostgresMediaCommitter is the canonical
    writer, MediaSearcher is the canonical VectorStorePort, and
    PostgresIndexWorker (with its composition-root drain loop, E5 sidecar
    embedder via ClipIndexer.ServerURL, and family bootstrap via
    EnsureEmbeddingFamily) is the canonical asset.index.requested consumer.
    This ticket tracks the REMOVAL of the superseded SQLite media writer
    family — removal is mandatory work once the exit condition is met, not
    an option.
  follow_up_tickets:
    - id: DEMO-SQLITE-MEDIA-COMMITTER
      note: "DEMOLITION COMPLETE (September 2026). OWNER: media-postgres-cutover. REASON: the SQLite media writer family (SQLiteMediaCommitter/SQLiteAssetCommitter and the asset_committer* files of internal/platform/sqlite/assets/imagesregistry) has been REMOVED — PostgreSQL + pgvector is the sole production writer of media_assets; only the non-media mutation primitives survive in media_asset_mutations.go (no commit, no outbox emission). REMOVED: the Qdrant media compatibility branch in registerOutboxCoreHandlers (no media index handler is registered on the SQLite outbox in ANY mode), the artlist publish SQLite atomic writer, and the old SQLite-outbox→Qdrant projection sync tests (replaced by the TestCutover_/TestWorker_/TestHNSW_ suites on the live PG DSN). EXIT CONDITION: partially met — enforced structurally by the Go gates (percheck_media_assets_writer_canonical, allowlist = PG family + surviving primitives only; percheck_indexed_state_writer_ssot; percheck_asset_committer_event_ssot). The script-based certificate (SQLITE_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_COMPATIBILITY=0) was NOT re-run since scripts/ci/certify-media-cutover.sh was deleted (commit 7e6965aab), so those three counters are currently UNVERIFIED. EQUIVALENCE GATE: TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/ -count=1 plus go run ./cmd/archcheck --strict. STATUS: structurally closed; certificate MISSING (restore the driver or promote the three counters into cmd/archcheck). AUDIT 2026-09-13: the gate suite is now GREEN and the counters are covered structurally — percheck_media_assets_writer_canonical scans `cmd/` in addition to `internal/`, so the documented repo-wide ban is actually enforced (previously the claim was false for cmd/admin), and its DELETE branch no longer requires a SET/( trailer, so `DELETE FROM media_assets` is caught. The two remaining cmd/admin media writers (maintenance/unify_catalogs.go INSERT OR IGNORE, maintenance/stock_reset.go DELETE) were retired to fail-closed stubs: a SQLite media write would desynchronise the PostgreSQL SSOT while the Drive-side effects still ran. The registry 'current' counts were also found stale for four hotspots and regenerated via scripts/regen_hotspots.py. OPEN ITEM (P2-9 Phase 2, NOT closed by this audit): the fresh-install SQLite baseline 000_baseline_267.sql STILL creates the quarantined media_assets + media_assets_pipeline_events tables (and migration 033 re-declares media_assets), because the SQLite migration test suite asserts their existence (internal/platform/sqlite boot_test.go + migrations_helpers_test.go::essentialTables, migrations_152/157/158/197). Regenerating to 000_baseline_268.sql without media-authoritative tables therefore requires the SQLite media-reader fixtures to be rehomed first; migration 268's marker is the current fresh-install guard. AUDIT 2026-09-13 follow-up: the guard is no longer prose-only — internal/platform/sqlite/migrations_268_test.go now ASSERTS the marker table exists exactly once with the canonical note (before that the marker was written and never read, so the migration's own 'lets runtime and CI gates assert' claim was true only on paper). REGENERATION CONSTRAINT (2026-09-13): `cmd/gen_baseline/main.go` hard-codes `000_baseline_267.sql` (lines 103 and 146) and rebuilds it from a clean `RunMigrationsOnDB` boot, so it RE-EMITS `media_assets` + `media_assets_pipeline_events` from the incremental migrations themselves; producing `000_baseline_268.sql` without media-authoritative tables therefore requires (a) rehoming the SQLite media-reader fixtures — `internal/platform/sqlite/boot_test.go:108`, `migrations_helpers_test.go:54` (`essentialTables`), `migrations_152_test.go:41,54`, `migrations_157_test.go:27`, and the `migrations_158_test.go` / `migrations_197_test.go` cases — (b) teaching gen_baseline to drop the quarantined media DDL, and (c) retiring or re-scoping the `migrations/sqlite/*media*` files plus the `media_assets` re-declaration in `033_media_assets_youtube_video_id_index.sql`. NOT REACHABLE IN THIS PASS: this is a schema-generation project with its own fixture migration, not a doc/gate fix, so it stays OPEN and is tracked here as the single blocking item of this ticket. READ-PLANE CLOSURE PASS (2026-09-13, second pass): the reachable read split-brain items are closed. (1) MEDIA-SSOT P1-6 CLOSED — the legacy SQLite local search backend (internal/app/wiring/search/search_backend_local.go, which read media_assets via sqassets.ClipsRepository) was DELETED; BuildSearchBackends no longer accepts a ClipsRepo and leaves the local media capability unregistered when the PostgreSQL local store is absent (godlike/07 fail-closed) instead of degrading to the SQLite mirror, pinned by TestBuildSearchBackends_FailsClosedWithoutPostgresLocalStore. (2) MEDIA-SSOT P1-5 CLOSED for the Artlist Searcher port — WireArtlist no longer calls sqliteSearch.NewArtlistSQLiteSearcher(bundle.ClipsRepo); the local searcher is newArtlistLocalSearcher(pgmedia.NewMediaSearcher(bundle.MediaDB)) in internal/app/wiring/artlist_runs_adapter.go (merged into an existing file to respect the percheck_legacy_hotspot_growth 150-production-file cap on internal/app/wiring), pinned by TestArtlistLocalSearcher_ReadsPostgresMediaSSOT; NewArtlistSQLiteSearcher now has ZERO production callers. (3) VERIFIED ALREADY CLOSED at HEAD, no change needed: P0-1 dispatcher (self-owned AssetCommitter paths; the tx-bound cross-engine branch is not representable), P0-2 Stock (splitPlaneFinalizer two-phase media-then-jobs boundary, banned by media_cutover_boundary_test.go), P0-3 Artlist (assetFinalizerDB opens the finalizer tx on the committer engine), P1-4 (pgmedia.MediaSearcher implements GetAsset/GetAssetsByIDs/GetMany/FindByHash/FindByYouTubeID/SearchLocal/FindAllByHash/SearchClipsByName), and the catalog-sync read-after-write (postgresCatalogRepository routes GetClip/GetIndexState to PostgreSQL). REMAINING BLOCKER FOR P2-9 PHASE 2, now precisely enumerated: the operational SQLite media READ plane still has production consumers, so a media-free fresh-install baseline would break them. Exact sites: (a) root.Repos.Assets = detail.Service(imagesregistry.AssetStoreSQLite) consumed by registry_adminconsole_api.go (List/Get/Save), registry_operator_admin_api.go, script_generation_runtime.go media preflight, wire_script_postprocess.go, localization_service.go, and build_bundles_artlist_publishers.go:60; (b) artlist.AssetStore.SearchClips (wired to bundle.ClipsRepo) called from artlist/search_core.go:49,308 (the /api/artlist/search DB-only endpoint and SearchService.SearchClips) and artlist/diagnostics.go:240; (c) imagesregistry.AssetStoreSQLite.SearchClips to SearchByTerms (search_terms_queries.go) still queries the clip_search_terms inverted index and re-hydrates media_assets in SQLite. UNBLOCK ORDER: (1) give the Artlist capability a PostgreSQL-backed read port for its DB-only search endpoints; (2) migrate the admin-console/script/operator Repos.Assets consumers to pgmedia.MediaSearcher; (3) retire clip_search_terms as a media index (migration 267 quarantined it in the observability DB only); then (4) rehome boot_test.go / migrations_helpers_test.go::essentialTables / migrations_152/157/158/197; (5) teach cmd/gen_baseline to drop the quarantined media DDL and bump to 000_baseline_268.sql. GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false) and all verify-agent legs green; NOTE the repository Makefile currently cannot parse because make/verify.policy.mk, make/artlist.mk and make/operations.smoke.mk are deleted in the working tree (pre-existing, unstaged) while still listed in include make/*.mk, so the agent gate was executed leg-by-leg. GATE-PROMOTION PASS (2026-09-13, third pass): the standing instruction recorded above — 'restore the driver or promote the three counters into cmd/archcheck' — is now satisfied for the READ counter. CERTIFICATE COUNTER STATUS: (1) SQLITE_MEDIA_WRITERS=0 — enforced by percheck_media_assets_writer_canonical (pre-existing); (2) SQLITE_MEDIA_READERS=0 — was UNVERIFIED, NOW PROMOTED to the hard gate `percheck_sqlite_media_reader_ban` (cmd/archcheck/scan/boundaries/percheck_sqlite_media_reader_ban.go), registered in cmd/archcheck/checks.go and architecture/policy.yaml's hard-gate list. The gate scans internal/ + cmd/ non-test files for comment-masked SQL reads of media_assets (FROM/JOIN) and fails closed on any file outside (a) the PostgreSQL media SSOT (internal/platform/postgres/), (b) the grandfathered legacy read plane (internal/platform/sqlite/, internal/platform/qdrant/indexing/, cmd/admin/), and (c) an exact-file 14-entry debt register (sqliteMediaReaderGrandfatheredFiles) listing the P2-9 Phase 2 read split-brain sites. The register has no ghost entries (pinned by TestSQLiteMediaReaderGrandfatheredFilesExist) and the real tree is clean (pinned by TestScanSQLiteMediaReaderBan_RepoTreeIsClean); detection is proven by TestScanSQLiteMediaReaderBan_ViolationTrip. Consequence for this ticket: the P2-9 Phase 2 blocker is unchanged in substance but is now MEASURABLE and RATCHETING — every migrated consumer must delete its register entry in the same change, and a NEW SQLite media reader cannot land unnoticed. (3) QDRANT_MEDIA_WRITERS/READERS/COMPATIBILITY — covered structurally by percheck_upsert_points_sole_owner + percheck_qdrant_index_import_ban + percheck_frame_concept_projection_writer rather than by a dedicated counter. ALSO DELETED THIS PASS (SQLite media reader family, zero production callers): internal/platform/sqlite/assets/artlist/artlist_searcher.go and its test, internal/capabilities/assets/providers/artlist/searcher_sqlite.go, and the `NewSQLiteSearcher(s.assetStore)` fallback in SearchService.buildSearcherChain (internal/capabilities/assets/providers/artlist/search_core.go). The Artlist local catalog searcher is now an EXPLICIT injection point only (composition wires the PostgreSQL-backed one); the SQLite bridge survives solely as the test-only helper internal/capabilities/assets/providers/artlist/searcher_local_testhelper_test.go. The 25 artlist fixture tests that had relied on the production fallback were updated to inject explicitly (helpers_test.go::baseServiceDeps default + search_chain_prefer_remote_test.go). GATE STATE: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations, 74 warnings under the 77 cap); go vet ./..., go build ./..., the no-secrets + submodule-integrity scripts and the verify-changed-components runner all PASS. GATE-PRECISION + P2-9 STEP 1 PASS (2026-09-13, fourth pass). (A) THE PROMOTED READ GATE WAS MADE DIALECT-CORRECT. The counter is SQLITE_MEDIA_READERS=0, so a PostgreSQL read of media_assets (a $N-bound statement) is correct by construction and must never be reported as debt; percheck_sqlite_media_reader_ban now classifies each read by the dialect of its enclosing SQL expression (go/ast string-literal and concatenation spans) instead of relying on a path allowlist for that fact. Consequence: the two register entries that were PostgreSQL-only were FALSE POSITIVES and were deleted — internal/app/wiring/build_bundles_domain_media.go (source_version read inside the media-commit pg transaction) and internal/app/wiring/vidrush/vidrush_materialization.go (index_state read on the media SSOT). Both remain load-bearing as regression pins: if the dialect discrimination breaks they reappear as violations and TestScanSQLiteMediaReaderBan_RepoTreeIsClean fails. (B) THE RATCHET WAS MADE ONE-DIRECTIONAL. The register previously pinned only that an entry's FILE still existed, so an entry whose read had been migrated survived as dead weight, which is how such lists decay into permanent allowlists. sqliteMediaReaderRegisterEntryIsLive plus TestSQLiteMediaReaderRegisterHasNoStaleEntries now require every entry to still carry a live SQLite-dialect read, and the check fired for real: internal/app/wiring/registry_adminconsole_api.go had already been migrated by the concurrent MediaAssetStore()/MediaAssetVersionStore() change and its stale entry was deleted. (C) THE REGISTER WAS SPLIT BY KIND. sqliteMediaReaderGrandfatheredFiles is now the production split-brain debt that must reach zero; sqliteMediaReaderDegradeOnlyFiles holds the documented media-disabled paths whose SQLite read is selected only when the PostgreSQL media plane is CLOSED, each naming its selector, with TestSQLiteMediaReaderRegistersAreDisjoint pinning that an entry belongs to exactly one. The file internal/app/wiring/canonical_media_committer.go (sqliteMediaAssetStore, chosen by ComposeRoot.MediaAssetStore() only when r.MediaPostgres == nil) is registered there: the gate caught it as a NEW reader and the reviewable decision was to classify it rather than widen the debt list. That entry also proved the exact-path pins work: the store briefly lived in a new file media_asset_store.go, and when the concurrent writer merged it back here to stay under the internal/app/wiring hotspot cap, TestSQLiteMediaReaderGrandfatheredFilesExist and TestSQLiteMediaReaderRegisterHasNoStaleEntries failed until the register entry followed in the same change. Register after this pass: 9 production-debt + 3 degrade-only = 12 entries, down from 14, with zero correct PostgreSQL readers misreported. (D) P2-9 UNBLOCK STEP 1 CLOSED. The Artlist DB-only search surface (AssetStore.SearchClips, and SearchByTerms behind it) resolved ids from the SQLite clip_search_terms inverted index and re-hydrated SQLite media_assets, so /api/artlist/search could not see a clip committed by the canonical PostgreSQL committer. WireArtlist now wraps the operational store in artlistMediaSSOTAssetStore (internal/app/wiring/artlist_runs_adapter.go), which answers SearchClips/SearchByTerms from pgmedia.MediaSearcher.SearchLocal over media_assets.search_terms with the same AND semantics and the same canonical ranking (detail.ScoreClips); every other AssetStore method still delegates. SearchLocal gained LocalMediaSearchRequest.AllTerms for the multi-keyword form, so there is NO PostgreSQL counterpart of clip_search_terms to create, which is what makes unblock step 3 (retire clip_search_terms as a media index) a deletion rather than a rewrite. Pinned by TestArtlistMediaSSOTAssetStore_SearchClipsReadsPostgres, _SearchByTermsHonorsLimit, _DelegatesRemainingMethods, _NoStoreKeepsDelegate, TestScanSQLiteMediaReaderBan_PostgresDialectOutsidePostgresPath, _MixedFileReportsOnlySQLite and _ConcatenatedPostgresStatement. REMAINING P2-9 UNBLOCK ORDER (unchanged in substance, now measurable): (2) the Repos.Assets consumers are now PARTIALLY migrated — ComposeRoot.MediaAssetStore()/MediaAssetVersionStore() already prefer PostgreSQL for the admin-console/operator read plus version surface, so what remains are the non-admin consumers: script_generation_runtime.go media preflight, wire_script_postprocess.go, localization_service.go and build_bundles_artlist_publishers.go; (3) retire clip_search_terms as a media index — the Artlist reader is gone, what remains are the UpdateSearchTerms/clip_search_terms writes and the residual AssetStoreSQLite.SearchClips/SearchByTerms callers; (4) rehome boot_test.go / migrations_helpers_test.go::essentialTables / migrations_152/157/158/197; (5) teach cmd/gen_baseline to drop the quarantined media DDL and bump to 000_baseline_268.sql. STILL NOT REACHABLE: P2-9 Phase 2 itself, for the reasons recorded above; the register still lists 9 production read sites plus the whole internal/platform/sqlite read plane. EXTERNAL INTERFERENCE OBSERVED AT THIS HEAD (not caused by this pass; left untouched because they belong to other writers in flight — three of the four resolved during the session as those writers finished): (i) go run ./cmd/archcheck --strict was RED with exactly 2 violations, both the hotspot cap — internal/app/wiring briefly sat at 151 production files against its registered 150 — raised by the then-untracked file internal/app/wiring/media_asset_store.go; that file was subsequently merged back into canonical_media_committer.go and the package is back at 150, so the hotspot gate is green again; the percheck_sqlite_media_reader_ban gate itself reported 0 violations throughout; (ii) internal/platform/postgres/media briefly failed TestScanMediaAssetRecord_ColumnAlignment because a concurrent edit added search_terms/review_status to mediaAssetReadColumns and to scanMediaAssetRecord while its test file was still being written — that writer finished and the suite is green again; (iii) make verify-agent failed at verify-changed-components on unmapped_files=testdata/workflows/test_stock_pipeline_live.yaml, a deletion made by another writer, still outstanding at the time of writing and unrelated to the media plane; (iv) while (i)-(ii) were live, git status of the same paths changed between consecutive commands, so any gate result in this window must be re-derived after the writers settle; (v) make verify-fast initially failed verify-format on internal/app/wiring/artlist_types.go, left misaligned by a concurrent writer who had just DELETED the legacy ArtlistBundle.Assets field (it had zero production readers once the Artlist DB-only surface moved to the PostgreSQL media SSOT via artlistMediaSSOTAssetStore, which is P2-9 unblock step 2 progress) — this pass applied gofmt only, a whitespace-only change with no semantic effect, and verify-fast is green. FINAL GATE STATE FOR THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations, 74 warnings), make verify-agent PASS, make verify-fast PASS, and the impacted suites (internal/platform/postgres/media, internal/capabilities/assets/providers/artlist, internal/app/wiring/..., cmd/archcheck/...) all ok. REPOS.ASSETS NON-ADMIN MIGRATION PASS (2026-09-13, fifth pass). CLAIM RE-CHECKED FIRST, AND THE PREVIOUS LIST WAS STALE. Of the four non-admin consumers named in the READ-PLANE CLOSURE PASS: localization_service.go was ALREADY fully migrated (it fails closed with 'media PostgreSQL SSOT is required (no second media catalog)' at localization_service.go:232, which is the exact pattern this pass propagated); build_bundles_artlist_publishers.go no longer references Repos.Assets at all; only script_generation_runtime.go and wire_script_postprocess.go were still live. Re-counting from source, Repos.Assets had SIX production consumers, not four. MIGRATED IN THIS PASS (census 6 -> 4). (1) ComposeRoot.MediaAssetDetailsLookup() (canonical_media_committer.go) is now PostgreSQL-ONLY and returns nil when the media plane is closed; the trailing 'return r.Repos.Assets' was deleted. Justification is the repo's own invariant, not a preference: RequireMediaPostgres is documented as the ONLY engine decision point and states 'Enabled means PostgreSQL is mandatory ... There is no SQLite/Qdrant fallback', so a SQLite return there contradicted the declared contract and re-created the split-brain — an asset committed by the canonical committer was invisible to the worker asset-transfer path. nil is the fail-closed signal the consumer already handles (AssetTransferServiceImpl guards querySvc != nil). (2) script_generation_runtime.go no longer re-implements the engine branch: the inline 'if root.MediaPostgres != nil { ... } else if root.Repos.Assets != nil { ... }' block was replaced with mediasub.AssetDetailsLookup(root.MediaAssetDetailsLookup()). That removes a SECOND engine decision point (the duplication RequireMediaPostgres exists to prevent) and, concretely, removes the failure mode where the script media preflight reported a PG-committed clip as missing while the worker transfer path (same selector) saw it. (3) wire_script_postprocess.go: the SQLite-backed deep verifier branch and its assetServiceLookupAdapter type (wrapping detail.Service) were DELETED, so the AssetLocationReconciliationProcessor has exactly two modes — deep Drive+PostgreSQL, or the explicit Drive-only shallow AssetLocationResolverAdapter — instead of a third mode that cross-referenced a divergent catalog. REMAINING Repos.Assets CONSUMERS (4), with why each was left. (a) canonical_media_committer.go:290-295 — the admin/operator admin-console store selection (sqliteMediaAssetStore), i.e. the ADMIN surface; it is also the sole remaining SQL reader behind the sqliteMediaReaderDegradeOnlyFiles register entry for that file, so removing it is what will retire that entry. (b) registry_assets.go:29 and (c) registry_internal_modules.go:211 — structural: they populate the assets / internal-media module bundles with the legacy detail.Service, which the ingest registries consume (build_bundles_ingest.go:115-118, build_bundles_domain_media.go:421-428, build_media_processor.go:58-61, module_media_ingest.go:125-128) as the ClipsRegistry hydration/processing dependency and via ingest.NewClipStoreAdapter. That is a registry-construction migration, not a read swap, and a concurrent writer is already mid-flight on exactly that area (they added pgmedia.MediaClipAssetReader over the media read repository and wired it in wire_assets.go as the clips read adapter), so this pass deliberately did not duplicate or race it; ingest/adapter_clip.go remains on the production-debt register for the same reason. GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations, 74 warnings), make verify-fast PASS, make verify-agent PASS, and the suites internal/app/wiring/..., internal/capabilities/jobs/..., internal/capabilities/scripts/..., internal/platform/drive/... and cmd/archcheck/... all ok. The sqliteMediaReader register is unchanged at 9 production-debt + 3 degrade-only: this pass removed Repos.Assets READS, but the register keys on direct SQL against media_assets, and none of the three migrated sites contained that SQL (they reached it through detail.Service in the grandfathered internal/platform/sqlite plane). INGEST MEDIA-HYDRATION MIGRATION PASS (2026-09-13, sixth pass). (A) DONE — the two ingest registries no longer take the legacy detail.Service for media hydration. Measured before touching anything: the concrete *detail.Service was used for exactly ONE method in each registry — Get(ctx,id) (*asset.Details, error) — so the dependency was retyped, not rewritten. artifacts.AssetDetailsReader (internal/capabilities/assets/artifacts/clips_adapter.go) and ingest.AssetDetailsReader (internal/capabilities/assets/ingest/adapter_clip.go) are now consumer-owned interfaces, and the construction sites pass mediaDetailsReaderFromCommitter(committer) (internal/app/wiring/canonical_media_committer.go), which derives the details reader from the canonical committer's own engine through its DB() handle — the same invariant MediaRepoBundle uses, so the ingest read and the canonical write cannot drift onto two engines. Sites migrated: build_bundles_ingest.go (2 registries + 2 clip stores), module_media_ingest.go (2 + 2), build_bundles_domain_media.go (1), and registry_helpers.go::InitMediaProcessor (1, whose now-dead querySvc *detail.Service parameter was DELETED so a caller cannot pass SQLite again). REAL DEFECT CLOSED: ingest's clipStoreAdapter.Get had NO PostgreSQL hydration path at all — it read the operational SQLite mirror unconditionally, so a clip committed by the canonical PostgreSQL committer looked absent to the ingest lifecycle and a stale pre-cutover row could be staged in its place. Both registries now fail closed with a typed error when no reader is wired (an unreadable catalog must not report not-found), pinned by TestClipStoreGet_FailsClosedWithoutMediaDetailsReader, TestClipsRegistryGetMedia_FailsClosedWithoutMediaDetailsReader and TestMediaDetailsReaderFromCommitter_DerivesFromCommitterEngine / _NoEngineYieldsNothing. WHAT WAS NOT NARROWED, AND WHY: the MediaIngestBundle.Assets and ServiceDeps.Assets *detail.Service FIELDS remain, because the roles still using them are not media reads — detail.Repository serves only the post-dispatch SoftDelete lifecycle call, LocationRepository only the asset_locations upsert, and ProcessingRepository is unused by these adapters. Each needs its own PostgreSQL port, and no PG LocationRepository/ProcessingRepository implementation exists under internal/platform/postgres/media yet (only PGAssetLocationExists), so narrowing those fields would have meant inventing half-wired ports; that is a separate step and was deliberately not faked. (B) NOT LANDED, WITH REASON — P2-9 unblock step 3, retiring clip_search_terms as a media index. Measured: the only production reader is the SearchByTerms fast path inside AssetStoreSQLite.SearchClips (internal/platform/sqlite/assets/imagesregistry/search_queries.go:148), and AssetStoreSQLite.SearchClips has THREE production callers — realtime search (internal/app/wiring/wire_script_adapters.go:171, whose source defaults to artlist), catalog search (internal/platform/sqlite/catalog/repository.go:45) and clip listing (clip_list_queries.go:62). The writers are the two artlist call sites (artlist/search_core.go:124 and artlist/semantic_enricher_enrich.go:188). Because the fast path only falls back when it returns ZERO rows, removing the writers while the reader remains — or the reverse — is not behaviour-neutral: it silently shrinks live search results. clip_search_terms is therefore all-or-nothing, and the SearchClips semantic change must be covered by tests before it lands. EXACT REMAINING PLAN for step 3: (a) pin the fast path's current result set for those three callers with a fixture test; (b) delete the SearchByTerms fast path from AssetStoreSQLite.SearchClips and prove the clipSearchColumns LIKE fallback is acceptable for them; (c) delete the SearchByTerms/UpdateSearchTerms/RebuildSearchTerms family (RebuildSearchTerms already has ZERO production callers) from imagesregistry and from the artlist AssetStore port, updating the ~17 test files that implement that port; (d) add the schema-retirement migration — the next free number is 270, and because 267 already renamed the table to legacy_observability_clip_search_terms in the observability DB the retirement must handle BOTH names — together with the 000_baseline_268 regeneration already tracked above. GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations), and the affected suites internal/capabilities/assets/... and internal/app/wiring/... green. COULD NOT COMPLETE make verify-fast / make verify-agent IN THIS WINDOW: three other writers were mid-refactor of cliprender.RenderExecutor (adding Settle) and the texttracks package, which broke go vet ./... inside packages this pass never touched (capabilities/cliprender, capabilities/localization/adapters, platform/renderinggen) and flapped between retries — every failure was in their files and cleared on their next write. Both gates must be re-run once those writers settle. MEDIA-WRITE-BRIDGE GATE PASS (2026-09-13, seventh pass). (A) THE GAP. The SQL-level writer gate (percheck_media_assets_writer_canonical) inspects STATEMENTS, so it is structurally blind to a media write that goes through an interface: someRepo.Upsert(ctx, a) contains no SQL at the call site at all. That is exactly how the YouTube enrichment defect landed — youtube/usecase held a detail.Repository, called Upsert, and in PostgreSQL mode the composition root had satisfied that interface with the SQLite AssetStoreSQLite facade, so enrichment wrote media_assets on the WRONG ENGINE with every gate green. The generic seam detail.Repository / detail.Service is the construct that makes it possible: the type carries no information about which database owns the write, so a wrong caller is indistinguishable from a correct one at compile time. (B) NEW HARD GATE percheck_media_write_bridge_ban (cmd/archcheck/scan/boundaries/percheck_media_write_bridge_ban.go), registered in cmd/archcheck/checks.go and in architecture/policy.yaml::hard_gates. It walks internal/ + cmd/ non-test Go files and flags a mutating call on the generic seam, detected structurally on the AST: repo.Upsert / SoftDelete / Restore / HardDelete where the receiver is declared in the same file as detail.Repository (struct field, parameter, result or var), the Service forms Save / Delete, and the chained svc.Repository().Upsert(...) shape that ClipsRegistry and the ingest lifecycle actually use. The seam is resolved through the REAL import path (internal/kernel/asset/detail), so a same-named type from another package cannot trigger it, and a narrow port that happens to have a method called Upsert is not flagged — the gate bans the generic seam, not a method name. Reads are deliberately excluded: percheck_sqlite_media_reader_ban already owns the SQLITE_MEDIA_READERS counter and its registers, so reporting the seam reads here would double-report one fact. Unparseable files fail closed (reported, never silently exempted). (C) EXEMPTIONS, ALL REVIEWABLE. Zone-exempt by construction (the seam own implementation plane): internal/kernel/asset/detail/ (the interface definition), internal/platform/sqlite/ (the operational store that implements it; its media_assets SQL is already fenced by the writer gate) and internal/platform/postgres/media/ (the canonical PostgreSQL owner). Exact-file debt register mediaWriteBridgeGrandfatheredFiles, 2 entries, both the post-dispatch delete still routed through detail.Repository: internal/capabilities/assets/artifacts/clips_adapter.go (DeleteMedia) and internal/capabilities/assets/ingest/adapter_clip.go (DeleteAssetRecord). These are genuine remaining split-brain writes — the UPSERT on the same fields was already routed to dispatcher.EnqueueAndIndex, only the delete is left, and it needs a delete port on the canonical side rather than another adapter. Separate degrade-only register mediaWriteBridgeDegradeOnlyFiles, 1 entry: internal/app/wiring/canonical_media_committer.go (sqliteMediaAssetStore.Save on the operational detail.Service, chosen by ComposeRoot.MediaAssetStore() only when r.MediaPostgres == nil). (D) THE RATCHET IS ONE-DIRECTIONAL, like the read gate: an entry must still carry a live detected seam write (mediaWriteBridgeRegisterEntryIsLive + TestMediaWriteBridgeRegisterHasNoStaleEntries) and must still exist (TestMediaWriteBridgeRegisteredFilesExist), so migrating a consumer forces its entry out rather than letting the list decay into a permanent allowlist. Detection is proven by TestScanMediaWriteBridgeBan_RegressionYouTubeEnrichment, which reproduces the historical YouTube shape and must fail the gate, plus pins for every mutating method, the chained form, the read exclusion, the narrow-port exclusion, zone and exact-path exemptions, alias resolution and the test-file exclusion. (E) GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations, 75 warnings), go build ./... green, hotspots fresh, and cmd/archcheck/... plus cmd/archcheck/scan/boundaries/... green. go vet ./... and make verify-fast/verify-agent still could not be completed in this window for the same reason as the previous pass: other writers were mid-refactor of cliprender.RenderExecutor (adding Settle) and the texttracks/cliprender subtitle path, so vet failed in capabilities/cliprender, capabilities/localization/adapters and platform/renderinggen — packages this pass never touched. REMAINING BRIDGE DEBT: the two registered delete sites above, which need a canonical delete/soft-delete port (the dispatcher only STAMPS delete-pending and emits asset.index.delete_requested; the actual row mutation happens in the index-delete worker), so migrating them is a behaviour change that must be proven against a live PostgreSQL DSN rather than a wiring swap. CANONICAL RETIREMENT PORT PASS (2026-09-13, eighth pass). THE PREVIOUS PASS WAS WRONG ABOUT ITS OWN HARDEST CONSTRAINT. Re-checked before touching anything: the canonical retirement surface already existed and was already bound in production. PostgresMediaCommitter.SoftDeleteAsset (internal/platform/postgres/media/delete_saga.go) is documented as the exact mirror of imagesregistry.ClipsRepository.SoftDelete — same lifecycle_state=DELETED + deleted_at pair — and the composition root had already adapted it to the jobs.AssetDeleter port (pgMediaAssetDeleter, internal/app/wiring/build_outbox_handlers.go), which the index-delete hop of the deletion saga consumes. So the two remaining bridge writes needed a PORT, not a live PostgreSQL DSN. (A) NEW PORT, ONE OWNER. persistence.AssetSoftDeleter (internal/capabilities/assets/persistence/committer.go) declares the narrow retirement surface — the single SoftDeleteAsset method — deliberately separate from AssetMutationCommitter so a caller that only retires an asset cannot reach the other fifteen mutations by accident (Pattern 0). persistence.CanonicalAssetSoftDeleter(committer) is the SINGLE resolution rule: it answers only for a committer that exposes retirement and returns nil otherwise (media plane closed), so no capability can keep a private SQLite fallback alive for a write the canonical committer owns. Pinned by TestCanonicalAssetSoftDeleter_ResolvesStructuralRetirement, _FailsClosed and TestAssetSoftDeleter_IsNarrow. (B) BOTH CONSUMERS MIGRATED, THE SEAM DELETED OUTRIGHT. artifacts.ClipsRegistry lost its `assets detail.Repository` field and constructor parameter; DeleteMedia now resolves persistence.CanonicalAssetSoftDeleter from the committer it already held and fails closed with mutations.ErrDispatcherUnavailable when the plane is closed. That is a consistency fix as much as a cutover: UpsertMedia ALREADY failed closed without a committer (clips registry committer not configured), so the SQLite SoftDelete fallback was the one inconsistent branch. ingest.clipStoreAdapter lost its `repo detail.Repository` field and parameter and takes the same port for DeleteAssetRecord, also failing closed. The dead pgMutator() helper and the now-unused detail.Repository parameter of InitMediaProcessor were deleted with them, so that entry point no longer accepts a seam a caller could pass SQLite through. New signatures: NewClipsRegistry(db, querySvc, processing, committer), NewClipsRegistryWithLogger(db, querySvc, processing, committer, log), NewClipStoreAdapter(db, retirer, querySvc, locations, processing, dispatcher), InitMediaProcessor(..., locations, processing, committer, ...). (C) THE WRITE-BRIDGE GATE RATCHETED TO ZERO PRODUCTION ALLOWLIST. Both remaining entries in percheck_media_write_bridge_ban were deleted in the same change (the concurrent deletion of sqliteMediaAssetStore had already retired the third), so mediaWriteBridgeGrandfatheredFiles and mediaWriteBridgeDegradeOnlyFiles are now BOTH EMPTY and the gate is a pure forward-prevention rule with zero production allowlist, pinned by the new TestMediaWriteBridgeRegistersAreEmpty. The register mechanism and its one-directional pins are deliberately kept — TestMediaWriteBridgeRegisterHasNoStaleEntries still fails if an entry survives its consumer — so a future documented exception must be a reviewed admission rather than a configuration knob. The exact-path exemption property is now exercised on a synthetic entry, because the production register is empty by design. Note what changed conceptually: this class of defect (a media write whose engine is invisible at the call site) is now caught by the gate for FUTURE code and has ZERO known instances in the tree, whereas the previous pass recorded it as blocked on an unverifiable behaviour change. (D) GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false, 0 violations, 75 warnings), go build ./... green, go vet clean on the touched packages, gofmt clean, hotspots fresh, and the suites internal/capabilities/assets/... and internal/app/wiring/... green. STILL OPEN, unchanged and NOT reachable in this pass: (2) a PostgreSQL asset_processing / asset_locations write port — measured this pass: the ingest adapters still call persistProcessingState/persistMediaProcessingState through detail.ProcessingRepository and upsert asset_locations through detail.LocationRepository, so MediaIngestBundle.Assets and ServiceDeps.Assets cannot be narrowed to typed ports yet, which is what keeps the two remaining root.Repos.Assets consumers (registry_assets.go:29, registry_internal_modules.go:211) alive; (3) the clip_folders write path, which blocks the cmd/admin folder ops (UpsertFolder/ListFolders/DeleteFolder) and therefore most of the remaining root.Repos.ClipsRepo consumers; (5) RepoBundle field deletion, blocked on 2-3; (6) AssetIndexService retirement; (7) the fixture rehoming plus 000_baseline_268 regeneration. Note also that RepoBundle.AssetsStore now has exactly ONE production consumer — the WireCanonicalAssetStore compatibility seam at build_bundles_domain_assets.go:83 — and that instance is distinct from the one reached through ClipsRepo.AssetStoreSQLite at line 87, so the seam cannot be deleted independently of RepoBundle.Assets; see item 5."
    - id: DEMO-QDRANT-MEDIA-PROJECTION
      note: "Demolition-debt card (smaller sibling, same exit condition). OWNER: media-postgres-cutover. REASON: Qdrant media indexing/search adapters (internal/platform/qdrant/search + indexing + collections used by the MEDIA plane) are bypassed in PG mode but still compile and stay wired for staged-migration mode. PRECISION (2026-09-12 audit): the outbox-driven consumer (internal/capabilities/jobs.IndexingHandler) has ZERO production callers, the `media.reindex` job binding (clipindexer.Service.RegisterJobHandler → jobmedia.TypeReindex → HandleJob → IndexClip → Qdrant UpsertPoints) has been REMOVED together with media.TypeReindex, the job policy entry and the clipindexer batch handler; what remains of *clipindexer.Service is a compatibility seam only — SetCanonicalIndexRequester (wired at composition.go) short-circuits IndexClip/IndexAsset into the PostgreSQL outbox. Any claim that 'no Qdrant media write is reachable' is therefore FALSE only for the retired indexAsset implementation, which no production entry point reaches. EXIT CONDITION: same as DEMO-SQLITE-MEDIA-COMMITTER. REMOVAL SCOPE: media-plane Qdrant wiring in build_process_qdrant.go/build_bundles_qdrant_gates.go/adapters_qdrant_transport_health.go, the recover-registry-from-qdrant emergency tool once certified no longer needed, and the media collections schema. NOT in scope (legitimate non-media users, do NOT delete): qdrant/indexing/mediamemory (frame concepts), capabilities/maintenance DR adapter, cmd/admin audit/reconcile tooling FOR NON-MEDIA COLLECTIONS. AUDIT 2026-09-13: the cmd/admin media Qdrant WRITE path is retired — `reindex-qdrant` (SQLite→Qdrant rebuild of the `media_assets` production collection) plus its apply/dry-run/golden-query implementation and the orphaned CollectionManager.PrepareProductionCollection/ActivateProductionCollection pair were removed and replaced by a typed fail-closed stub; the SQLite→Qdrant media parity ticker (projection-reconciler) and its metric family + config key were removed from the composition root; the media Qdrant runbooks that instructed operators to run the retired rebuild were deleted. STATUS: ACTIVE (read-side compatibility seam + DR/retention surface remain)."
    - id: TEXT-TRACK-MULTILINGUAL-INDEX-CLOSURE
      note: "CLOSED (2026-09-14). OWNER: media-postgres-cutover. REASON: the translation stage of the YouTube → clip → transcript → translation → indexing chain still leaked back onto the operational SQLite plane after every write had already moved to the PostgreSQL media SSOT. The TextTrackMaterializer received the generic outbox.EventsRepo (the SQLite operational outbox), so after creating the 10 language tracks it enqueued asset.index.requested INTO SQLITE — an event the SQLite outbox registers NO media handler for in ANY mode, so the translations landed in asset_text_tracks and were never indexed. A second, deeper gap: the E5 adapter embeds media_assets.search_text, and the initial YouTube commit deliberately writes title/summary/hook/topics WITHOUT the transcript, so even a correctly routed reindex would have embedded a pre-translation document. FIXED. (1) NEW NARROW PORTS (internal/capabilities/assets/texttracks/media_ports.go): IndexRequester is the post-translation reindex seam — when wired, the Materializer no longer touches sqlite/outboxevents at all and the SQLite OutboxEnqueuer is only the documented non-PostgreSQL fallback; SearchTextRebuilder is the multilingual document seam. (2) MULTILINGUAL REBUILD (internal/platform/postgres/media/search_text_rebuilder.go, pgmedia.NewSearchTextRebuilder): recomposes media_assets.search_text from ALL current READY transcript tracks whose language is in index_languages, so the translated languages enter the embedding input and not merely the text-track table; the Materializer rebuilds BEFORE requesting the reindex, so the worker embeds the NEW document. (3) YOUTUBE FAN-OUT: the direct ProcessYouTubeSegmentUseCase path now enqueues asset.text.materialize after a successful clip commit (internal/capabilities/youtube/usecase/materialize_fanout.go), so a newly acquired clip automatically fans out to the 10 configured languages (it, en, pl, ru, de, es, pt-BR, fr, tr, id) through Argos/Ollama with translation_key dedupe instead of relying on a generic AssetFinalizer path that never ran for it. (4) CERTIFICATE, LIVE: tests/e2e/youtube_multilingual_live_test.go (gated behind VELOX_E2E_LIVE=1 + TEST_POSTGRES_DSN) downloads ONE MINUTE of a real YouTube video with yt-dlp, parses the real English subtitles through the canonical VTT parser, commits clip + READY transcript through PostgresMediaCommitter.CommitClipTextAndIndexEvent (one PostgreSQL transaction), runs the REAL materializer with the REAL Ollama translator, rebuilds search_text, drains the reindex with the canonical PostgresIndexWorker and the REAL E5 sidecar, and asserts: 10 READY transcript rows with translation provenance and translation_key; a second identical run SKIPS all 9 targets (created=0, skipped=9); the Italian translation text is present in media_assets.search_text AND in the text handed to the embedder; the reindex event is in PostgreSQL outbox_events (a SQLite-outbox stub FAILS the test if the materializer ever falls back); index_state reaches INDEXED with a 768-d vector. Live run on 2026-09-14: PASS (10 languages, INDEXED, 768 dims, ~59s). ENFORCEMENT: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false) and TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/ -count=1 plus the hermetic texttracks/youtube-usecase/searchtext suites green. RE-OPENED AND FULLY CLOSED (2026-09-14, follow-up pass, same OWNER). Two further acceptance criteria were still reachable, so the card was not actually closed. (5) THE EXISTING CATALOG COULD NOT BE REPAIRED. refreshIndexInput ran only when the invocation CREATED or RETRANSLATED a track, so a run over the pre-existing catalog — where every language row is already READY, which is precisely the state the wiring bug left behind — performed no rebuild and requested no reindex: those assets stayed invisible to multilingual search no matter how often the operator re-ran the command, i.e. the fix worked only for clips committed after it. The repair now runs on EVERY Materialize that has a SearchTextRebuilder wired; the reindex is requested when this invocation mutated the tracks OR the rebuild changed the document (SearchTextRebuilder.Rebuild returns changed=false when the composed text equals what is stored), so a repeated run over an already-correct asset rebuilds but does NOT re-embed — the always-on rebuild costs one SELECT plus one string compare and buys back the only detector of 'already correct'. MaterializationReport now carries index_input_rebuilt / reindex_requested / reindex_skipped_reason, so 'nothing to repair' can never be confused with 'silently did nothing'; the fields flow through BackfillAssetResult → BackfillReport into the CLI as index_repaired_total and reindex_requested_total, and the human output warns explicitly when --only-missing suppressed the repair for every clip. OPERATOR PATH: admin text-tracks-backfill --all --apply (NOT --only-missing, which skips complete clips BEFORE the repair can reach them). Pinned by TestMaterialize_RepairsSearchTextForAlreadyTranslatedAsset and TestMaterialize_NoOpRerunDoesNotReindexUnchangedDocument; the latter REPLACES the older TestMaterialize_NoNewTranslationsSkipsRebuildAndReindex, which asserted that a fully-skipped run performs no rebuild at all — a assertion that encoded the bug it was meant to catch, and is recorded here so a future reader does not 'restore' it. (6) THE DIRECT YOUTUBE PATH DID NOT DELIVER ITS SUBTITLE FILES. The `asset.text.materialize` handler has two paths and only the automatic-ingest one (empty source hash) re-entered BackfillService.ProcessAsset, whose final step generates and uploads one .ass per READY language; the fast path (a committed source hash — what the direct YouTube fan-out sends for every clip whose acquisition chain found subtitles) ran the materializer only. A freshly extracted YouTube clip therefore got its 10 language rows and NONE of its subtitle artifacts, while the same clip reprocessed through the backfill CLI got all ten: the two paths had silently diverged. The delivery step is now ONE canonical owner, BackfillService.MaterializeSubtitleArtifacts (internal/capabilities/assets/texttracks/backfill_subtitles.go), extracted out of ProcessAsset and called by BOTH ProcessAsset and the job fast path (jobs_subtitles.go), so they cannot drift on the style id (now the named constant SubtitleArtifactStyleID), the content-hash fallback or the READY-language set. It is idempotent — an unchanged artifact reuses its recorded Drive reference instead of re-uploading, so a repeated fan-out cannot accumulate duplicate files — and every inapplicable case returns an explicit skip reason (no_asset / no_subtitle_materializer / source_does_not_take_subtitles / text_kind_is_not_transcript) rather than doing nothing silently. Pinned by backfill_subtitles_test.go (delivery for every READY language, idempotent re-delivery, all four skip reasons, nil-materializer degrade) and TestContainsTextKind. FILE-SIZE NOTE: materializer.go crossed the godlike/08 max_lines_per_file_strict cap (600) while carrying the new seam, so the post-translation index seam moved to materializer_index_seam.go — same package, no behaviour change; the strict gate caught it, which is the gate working. GATE STATE FOR THIS PASS: go run ./cmd/archcheck --strict green (passed=true, total_violations=0, has_hard_gate_hits=false), go build ./... and gofmt clean, go vet clean on every touched package, hermetic suites green (internal/capabilities/assets/texttracks, internal/capabilities/youtube/usecase, internal/platform/searchtext, internal/app/wiring), and TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/ -count=1 green. Still open, and NOT closed by this pass: the live E2E is opt-in (VELOX_E2E_LIVE) rather than part of the default hermetic suite, by design (godlike/07: a live test that silently degrades to a mock is worse than no test)."
