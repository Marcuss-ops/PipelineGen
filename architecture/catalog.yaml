    - id: P1-API-CUTOVER
      note: "Move HTTP transport and handlers out of api; generic server/router/middleware to platform/httpserver and business handlers beside capabilities."
    - id: P2-DOMAIN-DISSOLUTION
      note: "DONE 2026-08-24: internal/domain root deleted. Types migrated to kernel and capabilities. Legacy import path banned via percheck_legacy_root_ban.go."
