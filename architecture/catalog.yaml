- id: WAVE-24-CLEANUP-DAY-ARCHITECTURE
  status: in_progress
  owner: architecture-cleanup
  deadline: '2026-09-30T00:00:00Z'
  rationale: >-
    Converge PipelineGen on one owner per concept. Legacy roots may shrink but
    must not gain new production code; target architecture is app/kernel/
    capabilities/platform. This checklist is the ordered Cleanup Day backlog,
    not a claim that all listed migrations are complete.
  follow_up_tickets:
    - id: P0-GOVERNANCE-SNAPSHOT
      note: "DONE 2026-08-24: Strict baseline regenerated from HEAD 90233a7c1, stale hotspot removed (infrastructure/database/sqlite/assets), package_hotspots counts realigned."
    - id: P0-POLICY-CANONICAL
      note: "DONE 2026-08-26: policy.yaml now declares max_files_per_package=65 as the single executable hard ceiling with 40 demoted to a documented soft target (no second enforced threshold). Stale ::max_files_per_package=40 cross-refs in ownership/application.yaml, ownership.generated.yaml and the 41_divider CI gate comment aligned to =65. subject_bindings validated (no Go refs remain; stale-prose ban intact). platform_subzones already aligned (see P1-PLATFORM-ALIGNMENT DONE)."
    - id: P0-LEGACY-REGISTRY
      note: "DONE 2026-08-23: root_migrations contains only existing legacy roots and every hotspot target is under kernel, capabilities, or platform; completed roots are history-only."
    - id: P0-LEGACY-RATCHET
      note: "DONE 2026-08-26: percheck_legacy_hotspot_growth now ratchets every registered hotspot (no legacy-root filter); baselines reconciled (stockpipeline 51→63, delivery 9→12), completed legacy hotspots dropped. percheck_legacy_root_new_code remains a hard gate for any re-added legacy file."
    - id: P1-APP-CAPABILITIES
      note: "Eliminate internal/app/capabilities; move each file to its capability owner or platform adapter, leaving app with construction and wiring."
    - id: P1-APP-OVERLAYS
      note: "Remove internal/app/overlays; overlay semantics belong to capabilities/overlays, renderer/cache/probing to platform/overlays."
    - id: P1-APP-SHRINK
      note: "Reduce internal/app to composition root; move research, localization, cliprender, media commit, provider adapters, and business policies to canonical owners."
    - id: P1-CAPABILITY-OWNERSHIP
      note: "Publish package-to-macro-capability ownership map; every capability support package gets exactly one macro owner and an Archcheck check."
    - id: P1-PLATFORM-ALIGNMENT
      note: "DONE 2026-08-26: keep/migrate/absorb resolved for cas/media/renderinggen/observability/ollama (KEEP at platform/) and ffmpeg/nvidia (ABSORB into media/rustexec + overlays/workerruntime). embeddings/overlays/httpserver already KEEP from earlier waves. Recorded in policy.yaml::platform_subzones."
    - id: P1-UTILITY-ROUTE
      note: "DONE 2026-08-23: UtilityModule deleted. GET /internal/slug absorbed into System module (handler.go + module.go). 11 HTTP modules reduced to 10."
    - id: P1-OBSERVABILITY
      note: "DONE 2026-08-26: platform/observability is the sole metrics owner (28 files: Prometheus collectors, run records, progress-ratio). kernel/observability holds only the shared cross-capability Run/Stage/Operation contract. No infrastructure duplicate remains."
    - id: P1-SCRIPTS-CUTOVER
      note: "DONE 2026-08-24: application/scripts fully migrated to capabilities/scripts; legacy path no longer exists on disk. Semantic contracts in kernel/script, provider mechanics in platform."
    - id: P1-JOBS-CUTOVER
      note: "DONE 2026-08-24: application/jobs fully migrated to capabilities/jobs; policy/orchestration is split across the root compatibility facade plus capabilities/jobs/{queue,scheduling,finalize}, while persistence mechanics remain in platform/sqlite. jobs/scheduling is the current owner of polling/backoff, retry timing, preparation planning, and resource speculation."
    - id: P1-IMAGES-CUTOVER
      note: "DONE 2026-08-24: application/images fully migrated to capabilities/images/{workflow,generation,delivery,persistence} (54 production files → 0)."
    - id: P1-VOICEOVER-CUTOVER
      note: "Migrate application/voiceover to capabilities/voiceover; keep audio semantics in capabilities/audio and provider mechanics in platform."
    - id: P1-PLATFORM-ADAPTERS
      note: "DONE 2026-08-26: drive, delivery, embeddings, SQLite, filesystem/files (hash/MD5 folded into checksum), Qdrant (schema under platform/qdrant, DR adapter under capabilities/maintenance), AI transport (platform/ai declared as subzone), observability (platform/observability sole metrics owner). No infrastructure duplicates remain."
    - id: P1-API-CUTOVER
      note: "Move HTTP transport and handlers out of api; generic server/router/middleware to platform/httpserver and business handlers beside capabilities."
    - id: P2-DOMAIN-DISSOLUTION
      note: "DONE 2026-08-24: internal/domain root deleted. Types migrated to kernel and capabilities. Legacy import path banned via percheck_legacy_root_ban.go."
    - id: P2-LEGACY-ROOTS
      note: "Delete application, api, infrastructure, and domain only after import-zero gates; migration records then become history-only."
