- id: SSOT-JOBS-CONTRACTION
  status: in_progress
  owner: internal/capabilities/jobs
  deadline: '2026-09-15T00:00:00Z'
  rationale: >-
    Materialise the job layer per capabilities_jobs.target_subdirs. The root
    jobs package stays a thin compatibility facade/orchestration boundary;
    reusable policy is promoted into lower layers that depend ONLY on kernel
    contracts + stdlib (never on the root, no import cycles): enqueue into
    jobs/queue, scheduling/prioritisation (resource speculation + preparation
    planning) into jobs/scheduling, finalization (Finalizer + JobCompletionBus
    + workflow-step handlers) into jobs/finalize. Each increment is compile +
    test verified.
  follow_up_tickets:
    - id: JOBS-QUEUE
      note: "DONE 2026-08-31: jobs/queue owns GenerateJobID + ValidateEnqueueRequest + MaxPayloadSize; root enqueue_id.go + enqueue_validate.go are thin adapters. go test ./internal/capabilities/jobs/queue/ green."
    - id: JOBS-SCHEDULING
      note: "DONE 2026-08-31: jobs/scheduling owns ResourceScheduler/SpeculationScheduler + JobPreparationRegistry/PreparationUnit/PreparationPlan (Validate co-located); root speculation_scheduler.go + preparation_registry.go re-export via type aliases + forwarders. go test ./internal/capabilities/jobs/scheduling/ green."
    - id: JOBS-FINALIZE
      note: "DONE 2026-08-31: jobs/finalize owns the 6-file Finalizer unit + completionbus.go (JobCompletionBus/Event/Subscription/ErrWaitTimedOut) + workflow_step_{completed,failed}.go; root finalize_facade.go re-exports. Cycles broken by layering."
    - id: JOBS-POLICY-ORDER
      note: "Deadline gate: align cmd/archcheck + ownership generated view to the materialised subdomains and land the four legacy-governance cleanups (ownership split, legacy-path comments, drive-token wrapper) that keep the SSOT single-owner."
