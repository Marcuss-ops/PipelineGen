# Lifecycle: issues move from `open` -> `in_progress` -> `resolved`.
# Once `resolved`, the entry is moved to Git history (issue ownership
# migrates from this file to the commit that closed it). Per
# godlike/07 zero-legacy policy, completed tickets do NOT linger in
