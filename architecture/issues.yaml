- id: PR-REGISTER-CI-GATE
  title: "Promote scripts/ci-architectural-checks.sh::Check 50 from voluntary fail-closed to enforced exit-1 in default CI mode (audit P1 #1 closure follow-up)"
  status: pending
  owner: scripts/ci-architectural-checks.sh
  deadline: 2026-07-25
  linked_issues:
    - bd7a44bb  # audit P1 #1 fail-fast refactor (canoncial SHA on origin/main)
    - 155c5dfa  # byte-equivalent replay canonical on origin/main
  notes: |
    Audit P1 #1 (commit `bd7a44bb refactor(jobs): make JobHandler.Register
    fail-fast (audit P1 #1)`) closed the silent-success class on
    JobHandler.Register* failures (nil-typed-dispatcher + duplicate-bind
    case) — 10 production handlers now return `error` and wrap nil-bind
    cases with `appjobs.ErrMissingDeps` via `%w`. Check 50 was introduced
    in scripts/ci-architectural-checks.sh to forward-prevent the
    regression by fail-closed regex-matching every
    `func (h *X) Register(svc *jobs.Service) {` shape outside the
    allowlist.

    Current default CI invocation runs
    `bash scripts/ci-architectural-checks.sh` without an
    opt-in flag — Check 50 emits an INFO marker line and continues,
    deferring to per-site `// ARCH-ALLOWLIST: register-void-allowed`
    magic-marker opt-in. This ticket promotes Check 50 to default
    CI mode (exit 1 on violations outside allowlist) so the fail-fast
    invariant from P1 #1 is enforced at every CI run, not only when
    an operator opts in. Mirrors the Check 5 promotion pattern
    (QDRANT-RECOVERY-001 follow-up) for the void-Register shape.

