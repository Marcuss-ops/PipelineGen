# Active unresolved cross-package issues consumed by architecture checks.
# Completed tickets belong in Git history.
#
# Schema (intentionally minimal subset of architecture/deprecations.yaml):
#   - id: Kebab-case identifier (PR-LIVE-VERIFY-N).
#   - title: One-line tape summary.
#   - status: open | in_progress | resolved | wontfix.
#   - severity: p0 | p1 | p2 | p3. Drives dispatcher priority.
#   - owner_capability: pkg path that owns the surface in question
#     (e.g. internal/api/assets/artlist).
#   - follow_up: Action items the operator / next PR must take to
#     close the gap (one bullet per item; bullets are concrete).
#   - evidence_filename: filename under tests/operational/ that
#     captures the dry-run output for this specific gate. Operators
#     reading the file get immediate context without re-running.
#   - opened_date: YYYY-MM-DD (closing workflow tracks this).
#   - tracking_issue: Pointer to the upstream plan / doc.
#
# Lifecycle: issues move from `open` -> `in_progress` -> `resolved`.
# Once `resolved`, the entry is moved to Git history (issue ownership
# migrates from this file to the commit that closed it). Per
# godlike/07 zero-legacy policy, completed tickets do NOT linger in
# this file.
issues:

  # ── PR-LIVE-VERIFY-1: scraper not reachable ─────────────────────────────
  # Dry-run signal (July 12 2026): scraper /health at
  # http://127.0.0.1:9123/health returns blank/unreachable. The Node.js
  # artlist_server.js sidecar is NOT running in the dev environment,
  # even though Dockerfile.scraper installs Chromium + the JS bundle.
  # Resolution path: `docker compose up -d artlist-scraper` OR
  # `node node-scraper/artlist_server.js` directly with
  # CHROME_EXECUTABLE=/usr/bin/google-chrome. PR-P0-SCRAPER-BROWSER
  # (commit de53b2540) covers the diagnostic surface; missing here is
  # the *operational* bring-up path.
  - id: PR-LIVE-VERIFY-1
    title: "Node scraper not running — PR-LIVE-VERIFY dry-run cannot probe /health"
    status: open
    severity: p0
    owner_capability: "node-scraper / artlist_server.js"
    follow_up:
      - "Bring up the Node.js sidecar via `node node-scraper/artlist_server.js` in the dev environment with CHROME_EXECUTABLE=/usr/bin/google-chrome + ARTLIST_SCRAPER_BIND=127.0.0.1 + ARTLIST_SCRAPER_PORT=9123."
      - "Confirm /health returns healthy=true before re-running artlist_live_e2e_verify.sh."
      - "Optionally add a `make scraper-up` command that spawns the sidecar as a background process for live-verify runs."
    evidence_filename: "tests/operational/artlist_live_e2e_LAST_RUN.md"
    opened_date: 2026-07-12
    tracking_issue: "PR-P0-SCRAPER-BROWSER followup; commit de53b2540 covers diagnostic surface only"

  # ── PR-LIVE-VERIFY-2: server /ready status NOT OK ─────────────────────
  # Dry-run signal (July 12 2026): GET http://127.0.0.1:8000/ready
  # returns {"checks":{"clips_path":...,"db":...,"destination_clip":
  # ...}} but the .status field is missing or not equal to "ready"
  # (the verify script's `jq -e '.status == "ready"' filter trips).
  # Resolution path: investigate why /ready reports the composite
  # checks but not `status=ready` — most likely one of the
  # destination_clip / drive / outbox checks is failing in dev.
  - id: PR-LIVE-VERIFY-2
    title: "Velox server /ready does not report status=ready — operator preflight gate fails"
    status: open
    severity: p0
    owner_capability: "internal/api/server (health/ready handler)"
    follow_up:
      - "Confirm /ready response shape: `curl -s http://127.0.0.1:8000/ready | jq .` — look for top-level `.status` field."
      - "If `.status` is missing, add it to the /ready handler with the AND-of-all-checks semantics (currently the handler emits per-check status, no aggregate)."
      - "Re-run artlist_live_e2e_verify.sh after the fix; the dry-run preflight should now report `server /ready: ok`."
    evidence_filename: "tests/operational/artlist_live_e2e_LAST_RUN.md"
    opened_date: 2026-07-12
    tracking_issue: "godlike/07 fail-closed operator preflight conformance"

  # ── PR-LIVE-VERIFY-3: ROOT_FOLDER_ID empty (Drive destination fallback) ─
  # Dry-run signal (July 12 2026): VELOX_DRIVE_ARTLIST_ROOT is unset,
  # the script emits `ROOT_FOLDER_ID <empty — warning>` and falls back
  # to PipelineGen's configured default Drive destination. Without an
  # explicit operator-pinned root, verification point 5/6 (Drive Files.Get
  # via /api/drive/resolve-by-id) cannot assert against a known folder
  # and the path becomes non-reproducible across CI / local runs.
  - id: PR-LIVE-VERIFY-3
    title: "VELOX_DRIVE_ARTLIST_ROOT unset — Drive target folder is non-reproducible"
    status: open
    severity: p1
    owner_capability: "internal/platform/config (ExternalConfig)"
    follow_up:
      - "Set VELOX_DRIVE_ARTLIST_ROOT to a known dedicated folder (e.g. `/Velox-Live-Verify`) in the dev environment's .env + CI secrets."
      - "Confirm ROOT_FOLDER_ID propagates into POST /api/artlist/run via the dry-run plan output."
      - "Document the canonical folder shape in docs/operations/stock-e2e-runbook.md so new operators know where to point Drive uploads for live-e2e."
    evidence_filename: "tests/operational/artlist_live_e2e_LAST_RUN.md"
    opened_date: 2026-07-12
    tracking_issue: "godlike/06 SSOT Drive destination reproducibility"

  # ── PR-LIVE-VERIFY-4: VELOX_ADMIN_TOKEN missing in dry-run shell env ──
  # The verify script's pre-flight refuses empty tokens (exit 2: "refuse
  # to run with empty token"). Even --dry-run mode in the script body
  # only runs light preflight probes when the token IS set, so absent
  # a token the dry-run cannot exercise the operator-side signal flow
  # (server /ready + scraper /health + Qdrant availability check).
  # Resolution path: provision a non-default admin token via the
  # canonical token bootstrap script + persist in .env / CI secrets.
  - id: PR-LIVE-VERIFY-4
    title: "VELOX_ADMIN_TOKEN not provisioned in dev / CI — preflight gate refuses empty token"
    status: open
    severity: p1
    owner_capability: "internal/platform/auth (admin token bootstrap)"
    follow_up:
      - "Generate VELOX_ADMIN_TOKEN via the canonical scripts/tools/generate_drive_token.py analog (or scripts/tools/rotate_token.sh). Persist to dev .env + CI secrets (NEVER commit)."
      - "Confirm dry-run preflight output flips from `VELOX_ADMIN_TOKEN is empty — skipping preflight probes` to `light preflight probes (read-only)` listing server/scraper/Qdrant hits."
      - "Audit AGENTS.md git workflow compliance: `git log -p` should NEVER contain the literal VELOX_ADMIN_TOKEN (it lives in .gitignore + env-only)."
    evidence_filename: "tests/operational/artlist_live_e2e_LAST_RUN.md"
    opened_date: 2026-07-12
    tracking_issue: "godlike/07 no-fake-availability token precondition; AGENTS.md Operational rules"

  # ── PR-LIVE-VERIFY-5: Drive OAuth credentials not provisioned ───────────
  # Verification points 5 + 6 in artlist_live_e2e_verify.sh call
  # POST /api/drive/resolve-by-id with the asset's drive_file_id. The
  # endpoint requires Drive authorization (OAuth refresh token OR
  # service-account JSON) — not just a folder ID. PR-LIVE-VERIFY-3
  # covered the destination folder; this issue covers the AUTH leg.
  # Without this, points 5/6 can never complete even after -1/-2/-3/-4
  # land. Resolution path: provision the canonical Drive service-account
  # JSON + load via internal/infrastructure/drive canonical loader OR
  # OAuth refresh-token via scripts/tools/ (per AGENTS.md: NEVER commit
  # credentials, only path references in working tree).
  - id: PR-LIVE-VERIFY-5
    title: "Drive OAuth credentials not provisioned — Drive-issuable requests cannot authorize"
    status: open
    severity: p0
    owner_capability: "internal/infrastructure/drive (Drive SDK loader)"
    follow_up:
      - "Provision a Drive service-account JSON OR OAuth refresh token via the canonical scripts/tools/ path (per AGENTS.md Operational rules: NEVER commit credentials, only env path + .gitignore gates)."
      - "Confirm VELOX_DRIVE_* env vars (per architecture policy.yaml `drive.*` keys) are present in dev `.env` + CI secrets, AND the Go loader at internal/infrastructure/drive reads them on startup."
      - "Re-run artlist_live_e2e_verify.sh non-dry-run; point 5 (Drive Files.Get via /api/drive/resolve-by-id) should resolve ok=true + resolved_count >= 1 + size > 0."
      - "Audit: `git log -p` should NEVER print the service-account JSON contents; only the env var name + path reference."
    evidence_filename: "tests/operational/artlist_live_e2e_LAST_RUN.md"
    opened_date: 2026-07-12
    tracking_issue: "godlike/06 SSOT Drive auth; AGENTS.md Operational rules credential hygiene"

