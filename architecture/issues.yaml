    constructor wiring site):

        Tick:        10 * time.Minute
        PendingTTL:  30 * time.Minute
        UploadedTTL: 60 * time.Minute

    Operators can NOT currently tune these values without a rebuild —
    field tuning (e.g. pulsing the 30m pending window down to 5m
