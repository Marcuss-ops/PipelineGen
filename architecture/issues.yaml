    fallback constants so a missing YAML entry falls back to the
    canonical values rather than zero (which would re-introduce the
    "0 duration = panic in NewOrphanSweeper" surface B/2 documented).

- id: PR-STATUS-ENFORCE-TYPED
  title: "Tighten typed-enum JSON unmarshalling + add compile-time canonical-enum validators for CompletionState + IndexingStatus (audit-closure residue: IndexingStatus.UnmarshalJSON is permissive)"
  status: pending
  owner: internal/application/voiceover + internal/application/assets/providers/stock/stockpipeline
  deadline: 2026-07-25
  linked_issues:
    - P0.5  # PR-VO-AUDIT-P05 typed-state-machine (CompletionState)
    - P0.1  # PR-VO-AUDIT-P01 typed state machine
  notes: |
    Audit-closure residue (godlike/07 NO_FAKE_AVAILABILITY):
    IndexingStatus.UnmarshalJSON in
    `internal/application/assets/providers/stock/stockpipeline/types_status.go`
    assigns the raw JSON string WITHOUT validating against the 4
    canonical enum constants (IndexingPending / IndexingSkipped /
    IndexingCompleted / IndexingFailed) — production callers MAY
    unmarshal arbitrary strings into the typed field, defeating the
    compile-time type-safety invariant. A future DB column rename
    or forward-compatibility issue could silently re-introduce.

    CompletionState has NO JSON UnmarshalJSON guard today; the typed
    surface is preserved because all writes are funnelled through the
    typed constructor (no string-interpolation paths in
    voiceover/stages.go finalizeStage) — but a symmetric guard
    closes the JSON-read path gap.

    Proposal:
      (a) Tighten IndexingStatus.UnmarshalJSON to validate
          `raw ∈ {IndexingPending, IndexingSkipped, IndexingCompleted,
          IndexingFailed}` and return a typed error on unknown
          strings. All existing callers pass canonical values (4
          dedicated state paths in stockpipeline/run_upload.go);
          tightening has zero regression risk.
      (b) Add a symmetric MarshalJSON/UnmarshalJSON guard on
          CompletionState (currently omitempty hides the field,
          but a JSON read with non-canonical CompletionState would
          silently pass through).
      (c) Add helpers `MustValidateCompletionState(s string)
          (CompletionState, error)` and `MustValidateIndexingStatus
          (s string) (IndexingStatus, error)` in the typed-enum
          packages so DB column reads bypassing the JSON path
          (legacy adapters reading raw strings from stringly-typed
          columns) can validate against the canonical enum at the
          call site.
      (d) Optional build-tag variant `//go:build typed_status_enforce`
          gates a stricter-mode Constructor that returns
          `(CompletionState, error)` from any unvalidated string entry;
          production builds default to the gated path.

    Test scope: 4 ok cases + 5 reject cases per enum (empty, garbage,
    near-miss, lowercase, case-mismatch). TDD pattern matches the
    pkg/retry/errors.go::Classify precedent (typed-enum + binary
    Retryable helper, test driven by boundary conditions).

