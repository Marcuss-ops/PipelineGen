#   2. Every handler is owned by exactly one module.
job_handler_map:
  - job_type: script.generate_batch
    handler: BatchJobHandler.Handle
    owner: internal/capabilities/scripts
  - job_type: artlist.run
    handler: ArtlistHandler.enqueueArtlistRun
    owner: internal/capabilities/assets/providers/artlist
  - job_type: media.artlist
    handler: artlist.jobHandler
    owner: internal/capabilities/assets/providers/artlist
  - job_type: media.youtube_clip
    handler: YouTube clip ingest handler
    owner: internal/capabilities/assets/providers/youtube
  - job_type: media.stock_pipeline
    handler: StockPipeline handler
    owner: internal/capabilities/assets/providers/stock
  - job_type: maintenance.deep_cleanup
    handler: MaintenanceService
    owner: internal/capabilities/assets/maintenance
  - job_type: catalog.sync
    handler: CatalogSync service
    owner: internal/capabilities/assets/catalogsync

# ── Canonical Service Construction (SSOT) ────────────────────────────────────
# Each canonical service is constructed EXACTLY ONCE.
#
# Ownership matrix:
#   queue        = enqueue/claim/retry/lease policy and queue contracts
#   scheduling   = polling, backoff, resource-fit and preparation planning
#   finalize     = artifact finalization and publication policy
#   worker       = execution adapter and worker lifecycle
#   completion   = terminal completion events and idempotent completion handling
#   root facade  = public contracts, registration and composition-facing API only
# No second job manager, broker policy or terminal-state writer may be introduced.
