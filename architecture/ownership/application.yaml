# ── Transport (HTTP) ─────────────────────────────────────────────────────────

http_entrypoint:
  owner: cmd/server
  rationale: Composition root + main() for the HTTP server binary.

http_transport:
  owner: internal/api
  rule: api imports ONLY application + domain. Never infrastructure/database/sql, never os/exec, never google.golang.org/api/drive/v3.
  target_subdirs:
    - api/assets
    - api/content
    - api/images
    - api/jobs
    - api/scripts
    - api/system
    - api/middleware
    - api/transport

# ── Composition ──────────────────────────────────────────────────────────────

composition_root:
  owner: internal/app
  rule: Only place where concrete adapters (DB, Drive, exec) are instantiated.
  target_files: [app.go, bootstrap.go, lifecycle.go, shutdown.go, modules/*.go]

# ── Domain (canonical contracts + types) ─────────────────────────────────────

domain_job:
  owner: internal/domain/job
  rationale: Job, Lease, WorkerSession, WorkerCapabilities, WorkerCredentials, Store, ScriptGenerationPayload.
  migrated_from:
    - internal/domain/worker
    - internal/contracts/scriptjobs
    - internal/jobs/domain_types.go
    - internal/jobs/domain_commands.go

domain_script:
  owner: internal/domain/script
  rationale: Script, Plan, GenerationSpec, Payload, Codec error types.

domain_asset:
  owner: internal/domain/asset
  rationale: Asset, Artifact, Delivery, Location, LifecycleState, Processor, Destination, EmbeddingPort, AudioPort.
  absorbs_from_core_wave_4C:
    - Repository (from internal/core/assetop)
    - Processor (from internal/core/processor)
    - Destination (from internal/core/destination)
    - EmbeddingPort (from internal/core/embedding)
    - AudioPort (from internal/core/audio)
  migrated_from:
    - internal/domain/media
    - internal/assets
    - internal/artifacts
    - internal/core/assetop
    - internal/core/audio
    - internal/core/destination
    - internal/core/embedding
    - internal/core/processor
    - internal/core/scoring

