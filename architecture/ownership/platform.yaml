# PipelineGen — split ownership section: platform
# The only target roots are internal/{platform}. The legacy
# application/api/domain/infrastructure roots are migration-only and are
# governed by architecture/policy.yaml plus package_hotspots.json.
# Generator: cmd/architecture-aggregate produces architecture/ownership.generated.yaml
# from the split files in canonical order.
# Edit the source files; the generated view is regenerated deterministically.

infrastructure_db:
  owner: internal/platform/sqlite
  rule: ONLY place where Go SQL drivers / SQLite schema live.
infrastructure_drive:
  owner: internal/platform/drive
  rationale: Google Drive uploader + DocClient.
  migrated_from: internal/upload/drive
infrastructure_delivery:
  owner: internal/platform/delivery
  rationale: Asset-delivery URL signing, destination registry, and startup validation.
  migrated_from: internal/infrastructure/delivery

# ── Embeddings ──
infrastructure_embeddings:
  owner: internal/platform/embeddings
  rationale: Text-embedding adapters (HTTP sidecar, Ollama, Python subprocess, SigLIP cross-modal).
  migrated_from: internal/infrastructure/embeddings
infrastructure_filesystem:
  owner: internal/platform/filesystem
  rationale: Filesystem utilities (JSON I/O, folder-name normalization, foldermemory, metadataexport) plus kernel workspace I/O adapters (OS, HTTPFetcher, NewManager).
infrastructure_process:
  owner: internal/platform/process
  rationale: External command execution (yt-dlp, ffmpeg wrappers).
  rule: ONLY place where os/exec is allowed.
infrastructure_ai:
  owner: internal/platform/ai
  sub_dirs: [ai/classifier, ai/reranker, ai/vlm]
infrastructure_media:
  owner: internal/platform/media
  rationale: Rust media execution executor (rustexec/VideoProcessor) + processor/render subzones. P1-PLATFORM-ALIGNMENT 2026-08-26: KEEP at platform/media; ffmpeg absorbed into rustexec.
  migrated_from: [internal/media/mediaasset, internal/infrastructure/media]
infrastructure_jobs:
  owner: internal/platform/jobs
  rationale: Local in-process broker (replaces internal/application/jobbroker/local).
  target_subdirs: [jobs/local]
  decomposed_into:
    jobs_local:
      owner: internal/platform/jobs/local
    jobs_remote_clients:
      owner: internal/platform/remote
      clients:
        - assettransferclient   # HTTP client for asset transfer (worker side)
        - jobbrokerclient       # HTTP client for job broker (worker side)
infrastructure_observability:
  owner: internal/platform/observability
  rationale: metrics, tracing and health checks. Resource/process metrics belong under observability/resource; no parallel procmetrics owner.
  target_subdirs: [observability/resource]
  migrated_from: internal/infrastructure/observability
infrastructure_shared:
  owner: internal/platform  # retired bucket — 'DELETE' is policy, not a path; no shared/common/utils/helpers dirs may exist
  rationale: No shared/common/utils/helpers dumping grounds. Each utility must move to its technical owner or become a leaf-local helper.
  forbidden_paths: [internal/platform/shared, '**/shared', '**/common', '**/utils', '**/helpers']

infrastructure_qdrant_projection:
  owner: internal/platform/qdrant/indexing
  rationale: The single PayloadMapper/IndexDocument airlock owns RetrievalProjection-to-wire conversion; Qdrant stores retrieval projection only, never canonical business state.
  contracts: [asset_id, segment_id, workspace_id, vectors, semantic_document, retrieval_filters, projection_integrity]
  forbidden_fields: [download_url, drive_link, local_path, usage_counters, render_state, job_lifecycle, workflow_state, mutable_delivery_metadata]

infrastructure_config:
  owner: internal/platform/config
  rationale: Resolved configuration + folder IDs.
  rule: ONLY place where os.Getenv (env-driven config) is allowed (alongside cmd/* binaries).
