# PipelineGen — macro-cross capability import ledger (decoupling allowlist).
#
# Wave 24 P1-CAPABILITY-OWNERSHIP companion: every macro-cross import edge
# remaining after aggregation (see architecture/capability_macro_map.yaml) is
# tracked here. The archcheck ratchet treats this file as an ALLOWLIST:
#   - a macro-cross edge NOT listed here is a hard violation (new coupling);
#   - an entry whose edge no longer exists is a stale-ledger violation
#     (prune the entry only when the decoupling actually lands);
#   - edges are intended to SHRINK over time as each K1/K2 item ships.
#
# Fix-strategy taxonomy recorded per entry (kind field):
#   K1 - shared leaf/contract mis-homed under one macro but consumed by
#        another; hoist the contract to kernel (or the canonical shared
#        owner) and keep mechanics in the owning macro.
#   K2 - business coupling that should be inverted via a kernel/consumer-
#        side port (or retargeted to the kernel type home, e.g. job types
#        belong in kernel/job) with the composition root wiring concretes.
#   K3 - deliberate, documented SSOT pin / registry-tracked seam (see the
#        tracking_issue for the deprecation record or godlike/06 pin).
#
# Phase-1 review (2026-09-05): the assets/{texttracks,persistence,finalizer}
# and youtube/{dto,ports} leaves were audited as candidate K1 hoists. Result:
# none is mechanically hoistable as a whole package. texttracks/finalizer
# consumers call mechanics or concrete constructors (port inversion, K2);
# persistence is a port whose surface references the macro-assets
# mediaregistry taxonomy (kernel cannot import capabilities, so the taxonomy
# contract must reach kernel first); youtube/{dto,ports} is youtube's
# canonical public surface (dto imports ai/linguistics; Segment is pinned by
# the MONITOR-YOUTUBE-DIRECT-IMPORT SSOT record) — cross-macro use of it is a
# K3 public-API pin, not a mis-homing. Each entry carries a phase1 note with
# the concrete remediation shape.
#
# Tracking tickets: architecture/current.yaml WAVE-24-CLEANUP-DAY
# (P1-CAPABILITY-OWNERSHIP + cleanup backlog).
allowlist:

