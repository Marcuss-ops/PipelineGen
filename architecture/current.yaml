    then transitional_baselines below allows the owner to ship
    remaining remediation.
  transitional_baselines:
    note: |
      Per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
      §"Zero-baseline rule" the lint reports a non-zero count (~14) as
      of origin/main HEAD due to a CROSS-DIRECTORY SAME-PACKAGE-NAME
      false-positive pattern: two unrelated directories both declaring
      `package scripts;` (e.g. internal/application/scripts +
      internal/infrastructure/database/sqlite/scripts). Go treats them
      as DIFFERENT packages — but the AWK lens groups by NAME only
      instead of the canonical Go-package identity tuple
      (directory_path, package_name).
    owner: qdrant-hygiene work stream (RW-PROD-013 dependency chain)
    owner_secondary: scripts/ci-architectural-checks.sh maintainer
    deadline: 2026-07-25
