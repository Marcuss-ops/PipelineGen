  status: in_progress
  verified_zero: false
  description: |
    Three legacy media-search subsystems drift independently today:
      1. internal/application/assets/clipssearch — hand-coded fanout via
         map[string]AdvancedSearchRepo keyed by {"youtube","artlist",
         "stock"} (composition-root hardcoded whitelist at
         internal/app/module_media.go:196).
      2. internal/application/assets/search — cross-provider returning
         SearchResponse{Results:map[string]ProviderResult,Errors:...}
         (the exact shape the project rule forbids).
      3. internal/application/mediasearch — the QDRANT-004 semantic
         API at /internal/v1/media/search (single-tenant WorkerAuth,
         signed delivery URLs).
    Three PRs replace them with one capability (internal/application/search/):

      PR 8 (EXPAND, this commit): types.go + ports.go + cursor.go +
        aggregator.go NOOP stub + search_test.go + type aliases in
        mediasearch/types.go + delete the SearchMode type from
        mediasearch/ports.go (constants preserved). ZERO call-site or
        wire-shape touched.

      PR 9 (BACKFILL, separate commit): real Aggregator with
        pkg/concurrent errgroup + per-backend timeout + dedup by
        {assetID, provider+sourceRef, URL, hash} + max-score ranking +
        opaque cursor + Result.Partial; cross-cap composition-bridge
        adapters in internal/app/search_backends.go; legacy paths
        remain live during BACKFILL.

      PR 10 (CUTOVER, separate commit): handlers switch to Aggregator;
        composition-root drops hand-rolled map[string]AdvancedSearchRepo;
        git rm legacy packages; 2 deprecation records in
        architecture/deprecations.yaml.
