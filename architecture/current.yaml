    # completion (MVP). The parent GenerateJobHandler no longer
    # falsely reports SUCCEEDED at the application level just because
    # fan-out completed enqueueing children. Instead the result map
    # carries a typed `parent_state` enum (ParentWaitingChildren /
    # ParentPartialSuccess / ParentFailed / ParentSucceeded) which the
    # dispatcher writes to job.Result["parent_state"]. Micro-commit #4
    # pins the post-enqueue emit only (waiting_children on full success;
    # partial_success on partial/all-failed fanout; failed on
