    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \    ChannelSparse (Hybrid routing contract)\n       - QueryEcho.Mode == SearchModeHybrid\n\nIn-test orchestrator mirrors the production semanticSearchBackend\n(internal/app/search_backend_semantic.go)\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ 4-port architecture\n+ mode routing (HybridSearch vs Search). hermetic: all stubs\nlocal to the test file; the ONLY production component is\ndelivery.Signer (real, with 32-byte test secret). 3 compile-\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      time port assertions pin method-signature drift\n(search.EmbeddingChannelRegistry + assetsearch.VectorStorePort +\nmediasearch.MediaReadRepository). godlike/06 SSOT intact: the\n4 canonical ports\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
