  description: "Phase 2 of the archcheck Go-migration wave (deadline 2026-08-15):\nretire the 3 shell checks (Check 5/53/54) that have Go scanner\nequivalents, tighten the ci-gate to fail-closed on the\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ Go scanner,\nand promote `cmd/archcheck` from report-only to gate-promoted.\n\n**Plan**: `architecture/action-plans/2026-07-04-archcheck-phase-2-action-plan.md`.\n\n**CRITICAL implementation note**\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ (flagged by `thinker-with-files-gemini`):\nthe 3 target checks are **inline procedural bash blocks** starting with\n`echo \"=== Check N: <title> ===\"` and ending before the next check's\nheader —\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ NOT `check_NN() { ... }` functions. The executor MUST match on\nthe SPECIFIC title fragment to avoid deleting the UNRELATED earlier\n\"Check 5\" (forbid mutation primitives, ~line 395) or the historical-\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    comment \"Check 54\" reference (~line 3120).\n\n**Steps** (godlike/07 EXPAND→BACKFILL→CUTOVER→CONTRACT):\n1. EXPAND: 3 grep-assert Go tests in `cmd/archcheck/scan/percheck_*_test.go`\n   that read `scripts/ci-architectural-checks.sh`\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ and assert the canonical\n   header strings are strictly ABSENT — the forward-prevention seam that\n   locks the shell-retirement contract.\n2. CUTOVER: hard-delete the 3 inline bash blocks. Per godlike/07\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \   no-fake-availability: no shims, no deprecation records, no\n   pass-through wrappers.\n3. BACKFILL: NO-OP — `make verify-main` already chains\n   `go run ./cmd/archcheck --strict` as the canonical\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ fail-closed\n   surface. `cmd/archcheck/main.go` default `--strict false` is\n   PRESERVED (godlike/07 minimum-blast-radius: local `go run\n   ./cmd/archcheck` stays report-only for inspectability).\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    4. CONTRACT: 3-surface lockstep on the canonical 3 surfaces\n   (architecture/current.yaml + CHANGELOG.md + AGENTS.md).\n"
