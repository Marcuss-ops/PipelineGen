    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ wraps errors via fmt.Errorf\nwith %w.\n\nEXPAND-phase discipline: the orchestrator mirrors the\nproduction backend (BACKFILL ticket is \"sync production\norchestrator with this in-test one\" — not\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
