    notes: "Retire the dual-sentinel split introduced by commit 60a61808.\nThe pre-fix shape carried `var ErrLedgerStateConflict = errors.New(...)`\nin internal/application/assets/monitor/types_dto.go as\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ a DISTINCT\nsentinel value from internal/infrastructure/database/sqlite/assets::ErrStateConflict;\ncallers relied on the canonical `fmt.Errorf(\"...: %w\", assets.ErrStateConflict)`\nwrap chain\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ to bridge the two — a brittle pattern per godlike/07 that\nany unwrap error path silently invalidates.\n\nPost-fix shape: monitor-side `ErrLedgerStateConflict` is now a thin\nalias for assets.ErrStateConflict:\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \  `var ErrLedgerStateConflict = assetsdb.ErrStateConflict`\nBoth names now point at the SAME `*errors.errorString` value, so\n`errors.Is(err, monitor.ErrLedgerStateConflict)` ≡ `errors.Is(err,\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      assetsdb.ErrStateConflict)` is byte-equivalent (Go sentinel semantics:\nerrors.Is compares the pointer chain). Single owner of the fact\nper godlike/06 SSOT; brittle wrap chain eliminated per godlike/07.\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \nForward-pointer: the dual-shape for monitor.OutboxEntry (declared\nin types_dto.go but NOT yet wired — ports_discoveries.go STILL\nimports assetsdb.OutboxEntry) is a separate residue tracked under\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      PR-GODOBJ-MONITOR-OUTBOX-BACKFILL (deadline 2026-08-22, Mechanical band).\n\nPre-existing build issues carry forward unchanged: monitor_enqueue_test.go\n+ youtube_discoveries_test.go failures are\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ tracked under\narchitecture/current.yaml#PRE-EXISTING-BUILD-ISSUES-2026-07-04\n(FIX-MONITOR-ENQUEUE-TOLOWER + FIX-MONITOR-SCHEDULER-ENQUEUER,\ndeadline 2026-07-15) — NOT caused by this fix.\n"
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
