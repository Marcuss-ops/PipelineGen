# ── Wave 19 — Dependency Direction & Ports (in_progress, June 2026) ─────────
# Triggers: copy of "Dependency Rules" pasted by operator on 2026-06-26.
# This wave hardens the import graph along the direction
#     internal/app/ -> internal/application/<cap>/ -> internal/domain/
#     internal/application/<cap>/ -> internal/infrastructure/   ⟵ FORBIDDEN (ports)
#     internal/application/<capA>/ -> internal/application/<capB>/ ⟵ FORBIDDEN (events/ports)
# without renaming directories. Vocabulary mapping: capabilities=internal/application,
# kernel=internal/domain, platform=internal/infrastructure, app=internal/app.
# PR1 (this commit) ships the OBSERVATION counters (counts in `Checks`, no
# violations → CI stays green). PR2+ promote selected edges to hard gates
# via the existing ratchet mechanism (subtractSet vs allowlist per edge family).
- id: 19
  title: "Dependency Direction & consumer-owned ports (Vocabulary: capabilities/kernel/platform)"
  status: in_progress
  verified_zero: false
  description: |
    Implements the 10 "Actions to execute" from the operator-pasted
    Dependency Rules spec (June 2026). Map: `capabilities` =
    `internal/application/<cap>`, `kernel` = `internal/domain`,
    `platform` = `internal/infrastructure`, `app` = `internal/app`,
    `cmd` = `cmd/{server,worker,admin,archcheck}`.

    Vocabulary of the spec is preserved as a comment block; the
    directory names are NOT renamed (would invalidate the active
    Wave 14-18 ratchet, ownership.yaml entries, and 60+ existing
    path refs).

    PR1 (this commit) — observation only — edge COUNTS, not edge GRAPH:
      * `check_application_to_infrastructure` counts files
        `internal/application/...` containing a Go import of
        `internal/infrastructure/...` (anchored on `"` prefix to
        exclude comments and non-import string hits). Reported as
        `Checks["application_to_infrastructure_files"]`.
      * `check_cross_capability_import` counts distinct (capA, capB)
        pairs in `internal/application/<capA>/...` ->
        `internal/application/<capB>/...` (same-package references
        are excluded by the `srcCap == importCap` filter). Reported
        as `Checks["cross_capability_import_pairs"]`.
      * PR1 HONESTLY PARTIALS Actions 1-2: we generate edge COUNTS
        only, not a full per-file edge graph. Full graph emission
        (file-level list of each edge + classification per
        forbidden-pattern) and per-edge classification ship with
        PR2 alongside the ratchet baseline. Operators should read
        the count as a smoke signal — a non-zero count means the
        edge family exists, not that those edges are catalogued.

    PR2+ — promote selected edges to hard gates:
      * `application -> infrastructure` violations fail ratchet
        unless allowlisted in
        `docs/migrations/application-infrastructure-imports-allowlist.txt`
        (mirror of the existing api-infrastructure allowlist pattern).
      * `cross_capability` violations fail ratchet unless the pair
        is allowlisted in
        `docs/migrations/cross-capability-imports-allowlist.txt`.
  rule: |
    internal/application/<cap>/ must NOT import internal/infrastructure/
    unless the import is a structural port interface declared in
    internal/application/<cap>/ports.go (PR2 hardening).
    internal/application/<capA>/ must NOT import internal/application/<capB>/
    unless they communicate via a shared port, a typed event, or a
    composition-only bridge in internal/app/.
  blocked_by: ["16"]  # share the zero-redundancy surface
  target_metrics:
    application_to_infrastructure_files: 0
    cross_capability_import_pairs: 0
    documented_event_families: 0
    ports_with_owner_decl: 0
  pr1_exit_gate: >-
    Both `Checks["application_to_infrastructure_files"]` and
    `Checks["cross_capability_import_pairs"]` are PRESENT (i.e. the
    runner wiring is alive) and non-negative. CI stays GREEN. Wave
    19 PR1 does NOT emit any violations — the ratchet-promotion
    baseline MUST be agreed with operators before flipping any
    metric to enforcement (see `exit_gate` below, deferred to PR2).
  exit_gate: |-
    Both edge counters report 0 in the focused/ratchet report
    AND the allowlist files exist (or are explicitly empty)
    AND CI strict-mode exit code is 0 with `verified_zero: true`
    toggled. NOTE: this gate is for PR2 promotion; PR1 satisfies
    `pr1_exit_gate` only — operators should NOT flip
    `verified_zero: true` on PR1.
  observation_only_PR1:
    description: "PR1 ships observation counters in `Checks` (no violations). CI stays GREEN during the obfuscation pass."
    files_changed_PR1:
      - scripts/archcheck/main.go (add checkApplicationToInfrastructure + checkCrossCapabilityImport + wire into runFocusedChecks/runRatchetChecks)
      - architecture/current.yaml (this Wave 19 block)

  # PR2 setup (this setup commit ONLY records acceptance criteria — no
  # ratchet promotion, no implementation). Each PR2 item ships as its
  # own follow-up commit on main. Ratchet enforcement (allowlist files,
  # flipping target_metrics) is intentionally deferred until operators
  # agree on baseline with PR1 counts as starting reference.
  pr2_setup:
    description: |
      Records the three PR1 deferred items as concrete PR2 acceptance
      criteria. This setup commit is a no-op for the ratchet — the
      implementation of PR2-1, PR2-2, and PR2-3 ships as separate
      commits on main. Each item mirror's PR1's "observation-only"
      pattern: PR2 ships the per-file edge graph (PR2-1), the
      AnalyzeImports wire-or-delete decision (PR2-2), and the
      filesystem-driven capability discovery (PR2-3) before promotion
      to ratchet enforcement.
    items:
      - id: PR2-1
        title: "Full edge graph emission (per-file edge list per cross-edge family)"
        target: "scripts/archcheck/main.go::checkApplicationToInfrastructure + checkCrossCapabilityImport"
        description: |
          Replace the int counters with structured lists: each entry
          contains file path, import string, edge class (platform or
          cross_capability), plus a flag for whether the import is a
          structural port (in ports.go) or a concrete adapter (in
          service.go / provider). The graph is reported under
          `Checks["application_to_infrastructure_edges"]` and
          `Checks["cross_capability_import_edges"]` (each a []map
          with stable JSON shape).
        acceptance:
          - "`go run ./scripts/archcheck` returns ≥1 edge in the new keys when count > 0."
          - "Graph entries share JSON shape `{src_file, import, type, in_ports}` regardless of edge class."
          - "PR2 ratchet subtracts from the allowlist files to derive violation count (mirrors PR3_API_COMPACTION pattern)."
        files_touched:
          - "scripts/archcheck/main.go (counters + new keys + MakeReport shape)"
          - "scripts/archcheck/imports.go (potentially re-purposed as the canonical AST pass that feeds PR2-1 — see PR2-2 decision)"
        risk: |
          First time a structured edge feeds the ratchet. Lock the JSON shape
          contract now; change it later only via EXPAND/BACKFILL/CUTOVER
          per AGENTS.md Migration policy.
      - id: PR2-2
        title: "Wire or delete scripts/archcheck/imports.go::AnalyzeImports (dead code)"
        target: "scripts/archcheck/imports.go"
        status: done
        closed_in_commit: "Wave 19 PR2 dead-plus-setup (June 2026)"
        description: |
          imports.go defines `AnalyzeImports()` but `main.go` never calls
          it (PR1 review flagged it as dead code). PR2 makes the call:
          either wire it as the canonical AST pass feeding PR2-1's edge
          graph, or delete the file outright if redundant with the rg
          pattern in `scripts/archcheck/main.go`.
        acceptance:
          - "`rg AnalyzeImports scripts/archcheck` returns zero (after wire OR delete)."
          - "If wired: `runFocusedChecks` MakeReport has its result under `Checks` or a new top-level key."
          - "Whatever survives has a package doc explaining responsibility (no orphan half-implementations)."
        files_touched: "scripts/archcheck/imports.go (delete) OR scripts/archcheck/main.go (wire callsite) OR both (delete imports.go + let main.go checks stay rg-based)."
        decision_criterion: |
          Reuse beats innovation. Recommended path: delete imports.go.
          Reason: the rg pattern in main.go is already proven (PR1
          counters land cleanly), hand-rolled AST parsing for cross-
          capability imports adds little value over rg + SplitN, and
          dead code in a foundation file is a real risk per the prior
          review. Wire AnalyzeImports ONLY if a future PR requires
          per-edge AST classification that rg cannot provide.
      - id: PR2-3
        title: "Migrate applicationCapabilities from hardcoded list to filesystem-driven discovery"
        target: "scripts/archcheck/main.go::applicationCapabilities"
        status: done
        closed_in_commit: "Wave 19 PR2 dead-plus-setup (June 2026)"
        description: |
          Replace the hardcoded 22-capability list with one of:
          (a) `os.ReadDir("internal/application")` at startup, filtering
              non-cap directories (testdata, mocks, helpers);
          (b) read `architecture/ownership.yaml` entries with
              `application_*` prefix and derive the list.
        acceptance:
          - "Adding a new capability dir under internal/application/ is picked up automatically."
          - "Removing a capability dir causes the captured set to shrink without list edits."
          - "Hardcoded list deleted; PR2-hook comment removed."
          - "Both focused and ratchet mode discover the same set (no drift)."
        files_touched: "scripts/archcheck/main.go"
        choice: |
          (a) `os.ReadDir` is the cheapest and matches Wave 15's
          `register capabilities via filesystem` rule. (b) introduces
          a YAML dependency in the checker, more authoritative but
          slower to evolve.
