  completed_through_W19_pr2_deadplus_setup:
    - "scripts/archcheck/imports.go REMOVED (PR2-2 wire-or-delete: `rg AnalyzeImports .` returns ZERO callers; the file's AST-based architecture rules were never invoked from any focus/ratchet mode)"
    - "scripts/archcheck/aliases.go REMOVED (`rg FindAliases .` returns ZERO callers; the file's AST-based import-alias + local-alias detection was a hypothetical detector never wired into runFocusedChecks/runRatchetChecks)"
    - "scripts/archcheck/wrappers.go REMOVED (`rg FindWrappers .` returns ZERO callers; the file's single-statement wrapper detector was a hypothetical detector never wired into runFocusedChecks/runRatchetChecks)"
    - "scripts/archcheck/main.go::applicationCapabilities rewritten to use os.ReadDir(\"internal/application\") (PR2-3; hardcoded 22-entry map replaced; filesystem re-read on every invocation so new capability dirs are picked up automatically)"
    - "scripts/archcheck/main.go::Report struct: unused Graphs field + its long docstring reverted (forward-looking declaration; re-introduction deferred to PR-W19-PR2-1 follow-up PR once the allowlist for cross-capability edges is committed)"
    - "scripts/archcheck/main.go: added package-level docstring cross-referencing cmd/archcheck ('this binary is the legacy burndown half; companion is cmd/archcheck')"
    - "cmd/archcheck/main.go: package doc enhanced to cross-reference scripts/archcheck ('this binary is the target-tree half; companion is scripts/archcheck')"
    - "scripts/archcheck still vets cleanly: go vet + go build on scripts/archcheck/... GREEN; rg-sanity post-deletion conclusion: 0 callers across FindAliases/FindWrappers/AnalyzeImports"
    - "ci-architectural-checks.sh smoke GREEN: scripts/archcheck/main.go continues to be the last CI check before exit, no caller changes needed"

  # PR-W19-AST-DETECTION-RENEWAL (follow-up ticket, deferred):
  # If a future rule family needs AST-based detection (per-file alias
  # catalogues, single-statement wrapper counts, etc.) that the
  # `rg`-based Phase 0 rules cannot provide, the three deleted files
  # are available in git history (`git show HEAD~N:scripts/archcheck/
  # {aliases,wrappers,imports}.go`) and can be partially restored as
  # `_test_only` helpers or rewritten under a new
  # `scripts/archcheck/ast/` subpackage. Until such a need arises, the
  # caller-free AST detectors stay removed — restoring them in this
  # PR would resurrect the very dead-code drift this sweep targeted.
  w19_followup_ast_detection_renewal:
    id: PR-W19-AST-DETECTION-RENEWAL
    status: deferred
    trigger_criteria: |
      Restore the deleted AST-based detectors ONLY IF a future rule
      family requires per-file classification that rg patterns cannot
      express (e.g. ANNOTATING PRODUCTION ASSETS with import-alias
      provenance for a refactor audit). Otherwise the rg-based Phase 0
      rules remain the canonical detection surface and the deleted AST
      code stays out of the source tree.
    recovery_path: |
      Pin the deletion SHA deterministically (avoids `HEAD~N`
      drifting after future rebases): run
      `git log --all --diff-filter=D --pretty='%H' --name-only --
      scripts/archcheck/<name>.go` to retrieve the deletion SHA, then
      `git show <sha>:scripts/archcheck/<name>.go` to recover the file
      content. The `--all` covers cases where the deletion lived on a
      merged-in branch; `--diff-filter=D` filters to the deletion event;
      `--pretty='%H'` returns the SHA alone; `--name-only` confirms
      the path matched. (`--follow` is NOT used: it traces renames
      backward from a path that currently exists in HEAD, so once
      the file is deleted from HEAD `--follow` has nothing to track
      and silently degrades to plain `git log`.) Relocate restored
      code under `scripts/archcheck/ast/` (new subpackage) to avoid
      recreating the prior main-package file pile-up Wave 16
      disciplined against.
    rationale: |
      The pre-PR deletion rationale is
      `rg -l FindAliases . / rg -l FindWrappers . / rg -l AnalyzeImports .`
      each returning ZERO callers. The AST detection was correct but
      un-wired — re-introducing it without a caller would resurrect the
      dead-code drift this PR targeted.


# ── Wave 20 — QDRANT-005D hygiene + Check 5 lint (in_progress, June 2026) ──
# Triggers:
#   - Ticket QDRANT-RECOVERY-001 (docs/operations/05, RECOVERED) closed the
#     qdrant package redeclaration break via the recovery commits
#     2b67d701 + 38187ded.
#   - Forward-prevention blockers from that ticket's OPEN items were rolled
#     into this wave (allowlist file, canonical note, owner registration).
#
# Why this wave is separate (NOT threaded under Wave 16):
#   - Wave 16 is the zero-redundancy strict-mode gate (601 alias hits + 61
#     rule violations). Wave 20 is a strictly-scoped hygiene gate focused
#     on same-package redeclaration only — small enough to clear in <2 PRs,
#     large enough to deserve its own exit_gate + transitional baseline
#     per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
#     §"Zero-baseline rule":
#       "The final acceptable count is zero. Transitional baselines
#        require an owner and deadline. A baseline that only prevents new
#        violations is not completion."
- id: 20
  title: "QDRANT-005D hygiene — same-package duplicate-type-declaration lint"
  status: enforcement
  verified_zero: false
  description: |
    Forward-prevention half of QDRANT-RECOVERY-001. Catches Go's
    same-package redeclaration error class (`<X> redeclared in this
    block`) at pre-CI time so a new type declaration cannot land with
    a colliding same-package symbol. Scope: internal/**/*.go only
    (per AGENTS.md "scope discipline" rule). Excludes test fixtures
    (legitimate redeclarations in tests). Implementation:
    scripts/ci-architectural-checks.sh::Check 5
    (same-package duplicate-type-declaration lint block).
  deliverables:
    - id: docs/operations/05-qdrant-redeclaration-recovery.md
      kind: ticket
      title: "QDRANT-RECOVERY-001"
      status: RECOVERED (June 2026)
      delivered_via_commits: [2b67d701, 38187ded]
    - id: scripts/ci-architectural-checks.sh::Check 5
      kind: ci_gate
      title: "Same-package duplicate-type-declaration lint"
      allowlist_ref: docs/architecture/godlike/duplicate-types-allowlist.txt
      log_line_on_pass: "Check 5: 0 same-package type-redeclarations detected across internal/"
    - id: docs/architecture/godlike/duplicate-types-allowlist.txt
      kind: allowlist_file
      title: "Initial empty allowlist (populated ONLY for transitional cases per zero-baseline rule)"
      shipped_in: Wave 20 first commit on origin/main
    - id: docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md
      kind: doc_note
      title: "Canonical note: Go cannot distinguish file-level type from package-level type; wire-mirror + canonical-in-application cycle-break requires lint enforcement"
      status: pending
  rule: |
    Within any Go package under internal/**, an exported type X may be
    declared at most once (test files *_test.go are EXEMPT — legitimate
    redeclarations in tests are not a SSOT invariant). Implementation:
    scripts/ci-architectural-checks.sh::Check 5. The lint groups by
    <package_name>:<type_name> tuple; cross-directory same-package-NAME
    pairs that Go treats as DIFFERENT packages are inside-scope of the
    ratchet (final expected count = 0 once the AWK lens is replaced
    with a directory+name tuple grouping; see transitional_baselines).
  exit_gate: |
    bash scripts/ci-architectural-checks.sh exits 0 with the log line
    "Check 5: X same-package type-redeclarations detected across internal/"
    where X = 0 — the FINAL zero-baseline, per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
    §"Zero-baseline rule".
    docs/architecture/godlike/duplicate-types-allowlist.txt exists on
    disk and on origin/main (initial content: empty-by-design per the
    zero-baseline rule — transitional baselines default-block the lint
    rather than silently pass).
    docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md carries the
    canonical note explaining the wire-mirror + canonical-in-application
    cycle-break and the lint enforcement rationale.
    verified_zero: true flip requires X = 0 on origin/main HEAD; until
    then transitional_baselines below allows the owner to ship
    remaining remediation.
  transitional_baselines:
    note: |
      Per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
      §"Zero-baseline rule" the lint reports a non-zero count (~14) as
      of origin/main HEAD due to a CROSS-DIRECTORY SAME-PACKAGE-NAME
      false-positive pattern: two unrelated directories both declaring
      `package scripts;` (e.g. internal/application/scripts +
      internal/infrastructure/database/sqlite/scripts). Go treats them
      as DIFFERENT packages — but the AWK lens groups by NAME only
      instead of the canonical Go-package identity tuple
      (directory_path, package_name).
    owner: qdrant-hygiene work stream (RW-PROD-013 dependency chain)
    owner_secondary: scripts/ci-architectural-checks.sh maintainer
    deadline: 2026-07-25
    current_count: 14  # approx; re-verify via `bash scripts/ci-architectural-checks.sh`
    expected_post_remediation_count: 0
    remediation_target: |
      Replace the AWK lens with a directory+name tuple-grouping via a
      Go helper under scripts/archcheck/check5types/ (per Wave 16's
      per-file split discipline) wired into MakeReport. The script
      already invokes `go run ./scripts/archcheck` for the main gate,
      so a Go-side Check 5 is idiomatic; the AWK impl stays as a
      short-lived fallback while the Go-side helper matures.
  ci_impact_at_landing: |
    On origin/main HEAD after this wave entry merges, scripts/ci-architectural-checks.sh
    emits FAIL with ~14 same-package type-redeclarations detected
    (all cross-directory same-package-NAME false-positives, e.g.
    internal/application/scripts/repository.go ×
    internal/infrastructure/database/sqlite/scripts/repository_types.go).
    This IS the EXPECTED transitional state — see description §"Why
    this wave is separate" and exit_gate above for the canonical
    zero-baseline rationale. CI is RED on origin/main HEAD until
    the AWK→Go rewrite lands (deadline 2026-07-25). Future agents
    auditing RED CI should treat this wave as the documented
    source, NOT an unrelated regression.
  blocked_by: ["16"]  # shares the zero-redundancy surface (duplicate types = redundancy)
  component_checks:
    check_5_pass: 'exit 0 + log "Check 5: 0 same-package type-redeclarations detected across internal/"'
    duplicate_types_allowlist_present: yes (on disk, on origin/main)
    ticket_pinned: docs/operations/05-qdrant-redeclaration-recovery.md (RECOVERED)
    zero_legacy_doc_note: shipped (canonical note on wire-mirror + cycle-break + lint enforcement)

