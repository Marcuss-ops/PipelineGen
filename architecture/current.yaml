- id: 20
  title: "QDRANT-005D hygiene — same-package duplicate-type-declaration lint"
  status: enforcement
  verified_zero: false
  description: |
    Forward-prevention half of QDRANT-RECOVERY-001. Catches Go's
    same-package redeclaration error class (`<X> redeclared in this
    block`) at pre-CI time so a new type declaration cannot land with
    a colliding same-package symbol. Scope: internal/**/*.go only
    (per AGENTS.md "scope discipline" rule). Excludes test fixtures
    (legitimate redeclarations in tests). Implementation:
    scripts/ci-architectural-checks.sh::Check 5
    (same-package duplicate-type-declaration lint block).
  deliverables:
    - id: docs/operations/05-qdrant-redeclaration-recovery.md
      kind: ticket
      title: "QDRANT-RECOVERY-001"
      status: RECOVERED (June 2026)
      delivered_via_commits: [2b67d701, 38187ded]
    - id: scripts/ci-architectural-checks.sh::Check 5
      kind: ci_gate
      title: "Same-package duplicate-type-declaration lint"
      allowlist_ref: docs/architecture/godlike/duplicate-types-allowlist.txt
      log_line_on_pass: "Check 5: 0 same-package type-redeclarations detected across internal/"
    - id: docs/architecture/godlike/duplicate-types-allowlist.txt
      kind: allowlist_file
      title: "Initial empty allowlist (populated ONLY for transitional cases per zero-baseline rule)"
      shipped_in: Wave 20 first commit on origin/main
    - id: docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md
      kind: doc_note
      title: "Canonical note: Go cannot distinguish file-level type from package-level type; wire-mirror + canonical-in-application cycle-break requires lint enforcement"
      status: pending
  rule: |
    Within any Go package under internal/**, an exported type X may be
    declared at most once (test files *_test.go are EXEMPT — legitimate
    redeclarations in tests are not a SSOT invariant). Implementation:
    scripts/ci-architectural-checks.sh::Check 5. The lint groups by
    <package_name>:<type_name> tuple; cross-directory same-package-NAME
    pairs that Go treats as DIFFERENT packages are inside-scope of the
    ratchet (final expected count = 0 once the AWK lens is replaced
    with a directory+name tuple grouping; see transitional_baselines).
  exit_gate: |
    bash scripts/ci-architectural-checks.sh exits 0 with the log line
    "Check 5: X same-package type-redeclarations detected across internal/"
    where X = 0 — the FINAL zero-baseline, per docs/architecture/godlike/08_ARCHITECTURE_CI_GATES.md
    §"Zero-baseline rule".
    docs/architecture/godlike/duplicate-types-allowlist.txt exists on
    disk and on origin/main (initial content: empty-by-design per the
    zero-baseline rule — transitional baselines default-block the lint
    rather than silently pass).
