# ── Step 2 — JobFinalizer.CompleteWithArtifacts runtime wiring (CLOSED, July 2026) ──
# The 12-step plan's Step 2 is closed on origin/main HEAD. The canonical
# wiring was already live on `origin/main` via three coordinated commits
# (JobFinalizer FinalizationRequest typed envelope + Broker.CompleteWithArtifacts
# spine + worker-side Tools.CompleteWithArtifacts surface); this closure
# commit is the audit-pinning bookkeeping only.
#
# Acceptance — zero productive callers of `broker.Complete` for artifact-producing jobs:
# * (a) `JobPolicy.ProducesArtifacts bool` field EXISTS in
#   internal/application/jobs/registry.go (RegistryEntry alias) AND in
#   internal/domain/job/job_definition.go (ArtifactPolicy). Both layers
#   carry the field; the application-layer surface is the operational SSOT.
# * (b) The dispatch IS already central-but-not-single-method: workers
#   call `Tools.CompleteWithArtifacts(...)` (worker-side facade in
#   internal/application/jobs/worker/tools.go) for artifact-producing
#   job types, which routes through `Broker.CompleteWithArtifacts(...)`
#   (broker spine in internal/infrastructure/jobs/local/broker.go) and
#   delegates to `JobFinalizer.CompleteWithArtifacts(...)` in
#   internal/application/jobs/finalizer/job_finalizer.go. The legacy
#   `Broker.Complete` path runs `SQLiteStore.Complete(...)` which is
#   GATED at the SQL layer (`ErrArtifactJobRequiresCompleteWithArtifacts`
#   in internal/infrastructure/database/sqlite/jobs/repository_lifecycle.go:30)
#   for any job type whose `producesArtifacts[jobType] == true`. The map
#   is propagated from the registry via `repo.SetProducesArtifacts(registry.ProducesArtifactsMap())`
#   in internal/app/module_jobs.go:54.
# * (c) `script.generate_with_images` does NOT exist as a separate job
#   type constant; the canonical `TypeScriptGenerate = "script.generate"`
#   (per internal/domain/job/job.go) handles all script-generation modes
#   (from-clips / with-images / batch / curate) as a single registered
#   type, already flagged `ProducesArtifacts: true` in
#   internal/application/jobs/registry.go:475.
#
# The dispatching design above is the user-spec-equivalent behavior via
# a different (defense-in-depth) shape: rather than collapsing into one
# broker.Complete method with a flag branch, the architecture uses two
# canonical broker methods (Complete + CompleteWithArtifacts) with SQL-layer
# gating. Both yield the same operational guarantee ("zero productive
# callers of broker.Complete for artifact-producing jobs") and the
# SQL-layer gate is operationally MORE robust (a worker that accidentally
# calls broker.Complete for an artifact-producing job is rejected loudly
# rather than silently creating a half-finalized asset row).
