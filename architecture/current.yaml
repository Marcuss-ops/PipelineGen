    failure_mode: "If a future agent proposes to MOVE the `media_assets` write OUT of\nvoiceover.Finalize (e.g. into a separate post-write save context, a\nnew use case, or the broker's `CompleteWithArtifacts`\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ fork), the\nsystem breaks NON-OBVIOUSLY:\n  (1) DOUBLE-WRITE RACE: if media_assets is written in TX1 (outside\n      the finalizer's *sql.Tx) and the broker complete fork is in TX2,\n      a crash\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ between TX1 and TX2 results in EITHER (a) orphan\n      media_assets row pointing to a job that was never marked\n      SUCCEEDED, OR (b) job marked SUCCEEDED but no media_assets row.\n      The\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ system appears to work in normal operation; the\n      inconsistency only surfaces on crash recovery or rollback.\n  (2) SSOT VIOLATION: voiceover.finalizer is the canonical owner of\n      the\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ voiceover artifact persistence (per godlike/06\n      one-owner-per-fact). Splitting the writes across 2 transactions\n      violates the SSOT contract and breaks the 3rd TDD test\n      `TestVoiceoverFinalizer_PersistsMediaAssetsInSameTxn`\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ which\n      uses tx-pointer identity to prove atomicity.\n  (3) SQL-GUARD BINARY-SURFACE MISMATCH: voiceover.finalizer is the\n      only application-layer surface that knows about the in-TX\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \      media_assets write; the SQL-layer `ErrCompleteJobPathViolation`\n      guard at repository_lifecycle.go:115 only knows about\n      `ProducesArtifacts=true/false`. Moving the write to a surface\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \      the guard doesn't know about creates a binary-surface mismatch\n      that no CI gate can detect.\nAny future agent proposing such a refactor MUST open a new\nwave-tracker entry (e.g. `PR-VOICEOVER-PATH-A-REVISITED`)\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ and\naddress all 3 failure-mode concerns with substantive rebuttal per\ngodlike/07 no-fake-availability. The 4 TDD tests in\ninternal/application/voiceover/jobs/finalizer_invariants_test.go\nare\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
      \ the canonical guard against silent regression.\n"
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
