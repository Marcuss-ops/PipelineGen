    # cmd.Validate() failure, or panic-recovered paths. Post-P06 a
    # local var extraction (`enq, failEnq := 0, 0; if res != nil { ... }`)
    # nil-guards both calls; toFanoutResultMap stays nil-safe (returns
    # a well-formed partial-failure map) so the dispatcher's result-
