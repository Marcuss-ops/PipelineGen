  rationale: "Demolition debt from the PostgreSQL + pgvector media cutover (September 2026). The replacement is ENFORCED by the Go gate suite, NOT by the historical certificate: scripts/ci/certify-media-cutover.sh was deleted by commit 7e6965aab, and the `make certify-media-cutover` target (with its certify-storage / certify-data-layer / certify-rust-migration siblings and their -json twins) was RETIRED on 2026-09-13 — a target that can only fail closed is not a gate and it kept stale certificate claims alive. The live enforcement is `go run ./cmd/archcheck --strict` (percheck_media_assets_writer_canonical, percheck_asset_committer_event_ssot, percheck_indexed_state_writer_ssot, percheck_upsert_points_sole_owner) plus `TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/`. The design goal remains: PostgresMediaCommitter is the canonical writer, MediaSearcher is the canonical VectorStorePort, and PostgresIndexWorker (with its composition-root drain loop, E5 sidecar embedder via ClipIndexer.ServerURL, and family bootstrap via EnsureEmbeddingFamily) is the canonical asset.index.requested consumer. This ticket tracks the REMOVAL of the superseded SQLite media writer family — removal is mandatory work once the exit condition is met, not an option."
  follow_up_tickets:
    - id: "DEMO-SQLITE-MEDIA-COMMITTER"
      note: "DEMOLITION COMPLETE (September 2026). OWNER: media-postgres-cutover. REASON: the SQLite media writer family (SQLiteMediaCommitter/SQLiteAssetCommitter and the asset_committer* files of internal/platform/sqlite/assets/imagesregistry) has been REMOVED — PostgreSQL + pgvector is the sole production writer of media_assets; only the non-media mutation primitives survive in media_asset_mutations.go (no commit, no outbox emission). REMOVED: the Qdrant media compatibility branch in registerOutboxCoreHandlers (no media index handler is registered on the SQLite outbox in ANY mode), the artlist publish SQLite atomic writer, and the old SQLite-outbox→Qdrant projection sync tests (replaced by the TestCutover_/TestWorker_/TestHNSW_ suites on the live PG DSN). EXIT CONDITION: partially met — enforced structurally by the Go gates (percheck_media_assets_writer_canonical, allowlist = PG family + surviving primitives only; percheck_indexed_state_writer_ssot; percheck_asset_committer_event_ssot). The script-based certificate (SQLITE_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_WRITERS/READERS=0, QDRANT_MEDIA_COMPATIBILITY=0) was NOT re-run since scripts/ci/certify-media-cutover.sh was deleted (commit 7e6965aab), so those three counters are currently UNVERIFIED. EQUIVALENCE GATE: TEST_POSTGRES_DSN=… go test ./internal/platform/postgres/media/ -count=1 plus go run ./cmd/archcheck --strict. STATUS: structurally closed; certificate MISSING (restore the driver or promote the three counters into cmd/archcheck). AUDIT 2026-09-13: the gate suite is now GREEN and the counters are covered structurally — percheck_media_assets_writer_canonical scans `cmd/` in addition to `internal/`, so the documented repo-wide ban is actually enforced (previously the claim was false for cmd/admin), and its DELETE branch no longer requires a SET/( trailer, so `DELETE FROM media_assets` is caught. The two remaining cmd/admin media writers (maintenance/unify_catalogs.go INSERT OR IGNORE, maintenance/stock_reset.go DELETE) were retired to fail-closed stubs: a SQLite media write would desynchronise the PostgreSQL SSOT while the Drive-side effects still ran. The registry 'current' counts were also found stale for four hotspots and regenerated via scripts/regen_hotspots.py. OPEN ITEM (P2-9 Phase 2, NOT closed by this audit): the fresh-install SQLite baseline 000_baseline_267.sql STILL creates the quarantined media_assets + media_assets_pipeline_events tables (and migration 033 re-declares media_assets), because the SQLite migration test suite asserts their existence (internal/platform/sqlite boot_test.go + migrations_helpers_test.go::essentialTables, migrations_152/157/158/197). Regenerating to 000_baseline_268.sql without media-authoritative tables therefore requires the SQLite media-reader fixtures to be rehomed first; migration 268's marker is the current fresh-install guard. AUDIT 2026-09-13 follow-up: the guard is no longer prose-only — internal/platform/sqlite/migrations_268_test.go now ASSERTS the marker table exists exactly once with the canonical note (before that the marker was written and never read, so the migration's own 'lets runtime and CI gates assert' claim was true only on paper). REGENERATION CONSTRAINT (2026-09-13): `cmd/gen_baseline/main.go` hard-codes `000_baseline_267.sql` (lines 103 and 146) and rebuilds it from a clean `RunMigrationsOnDB` boot, so it RE-EMITS `media_assets` + `media_assets_pipeline_events` from the incremental migrations themselves; producing `000_baseline_268.sql` without media-authoritative tables therefore requires (a) rehoming the SQLite media-reader fixtures — `internal/platform/sqlite/boot_test.go:108`, `migrations_helpers_test.go:54` (`essentialTables`), `migrations_152_test.go:41,54`, `migrations_157_test.go:27`, and the `migrations_158_test.go` / `migrations_197_test.go` cases — (b) teaching gen_baseline to drop the quarantined media DDL, and (c) retiring or re-scoping the `migrations/sqlite/*media*` files plus the `media_assets` re-declaration in `033_media_assets_youtube_video_id_index.sql`. NOT REACHABLE IN THIS PASS: this is a schema-generation project with its own fixture migration, not a doc/gate fix, so it stays OPEN and is tracked here as the single blocking item of this ticket. READ-PLANE CLOSURE PASS (2026-09-13, second pass): the reachable read split-brain items are closed. (1) MEDIA-SSOT P1-6 CLOSED — the legacy SQLite local search backend (internal/app/wiring/search/search_backend_local.go, which read media_assets via sqassets.ClipsRepository) was DELETED; BuildSearchBackends no longer accepts a ClipsRepo and leaves the local media capability unregistered when the PostgreSQL local store is absent (godlike/07 fail-closed) instead of degrading to the SQLite mirror, pinned by TestBuildSearchBackends_FailsClosedWithoutPostgresLocalStore. (2) MEDIA-SSOT P1-5 CLOSED for the Artlist Searcher port — WireArtlist no longer calls sqliteSearch.NewArtlistSQLiteSearcher(bundle.ClipsRepo); the local searcher is newArtlistLocalSearcher(pgmedia.NewMediaSearcher(bundle.MediaDB)) in internal/app/wiring/artlist_runs_adapter.go (merged into an existing file to respect the percheck_legacy_hotspot_growth 150-production-file cap on internal/app/wiring), pinned by TestArtlistLocalSearcher_ReadsPostgresMediaSSOT; NewArtlistSQLiteSearcher now has ZERO production callers. (3) VERIFIED ALREADY CLOSED at HEAD, no change needed: P0-1 dispatcher (self-owned AssetCommitter paths; the tx-bound cross-engine branch is not representable), P0-2 Stock (splitPlaneFinalizer two-phase media-then-jobs boundary, banned by media_cutover_boundary_test.go), P0-3 Artlist (assetFinalizerDB opens the finalizer tx on the committer engine), P1-4 (pgmedia.MediaSearcher implements GetAsset/GetAssetsByIDs/GetMany/FindByHash/FindByYouTubeID/SearchLocal/FindAllByHash/SearchClipsByName), and the catalog-sync read-after-write (postgresCatalogRepository routes GetClip/GetIndexState to PostgreSQL). REMAINING BLOCKER FOR P2-9 PHASE 2, now precisely enumerated: the operational SQLite media READ plane still has production consumers, so a media-free fresh-install baseline would break them. Exact sites: (a) root.Repos.Assets = detail.Service(imagesregistry.AssetStoreSQLite) consumed by registry_adminconsole_api.go (List/Get/Save), registry_operator_admin_api.go, script_generation_runtime.go media preflight, wire_script_postprocess.go, localization_service.go, and build_bundles_artlist_publishers.go:60; (b) artlist.AssetStore.SearchClips (wired to bundle.ClipsRepo) called from artlist/search_core.go:49,308 (the /api/artlist/search DB-only endpoint and SearchService.SearchClips) and artlist/diagnostics.go:240; (c) imagesregistry.AssetStoreSQLite.SearchClips to SearchByTerms (search_terms_queries.go) still queries the clip_search_terms inverted index and re-hydrates media_assets in SQLite. UNBLOCK ORDER: (1) give the Artlist capability a PostgreSQL-backed read port for its DB-only search endpoints; (2) migrate the admin-console/script/operator Repos.Assets consumers to pgmedia.MediaSearcher; (3) retire clip_search_terms as a media index (migration 267 quarantined it in the observability DB only); then (4) rehome boot_test.go / migrations_helpers_test.go::essentialTables / migrations_152/157/158/197; (5) teach cmd/gen_baseline to drop the quarantined media DDL and bump to 000_baseline_268.sql. GATE STATE AFTER THIS PASS: go run ./cmd/archcheck --strict green (passed=true, has_hard_gate_hits=false) and all verify-agent legs green; NOTE the repository Makefile currently cannot parse because make/verify.policy.mk, make/artlist.mk and make/operations.smoke.mk are deleted in the working tree (pre-existing, unstaged) while still listed in include make/*.mk, so the agent gate was executed leg-by-leg. GATE-PROMOTION PASS (2026-09-13, third pass): the standing instruction recorded above — 'restore the driver or promote the three counters into cmd/archcheck' — is now satisfied for the READ counter. CERTIFICATE COUNTER STATUS: (1) SQLITE_MEDIA_WRITERS=0 — enforced by percheck_media_assets_writer_canonical (pre-existing); (2) SQLITE_MEDIA_READERS=0 — was UNVERIFIED, NOW PROMOTED to the hard gate `percheck_sqlite_media_reader_ban` (cmd/archcheck/scan/boundaries/percheck_sqlite_media_reader_ban.go), registered in cmd/archcheck/checks.go and architecture/policy.yaml's hard-gate list. The gate scans internal/ + cmd/ non-test files for comment-masked SQL reads of media_assets (FROM/JOIN) and fails closed on any file outside (a) the PostgreSQL media SSOT (internal/platform/postgres/), (b) the grandfathered legacy read plane (internal/platform/sqlite/, internal/platform/qdrant/indexing/, cmd/admin/), and (c) an exact-file 14-entry debt register (sqliteMediaReaderGrandfatheredFiles) listing the P2-9 Phase 2 read split-brain sites. The register has no ghost entries (pinned by TestSQLiteMediaReaderGrandfatheredFilesExist) and the real tree is clean (pinned by TestScanSQLiteMediaReaderBan_RepoTreeIsClean); detection is proven by TestScanSQLiteMediaReaderBan_ViolationTrip. Consequence for this ticket: the P2-9 Phase 2 blocker is unchanged in substance but is now MEASURABLE and RATCHETING — every migrated consumer must delete its register entry in the same change, and a NEW SQLite media reader cannot land unnoticed. (3) QDRANT_MEDIA_WRITERS/READERS/COMPATIBILITY — covered structurally by percheck_upsert_points_sole_owner + percheck_qdrant_index_import_ban + percheck_frame_concept_projection_writer rather than by a dedicated counter. ALSO DELETED THIS PASS (SQLite media reader family, zero production callers): internal/platform/sqlite/assets/artlist/artlist_searcher.go and its test, internal/capabilities/assets/providers/artlist/searcher_sqlite.go, and the `NewSQLiteSearcher(s.assetStore)` fallback in SearchService.buildSearcherChain (internal/capabilities/assets/providers/artlist/search_core.go). The Artlist local catalog searcher is now an EXPLICIT injection point only (composition wire