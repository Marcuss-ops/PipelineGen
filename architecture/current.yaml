      * DRIFT-23-3 (dual search subsystem) was eliminated upstream
        by feat(W21 PR 10) CUTOVER (commit 9f7149d4, June 2026).
        Kept in the wave entry as audit documentation with
        superseded_by: 9f7149d4; no Wave 23 PR needs to reship
        that work.
      * HC-2's "Discovery search unification" acceptance criterion
        is annotated [DONE in 9f7149d4]. Residual scope covers
        the source-alias map and the resolveRepo factory in
        internal/application/assets/artifacts/source_resolver.go.
  rule: |
    Runtime configuration values MUST trace to exactly ONE of the
    following four canonical surfaces (the "4-Destination Rule"
    extending godlike/06 §"Configuration" to runtime values):
      (1) Consumer DTO — a typed struct field read by the consumer
          (e.g. `req.Timeout`, `cfg.DefaultVideo.Title`).
      (2) Operator config — the YAML config surface read by the
          composition root before services boot.
      (3) Capability registry — a typed registry (JobPolicy
          Registry, SourceAliasMap, VoiceoverProfileRegistry).
      (4) Typed invariant — a typed constant in the canonical
          constants file (e.g. `types.WordsPerMinute`).
    All other surfaces — fallback chains, per-call literal
    overrides, copy-paste duplications across packages — are
    FORBIDDEN per godlike/07 §"Forbidden compatibility techniques".
