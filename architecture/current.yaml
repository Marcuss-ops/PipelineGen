    ship_via: 'chore(stock): PR-COMPLETE-WORKER-FIX-TYPE-MEDIA-STOCK verified-canonical-spine-surface closure -- ProducesArtifacts=true RETAINED. The stock pipeline uses the canonical JobFinalizer.CompleteWithArtifacts SPINE (not a per-item tx like voiceover/YouTube) for the terminal-flip + artifact write: Service.runOrchestratorResilient to Orchestrator.RunResilient step 6 stock.finalize calls BuildFinalizationRequest + ApplyFinalizationSpine to JobFinalizer.CompleteWithArtifacts which does the SINGLE-TX spine write (UpdateJobToSucceededCAS + InsertResultOnConflict + PersistArtifactMap + InsertOutboxEnvelope per Pattern 11). The entry is closed as verified-canonical-spine-surface rather than as a flip. godlike/06 SSOT: ProducesArtifacts=true is the canonical signal that drives the SQL-layer gate at repository_lifecycle.go:108-115 and the typed-service gate at application/jobs/completion/complete_job_service.go. Flipping to false would (a) corrupt the SSOT (job DOES produce artifacts -- chunks, metadata.json, thumbnail.png, bindings.json, report.json, summary.txt per C12 envelope in buildStockManifest), AND (b) silently introduce a double-write race (spine call still does the terminal-flip; now-allowed legacy Complete would either no-op on already-terminal rows or fail with ErrInvalidState on the CAS fence), AND (c) break operator-dashboard cardinality. godlike/07 fail-closed: a future flip would NOT re-introduce ErrCompleteJobPathViolation (spine path does not go through legacy Complete) -- it would silently corrupt the SSOT. The verified-canonical-spine-surface contract is locked via internal/application/assets/providers/stock/stockpipeline/registry_contract_test.go (2 TDD tests + 2 compile-time pins on Orchestrator.jobFinalizer field + Orchestrator.WithJobFinalizer method). The remaining 14 PR-COMPLETE-WORKER-FIX-TYPE-* entries (TypeScriptGenerate, TypeMediaExtract, TypeMediaGenerate, TypeBulUploadYouTubeClips, TypeVideoGenerate, TypeRenderVideo, TypeYouTubeUpload, TypeBooksProcess, TypeLessonsProcess, TypeImageGenerateGoogle, TypeScriptVoiceoverSibling, TypeScriptImageSibling) are forward-pointers -- each needs the same per-type analysis (spine vs per-item tx). Deadline 2026-08-01 holds; this MEDIA-STOCK entry is the canonical no-flip-needed template for spine-based entries.'
