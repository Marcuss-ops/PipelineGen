      \ pipeline\n     (Hybrid mode per godlike/06 default) with a phrase\n     NEVER present in metadata (\"sviluppatore esausto davanti\n     al monitor di notte\"); asserts:\n       - top hit is the\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
