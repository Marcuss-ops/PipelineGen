  description: "Fix the godlike/07 fake-success anti-pattern in the artlist\nrun-orchestrator pipeline. The bug: POST /api/artlist/run returns\nSUCCEEDED + processed=1 + failed=0 BUT no rows are written\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ to\nartlist_runs and no media_assets are inserted. Root cause (3\nsource-line probes):\n  (a) `run_orchestrator_stages.go:287` increments\n      `ps.resp.Processed++` unconditionally during\n    \
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \  stageProcessBatch (in-memory counter, no DB-side verify).\n  (b) `run_orchestrator_stages.go:312` silently no-ops the\n      persist step when the clip is missing from DB (logged\n      at Debug\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ level, not Warn).\n  (c) `job_core.go:281` exits HandleJob via\n      `jobCodec.ResultFromResponse(resp)` without invoking\n      ClipsRepository.Insert / ClipsRepository.Persist;\n      finalizer.markSucceeded\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ writes only `jobs.status=SUCCEEDED`\n      + `job_events(job_completed)`, never `media_assets` or\n      `artlist_runs`.\n\nThe diagnostic artifact\n`internal/application/assets/providers/artlist/diagnostic_fake_success_test.go`\n\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    (shipped 2026-07-04, SHA `f241568c`) is the opt-in probe —\nSKIP by default, enabled with `VELOX_DIAGNOSTIC=1`. The test\nPASSES today (bug present) and will FAIL when the closure\nlands (substring\
    ship_sha: fdccf178c5273f503f4514ce319275027f0189dd
    ship_date: '2026-07-04'
    \ absent) — the FAIL is the operator signal to\nretire this diagnostic artifact.\n"
