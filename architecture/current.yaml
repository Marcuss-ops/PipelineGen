lips); every other AssetStore method still delegates. SearchLocal gained LocalMediaSearchRequest.AllTerms for the multi-keyword form, so there is NO PostgreSQL counterpart of clip_search_terms to create, which is what makes unblock step 3 (retire clip_search_terms as a media index) a deletion rather than a rewrite. Pinned by TestArtlistMediaSSOTAssetStore_SearchClipsReadsPostgres, _SearchByTermsHonorsLimit, _DelegatesRemainingMethods, _NoStoreKeepsDelegate, TestScanSQLiteMediaReaderBan_PostgresDialectOutsidePostgresPath, _MixedFileReportsOnlySQLite and _ConcatenatedPostgresStatement. REMAINING P2-9 UNBLOCK ORDER (unchanged in substance, now measurable): (2) the Repos.Assets consumers are now PARTIALLY migrated — ComposeRoot.MediaAssetStore()/MediaAssetVersionStore() already prefer PostgreSQL for the admin-console/operator read plus version surface, so what remains are the non-admin consumers: script_generation_runtime.go media preflight, wire_script_postprocess.go, localization_service.go and build_bundles_artlist_publishers.go; (3) retire clip_search_terms as a media index — the Artlist reader is gone, what remains are the UpdateSearchTerms/clip_search_terms writes and the residual AssetStoreSQLite.SearchClips/SearchByTerms callers; (4) rehome boot_test.go / migrations_helpers_test.go::essentialTables / migrations_152/157/158/197; (5) teach cmd/gen_baseline to drop the quarantined media DDL and bump to 000_baseline_268.sql. STILL NOT REACHABLE: P2-9 Phase 2 itself, for the reasons recorded above; the register still lists 9 production read sites plus the whole internal/platform/sqlite read plane. EXTERNAL INTERFERENCE OBSERVED AT THIS HEAD (not caused by this pass; left untouched because they belong to other writers in flight — three of the four resolved during the session as those writers finished): (i) go run ./cmd/archcheck --strict was RED with exactly 2 violations, both the hotspot cap — internal/app/wiring briefly sat at 151 production files against its regist