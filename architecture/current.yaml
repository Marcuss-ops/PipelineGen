  description: |
    Eliminates the 7 remaining runtime-configuration hardcode sites
    (HC-1..HC-7) and registers the 4 cross-cutting drift patterns
    (DRIFT-23-1..DRIFT-23-4) accumulated during the Wave 16/19/20/21
    pre-baseline. Ordered strictly by blocked_by chain so the
    foundational fixes (defaults SSOT, JobPolicy consolidation) ship
    first; media-ingestion profiles (HC-4/5/6) can only be safe to
    land atop the consolidated defaults; HC-2 (Asset Source
    Registry) lands last because it depends on the W14-PR2 clip-
