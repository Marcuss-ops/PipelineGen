#
# OPEN architectural debt. ONLY entries with status in (pending|in_progress)
# are admitted. Closed waves belong in git history, NOT here.
#
# Schema per entry (godlike/06 SSOT = one canonical fact per entry):
#   id            — short kebab identifier (PR-XXX-... or WAVE-NN-...).
#                   Unique across entries. Stable across the wave's lifetime.
#   status        — pending | in_progress
#   owner         — workstream / role / wave-owner responsible for closure.
#                   Mirrors capability_inventory.yaml::gates_baseline owner
#                   when known.
#   deadline      — RFC3339 UTC date (NOT datetime). Concrete day, no vague
#                   quarters. A missed deadline is a CI signal (gating
#                   ratchet nudges the entry toward "promote the gate
#                   to enforce_zero=true").
#   follow_up_tickets — optional list of follow-up PRs/tickets that
#                       must close before the entry is removed.
#   rationale     — optional human-readable note describing the WHY of
#                   the debt + its blast radius if the wave stagnates.
#   cross_refs    — optional machine-readable pointers to the related
#                   ratchet (capability_inventory.yaml::gates_baseline.id)
#                   + the governing CI check name.
#
# Regeneration contract: `go run ./cmd/admin regen-current-yaml` re-emits
# this file from the canonical sources (gates_baseline + waves-tracker +
# the hand-curated entries below). The hand-curated section is a
# back-compat shell for waves that predate the gates_baseline schema;
# migrate them to a gate_id reference as waves progress.
#
# Per AGENTS.md §8 zero-baseline rule: every entry here MUST carry an
# explicit `owner` and a concrete `deadline`. Entries missing either
# field are a forward-prevention regression — fail-closed.
#
# Per godlike/07 NO-FAKE-AVAILABILITY: dates that lie in the past past
# today MUST be remediated (the wave has stagnated). The CI gate (Check
# 63, scripts/ci-architectural-checks.sh) reports stale entries as a
# warning + the cross-ref gates promote the wave toward enforce_zero=true.

