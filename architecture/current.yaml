      Cross-refs: registry.go:541+548 (parent + child registry\nentries) + repository_lifecycle.go:115 (SQL-layer\nErrCompleteJobPathViolation guard) + voiceover/finalizer.go\n(in-TX persist + post-write\
      \ outbox + cleanup steps).\nDocumentation drift surface (this entry) is intentionally\ndistinct from the test surface (the 4 TDD tests above) per\ngodlike/06 one-owner-per-fact: the tests assert the\n\
      contract, this entry REMEMBERS the rationale so a future\nagent does not silently delete the tests as \"obsolete\nduplicate coverage\" without addressing the contract first.\nHonest scope-lock (godlike/07):\
