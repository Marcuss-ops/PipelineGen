# PipelineGen — Active Migration Plan
# -----------------------------------------------------------------------------
# Current waves only (14-22 in flight) + Wave 0 meta-snapshot. Historical
# waves 1-13 (all status: done) live in docs/archive/migration-history.md.
#
# Owner-of-record cross-reference: architecture/ownership.yaml.
# Archcheck ratchet: scripts/archcheck/main.go (reads this file via migPath).
#
# Status decreases monotonically: pending → in_progress → done.
# Each in-flight wave carries an exit_gate the ratchet checker can verify.
#
# MULTI-DOCUMENT STREAM (PHASE-PR, June 2026)
# ----------------------------------------------------------------------------
# This file is a YAML 1.2 multi-document stream (3 docs separated by `---`
# markers at column 0). The schema was previously a single-document file
# mixing a top-level sequence (`- id: N` wave blocks) with top-level
# mappings (`post_cascade_followups:`, `legacy_fallback_cleanup:`) without
# separators, which PyYAML strict-mode rejected with
# `expected <block end>, but found '?'`. Adding `---` between the
# three sections makes the file parse-clean for any YAML 1.2 consumer
# while preserving the line-based scanner used by
# scripts/archcheck/main.go::scanYAML (it only inspects lines starting
# with `- id:` and ignores `---`).
#
# Document order (kept identical to the previous single-file ordering):
#   1. Wave sequence (`- id:` items 0, 14, 15, 16, 17, 18, 19).
#      Status transitions: pending → in_progress → done. Each carries
#      verified_zero. This is the ratcheted input to archcheck.
#   2. post_cascade_followups: post-cascade-merge operational tickets
#      (informational only; not part of the ratchet).
#   3. legacy_fallback_cleanup: legacy dual-path removal tracker
#      (completed June 2026).
#
# Consumer guidance:
#   - scripts/archcheck/main.go::scanYAML (custom line-based scanner;
#     text-only, walks wave blocks via strings.HasPrefix(line, "- id:"),
#     silently tolerates `---` markers and indented `- id:` lines).
#   - Optional future Go yaml.v3 consumers MUST use
#     yaml.NewDecoder(input).Decode() in a loop to read ALL documents
#     (yaml.Unmarshal only reads doc[0] and silently drops mappings).
#   - PyYAML / ruamel.yaml consumers should use safe_load_all / load_all.
# -----------------------------------------------------------------------------

