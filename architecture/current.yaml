  # Archcheck entry-point decision (June 2026, Wave 19 PR2 dead-plus-setup):
  # Two archcheck binaries coexist by design — see AGENTS.md
  # "Architecture Map" and the package-level docstrings on both binaries.
  # KEEP_BOTH is the canonical answer (NOT a working-around-Phase-0 hack):
  #   - cmd/archcheck is PERMANENT (target tree shape; never expires).
  #   - scripts/archcheck is TRANSIENT (legacy burndown; rules expire as
  #     they reach verified_zero: true, binary dies with last legacy family).
  # They cover COMPLEMENTARY concerns, NOT overlapping rule families. A
  # forced merge would couple permanent rules with ephemeral burndown
  # logic at huge refactor cost; the deferred_merger_trigger below is
  # the natural endgame when scripts/archcheck reaches end-of-life.
  archcheck_entry_point_decision:
    decision: KEEP_BOTH
    decided_in: "Wave 19 PR2 dead-plus-setup commit (June 2026)"
    binary_a:
      path: cmd/archcheck
      role: target-tree validator
      lifecycle: permanent
      parses: architecture/policy.yaml
      mode: Phase 0 report-only (no --strict enforcement yet)
    binary_b:
      path: scripts/archcheck
      role: legacy burndown ratchet
      lifecycle: transient
      invokes: rg (regex-heavy)
      mode: live CI gate via scripts/ci-architectural-checks.sh
    deferred_merger_trigger: |
      Reopen the merge question when scripts/archcheck reaches
      `verified_zero: true` across all rule families AND the
      application-infrastructure + cross-capability ratchets
      converge to zero — at that point a one-time merge absorbing
