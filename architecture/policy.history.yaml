# PipelineGen — Policy History
# -----------------------------------------------------------------------------
# Human-readable archive of past policy changes. This file is NOT read by
# cmd/archcheck; it exists only to keep the executable policy.yaml free of
# long historical narratives. Git history remains the authoritative archive.

# Package-size cap history ---------------------------------------------------
# Hotspot baseline ratchet history -------------------------------------------
# The executable package_hotspots registry records the committed-tree counts
# after the scripts/jobs capability cutovers. Owners, deadlines and target
# packages are unchanged; this is a measured baseline update, not a global cap
# increase.
package_hotspot_baselines:
  - date: "2026-08-05"
    change: "cmd/admin 106 → 109; internal/app 136 → 137"
    note: "Reconciled registered hotspot baselines with the committed production tree after the capability wiring increments; the global max_files_per_package cap remains 65."
  - date: "2026-08-15"
    change: "cmd/admin 111 → 115; cmd/archcheck/scan 42 → 70; internal/app 139 → 141"
    note: "Reconciled registered hotspot baselines with the working tree after the audio-only cutover and the Qdrant/mediaregistry/identity-audit wiring increments; the global max_files_per_package cap remains 65."
  - date: "2026-08-26"
    change: "stockpipeline 51 → 63; internal/platform/delivery 9 → 12; removed internal/application/images + internal/application/jobs hotspots (roots deleted, already in completed_migrations)"
    note: |
      P0-LEGACY-RATCHET activation: percheck_legacy_hotspot_growth no
      longer filters by legacy-root membership. The registered hotspot
      registry is itself the carry-forward debt surface, so every hotspot
      now ratchets against its committed baseline regardless of the global
      65-file cap (which only caught packages already above 65). This      is the re-baseline that makes the newly active ratchet green: baselines
      are reconciled to the measured committed tree, then growth above them
      fails closed. Completed legacy-root hotspots were dropped rather than
      re-baselined to 0.
  - date: "2026-08-26"
    change: "internal/kernel/asset 71 → 39; new hotspot internal/kernel/asset/detail registered at 34"
    note: |
      kernel/asset hard cutover (P0 meta-package reduction, ≤40 files per
      package): leaf domains (texttrack, render, image, clip, search,
      store, taxonomy, source-catalog, artifact-stages) extracted into the
      new internal/kernel/asset/detail package. Core keeps the Asset
      model + state machine at 39 files; detail registered at 34 so the
      ratchet tracks its growth from day one. 312 external importers were
      retargeted asset.X → detail.X during the cutover.
  - date: "2026-08-26"
    change: "stockpipeline 63 → 50; new hotspot stockpipeline/support registered at 13"
    note: |
      stockpipeline split toward the original 51-file baseline (deadline
      2026-09-30): the 52-file mutual-recursion cluster (planner,
      orchestrator, steps, render, service, stager) stays in core, which
      lands at 50 production files — under the 51 baseline. The
      query/run/rounds/ports/errors/process/production/render-transitions
      surface (13 files) was extracted to the sibling
      internal/capabilities/assets/providers/stock/stockpipeline/support
      package and registered so the ratchet tracks its growth from day
      one. stock_test_helpers.go (test-only helpers misnamed as
      production) was renamed to the _test.go surface, removing it from
      the production count. The remaining 50-file core is the irreducible
      SCC: reaching below ~44 without breaking type cycles would require
      a semantic refactor of the interlocking step/orchestrator types.

max_files_per_package:
  current: 65
  history:
    - date: "2026-07-15"
      change: "40 → 65"
      note: "initial raise during SQLite consolidation"
    - date: "2026-07-22"
      intended: "65 → 70"
      note: |
        The comment in policy.yaml claimed this raise happened, but the
        executable value remained 65. The discrepancy has been corrected
        by keeping the cap at 65 and recording the intended raise here.
        internal/platform/sqlite/assets reached 69 files
        while absorbing the canonical asset committer / outbox / clips /
        catalog / artifacts / delivery / maintenance / voiceover /
        visual-summary surfaces. The package is the SQLite persistence
        consolidation point; splitting it now would fracture transactional
        cohesion. The cap will be revisited once the QDRANT-002 / asset-
        committer consolidation wave settles.
    - date: "2026-08-26"
      change: "canonicalized (no value change — P0-POLICY-CANONICAL)"
      note: |
        policy.yaml prose previously described a "40/65 regime" and
        claimed both numbers were canonical, while only 65 was (and
        remains) the executable value read by scan.ScanPackages.
        Resolved: 65 is THE single executable hard ceiling; 40 is a
        documented soft target for well-factored normal packages, not a
        second enforced threshold. Stale cross-references to
        ::max_files_per_package=40 in ownership/application.yaml,
        ownership.generated.yaml and the 41_divider CI gate comment were
        aligned to =65.

# File-size cap history ------------------------------------------------------
max_lines_per_file:
  current: 1000
  history:
    - date: "2026-07-11"
      change: "500 → 1000"
      note: |
        The script.generate pipeline introduced 6 cohesive feature files
        that manage hard transactional/cue boundaries which cannot be safely
        split, including clip_atomic_writer.go (922 lines) and
        text_track_resolver.go (750 lines). The raise absorbed 16 existing
        file-size violations. Any file exceeding 1000 lines is still a
        violation and a strong signal for a real split. Per AGENTS.md,
        splitting remains preferred for any new file that approaches
        1000 lines.

# Debt-budget history --------------------------------------------------------
debt_budget:
  current:
    max_pre_existing_open: 9
    statuses_counted: ["open", "in_progress"]
  history:
    - date: "2026-07-13"
      change: "5 → 9"
      owner: "PipelineGen Agent (qdrant-hygiene + docs-arch waves)"
      deadline: "2026-11-30"
      note: |
        Raised to accommodate the operator's "novembre" sub-commit wave:
        PRE-EXISTING-15-LENS-MIGRATION and PRE-EXISTING-16-DOCS-MISSING.
        The previous policy deliberately excluded `in_progress` from the
        counter, allowing a status flip to unblock CI without a fix. That
        bypass has been closed: `in_progress` now counts the same as `open`
        and requires owner_capability and evidence_filename.

# Layout-cutover history -----------------------------------------------------
target_internal_roots:
  current: {chosen-as-canonical: "2026-07-25", legacy_roots: migration-only}
  history:
    - date: "2026-07-25"
      change: "target_internal_roots remains THE canonical layout; legacy roots are migration-only"
      note: |
        PipelineGen carried a two-layout mode (legacy_internal_roots +
        target_internal_roots) that accumulated transitional layers,
        allowlists, and ratchets. The legacy zone list (api, app,
        application, domain, infrastructure, transcription, youtube)
        accumulated because no single direction had policy cover. This commit
        establishes target_internal_roots as THE canonical layout
        per godlike/07 ZERO_LEGACY_POLICY §"Default rule". The legacy zones
        remain on disk only as migration-only surfaces; they are not a second
        supported architecture and must not receive new capabilities,
        contracts, providers, routes, files, or packages. The
        stock-legacy-keyword allowlist (docs/migrations/) survives this
        commit ONLY as a forward-pointer tombstone for the 4 still-
        retirement-pending files (service.go, run.go, usecase.go,
        ../adapter.go) — NO NEW entries per ZERO_LEGACY_POLICY §"Default
        rule". The stockpipeline package itself is NOT retired in this
        commit; the 5-subzone structural split is the next commit
        (PR-STOCKPIPELINE-PHASE-SPLIT forward-pointer).

# Strict-file-line cap history -----------------------------------------------
# Forward-prevention gate introduced alongside the legacy hard-cap gate.
# Walks the same surface (internal/ + cmd/) but at a stricter 600-LOC soft
# threshold so files reach the "please split" signal before crossing the
# 1000-LOC hard ceiling. Allowlisted via docs/migrations/max-lines-strict-
# allowlist.txt (the canonical escape hatch per godlike/07 §"Temporary
# deprecation record"). Initial population = 15 files >600 LOC from the
# JSON baseline (cmd/admin/qdrant_readiness.go 1466 down to
# internal/app/assets_register_sourcing.go 607); whole-block deadline
# 2026-09-15 (Wave-23 cleanup cadence).
max_lines_per_file_strict:
  current: 600
  history:
    - date: "2026-07-27"
      change: "introduced"
      note: |
        New soft-warning guardrail introduced July 2026 per godlike/08
        §"Mandatory checks" forward-prevention gate. Distinct from the
        legacy max_lines_per_file=1000 hard cap: the 600-LOC threshold
        fires BEFORE files cross the 1000 hard line, giving operators a
        400-LOC safety margin to split cohesively. Initial population =
        15 .go files >600 LOC documented in
        docs/migrations/max-lines-strict-allowlist.txt with per-entry
        owner + 2026-09-15 deadline annotations. Promotion to a hard
        gate (i.e. `max_lines_per_file_strict` added to architecture/
        policy.yaml::hard_gates) is a separate, future PR — Phase 0
        default is `warn` severity (report-only).
    - date: "2026-07-27"
      change: "promoted from soft-warning to hard gate (Wave-24)"
      note: |
        Wave-24 promotion: `max_lines_per_file_strict` added to
        architecture/policy.yaml::hard_gates so violations exit
        ExitViolations unconditionally (mirrors cmd/archcheck/runner.go
        hard-gate escalation logic — every violation whose Rule
        matches is severity-escalated to SeverityError and the exit
        decision is widened to `hasHardGate || (strict && len>0)`).
        The cap value remains 600 LOC; the legacy max_lines_per_file=
        1000 hard ceiling is unaffected.

        Three newly-discovered offenders ship in the allowlist under
        the Wave-24 Bucket 5 header with a TIGHTER 2026-08-15 deadline
        (vs. the 2026-09-15 baseline) so the next wave MUST split them:
          - internal/capabilities/assets/providers/stock/stockpipeline/
            stager_adapter.go (714 LOC; @stock-pipeline-team)
          - internal/capabilities/assets/providers/stock/stockpipeline/
            step_extract_clips.go (634 LOC; @stock-pipeline-team)
          - internal/application/mediamemory/linker_worker.go
            (680 LOC; @mediamemory-team)

        NO new grandfathered entries are intended beyond these 3 —
        every future PR must split cohesively BEFORE crossing the
        600-LOC mark or surface as a hard CI build failure on push.
        Per godlike/07 NO-FAKE-AVAILABILITY, the allowlist is the
        canonical escape hatch with explicit owner + deadline +
        removal_trigger per entry (godlike/08 zero-baseline rule);
        removing an entry is always safe (the file will now fail-
        closed at the strict cap, surfacing the regression to the
        assigned workstream).
