      gate that prevented CLI consumers from reaching the typed-port
      service while the cutover window was open; Step 9 B-3 deleted
      both the seam AND any 410 stub references in parallel.

      Cross-refs (chain of closures):
        - godlike/06 §"One owner per fact" : *voiceover.Service is the
          canonical owner of the voiceover generation fact; this entry
          mirrors that ownership boundary by deleting the seam that
          used to bridge the typed-port surface with the scriptflow
          adapter layer.
        - godlike/07 §"No fake availability" : the Step 9 deletion
          was a code removal event (not a "we'll handle it later"
          entry); the seam literally no longer compiles.
        - godlike/07 §"Migration sequence" : zero pre-removal callers
          + canonical replacement exists → direct CONTRACT jump from
          EXPAND/BACKFILL/CUTOVER was valid. This deprecation record
          is the audit-footprint of that jump.

      Cross-record delineation (sibling voiceover deprecations that overlap
      with this entry — read each independently, do NOT collapse):

        - PR-VO-C1 (record #14 above): /api/voiceover/generate-with-group
          HTTP-ROUTE deprecation. 90-day Sunset window until 2026-09-26.
          Status: in_progress. Covers the Handler.GenerateWithGroup +
          RegisterRoutes entry at internal/api/assets/voiceover/handler.go.
          Distinct surface from THIS record (which covers the Go-adapter
          seam, NOT an HTTP route).

        - PR-VOICEOVER-TYPED-PORT-RECOVERY-PHASE2 (architecture/current.yaml
          #id-26 follow_up_tickets): WAVE-PROGRESS tracker entry recording
          the B-2 BACKFILL → B-3 CUTOVER → B-4 CONTRACT sequence of the
          voiceover typed-port recovery. This deprecation record is the
          godlike/07 schema companion — godlike/07 owns deprecation-records,
          wave-tracker owns wave-progress; the two are complementary, not
          redundant (per AGENTS.md §Documentation Map).

        - PR-VOICEOVER-RECOVERY (architecture/current.yaml #id-26
          follow_up_tickets, sibling): V1..V7 typed-port chain (deadline
          2026-07-10). Different scope — the V-chain is the deep typed-port
