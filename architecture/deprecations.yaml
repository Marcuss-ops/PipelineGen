          line: 150
          quote: "type AssetMutationDispatcher interface {"
          role: "canonical interface type declaration"
        - file: internal/infrastructure/database/sqlite/outbox/repository.go
          line: 760
          quote: "var _ mutations.AssetMutationDispatcher = (*Dispatcher)(nil)"
          role: "compile-time assertion at the outbox concrete site"


