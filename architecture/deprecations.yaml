    introduction_date: 2026-04
    removal_date: 2026-06-26  # this PR
    tracking_issue: "QDRANT-asset-mutation isolation (Wave 22 task 5 / PR-CLIP-RAW-MUTATIONS, June 2026)"
    compatibility_test: |
      Three layers of defence are simultaneously enforced:
        (a) `rg 'Restore\(|HardDelete\(|HardDeleteClip\(' internal/application internal/api`
            returns zero hits — the methods were removed from the canonical
            *assets.ClipsRepository receiver, so any direct caller that lands
            here is a go test build failure.
        (b) `internal/application/assets/mutations/primitives.go`
            `AssetMutationPrimitives` interface carries only UpsertClip;
            Restore and HardDelete were dropped from the interface so any
            assertion against the 3-method supertype (a signature drift
            scenario) fails to compile.
        (c) `scripts/ci-architectural-checks.sh` Check 5 rg-gates the
            production caller patterns (`\bUpsertClip\(`,
            `(^|[\s.(])r\.Restore\(`, `(^|[\s.(])r\.HardDelete\(`,
            alias-attribute forms `\br\.repo\.UpsertClip\(`,
            `\br\.clips\.UpsertClip\(`).
