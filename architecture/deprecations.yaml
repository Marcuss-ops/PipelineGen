# PipelineGen — Deprecation Manifest (Wave 16 PR1)
# -----------------------------------------------------------------------------
# Canonical deprecation registry, per docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md.
# Each record MUST carry: id, owner_capability, exact_symbol, file:line,
# replacement, introduction_date, removal_date, tracking_issue, compatibility_test,
# usage_metric, status, notes.
#
# Phase-2 CI enforcement (per godlike/07 §"An expired deprecation fails CI"):
# scripts/archcheck/main.go::runFocusedChecks will scan this file and FAIL
# the gate on any record whose removal_date is in the past AND whose status
# is NOT yet "removed". Records with status="removed" are audit-only.
#
# Records in this PR (Wave 16 PR1, June 2026):
#   1. PR-CLIP-RESTORE          — clips_repository.go RestoreClip alias
#   2. PR-JOB-STATUS-DEFENSIVE  — jobs_checker.go LOWER(status) defensive fold
#   3. PR-QDRANT-PAYLOAD-STATUS — qdrant/payload_mapper.go legacy "status" key
#   4. PR-QDRANT-CFG-URL        — qdrant/types.go Config.URL field alias
#   5. PR-INDEXST-LEGACY-ALPHABET — domain/asset/index_state.go legacyState* constants
#   6. PR-YT-SEARCHTOPICS       — youtube_handlers.go SearchTopics unrouted method
#   7. PR-YT-TYPES-TOPIC        — youtube/types/types.go TopicSearchRequest canonical relocation
#
# Each record below cites the Phase 1..4 migration status per godlike/07 §"Migration sequence":
#   EXPAND (introduce new canonical structure)
#   BACKFILL (migrate durable state)
#   CUTOVER (switch all callers/routes/writers)
#   CONTRACT (remove old code/data/tests/docs/allowlists)
# -----------------------------------------------------------------------------

deprecations:

  # ────────────────────────────────────────────────────────────────────────
  # 1. PR-CLIP-RESTORE — alias method removed from sqlite/assets repository
  # ────────────────────────────────────────────────────────────────────────
  - id: PR-CLIP-RESTORE
    owner_capability: internal/infrastructure/database/sqlite/assets
    exact_symbol: "*ClipsRepository.RestoreClip"
    file: internal/infrastructure/database/sqlite/assets/clips_repository.go
    file_line: 365
    replacement: "*ClipsRepository.Restore(ctx, id)"
    introduction_date: 2026-04
    removal_date: 2026-06-26
    tracking_issue: QDRANT-002 followup (no external tracking number; resolved at CONTRACT)
    compatibility_test: |
      clips_repository_test.go references only `Restore`; the
      ripgrep gate `rg 'RestoreClip' internal/` returns zero hits
      outside the deprecation comment itself (the line above the
      removed method).
    usage_metric: |
      0 internal callers (rg RestoreClip internal/ → 1 hit, which
      is the deprecation comment line citing this manifest entry).
      Pre-removal: 1 alias wrapper, 1 forward to Restore.
    migration_phase: CONTRACT
    status: removed
    notes: |
      RestoreClip was a one-line method on *ClipsRepository that
      forwarded to Restore. Removed inline (comment-only fossil
      remains at the original method position, per godlike/07
      §"Historical information" → Git history is the canonical
      record; this manifest is the index, not the narration).
      No callers were ever migrated because nobody wrote against
      the spelled-out alias — Restore was always the canonical name.

  # ────────────────────────────────────────────────────────────────────────
  # 2. PR-JOB-STATUS-DEFENSIVE — LOWER(status) fold migrates away after data normalisation
  # ────────────────────────────────────────────────────────────────────────
  - id: PR-JOB-STATUS-DEFENSIVE
    owner_capability: internal/infrastructure/health
    exact_symbol: 'jobs_checker.go::livenessQuery LOWER(status) IN (''running'', ''leased'', ''pending'')'
    file: internal/infrastructure/health/jobs_checker.go
    file_line: 78
    replacement: 'livenessQuery no LOWER() fold; rely on canonical migration 066/070 uppercase job statuses (PENDING|LEASED|RUNNING|SUCCEEDED|FAILED|CANCELLED)'
    introduction_date: 2026-04
    removal_date: 2026-Q3  # gated on PR-JOB-STATUS-UPPERCASE-MIGRATION (TBD)
    tracking_issue: "PR-JOB-STATUS-UPPERCASE-MIGRATION (data migration owner: internal/infrastructure/database/sqlite/jobs)"
    compatibility_test: |
      After the data migration pass writes all jobs.status as UPPERCASE,
      remove the LOWER() fold in livenessQuery and re-run
      `go test ./internal/infrastructure/health/... -short` + the
      integration probe that confirms the runner heartbeat path
      is alive.
    usage_metric: |
      Until the data migration ships, zero usages of
      `'running'|'failed'|'completed'` legacy literals
      remain in application code; the SQL fold is the only
      defensive read. Migration ticket must include a pre-flight
      `SELECT COUNT(*) FROM jobs WHERE LOWER(status) IN ('running','failed','completed')`
      and confirm the count is zero post-migration before the
      fold can be removed.
    migration_phase: BACKFILL  # in-flight; CUTOVER blocked on data migration, CONTRACT blocked on CUTOVER
    status: in_progress
    notes: |
      Per godlike/07 §"Forbidden compatibility techniques" the
      "hidden fallback branches selected on errors" rule does
      NOT directly apply (this is a defensive READ, not a
      fallback). However, this deprecation records the rule
      that the dual-casing state must be eliminated by the
      BACKFILL phase + a follow-up data migration, not via
      permanent SQL defensive logic. The migration ticket
      PR-JOB-STATUS-UPPERCASE-MIGRATION will own this.

  # ────────────────────────────────────────────────────────────────────────
  # 3. PR-QDRANT-PAYLOAD-STATUS — payload "status" key replaced by "lifecycle_state"
  # ────────────────────────────────────────────────────────────────────────
  - id: PR-QDRANT-PAYLOAD-STATUS
    owner_capability: internal/infrastructure/qdrant
    exact_symbol: 'BuildPayload() legacy "status" payload key'
    file: internal/infrastructure/qdrant/payload_mapper.go
    file_line: 165
    replacement: 'BuildPayload() canonical "lifecycle_state" key (SSOT with media_assets.lifecycle_state)'
    introduction_date: pre-QDRANT-004
    removal_date: 2026-06-26  # writer-side removal happened in QDRANT-004 PR2
    tracking_issue: QDRANT-005B (PR-history; reconciler drives the cleanup of legacy points)
    compatibility_test: |
      payload_mapper_test.go asserts the writer never emits a
      "status" key (line ~42 — `if _, leaked := payload[\"status\"]`).
      reader-side search_adapter.go and clip_search_adapter.go
      stop reading the legacy key as of QDRANT-004 closure.
    usage_metric: |
      0 new writes emit "status" (BuildPayload has not written
      it since pre-PR6). Legacy historical points carrying the
      "status" key are an estimated <1% of total points and
      are migrated by QDRANT-005B's Reconciler (point-level
      payload strip via DeletePayloadKeys on CLASSIFIED_LIFECYCLE_KEY_LEGACY).
      Metric: `qdrant_reconciler_classifications_total{kind="lifecycle_key_legacy"}`.
    migration_phase: CUTOVER  # writer/reader/manifest migrated; historical points migrate via QDRANT-005B
    status: removed
    notes: |
      This case is unusual per godlike/07 §"Migration sequence":
      the canonical update (writer + reader + manifest) shipped
      in QDRANT-004 PR2 (June 2026), but historical points
      carrying both keys still exist in production. The
      QDRANT-005B reconciler's classification
      LifecycleKeyLegacy (= payload has "status" key) drives
      the migration; once that counter trends to zero at low
      observation (operator-runbook per architecture/current.yaml
      Wave 16 status_note), the CONTRACT phase is complete.

  # ────────────────────────────────────────────────────────────────────────
  # 4. PR-QDRANT-CFG-URL — Config.URL field replaced by Config.BaseURL
  # ────────────────────────────────────────────────────────────────────────
  - id: PR-QDRANT-CFG-URL
    owner_capability: internal/infrastructure/qdrant
