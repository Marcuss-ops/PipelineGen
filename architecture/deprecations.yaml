  # ── 0. PR-VOICEOVER-PRODUCESARTIFACTS-PATH-A — Path A design EXPLICITLY REJECTED at db2f3b1e (2026-07-04) ──
  # The original diagnosis (raised on 2026-06, prior to the chosen db2f3b1e
  # fix) proposed Path A: keep ProducesArtifacts=false on the parent
  # (TypeVoiceoverGenerate) but flip ProducesArtifacts=true on the per-language
  # child (TypeVoiceoverGenerateItem) and have the broker fork to
  # `CompleteWithArtifacts` when the child terminates. Path A was EXPLICITLY
  # REJECTED in favor of Path B (commit db2f3b1e, 2026-07-04). This record
  # locks the rejection so a future agent proposing to "fix" the design by
  # re-introducing Path A must surface the 3 reasons below + open an
  # architecture/current.yaml#PR-VOICEOVER-PATH-A-REVISITED ticket before
  # reverting.
  # ─────────────────────────────────────────────────────────────────
  - id: PR-VOICEOVER-PRODUCESARTIFACTS-PATH-A
    owner_capability: internal/application/voiceover
    exact_symbol: |
      The Path A design (REJECTED — never shipped):
        - TypeVoiceoverGenerate (parent) : ProducesArtifacts = false
        - TypeVoiceoverGenerateItem (child) : ProducesArtifacts = true
        - broker-side fork: when child terminates, the broker routes
          its Complete call through CompleteWithArtifacts (the typed
          artifact-emitter spine) instead of the legacy Complete.
    file: internal/application/jobs/registry.go
    file_line: |
      registry.go:541 (TypeVoiceoverGenerate, post-fix ProducesArtifacts=false)
      + :548 (TypeVoiceoverGenerateItem, post-fix ProducesArtifacts=false).
      Path A's would-be flip is the symmetric opposite: :541 stays false,
      :548 becomes true, with a new broker-side dispatch branch in
      worker_execution.go routing child completion through
      CompleteWithArtifacts.
    replacement: |
      Path B (CHOSEN, shipped at commit db2f3b1e, 2026-07-04):
        - BOTH TypeVoiceoverGenerate (parent) AND TypeVoiceoverGenerateItem
          (child) declared with ProducesArtifacts = false.
        - voiceover.finalizer is the canonical SOLE owner of media_assets
          projection + outbox events writes (Steps 4 + 5 + 6 of Finalize
          in a single caller-owned *sql.Tx).
        - The broker re-routes mark-SUCCEEDED through the legacy
          SQLiteStore.Complete path (no CompleteWithArtifacts).
        - godlike/06 SSOT: ONE canonical owner per fact (finalizer for
          artifacts, broker for mark-SUCCEEDED) — no double-write race.
    introduction_date: 2026-06
    removal_date: never
    migration_phase: not applicable
    status: keep
    tracking_issue: |
      PR-VO-COMPLETEPATH-FIX (the chosen Path B closure —
      architecture/current.yaml#PR-VO-COMPLETEPATH-FIX, status: done,
      ship_sha: db2f3b1e, ship_date: 2026-07-04). Forward-pointer for any
      future "let's revisit Path A" proposal: PR-VOICEOVER-PATH-A-REVISITED
      (deadline TBD, requires explicit architecture/current.yaml wave-tracker
      entry + 3-reason rebuttal before revert is permitted).
    compatibility_test: |
      4 TDD regression tests in internal/application/voiceover/jobs/
      finalizer_invariants_test.go (commit e71d10ad, 2026-07-04):
        (a) TestVoiceoverGenerate_RoutesToLegacyComplete (L95) — registry
            contract pins ProducesArtifacts=false on parent.
        (b) TestVoiceoverGenerateItem_RoutesToLegacyComplete (L134) — same
            for child + Concurrency=4 per-language sibling throttle.
        (c) TestVoiceoverFinalizer_PersistsMediaAssetsInSameTxn (L348) —
            tx-pointer identity + rollback trick proves atomicity of
            (voiceovers + media_assets projection + outbox) in the SAME
            caller-owned *sql.Tx. 3 marker assertions: `voiceover_record`
            literal + `voiceover_index` event JSON tag + `voiceover_cleanup`
            event JSON tag.
        (d) TestParentAggregator_TriggeredOnlyAfterWaitingChildren (L474) —
            parent_aggregator eligibility gate (3 sub-cases:
            waiting_children → process / succeeded → no-op /
            cancelled → no-op).
      Any revert to Path A breaks tests (a)+(b) at the registry-contract
      level. This record is the canonical "why" anchor surfaced to the
      next agent encountering the FAIL.
    usage_metric: |
      Post-fix canonical state (verified on origin/main @ 564780aa,
      2026-07-04):
        - rg 'ProducesArtifacts:\s*true' internal/application/jobs/registry.go
          | grep -E 'voiceover\.(generate|generate_item)' : 0 hits.
        - rg 'CompleteWithArtifacts' internal/application/voiceover/
          : 0 hits (Path B eliminated the call site).
        - rg 'job_complete_with_artifacts' internal/application/voiceover/
          : 0 hits.
        - rg 'voiceover\.generate' internal/application/jobs/registry.go
          : 2 hits (both with ProducesArtifacts=false post-fix).
      Forward-prevention: re-introduction of Path A flips tests (a)+(b)
      to FAIL; this record is the canonical "why" anchor surfaced to the
      next agent encountering the FAIL.
    notes: |
      3 reasons Path A was EXPLICITLY REJECTED at db2f3b1e (2026-07-04):

      1. godlike/06 SSOT "one canonical owner per fact" violation:
         Path A would have BOTH the broker (via CompleteWithArtifacts)
         AND the voiceover.finalizer (via its own media_assets UPSERT)
         writing to the same `media_assets` row inside the per-item
         transaction. The two writes are not coordinated; the broker's
         UPSERT would clobber the finalizer's in-flight row (or vice
         versa, depending on commit order). The race is real because
         the broker's CompleteWithArtifacts path and the finalizer's
         Step 4 (UpsertVoiceoverProjectionTx) are both in the per-item
         *sql.Tx; serializability gives the wrong writer the row.

      2. godlike/07 "no fake availability" + fail-fast-at-boot
         violation: Path A's "broker forks to CompleteWithArtifacts when
         child terminates" creates a side-channel that the SQL-layer
         guard at internal/infrastructure/database/sqlite/jobs/
         repository_lifecycle.go:115 (which rejects legacy Complete for
         ProducesArtifacts=true job types) does NOT model. The guard is
         binary: legacy Complete works for ProducesArtifacts=false jobs
         and rejects for true jobs. Path A's fork would require the
         guard to learn about the fork, adding a 3rd code path
         (forked-Complete for artifact-producing children) — silent-
         success surface for partial failures (e.g., fork succeeds but
         finalizer fails: which one wins? what about double-emission?).
         The godlike/07 contract is: NO side-channels, NO silent-success.
         Path B's surface is binary (legacy Complete only) and the
         SQL-layer guard is the single source of truth.

      3. godlike/07 "fail-fast-at-boot vs fail-slow-at-first-/run":
         Path A's bug surfaces at first /run invocation (the broker
         fork mis-routes and the SQL-layer guard catches it at runtime,
         marking the job FAILED with "legacy Worker cannot complete
         artifact-producing job"). Path B's invariant is enforced at
         REGISTRATION time (a single boolean flip in registry.go
         becomes a build-visible test failure on the registry contract).
         Boot-time catches drift; runtime only catches invocation drift.
         The 4 TDD tests pin the boot-time surface.

      Cross-references (godlike/06 3-surface lockstep):
        - AGENTS.md Recent cross-cutting closures (June 2026) —
          PR-VO-COMPLETEPATH-FIX entry (L1095).
        - CHANGELOG.md ## Unreleased → ### Fixed — first bullet
          referencing commit db2f3b1e.
        - architecture/current.yaml#PR-VO-COMPLETEPATH-FIX — wave-tracker
          entry with linked_issues[db2f3b1e + e71d10ad +
          PR-VO-ASSET-LOCATIONS-CONSUMER-AUDIT].
        - 4 TDD regression tests in
          internal/application/voiceover/jobs/finalizer_invariants_test.go
          (commit e71d10ad, 2026-07-04).

      Forward-pointer (godlike/06 SSOT): if a future agent proposes to
      revert to Path A, they MUST open
      architecture/current.yaml#PR-VOICEOVER-PATH-A-REVISITED (deadline TBD)
      with a 3-reason rebuttal addressing each of the 3 reasons above.
      The 4 TDD tests (a)+(b)+(c)+(d) are the load-bearing seam — any
      revert breaks them.

