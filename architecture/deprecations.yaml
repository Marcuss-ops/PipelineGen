# ── Open Questions (read-write; voting-enabled; deferred naming/scope decisions) ──
# Per AGENTS.md §8 zero-baseline rule, "open questions" carry owner + deadline + team-vote
# outcome. Each entry cites evidence (file:line + comment quote) so future agents
# can audit why the question was deferred and what canonical surface is in scope.
# Open questions do NOT block CI; they record the team's decision-making intent so
# the Wave 24 PR 4+ roadmap can reason about the upstream constraints.
open_questions:

  # ── 1. OPEN-W24-BLOCK1-NAMING-DECISION ────────────────────────────────────
  # The naming of the canonical AssetMutation interface is open for team vote:
  #   * "Dispatcher" reflects event-driven semantics matching the outbox.Dispatcher
  #     family, but is more specific than a generic Service noun.
  #   * "Service" is idiomatic Go but loses the semantic distinction from outbox
  #     and would cost a 99-file:line rename if used.
  # The decision lives here for one cycle (deadline 2026-07-15); the team votes
  # via PR-W24-BLOCK1-NAMING-DECISION ticket close.
  - id: OPEN-W24-BLOCK1-NAMING-DECISION
    title: "AssetMutationDispatcher vs AssetMutationService"
    introduced: 2026-06-28
    tracker_ref: "architecture/current.yaml#id-24 follow_up_tickets.PR-W24-BLOCK1-NAMING-DECISION"
    teammate_ref: "scripts/ci-bypass-audit.sh + scripts/ci-architectural-checks.sh (both reference `mutations.AssetMutationDispatcher` in canonical-SSOT language)"
    deadline: 2026-07-15
    status: open (team vote pending)

    evidence_dispatcher_currently_shipped:
      - "(1) 99 hits across internal/ + cmd/ for AssetMutationDispatcher (canonical, currently shipped); 0 hits for AssetMutationService"
      - "(2) Matches outbox.Dispatcher naming family: outbox.Dispatcher.EnqueueAndDelete, outbox.Dispatcher.EnqueueAndIndex, outbox.Dispatcher.EnqueueAndRestore (the canonical sibling pattern)"
      - "(3) Reflects event-driven semantics: dispatcher routes envelope to outbox event queue, NOT to a generic service entry point"
      - "(4) Compile-time assertion documented at internal/infrastructure/database/sqlite/outbox/repository.go:760 — `var _ mutations.AssetMutationDispatcher = (*Dispatcher)(nil)` — the outbox concrete IS the dispatcher (no fake availability per godlike/07)"

    evidence_service_alternative:
      - "(1) Idiomatic Go convention; 'Service' noun widely used across the codebase (scriptcore.Engine, clips.ReprocessUseCase, etc.)"
      - "(2) Less cognitive load for new contributors reading the codebase for the first time"
      - "(3) Future flexibility for non-event-driven compositions (e.g. read-most, sync validation flows)"
      - "(4) Symmetric with package patterns like pkg/apiutil, pkg/handlerutil, pkg/sqlutil"

    rationale_dispatcher_keep:
      title: "Recommendation: keep AssetMutationDispatcher"
      pros:
        - "Matches outbox family semantics (event-driven); explicit about WHAT the canonical surface routes"
        - "Distinguishes from sync Service patterns elsewhere in the codebase — naming aids grep-navigate"
        - "Zero current friction: 99 hits = broad acceptance already; all consumers have adapted"
        - "Compile-time assertion at the outbox concrete site IS the dispatcher; semantically true"
      cons:
        - "More specific semantics may limit future non-event-driven compositions if such compositions emerge"
        - "New contributors must learn the dispatcher convention (small but real cognitive load)"

    rationale_service_rename:
      title: "Alternative: rename to AssetMutationService"
      pros:
        - "Idiomatic Go naming — fewer cognitive load for new contributors"
        - "Future flexibility for non-event-composed flows (read-most, async-light, sync preflight)"
        - "Symmetric with the broader `Service` noun pattern in pkg/<utility>/"
      cons:
        - "99 → 0 hits migration churn: 99 file:line edits across internal/ + cmd/" 
        - "Renames affect Check 7 (ci-bypass-audit.sh) and Check 5 (ci-architectural-checks.sh) backward-compat surface"
        - "Loses semantic distinction from outbox side: Dispatcher family becomes Service family — harder to grep for what is and isn't outbox-routed"
        - "Zero functional value (semantics are equivalent; the change is purely aesthetic)"

    decision_criteria: |
      (a) If the team favours semantic precision + minimal churn, keep Dispatcher.
      (b) If the team favours idempotent future flexibility + broader convention fit, rename to Service.
      Decision recorded by PR-W24-BLOCK1-NAMING-DECISION ticket close:
      the team's vote + rationale is appended to this section's `team_decision` field.

    team_decision: pending
    vote_record:
      dispatcher_keep_votes: []
      service_rename_votes: []
    closing_blocker: "vote ties → defer until next wave tracker entry; cost-asymmetry is the deciding factor"

    # Sibling evidence (canonical interface name declaration site):
    canonical_evidence:
      file: internal/application/assets/mutations/dispatcher.go
      line: 1
      quote: "// Package mutations — AssetMutationDispatcher canonical interface."
      role: "the canonical interface name lives at this single site; renaming touches this line + 98 callers"
      secondary_evidence:
        - file: internal/application/assets/mutations/dispatcher.go
          line: 150
          quote: "type AssetMutationDispatcher interface {"
          role: "canonical interface type declaration"
        - file: internal/infrastructure/database/sqlite/outbox/repository.go
          line: 760
          quote: "var _ mutations.AssetMutationDispatcher = (*Dispatcher)(nil)"
          role: "compile-time assertion at the outbox concrete site"


