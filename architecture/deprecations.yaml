    migration_phase: CONTRACT
    status: removed
    notes: |
      Removal was bundled with QDRANT-001's V3 manifest migration
      (June 2026). The orphan-fields list in the Config doc
      block IS the canonical deprecation record for the cluster
      (URL + 14 other V2-era fields). This manifest entry picks
