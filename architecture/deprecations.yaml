      CUTOVER → CONTRACT collapses over the natural migration
      window; the umbrella ID carries the audit-footprint for the
      full chain.
    migration_phase: EXPAND
    status: in_progress
    notes: |
      Three legacy port stragglers are GO-TYPE-ALIASED to the
      canonical Fase 9 SSOT in internal/application/translation/legacy.go.
      Go 1.9+ type aliases on interfaces are structurally
      transparent — the alias and the canonical declaration
      share identical method sets, so existing compile-time
      assertions like `var _ MetadataTranslator = (*mockTranslatorFailingTranslate)(nil)`
      compile unchanged because Mock satisfies both identically.

      The OllamaTranslator concrete satisfies all 4 ports by
      implementing 4 method bodies internally (3 thin delegations
      to gen.TranslateTextWithModel on the legacy port + 1 DTO-in/
      DTO-out translation method on the canonical port). This
      ONE-concrete design is the godlike/06 "one owner per fact"
      pattern at the translation boundary — no two adapters
      implement overlapping translation logic.

      Why a single umbrella ID rather than 3 split IDs:
        - All 3 legacy ports share the same OllamaTranslator concrete.
        - All 3 are declared as type aliases in the same commit.
        - All 3 reach the same CUTOVER-phase trigger gate
          (zero pre-removal callers of the legacy methods).
        - Splitting into 3 IDs would triple the audit-footprint
          without adding information; the umbrella ID keeps the
          manifest scan-readable.

