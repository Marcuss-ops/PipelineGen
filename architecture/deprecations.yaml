        - `repo.Restore(`           — 0 production callers
                                       (admin path was routed through
                                        InternalAdminPurge already).
        - `repo.HardDelete(`        — 0 production callers.
        - `repo.HardDeleteClip(`    — 0 production callers
                                       (admin internal alias only).
      Post-removal audit commands (mandatory before this PR merges):
        - `rg 'Restore\(|HardDelete\(|HardDeleteClip\(' internal/application internal/api` → 0
        - `rg '^func \(r \*ClipsRepository\) (Restore|HardDelete|HardDeleteClip)' internal/infrastructure/database/sqlite/assets/clips_repository.go` → 0
        - `rg '^[^/]*\.HardDeleteClip\(|^[^/]*\.RestoreClip\(' internal/` → 0
