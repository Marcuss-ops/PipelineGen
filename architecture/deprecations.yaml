    migration_phase: CONTRACT  # no callers in production; direct CONTRACT per godlike/07 §"Migration sequence"
    status: removed
    notes: |
      This is the only method-removal entry in the manifest whose
      replacement lives in a NEW PACKAGE (the tx-scoped unexported
      restriction). The package doc
      (`internal/infrastructure/database/sqlite/assets/txmutation/primitives.go`)
