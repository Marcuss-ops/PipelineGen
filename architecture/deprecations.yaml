    migration_phase: not applicable  # this is anti-corruption documentation
    status: keep
    notes: |
      Intentional non-removal: per godlike/07 §"No fake
      availability" + §"Forbidden compatibility techniques",
      Valid() must explicitly reject pre-migration values.
      Removing the constants would lose the named reference
      target. CI gate does NOT flag never-removal entries;
      this record is the explicit `keep` annotation.

