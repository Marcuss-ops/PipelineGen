      fragile: it catches signature drift but NOT field-copy drift in the
      manual `VerifierAdapter.VerifyReindex` field-by-field copy. A future
      maintainer who adds a field to one struct without updating the
      other will get a silent zero at runtime. The collapse resolves this
      fragility by reducing the bridge to either a passthrough or zero
      statements — there is no field copy to maintain.

      Recommended collapse target: Option B (per-shape WireShape + CanonicalShape siblings
      in ONE types package) per the JSON-tag leakage analysis in
      `docs/operations/06-qdrant-wire-mirror-review.md` §"JSON-tag leakage" — Option A
      (single struct) violates godlike/07 §"No fake availability" by inheriting wire-shape
      concerns into the application domain. Option B preserves separation of concerns while
      breaking the cycle. Option C (status quo wire-mirror) remains the fallback if the
      EXPAND + BACKFILL + CUTOVER + CONTRACT smoke test signals JSON-tag leakage as a
      real-world concern; the contingent Q4 2026 → Q1 2027 fallback deadline in the ticket
