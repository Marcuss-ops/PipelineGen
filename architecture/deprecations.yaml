        - architecture/current.yaml#PR-VO-COMPLETEPATH-FIX — wave-tracker
          entry with linked_issues[db2f3b1e + e71d10ad +
          PR-VO-ASSET-LOCATIONS-CONSUMER-AUDIT].
        - 4 TDD regression tests in
          internal/application/voiceover/jobs/finalizer_invariants_test.go
          (commit e71d10ad, 2026-07-04).

      Forward-pointer (godlike/06 SSOT): if a future agent proposes to
      revert to Path A, they MUST open
