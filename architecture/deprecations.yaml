  # ────────────────────────────────────────────────────────────────────────
  # 5. PR-INDEXST-LEGACY-ALPHABET — legacyState* constants preserved for negative-validate
  # ────────────────────────────────────────────────────────────────────────
  - id: PR-INDEXST-LEGACY-ALPHABET
    owner_capability: internal/domain/asset
    exact_symbol: 'legacyStateEmbedding, legacyStateUpserting, legacyStateRetrying, legacyStateIndexed, legacyStateFailed'
    file: internal/domain/asset/index_state.go
    file_line: 36, 101
    replacement: 'no replacement (anti-corruption pattern; Valid() rejects them deliberately)'
    introduction_date: 2026-04
    removal_date: never  # this entry documents the KEEP, not a removal
    tracking_issue: documentation-only
    compatibility_test: |
      `state.Valid()` returns false on every legacyState* value
      (covered by index_state_test.go). The constants exist
      solely so a future anti-corruption test can reference
      them by name without re-typing the literal.
    usage_metric: |
      0 callers. The constants are private package-level
      visibility (lowercase first letter); no production file
      imports them or references them as values. They appear
