          Status: in_progress. Covers the Handler.GenerateWithGroup +
          RegisterRoutes entry at internal/api/assets/voiceover/handler.go.
          Distinct surface from THIS record (which covers the Go-adapter
          seam, NOT an HTTP route).

        - PR-VOICEOVER-TYPED-PORT-RECOVERY-PHASE2 (architecture/current.yaml
          #id-26 follow_up_tickets): WAVE-PROGRESS tracker entry recording
          the B-2 BACKFILL → B-3 CUTOVER → B-4 CONTRACT sequence of the
          voiceover typed-port recovery. This deprecation record is the
          godlike/07 schema companion — godlike/07 owns deprecation-records,
          wave-tracker owns wave-progress; the two are complementary, not
          redundant (per AGENTS.md §Documentation Map).

        - PR-VOICEOVER-RECOVERY (architecture/current.yaml #id-26
          follow_up_tickets, sibling): V1..V7 typed-port chain (deadline
          2026-07-10). Different scope — the V-chain is the deep typed-port
          push through Go canonical types; this deprecation record is the
          audit-footprint of the seam removal that the V-chain's CONTRACT
          phase delivers.

      Shipped-then-registered pattern: Step 9 B-3 CUTOVER (commit 665ff194)
      landed the deletion FIRST. This manifest registration follows on
      2026-06-28 (today). Per godlike/07 §"No fake availability", retroactive
      registration of an already-removed surface is legitimate IF the
      compatibility test footprint (compatibility_test + usage_metric) is
      present — the gate checks the schema, not the registration-vs-landing
      ordering. Future agents auditing "why does this record have
      status=removed AND removal_date=2026-06-28 (today)?" should consult
      this paragraph.

