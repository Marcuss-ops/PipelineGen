# PipelineGen — Deprecation Manifest
# -----------------------------------------------------------------------------
# Canonical deprecation registry, per docs/architecture/godlike/07_ZERO_LEGACY_POLICY.md.
# Each record MUST carry: id, owner_capability, exact_symbol, file:line,
# replacement, introduction_date, removal_date, tracking_issue, compatibility_test,
# usage_metric, migration_phase, status, notes.
#
# CI enforcement (scripts/archcheck/deprecations_validator.go):
#   - Duplicate IDs → hard fail
#   - Duplicate YAML keys → hard fail (yaml.v3 decoder rejects)
#   - Records with removal_date in the past AND status != "removed" → hard fail
#   - Records with status="removed" are audit-only
#
# Migration phases per godlike/07 §"Migration sequence":
#   EXPAND → BACKFILL → CUTOVER → CONTRACT
# -----------------------------------------------------------------------------

