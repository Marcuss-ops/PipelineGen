      root is the only consumer of the legacy methods (via the
      alias-populated svc.Translation + svc.Translator fields).
      Post-EXPAND: pre-removal callers still surface via the alias;
      the canonical path is the default for NEW consumers; the
      legacy path lives solely for the EXPAND-window back-compat
      where a third-party caller may have a stale binary image.
