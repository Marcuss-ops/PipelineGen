# PipelineGen — Pre-Migration Baseline Inventory (2026-06-29)
# -----------------------------------------------------------------------------
# This file is the canonical pre-migration snapshot of internal/ file counts
# + per-directory target-zone mapping for the migration from
# legacy_internal_roots (api, app, application, domain, infrastructure) to
# target_internal_roots (app, kernel, capabilities, platform) per
# architecture/policy.yaml.
#
# The inventory is computed once and held in a date-stamped artifact (this
# file). Subsequent migration commits MUST produce monotone-decreasing deltas
# on legacy counts + monotone-increasing deltas on target counts, gated by
# each root's ratchet_window_opens date (see migration_target_metrics.
# monotone_invariants below).
#
# Architecture/name references:
#   - legacy target tree: architecture/policy.yaml::legacy_internal_roots
#   - target tree:       architecture/policy.yaml::target_internal_roots
#   - kernel slots:      architecture/policy.yaml::kernel_subzones
#                        (asset, job, script, event, identity, errors)
#   - capability slots:  architecture/policy.yaml::capabilities
#                        (assets, artlist, youtube, scripts, images, voiceover,
#                         content, channels, jobs, system)
#   - platform slots:    architecture/policy.yaml::platform_subzones
#                        (config, sqlite, drive, qdrant, ffmpeg, process,
#                         filesystem, observability, httpserver, ollama,
#                         nvidia, youtube)
#   - ownership:         architecture/ownership/<domain>.yaml, regenerated
#                        deterministically into
#                        architecture/ownership.generated.yaml by
#                        cmd/architecture-aggregate.
# -----------------------------------------------------------------------------

capture:
  date: 2026-06-29
  origin_main_sha: d017b62c
  capture_method: "find internal/<tld> -name '*.go' ! -name '*_test.go' | wc -l  (per TLD + per immediate subdir; shell out via bash)"
  produced_by: "Close-Wave-0 followup (Step 2 of the migration plan, June 2026)"
  supersedes: null
  standards_refs:
    - architecture/policy.yaml
    - architecture/current.yaml
    - architecture/ownership.generated.yaml
    - architecture/migrations/ (this directory)

