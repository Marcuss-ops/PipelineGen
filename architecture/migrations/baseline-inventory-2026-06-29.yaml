# -----------------------------------------------------------------------------
# Ratchet command (post-migration-commit invariant check).
# Rewritten from yq+bc to BASH-only for portability (yq and bc were not
# available in this repo's CI container; rg was missing in Check 2).
# Bash + find + wc + arithmetic are universally available.
# Walks all depths under internal/<tld>/ excluding *_test.go files, which
# matches totals_legacy.aggregate.total_productive (also computed recursively).
# -----------------------------------------------------------------------------
ratchet_command_post_migration_commit: |
  # Should exit 0 every migration commit; exit 1 if legacy count grew during
  # an active migration window (Phase B / Phase A / Phase C). Per the phase-gated
  # monotone_invariants table above, the gate only fires AFTER each root's
  # ratchet_window_opens date — pre-migration growth is allowed.
  set -e
  REALTIME=0
  for tld in api app application domain infrastructure; do
    REALTIME=$((REALTIME + $(find internal/$tld -name '*.go' ! -name '*_test.go' | wc -l)))
  done
  CURRENT=819  # totals_legacy.aggregate.total_productive (re-read from YAML when schema changes)
  if [ "$REALTIME" -gt "$CURRENT" ]; then
    echo "MIGRATION_RATCHET_FAIL: legacy productive count $REALTIME > baseline $CURRENT"
    echo "  Phase A / Phase B / Phase C may be incomplete."
    echo "  Review the migration commit and ensure legacy subtrees shrink during active migration windows."
    exit 1
  fi
  echo "MIGRATION_RATCHET_OK: legacy productive $REALTIME <= baseline $CURRENT"

