# PipelineGen — Canonical Ownership Map
# -----------------------------------------------------------------------------
# Each capability has exactly ONE canonical owner. This file is the SSOT for
# "where does X live?". When waves reach their exit gates, this map is the source
# of truth; migration.yaml tracks the actual progress.
#
# Status: target architecture (post Onda 17). Real-state drift is tracked in
# migration.yaml. Last baseline: cleanup-wave-00-final.
#
# CI Gate: validated by scripts/ci-architectural-checks.sh Check 22.
# -----------------------------------------------------------------------------

version: 2
target_root: internal/

# ── Module → Route Mount Map (SSOT for HTTP surface) ─────────────────────────
# Each module below owns exactly one route prefix. The CI gate enforces:
#   1. No duplicate METHOD + PATH across modules.
#   2. Every module here has a corresponding Wire<Module> in internal/app/.
#   3. Every Wire<Module> in registry.go is listed here.
module_route_map:
  - module: ScriptFlow
    prefix: /api/script
    owner: internal/app/wire_script.go
    routes:
      - POST /generate-from-clips
      - POST /generate-with-images
      - POST /generate-batch
      - GET  /generate-batch/progress
      - POST /generate-from-catalog
      - POST /curate
      - POST /cache/evict
      - POST /:id/sections/:section_id/regenerate
      - GET  /jobs/:job_id
      - GET  /jobs/:job_id/full
  - module: Assets
    prefix: /api/media + /api/assets
    owner: internal/app/module_assets.go
    routes:
      - POST /media/search
      - POST /media/upload
      - GET  /media/stats
      - POST /media/recommend
      - POST /media/clips/enrich
      - POST /media/voiceover/generate
      - POST /media/sound-effect/generate
      - GET  /media/realtime/search
      - GET  /media/realtime/index-health
      - POST /media/register
      - POST /media/sync
      - GET  /media/diagnostics
      - POST /scraper/start
      - POST /scraper/stop
      - GET  /scraper/status
      - POST /ingest/media
      - POST /ingest/bulk
  - module: Artlist
    prefix: /api/artlist
    owner: internal/app/module_artlist.go
    routes:
      - POST /run
      - GET  /runs/:run_id
      - GET  /stats
      - GET  /diagnostics
      - POST /search
      - POST /search/live
      - POST /recommend
      - POST /sync-catalogs
  - module: Images
    prefix: /api/images
    owner: internal/app/module_fullimages.go
    routes:
      - GET  /search
      - GET  /diagnostics
      - POST /upload
      - POST /sync
      - POST /generate
      - POST /animate
      - POST /webhook/remote
      - POST /video/generate
  - module: Jobs
    prefix: /api/jobs + /api/internal
    owner: internal/app/module_jobs.go
    routes:
      - POST /
      - GET  /
      - GET  /stats
      - GET  /:id
      - GET  /:id/full
      - POST /:id/cancel
      - POST /:id/retry
      - GET  /:id/events
  - module: YouTube
    prefix: /api/clips
    owner: internal/app/module_youtube.go
    routes:
      - POST /search
      - POST /ingest
      - GET  /stats
      - POST /batch
  - module: Channels
    prefix: /api/channels
    owner: internal/app/module_ingest.go
    routes:
      - GET  /
      - POST /
      - POST /:id/toggle
  - module: Stock
    prefix: stock pipeline routes
    owner: internal/app/module_stock.go
    routes: []  # registered via separate handler
  - module: Content
    prefix: /api/books + /api/lessons
    owner: internal/app/registry.go (inline)
    routes:
      - POST /books/process
      - POST /books/generate
      - POST /books/process-from-drive
      - GET  /books/jobs
      - POST /lessons/generate
      - GET  /lessons/jobs
  - module: System
    prefix: /api/system + /api/drive + /api/scripts
    owner: internal/app/registry.go (inline)
    routes:
      - GET  /system/doctor
      - POST /drive/reconcile
      - POST /drive/cleanup
      - POST /drive/folders
      - POST /drive/move
      - POST /drive/resolve-by-id
      - GET  /scripts
      - GET  /scripts/:id

# ── Job Type → Handler Map (SSOT for background jobs) ────────────────────────
# Each job type must have exactly ONE handler. The CI gate enforces:
#   1. No job type is registered more than once.
#   2. Every handler is owned by exactly one module.
job_handler_map:
  - job_type: script.generate_from_clips
    handler: PipelineUseCase.HandleJob
    owner: internal/application/scripts
  - job_type: script.generate_batch
    handler: ScriptFlowHandler.HandleBatchScriptGenerateJob
    owner: internal/api/script
  - job_type: script.curate
    handler: CurationJobServiceImpl.HandleCurateJob
    owner: internal/application/scripts
  - job_type: artlist.run
    handler: ArtlistHandler.enqueueArtlistRun
    owner: internal/api/assets/artlist
  - job_type: media.artlist
    handler: artlist.jobHandler
    owner: internal/application/assets/providers/artlist
  - job_type: media.youtube_clip
    handler: YouTube clip ingest handler
    owner: internal/application/assets/providers/youtube
  - job_type: media.stock_pipeline
    handler: StockPipeline handler
    owner: internal/application/assets/providers/stock
  - job_type: maintenance.deep_cleanup
    handler: MaintenanceService
    owner: internal/application/assets/maintenance
  - job_type: catalog.sync
    handler: CatalogSync service
    owner: internal/application/assets/catalogsync

# ── Canonical Service Construction (SSOT) ────────────────────────────────────
# Each canonical service is constructed EXACTLY ONCE. The CI gate enforces
# no duplicate NewService/NewEngine/NewPipeline calls across modules.
canonical_services:
  - service: Engine
    constructor: NewScriptEngine
    location: internal/app/composition.go::BuildAIBundle
  - service: Pipeline
    constructor: NewPipeline
    location: internal/app/wire_script.go
  - service: MemoryService (gemmamemory)
    constructor: NewService
    location: internal/app/composition.go::BuildAIBundle
  - service: ScriptRepository
    constructor: NewRepositoryAdapter
    location: internal/app/wire_script.go
  - service: ClipSourceBuilder
    constructor: wireClipSourceBuilder
    location: internal/app/wire_script.go
  - service: MediaCurator
    constructor: wireMediaCurator
    location: internal/app/wire_script.go
  - service: SemaphoreUseCase
    constructor: NewSemaphoreUseCase
    location: internal/app/wire_script.go
  - service: PrewarmUseCase
    constructor: NewPrewarmUseCase
    location: internal/app/wire_script.go
  - service: DocumentsUseCase
    constructor: NewDocumentsUseCase
    location: internal/app/wire_script.go
  - service: SceneBuilderUseCase
    constructor: NewSceneBuilderUseCase
    location: internal/app/wire_script.go
  - service: PostGenUseCase
    constructor: NewPostGenUseCase
    location: internal/app/wire_script.go
  - service: PipelineUseCase
    constructor: NewPipelineUseCase
    location: internal/app/wire_script.go
  - service: GenerateBatchUseCase
    constructor: NewGenerateBatchUseCase
    location: internal/app/wire_script.go
  - service: CacheEvictionUseCase
    constructor: NewCacheEvictionUseCase
    location: internal/app/wire_script.go
  - service: SectionRegenerator
    constructor: NewSectionRegenerator
    location: internal/app/wire_script.go
  - service: ImageService
    constructor: initImageService
    location: internal/app/compose_images.go
  - service: VoiceoverService
    constructor: initVoiceoverService
    location: internal/app/compose_voiceover.go
  - service: BooksService
    constructor: initBooksService
    location: internal/app/compose_content.go
  - service: ArtlistService
    constructor: NewService
    location: internal/app/module_artlist.go
  - service: YouTubeClipService
    constructor: NewYouTubeService
    location: internal/app/composition.go::BuildDomainBundle
  - service: RealtimeService
    constructor: NewService
    location: internal/app/composition.go::BuildDomainBundle
  - service: CatalogSyncService
    constructor: NewService
    location: internal/app/composition.go::BuildSyncBundle
  - service: AssetTreeService
    constructor: NewService
    location: internal/app/registry.go::initAssetServices
  - service: AssetIndexService
    constructor: NewService
    location: internal/app/registry.go::initAssetServices
  - service: ClipIndexerService
    constructor: NewClipIndexerService
    location: internal/app/composition.go::BuildProcessBundle
  - service: MediaProcessor
    constructor: initMediaProcessor
    location: internal/app/registry.go
  - service: MaintenanceService
    constructor: NewService
    location: internal/app/registry.go
  - service: ProviderRegistry
    constructor: NewRegistry
    location: internal/app/composition.go::BuildSearchBundle
  - service: OutboxDispatcher
    constructor: NewDispatcher
    location: internal/app/composition.go::BuildOutboxBundle
  - service: JobService (jobs.Service)
    constructor: NewService
    location: internal/app/composition.go::BuildJobsBundle
  - service: JobFacade (jobs.Facade)
    constructor: NewFacade
    location: internal/app/composition.go::BuildJobsBundle
  - service: DeletionService
    constructor: NewDeletionService
    location: internal/app/composition.go::BuildMaintBundle
  - service: HealthService
    constructor: NewService
    location: internal/app/composition.go::BuildUtilityBundle
  - service: ReadyChecker
    constructor: NewReadyChecker
    location: internal/app/bootstrap.go

allowed_internal_roots:
  - api
  - app
  - application
  - domain
  - infrastructure

# ── Transport (HTTP) ─────────────────────────────────────────────────────────

http_entrypoint:
  owner: cmd/server
  rationale: Composition root + main() for the HTTP server binary.

http_transport:
  owner: internal/api
  rule: api imports ONLY application + domain. Never infrastructure/database/sql, never os/exec, never google.golang.org/api/drive/v3.
  target_subdirs:
    - api/assets
    - api/content
    - api/images
    - api/jobs
    - api/scripts
    - api/system
    - api/middleware
    - api/transport

# ── Composition ──────────────────────────────────────────────────────────────

composition_root:
  owner: internal/app
  rule: Only place where concrete adapters (DB, Drive, exec) are instantiated.
  target_files: [app.go, bootstrap.go, lifecycle.go, shutdown.go, modules/*.go]

# ── Domain (canonical contracts + types) ─────────────────────────────────────

domain_job:
  owner: internal/domain/job
  rationale: Job, Lease, WorkerSession, WorkerCapabilities, WorkerCredentials, Store, ScriptGenerationPayload.
  migrated_from:
    - internal/domain/worker
    - internal/contracts/scriptjobs
    - internal/jobs/domain_types.go
    - internal/jobs/domain_commands.go

domain_script:
  owner: internal/domain/script
  rationale: Script, Plan, GenerationSpec, Payload, Codec error types.

domain_asset:
  owner: internal/domain/asset
  rationale: Asset, Artifact, Delivery, Location, LifecycleState, Processor, Destination, EmbeddingPort, AudioPort.
  absorbs_from_core_wave_4C:
    - Repository (from internal/core/assetop)
    - Processor (from internal/core/processor)
    - Destination (from internal/core/destination)
    - EmbeddingPort (from internal/core/embedding)
    - AudioPort (from internal/core/audio)
  migrated_from:
    - internal/domain/media
    - internal/assets
    - internal/artifacts
    - internal/core/assetop
    - internal/core/audio
    - internal/core/destination
    - internal/core/embedding
    - internal/core/processor
    - internal/core/scoring

# STATUS: HISTORICAL — Wave 4C completed (June 2026). Core ports now live in
# internal/domain/asset/. This section kept for audit trail only.
# domain_core_ports (REMOVED — internal/core/ no longer exists)

# ── Application (use cases) ──────────────────────────────────────────────────application_jobs:
  owner: internal/application/jobs
  rationale: Job registry + worker execution + claims + lease + payloads + codec + outbox dispatcher.
  # Sub-fragment of Wave 5 PR3, closed June 2026:
  #   - The broader PR3 (Store / StartJob / RequeueResult aliases in
  #     internal/application/jobs/types.go) had already been collapsed
  #     upstream at commit 21269fbf.
  #   - This repo's commit e49c8a43 certifies the
  #     script.generate_from_clips sub-fragment under that parent gate.
  #
  # State after the script.generate_from_clips closure:
  #   1. internal/domain/job/job.go::77 (TypeClipScriptGenerate) is the SOLE
  #      canonical declaration of the job-type identity.
  #   2. Legacy duplicates at
  #        internal/domain/script/spec.go::JobTypeGenerateFromClips
  #        internal/application/jobs/registry.go::TypeClipScriptGenerate
  #      were deleted outright (no back-compat aliases were kept).
  #   3. The timeout-map literal at internal/application/jobs/worker.go was
  #      re-keyed through the typed constant job.TypeClipScriptGenerate.
  #
  # See architecture/migration.yaml::5_PR3 for the parent ratchet entry.
  target_subdirs:
    - jobs/assets         # worker asset ops (renamed from old application/workerassets)
    - jobs/outbox         # outbox dispatcher (migrated from internal/outboxhandlers in Wave 5)

application_scripts:
  owner: internal/application/scripts
  rationale: Script-generation orchestration (batch, curation, documents, scenes, generate, memory).
  target_subdirs:
    - scripts/batch
    - scripts/curation
    - scripts/documents
    - scripts/generate
    - scripts/jobs
    - scripts/scenes
    - scripts/memory
  current_drift: internal/application/scriptflow/ directory eliminated (flat-merged into internal/application/scripts/). internal/scripts/ still has 5 file-level comment references to old merge sources.

application_assets:
  owner: internal/application/assets
  rationale: Catalog, indexing, classification, providers registry, association & realtime search.
  target_subdirs:
    - assets/catalog
    - assets/tree
    - assets/index
    - assets/resolve
    - assets/ingest
    - assets/classification
    - assets/enrichment
    - assets/ontology
    - assets/sync
    - assets/monitor
    - assets/providers/{artlist,youtube,stock}
    - assets/realtime
    - assets/association

application_images:
  owner: internal/application/images
  target_subdirs: [images/service, images/generation, images/search, images/ingest, images/styles]

application_voiceover:
  owner: internal/application/voiceover
  target_subdirs: [voiceover/service, voiceover/sync]

application_books:
  owner: internal/application/books
  rationale: Books + lessons; produces Markdown/PDF deliverables.
  target_subdirs: [books]

application_lessons:
  owner: internal/application/lessons
  rationale: Lesson generation; produces Markdown/PDF deliverables.
  target_subdirs: [lessons]

# ── Infrastructure (adapters to external systems) ────────────────────────────

infrastructure_db:
  owner: internal/infrastructure/database/sqlite
  rule: ONLY place where Go SQL drivers / SQLite schema live.

infrastructure_drive:
  owner: internal/infrastructure/drive
  rationale: Google Drive uploader + DocClient.
  migrated_from: internal/upload/drive

infrastructure_files:
  owner: internal/infrastructure/files
  rationale: Filesystem utilities (path, hash, JSON I/O).

infrastructure_process:
  owner: internal/infrastructure/process
  rationale: External command execution (yt-dlp, ffmpeg wrappers).
  rule: ONLY place where os/exec is allowed.

infrastructure_ai:
  owner: internal/infrastructure/ai
  sub_dirs: [ai/ollama, ai/reranker, ai/vlm, ai/images]


infrastructure_media:
  owner: internal/infrastructure/media/processor
  rationale: yt-dlp, ffmpeg, download, normalization, temporary filesystem.
  migrated_from: internal/media/mediaasset

infrastructure_jobs:
  owner: internal/infrastructure/jobs
  rationale: Local in-process broker (replaces internal/application/jobbroker/local).
  target_subdirs: [jobs/local]
  decomposed_into:
    jobs_local:
      owner: internal/infrastructure/jobs/local
    jobs_remote_clients:
      owner: internal/infrastructure/remote
      clients:
        - assettransferclient   # HTTP client for asset transfer (worker side)
        - jobbrokerclient       # HTTP client for job broker (worker side)

infrastructure_observability:
  owner: internal/infrastructure/observability
  rationale: metrics, tracing, health checks.

infrastructure_config:
  owner: internal/platform/config
  rationale: Resolved configuration + folder IDs.
  rule: ONLY place where os.Getenv (env-driven config) is allowed (alongside cmd/* binaries).

