  # ── 0. PR-VOICEOVER-LEGACY-ENDPOINTS-410 — voiceover typed-port seam HTTP 410 surface removed ──
  # Step 9 B-3 CUTOVER (commit 665ff194, June 2026) deleted the
  # `voiceoverSvcAdapter` typed-port seam that was introduced during
  # the V1..V7 typed-port chain. The seam's two methods
  # (`Generate` / `GenerateWithDestination`) previously returned
  # `(interface{}, error)` to mask the untyped wire shape; callers
  # (processor_voiceover.go::Process) had to runtime-assert the result
  # via the deleted `extractVoiceoverPaths(result interface{})` helper.
  # This record ratchets the seam as a deprecation event so a future
  # `interface{}`-returning voiceover wrapper cannot land without an
  # explicit godlike/07 schema entry + compatibility test footprint.
