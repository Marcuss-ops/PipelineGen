# Ollama NVIDIA runtime for the PipelineGen host.
#
# Install on a host with the NVIDIA driver and Ollama CUDA v12 runtime:
#   sudo install -d -m 0755 /etc/systemd/system/ollama.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/ollama.service.d/gpu.conf \
#     /etc/systemd/system/ollama.service.d/gpu.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama.service
#
# `cuda_v12` is intentional: Ollama 0.30.4 ships both CUDA v12 and v13
# runners, while this host's NVIDIA driver/runtime contract is validated
# against the v12 runner. Ollama then reports the selected CUDA device in
# `ollama ps`; PipelineGen must not force a fake success when that probe fails.
[Service]
Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
Environment="OLLAMA_NUM_PARALLEL=3"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_FLASH_ATTENTION=1"
