# Ollama runner context for the PipelineGen host.
#
# PipelineGen pins every producer to ONE resident runner bucket
# (internal/platform/ollama types.ProductionRunnerContext = 16384):
# the startup warm probe, script generation and phrase extraction all
# request num_ctx=16384, and Ollama unloads + reloads the resident model
# whenever a request asks for a different context window. The daemon
# default (4096) therefore made every warmup evict the job runner and
# every job evict the warmed runner; startup warmup could never reach
# residency and the server died in ollama-model-warm (measured
# 2026-10-14). Pinning the daemon default to the same bucket keeps one
# resident runner across warmup and jobs.
#
# Install alongside gpu.conf:
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/ollama.service.d/context.conf \
#     /etc/systemd/system/ollama.service.d/context.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama.service
[Service]
Environment="OLLAMA_CONTEXT_LENGTH=16384"
