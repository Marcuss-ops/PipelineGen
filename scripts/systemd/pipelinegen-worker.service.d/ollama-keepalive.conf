# Ollama permanent model residency (keep_alive=-1).
#
# The worker executes script.generate, so the residency override must live
# here too: the per-job warm probe (`ollama/warm`) becomes a no-op check
# when the model is resident, and only the startup warm pays the load.
# See pipelinegen.service.d/ollama-keepalive.conf for the full rationale
# (measured: 18.4 s/job of idle-unload reload on gate-100-r7, 2026-10-26).
#
# Install:
#   sudo install -d -m 0755 /etc/systemd/system/pipelinegen-worker.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen-worker.service.d/ollama-keepalive.conf \
#     /etc/systemd/system/pipelinegen-worker.service.d/ollama-keepalive.conf
#   sudo systemctl daemon-reload && sudo systemctl restart pipelinegen-worker.service
[Service]
Environment="PIPELINEGEN_OLLAMA_KEEP_ALIVE=-1"
