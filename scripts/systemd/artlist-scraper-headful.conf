# Artlist serves the catalog to a visible Chromium session on this host.
# Keep the service headless at the OS level via Xvfb while using Chromium's
# headful rendering mode for the scraper.
[Service]
Environment=ARTLIST_HEADLESS=false
ExecStart=
ExecStart=/usr/bin/xvfb-run --auto-servernum '--server-args=-screen 0 1440x900x24' /home/pierone/.nvm/versions/node/v22.22.2/bin/node artlist_server.js
