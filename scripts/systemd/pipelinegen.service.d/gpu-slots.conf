# Overlay GPU admission contract.
#
# RENDERINGGEN_GPU_SLOTS must match the peer that shares the GPU. RenderingGen's
# worker.gpu_lanes is the measured ceiling on the reference host
# (`RenderingGen/renderinggen/config.yaml` → `gpu_lanes: 2`, pinned by
# `infra/native/renderinggen-native.yaml`, which records that extra lanes add
# queue wait, VRAM pressure and text-path lock contention without raising the
# render-loop rate).
#
# Leaving the variable unset makes PipelineGen apply its built-in default
# (DefaultGPUGateSlots = 2, in internal/app/wiring/rendering_runtime.go) and log
# a warning. That default happens to match RenderingGen's `gpu_lanes: 2` today,
# but the value is still pinned explicitly here so the two processes DECLARE the
# same admission contract instead of relying on two independent defaults staying
# equal. If `worker.gpu_lanes` changes, change this value in the same commit and
# re-measure; a Chronon video job is itself serialized by the daemon
# execution-domain mutex
# (`Chronon3d/apps/chronon3d_cli/daemon/daemon_render_concurrency.hpp`).
[Service]
Environment="RENDERINGGEN_GPU_SLOTS=2"
