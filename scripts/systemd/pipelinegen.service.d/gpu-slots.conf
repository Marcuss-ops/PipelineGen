# Overlay GPU admission contract (retuned 2026-10-23: back to 3, tri-daemon
# lanes, receipt verification off the render lane).
#
# RENDERINGGEN_GPU_SLOTS must match the peer that shares the GPU. The peer is
# RenderingGen's worker.gpu_lanes, and the GPU renders in flight can never
# exceed the number of Chronon daemons: one daemon executes one RENDER_JOB at a
# time (`Chronon3d/apps/chronon3d_cli/daemon/daemon_render_concurrency.hpp`,
# `kSerializedRenderJobSlots = 1`), so N daemons = N render lanes.
#
# 2026-10-23 (TICKET-OVERLAY-THROUGHPUT fix 1): the receipt verification
# (probe + sha256 + full-decode gate) is now built OUTSIDE the daemon execution
# lock, so it no longer occupies a slot's GPU time — one lane needs ~1.6
# in-flight children to stay fed through the off-lane tail. The certified
# scale-out is the third execution domain (chronon3d-c.service); worker
# topology: `chronon.socket_paths` = 3 sockets, `gpu_lanes: 3`.
#
# 2026-10-22: the golden runs v8/v9/v10 measured the overlay window as 100%
# render service (v9: 91.7 s of render_ms in a 90.5 s window, 41 items →
# 25-29 item/min at ONE lane). The overlay item pool keeps the feed width in
# flight (`defaultSeparateItemRenderWorkers = 4`, cap `overlayItemMaxWidth = 6`
# in render_queue_items.go) so no lane starves on the off-lane receipt tail.
#
# Leaving the variable unset makes PipelineGen apply its built-in default
# (DefaultGPUGateSlots = 3, in internal/app/wiring/rendering_runtime.go) and log
# a warning; the value is pinned explicitly here so the two processes DECLARE
# the same admission contract instead of relying on independent defaults. If
# `worker.gpu_lanes` or the daemon count changes, change this value in the same
# commit and re-measure.
[Service]
Environment="RENDERINGGEN_GPU_SLOTS=3"
