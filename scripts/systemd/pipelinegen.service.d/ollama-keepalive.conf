# Keep Ollama models resident for 24 hours between requests.
#
# The request-level keep_alive default was 30m (certified), so any job
# arriving more than 30 minutes after the previous one paid a full model
# reload measured as `ollama/warm` (18.4 s on gate-100-r7, 2026-10-26;
# historical ledger: 129 `ollama/warm` ops averaging 27.3s, max 600s).
# The connected Ollama endpoint rejected "-1" with "missing unit" during a
# production run. A 24-hour duration is accepted by that endpoint and avoids
# the per-job reload for normal daily use.
#
# The startup warm (buildOllamaWarmStep / startupWarmModels) remains the
# only load: it runs once at service start, then every job sees a resident
# runner. VRAM stays occupied by design — that is the trade this buys.
#
# Install with the tracked installer (it renders and installs EVERY drop-in in
# this directory, so this file is part of the deploy and not a manual step):
#   scripts/systemd/install.sh
#   sudo systemctl daemon-reload && sudo systemctl restart pipelinegen.service
#
# Keep this value in the tracked drop-in so install.sh cannot restore an
# incompatible sentinel from a different local systemd override.
[Service]
Environment="PIPELINEGEN_OLLAMA_KEEP_ALIVE=24h"
