# Ollama permanent model residency (keep_alive=-1).
#
# The request-level keep_alive default was 30m (certified), so any job
# arriving more than 30 minutes after the previous one paid a full model
# reload measured as `ollama/warm` (18.4 s on gate-100-r7, 2026-10-26;
# historical ledger: 129 `ollama/warm` ops averaging 27.3s, max 600s).
# Ollama's own "-1" contract keeps the model resident until the server
# stops, which makes the per-job warm probe a no-op residency check.
#
# The startup warm (buildOllamaWarmStep / startupWarmModels) remains the
# only load: it runs once at service start, then every job sees a resident
# runner. VRAM stays occupied by design — that is the trade this buys.
#
# Install alongside ollama-gpu.conf:
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen.service.d/ollama-keepalive.conf \
#     /etc/systemd/system/pipelinegen.service.d/ollama-keepalive.conf
#   sudo systemctl daemon-reload && sudo systemctl restart pipelinegen.service
[Service]
Environment="PIPELINEGEN_OLLAMA_KEEP_ALIVE=-1"
