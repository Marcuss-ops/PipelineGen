# Map rendering lane: the native renderer of ChrononPlugin is the single
# dynamic map renderer since the Python renderer's retirement
# (TICKET-MAPS-NATIVE-PORT fase 6-7). The binary and its boundary catalog are
# installed together by ChrononPlugin/plugins/maps/CMakeLists.txt
# (`cmake --install <build> --prefix /usr/local`).
#
# The encoder profile defaults to the renderer's certified closed profile
# (libx264/veryfast/CRF23): no knob belongs here. An NVENC declaration
# (PIPELINEGEN_MAP_CODEC=h264_nvenc) fails closed at the render boundary until
# the OpenCL sampler is ported.
[Service]
Environment=VELOX_MAP_NATIVE_RENDERER_PATH=/usr/local/bin/maps_dynamic_map_render
Environment=CHRONON_MAPS_CATALOG_DIR=/usr/local/share/chrononplugin/maps-catalog
