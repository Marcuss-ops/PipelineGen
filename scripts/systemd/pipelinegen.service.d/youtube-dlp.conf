# PipelineGen YouTube yt-dlp configuration.
#
# Install on the host with:
#   sudo install -d -m 0755 /etc/systemd/system/pipelinegen.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen.service.d/youtube-dlp.conf \
#     /etc/systemd/system/pipelinegen.service.d/youtube-dlp.conf
#   sudo systemctl daemon-reload
#   sudo -n /usr/bin/systemctl restart pipelinegen.service
#
# This file is intentionally versioned; installing it and restarting the
# service are operator actions. The systemd unit is the canonical start path
# (ExecStart=bin/pipelinegen --mode server); the development-only
# start_server.sh re-applies the systemd-provided values after sourcing the
# repository-local .env, so they cannot be silently overridden by a
# gitignored .env.
#
# Canonical values (August 2026 YouTube recovery):
#
#  - YTDLP_PATH: the versioned runtime-only wrapper at
#    scripts/yt-dlp-pipeline. Player-client policy is owned by the Go
#    CommandBuilder/downloader fallback chain (see
#    VELOX_YOUTUBE_PLAYER_CLIENT_FALLBACK below), NOT by the wrapper. The
#    wrapper only (a) pins the pip user install (which carries the bgutil POT
#    plugin) by resolving $HOME so a different/empty HOME cannot silently fall
#    back to the distro /usr/local yt-dlp, and (b) prepends the nvm node bin
#    dir to PATH so --js-runtime node resolves node v22, not the distro
#    /usr/bin/node v20 that cannot solve the player JS challenges.
#
#  - YT_JS_RUNTIME_PATH=node: kept as a name so yt-dlp resolves it through
#    PATH; the wrapper guarantees the nvm node dir is on PATH.
#
#  - VELOX_YOUTUBE_PLAYER_CLIENT_FALLBACK: the ordered player-client ladder
#    tried after the canonical primary client when YouTube returns a
#    retryable error (bot check / 403 / no formats). YouTube enforces
#    Proof-of-Origin tokens on some clients; the local bgutil POT provider
#    (docker container bgutil-provider, :4416) supplies the GVS PO token.
#
#  - YTDLP_MIN/MAX_SLEEP_SECONDS: random sleep before each YouTube download
#    to avoid hot-IP rate limits.
#
#  - HOME: pinned to the deployment user so yt-dlp discovers the pip user
#    install (yt-dlp core + bgutil POT plugin) in
#    $HOME/.local/lib/python3.10/site-packages. Defense-in-depth; the wrapper
#    also pins the same value.
#
# The canonical cookie jar is VELOX_YOUTUBE_COOKIES_FILE in
# /etc/pipelinegen/pipelinegen.env.
[Service]
Environment="HOME=/home/pierone"
Environment="YTDLP_PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/scripts/yt-dlp-pipeline"
Environment="YT_JS_RUNTIME_PATH=node"
Environment="VELOX_YOUTUBE_PLAYER_CLIENT_FALLBACK=web_embedded,mweb,android_creator"
Environment="YTDLP_MIN_SLEEP_SECONDS=2"
Environment="YTDLP_MAX_SLEEP_SECONDS=5"
