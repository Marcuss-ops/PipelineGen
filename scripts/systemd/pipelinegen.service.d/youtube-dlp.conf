# PipelineGen YouTube yt-dlp configuration.
#
# Install on the host with:
#   sudo install -d -m 0755 /etc/systemd/system/pipelinegen.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen.service.d/youtube-dlp.conf \
#     /etc/systemd/system/pipelinegen.service.d/youtube-dlp.conf
#   sudo systemctl daemon-reload
#   sudo -n /usr/bin/systemctl restart pipelinegen.service
#
# This file is intentionally versioned; installing it and restarting the
# service are operator actions. start_server.sh treats the variables below
# as canonical (it re-applies the systemd-provided values after sourcing the
# repository-local .env), so they cannot be silently overridden by a
# gitignored .env.
#
# Canonical values (August 2026 YouTube recovery):
#
#  - YTDLP_PATH: the versioned wrapper at scripts/yt-dlp-pipeline. The
#    wrapper appends --extractor-args youtube:player_client=web_safari for
#    direct video URLs: YouTube enforces Proof-of-Origin tokens on the
#    android_creator/tv flows the stock downloader prefers (HTTP 403 on
#    googlevideo.com), while web_safari serves HLS streams that accept a GVS
#    PO token generated by the local bgutil POT server (docker container
#    bgutil-provider, :4416). The wrapper appends the override last so it
#    wins without touching Go code. It also prepends the nvm node bin dir to
#    PATH so --js-runtime node resolves node v22, not the distro /usr/bin/
#    node v20 that cannot solve the player JS challenges.
#
#  - YT_JS_RUNTIME_PATH=node: kept as a name so yt-dlp resolves it through
#    PATH; the wrapper guarantees the nvm node dir is on PATH.
#
#  - YTDLP_MIN/MAX_SLEEP_SECONDS: random sleep before each YouTube download
#    to avoid hot-IP rate limits.
#
# The canonical cookie jar is VELOX_YOUTUBE_COOKIES_FILE in
# /etc/pipelinegen/pipelinegen.env.
[Service]
Environment="YTDLP_PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/scripts/yt-dlp-pipeline"
Environment="YT_JS_RUNTIME_PATH=node"
Environment="YTDLP_MIN_SLEEP_SECONDS=2"
Environment="YTDLP_MAX_SLEEP_SECONDS=5"
