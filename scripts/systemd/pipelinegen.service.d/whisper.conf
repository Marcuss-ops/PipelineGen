# PipelineGen Whisper runtime.
#
# Install on the host with:
#   sudo install -d -m 0755 /etc/systemd/system/pipelinegen.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen.service.d/whisper.conf \
#     /etc/systemd/system/pipelinegen.service.d/whisper.conf
#   sudo systemctl daemon-reload
#
# This file is intentionally versioned; installing it and restarting the
# service are operator actions. The PATH selects python3 for the existing Go
# adapter without changing application code or the canonical auth file.
# The canonical preflight (scripts/tools/whisper_preflight.py) gates startup
# with ExecStartPre and fails closed: VELOX_WHISPER_DEVICE=cuda means a broken
# CUDA stack or missing runtime blocks the service instead of silently
# degrading to CPU.
[Service]
ExecStartPre=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/bin/python3 /home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/scripts/tools/whisper_preflight.py
Environment="PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
Environment="LD_LIBRARY_PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cublas/lib:/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cudnn/lib:/usr/local/lib/ollama/cuda_v12"
# VELOX_WHISPER_MODEL is intentionally NOT set here: the canonical ASR
# identity is the registry default (scripts/services/model_registry_generated.py
# -> openai/whisper-large-v3-turbo), which transcribe_detect_lang.py maps to
# the published CTranslate2 build "large-v3-turbo". A size alias such as
# "base" here would silently pin production to the smallest model and bypass
# that map; set VELOX_WHISPER_MODEL only to deliberately override the model.
Environment="VELOX_WHISPER_DEVICE=cuda"
Environment="VELOX_WHISPER_CUDA_LIB_DIR=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cublas/lib"
