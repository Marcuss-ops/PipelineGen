# PipelineGen Whisper runtime.
#
# Install on the host with:
#   sudo install -d -m 0755 /etc/systemd/system/pipelinegen.service.d
#   sudo install -m 0644 -o root -g root \
#     scripts/systemd/pipelinegen.service.d/whisper.conf \
#     /etc/systemd/system/pipelinegen.service.d/whisper.conf
#   sudo systemctl daemon-reload
#
# This file is intentionally versioned; installing it and restarting the
# service are operator actions. The PATH selects python3 for the existing Go
# adapter without changing application code or the canonical auth file.
[Service]
Environment="PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
Environment="LD_LIBRARY_PATH=/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cublas/lib:/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:/home/pierone/src/go-master/projects/Pyt/VeloxEditing/refactored/.venv-whisper/lib/python3.10/site-packages/nvidia/cudnn/lib:/usr/local/lib/ollama/cuda_v12"
