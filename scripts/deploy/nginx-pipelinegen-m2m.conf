# Nginx TLS reverse proxy for the PipelineGen M2M master.
#
# Install on the master, not on the remote worker:
#   sudo cp scripts/deploy/nginx-pipelinegen-m2m.conf \
#     /etc/nginx/sites-available/pipelinegen
#   sudo ln -s /etc/nginx/sites-available/pipelinegen \
#     /etc/nginx/sites-enabled/pipelinegen
#   sudo certbot --nginx -d pipeline.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then bind PipelineGen to loopback only:
#   VELOX_HOST=127.0.0.1
#   VELOX_PORT=8000
# and close port 8000 at the firewall. Only 80/443 stay public.
#
# Replace pipeline.example.com and the certificate paths before enabling.

server {
    listen 80;
    listen [::]:80;
    server_name pipeline.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pipeline.example.com;

    ssl_certificate /etc/letsencrypt/live/pipeline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pipeline.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 10m;

    # Media downloads can be large and slow. Do not let Nginx time out a
    # healthy Range/resume stream, and do not buffer the whole file in RAM.
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The M2M key and idempotency header must reach the master unchanged.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Workspace-ID $http_x_workspace_id;

        # Required for resumable downloads. Nginx normally forwards Range, but
        # making it explicit prevents a future proxy rewrite from dropping it.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        add_header X-Content-Type-Options nosniff always;
    }
}
