# Host-specific Nginx config for the PipelineGen master at 77.93.152.122.
#
# Topology:
#   :443  Nginx TLS
#           ├─ /objects/  -> http://127.0.0.1:9000 (object store, signed GETs)
#           └─ /          -> http://127.0.0.1:8000 (PipelineGen M2M API)
#
# The object store keeps its own TLS listener on 127.0.0.1:9443, but the public
# 443 is owned by this Nginx. Existing https://77.93.152.122/objects/<sha>
# URLs keep working because the path is forwarded unchanged.
#
# Certbot uses the standalone authenticator on port 80, so this file must NOT
# listen on :80. Install the deploy hook to reload Nginx after renewal:
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 77.93.152.122;

    ssl_certificate /etc/letsencrypt/live/77.93.152.122/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/77.93.152.122/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 2g;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Workspace-ID $http_x_workspace_id;

    # The object store uses HMAC query signatures and large streamed bodies.
    location /objects/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # PipelineGen M2M API, media catalog, job API and health/readiness.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
