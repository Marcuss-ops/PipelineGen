{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{template "title" .}} - PipelineGen Operator Console</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>PipelineGen</h1>
        <small>Operator Console</small>
      </div>
      <nav>
        <a href="/" {{if eq .NavActive "dashboard"}}class="active"{{end}}>Dashboard</a>
        <a href="/assets" {{if eq .NavActive "assets"}}class="active"{{end}}>Media Explorer</a>
        <a href="/sound-effects" {{if eq .NavActive "sound-effects"}}class="active"{{end}}>Sound Effects</a>
        <a href="/jobs" {{if eq .NavActive "jobs"}}class="active"{{end}}>Jobs</a>
        <a href="/outbox" {{if eq .NavActive "outbox"}}class="active"{{end}}>Outbox</a>
      </nav>
    </aside>
    <div class="main-content">
      {{template "content" .}}
    </div>
  </div>

  <!-- Drawer overlay for asset detail -->
  <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
  <div id="drawer" class="drawer">
    <div class="drawer-header">
      <h3 id="drawer-title">Asset Detail</h3>
      <button class="drawer-close" onclick="closeDrawer()">&times;</button>
    </div>
    <div id="drawer-body" class="drawer-body">
      <div class="empty-state"><p>Select an asset to view details</p></div>
    </div>
  </div>

  <script>
    function openDrawer(title) {
      document.getElementById('drawer-title').textContent = title || 'Detail';
      document.getElementById('drawer-overlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('drawer-overlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
    }
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(function(){});
    }
  </script>
</body>
</html>
{{end}}
