# =============================================================================
# PipelineGen Clip Folder Aliases (SSOT, July 2026)
# =============================================================================
# Maps user-supplied folder name aliases (case-insensitive, freely
# formatted: "Boxe", "boxing", "hip-hop", "Hip Hop", etc.) to the
# canonical Drive clip-folder routing primitives consumed by the
# FolderAliasResolver (internal/application/clipfolder/).
#
# godlike/06 SSOT (one canonical owner per fact): this YAML is the
# SOLE source of truth for taxonomy aliases. The resolver reads it
# once at startup and exposes a typed ClipFolderRef{id, path,
# normalized_group} surface. No conditional folder logic (`if folder =
# "Boxe" {...}`) is permitted elsewhere in the codebase — every caller
# routes through FolderAliasResolver.Resolve(input).
#
# Conventions:
#   - alias key        : freely-formatted user input. The lookup
#                        normalises to lower-case + trim whitespace.
#                        Two keys that normalise to the same value are
#                        an error at load time (no silent override).
#   - path             : canonical, human-readable Drive folder name
#                        (e.g. "Boxe", "HipHop"). The first segment of
#                        the YouTubeClipPath hierarchy
#                        (`clips/{path}/{video_id}`). Operators see this
#                        string in Drive.
#   - normalized_group : lowercase routing key. The value that fills:
#                          media_assets.metadata_json.normalized_group
#                          Qdrant payload filter
#                          IndexDocument.NormalizedGroup field
#                        The resolver never invents this — operators
#                        must set it explicitly.
#   - folder_id        : OPTIONAL — explicit Drive folder ID. Empty
#                        ("") = caller resolves via
#                        delivery.Publisher.ResolveFolder(ctx,
#                        PublishRequest{DestinationYouTubeClip,
#                        Group: ref.Path}).
#                        Initial seeding leaves folder_id empty to
#                        honour "Niente nuove cartelle Drive, niente
#                        nuove colonne DB."
#
# Add new aliases here. NEVER inline a folder alias in Go source — the
# resolver would not see it.
# =============================================================================

folder_aliases:
  # ── Boxe ─────────────────────────────────────────────────
  boxe:
    path: Boxe
    normalized_group: boxe
    folder_id: ""
  boxing:
    path: Boxe
    normalized_group: boxe
    folder_id: ""
  pugilato:
    path: Boxe
    normalized_group: boxe
    folder_id: ""

  # ── WWE ──────────────────────────────────────────────────
  wwe:
    path: WWE
    normalized_group: wwe
    folder_id: ""
  wwee:
    path: WWE
    normalized_group: wwe
    folder_id: ""
  wrestling:
    path: WWE
    normalized_group: wwe
    folder_id: ""

  # ── HipHop ───────────────────────────────────────────────
  hiphop:
    path: HipHop
    normalized_group: hiphop
    folder_id: ""
  "hip-hop":
    path: HipHop
    normalized_group: hiphop
    folder_id: ""
  "hip hop":
    path: HipHop
    normalized_group: hiphop
    folder_id: ""

  # ── Rap ──────────────────────────────────────────────────
  rap:
    path: Rap
    normalized_group: rap
    folder_id: ""

  # ── Discovery ────────────────────────────────────────────
  discovery:
    path: Discovery
    normalized_group: discovery
    folder_id: ""

  # ── Celebrity ────────────────────────────────────────────
  celebrity:
    path: Celebrity
    normalized_group: celebrity
    folder_id: ""
