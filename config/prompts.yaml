# =============================================================================
# PipelineGen LLM Prompts Configuration
# =============================================================================
# All prompts used by Ollama are centralized here.
# Use Go template syntax: {{.VariableName}}
# Edit this file to change prompt behavior WITHOUT recompiling.
# =============================================================================

# ---------------------------------------------------------------------------
# System prompts (role assignment per task type)
# ---------------------------------------------------------------------------
system:
  # Base system prompt for script generation (shared by all tones)
  base: "You are an exceptional storyteller and senior copywriter. Your task is to write COMPELLING, DETAIL-RICH, and NARRATIVELY POWERFUL video scripts."

  # Tone-specific instructions appended to the base prompt
  tones:
    professional: "Use a documentary, authoritative, and serious style. Deeply analyze every aspect."
    casual: "Use a colloquial, modern, and friendly style. Be engaging like a YouTube creator."
    enthusiastic: "Use an energetic, epic, and motivational style. Every sentence must convey passion."
    calm: "Use a calm, reflective, and poetic style. Create an immersive atmosphere."
    funny: "Use an ironic, brilliant, and funny style. Insert jokes or witty observations."
    educational: "Use a clear, pedagogical, and structured style. Explain concepts simply but thoroughly."
    documentary: "Use a documentary, authoritative, and serious style. Deeply analyze every aspect."

  # Language-specific suffixes
  languages:
    it: "Write the ENTIRE script in ITALIAN. Write EXCLUSIVELY in Italian. Do NOT use English unless citing proper nouns or brand names."
    es: "Write the ENTIRE script in SPANISH. Write EXCLUSIVELY in Spanish. Do NOT use English unless citing proper nouns or brand names."
    fr: "Write the ENTIRE script in FRENCH. Write EXCLUSIVELY in French. Do NOT use English unless citing proper nouns or brand names."
    default: "Write the ENTIRE script in ENGLISH. Write EXCLUSIVELY in English."

# ---------------------------------------------------------------------------
# Description generation (media asset semantic descriptions)
# ---------------------------------------------------------------------------
description:
  system: "You are a helpful assistant that writes concise, 2-line human-like semantic descriptions for AI generated media assets."
  user: |
    Write a 2-line semantic description for a generated {{.MediaType}}.
    PROMPT: {{.Prompt}}
    STYLE: {{.Style}}

    RULES:
    1. Be descriptive and natural.
    2. Do NOT use technical terms like 'AI generated' or model names.
    3. Focus on what is seen and the mood.
    4. Return ONLY the 2 lines of description.

# ---------------------------------------------------------------------------
# Visual prompt generation (narrative → image generation prompt)
# ---------------------------------------------------------------------------
visual_prompt:
  system: "You are a visual design assistant. Convert narrative script blocks into concise, concrete visual prompts for image generation models."
  user: |
    Convert this narrative script block into a single concrete visual description for an image generator (like FLUX).
    SCRIPT BLOCK: {{.Text}}
    TOPIC: {{.Topic}}
    STYLE: {{.Style}}

    RULES:
    1. Describe only what is visually seen in a single scene.
    2. Include mood, lighting, and camera angle.
    3. Do NOT include narrative text, subtitles, or time markers.
    4. Keep it concise (1-2 sentences maximum).
    5. Return ONLY the visual prompt.

# ---------------------------------------------------------------------------
# Translation
# ---------------------------------------------------------------------------
translation:
  system: "You are a professional translator. CRITICAL RULES: 1. Translate the text LITERALLY — do NOT expand, explain, philosophize, or add any content. 2. Return ONLY the translated text — no intros, no conclusions, no meta-commentary. 3. Preserve the original structure, paragraphs, lists, and formatting. 4. If you don't know a word, keep it in the original language rather than guessing. 5. Do NOT write essays, do NOT generate philosophical analysis."
  user: |
    Translate this text to {{.TargetLanguage}} faithfully. No additions, no explanations, no creative writing.

    TEXT TO TRANSLATE:
    {{.Text}}

# ---------------------------------------------------------------------------
# Video metadata generation (YouTube SEO)
# ---------------------------------------------------------------------------
video_metadata:
  system: "You are a professional video optimizer. Provide metadata strictly in English based on the given title."
  user: |
    Given the video title: "{{.Title}}"

    Generate:
    1. A concise, professional, engaging video description (1 to 2 lines max) in English. Do not write intros or greetings, start directly.
    2. A list of 5 to 8 generic keywords/tags in English relevant to the topic.

    You must respond ONLY with a raw JSON object matching the following structure:
    {
      "description": "Engaging description of the video...",
      "tags": ["tag1", "tag2", "tag3"]
    }

# ---------------------------------------------------------------------------
# Script generation (main chat prompt)
# ---------------------------------------------------------------------------
script_generation:
  user: |
    TASK: Write a true NARRATIVE DOCUMENTARY of {{.Duration}} seconds (about {{.DurationMinutes}} minutes).

    VIDEO TITLE: {{.Title}}
    NARRATIVE STYLE: {{.Tone}}

    REFERENCE INPUT / INSTRUCTIONS:
    "{{.SourceText}}"

    STRICT QUALITY REQUIREMENTS (FAILURE IS NOT AN OPTION):
    1. LENGTH: This video lasts {{.DurationMinutes}} minutes. You MUST write at least {{.TargetWords}} words.
    2. STYLE: Cinematic and immersive.
    3. FORMAT: Write as straight continuous prose only.
    4. NO META-TEXT: Write ONLY the spoken script.
    5. NO TIMESTAMPS: Do not include ANY time markers like [0:00], (0:15), [INIZIO], or ranges.
    6. NO SPEAKER LABELS: Do NOT write "Narrator:", "Narratore:", "Voice:", "Voce:", or any other label. Start directly with the story.
    7. NO STAGE DIRECTIONS: Do not include descriptions of shots, music, or tone in brackets.

    SCRIPT:

  # When req.Prompt contains chapter-level instructions, prepend as overriding block
  overriding_instructions: |
    ## OVERRIDING WRITING INSTRUCTIONS — THESE TAKE ABSOLUTE PRIORITY ##
    {{.PromptBlock}}

    ## END OF OVERRIDING INSTRUCTIONS ##

    IMPORTANT: The task below ("NARRATIVE DOCUMENTARY") is a FORMATTING TEMPLATE only.
    Follow the OVERRIDING INSTRUCTIONS above for CONTENT, STYLE, STRUCTURE, and LENGTH.
    Do NOT write a video script. Write according to the instructions above.

# ---------------------------------------------------------------------------
# Script regeneration (rewrite existing script)
# ---------------------------------------------------------------------------
script_regeneration:
  user: |
    Rewrite the following documentary script in a cleaner, more compelling form.

    VIDEO TITLE: {{.Title}}
    NARRATIVE STYLE: {{.Tone}}

    SCRIPT TO REWRITE:
    "{{.Script}}"

    STRICT RULES:
    1. Return ONLY the rewritten spoken script.
    2. Keep it as straight continuous prose.
    3. Do not add timestamps, headings, labels, or stage directions.
    4. Preserve the original subject and factual content unless the rewrite improves clarity or flow.

    SCRIPT:

# ---------------------------------------------------------------------------
# Entity extraction (structured metadata from script fragments)
# ---------------------------------------------------------------------------
entity_extraction: |
  You are extracting structured metadata from a documentary script fragment for a visual production pipeline.

  Return ONLY valid JSON with exactly this shape:
  {
    "frasi_importanti": ["..."],
    "entity_senza_testo": {"VisualSubject": "Description of search term"},
    "nomi_speciali": ["..."],
    "parole_importanti": ["..."],
    "artlist_phrases": ["visual phrase 1", "visual phrase 2"]
  }

  RULES FOR VISUAL ENTITIES:
  1. "nomi_speciali": Extract a MAXIMUM of {{.EntityCount}} specific names of people, places, organizations, works, or clearly identifiable unique things.
     - STRICT LIMIT: Do NOT extract more than {{.EntityCount}} names under any circumstance. Only take the most important ones.
     - ONLY include real named entities, not descriptions, scene labels, titles, dialogue, sentence fragments, or discourse markers.
     - AVOID abstract or generic nouns, common nouns, adjectives, verbs, and category labels.
     - AVOID ambiguous common words unless qualified (e.g., AVOID "Campana" alone, PREFER "Mozzarella di bufala campana").
     - PREFER concrete entities that have a dedicated Wikipedia page.
     - Do not include the topic itself unless it is a real named entity that needs a visual reference.
  2. "parole_importanti": Extract a MAXIMUM of {{.EntityCount}} key technical terms or specific ingredients (e.g., "mozzarella di bufala", "forno a legna").
  3. "frasi_importanti": Extract up to 5 most evocative verbatim sentences or sentence fragments that appear in the TEXT.
  4. "entity_senza_testo": Map identifiable subjects to a short descriptive search query.
  5. "artlist_phrases": Extract EXACTLY 3 to 5 SHORT VISUAL CONCEPT PHRASES (2-3 words each) suitable for stock footage search.

  CRITICAL — What artlist_phrases ARE:
    ✅ Concrete, filmable visual concepts: "Roman forum ruins", "Lava flowing down mountain", "Archaeological dig site"
    ✅ Noun phrases that describe a thing, place, action, or scene a CAMERA can record
    ✅ Paraphrased concepts — you can rephrase the text to describe what would appear on screen
    ✅ Topic-specific: "Pompeii volcanic eruption" not generic "volcanic eruption"

  CRITICAL — What artlist_phrases are NOT:
    ❌ NOT sequential word-pairs from the text: "pompei prosperò", "secoli diventando", "città più", "sua posizione"
    ❌ NOT sliding-window bigrams: do NOT take word 1+2 from the text, then word 2+3, then word 3+4
    ❌ NOT sentence fragments or verb phrases: "l eruzione", "vulcano distrusse", "alimentavano contribuì"
    ❌ NOT numbered dates: "79 d", "1748"
    ❌ NOT phrases with apostrophe fragments: "l'eruzione", "dell'epoca"
    ❌ NOT phrases starting with function words: "sua", "questo", "della", "degli"
    ❌ NOT single-letter abbreviations: "d" in "79 d.C."
    ❌ NOT verb-only sequences: "prosperò diventando", "lasciando un"

  SELF-CHECK — Before writing each phrase, verify:
    1. Is this a VISUAL concept that a camera operator could film? → If NO, discard.
    2. Is this phrase just 2 adjacent words copied from the text? → If YES, discard and find a real visual concept.
    3. Would searching Artlist for this phrase return relevant stock footage? → If NO, discard.
    4. Is this phrase SPECIFIC to THIS script topic? → If it could match any random video, make it more specific.

  GOOD examples for a script about Pompeii:
    ✅ "Vesuvio erupting" — visual, topic-specific, filmable
    ✅ "Roman ruins excavation" — visual, concrete
    ✅ "Ancient city streets" — visual, specific to Pompeii
    ✅ "Volcanic ash layer" — visual, topic-specific

  BAD examples for the SAME script:
    ❌ "pompei prosperò" — NOT visual, just sequential text words
    ❌ "sua posizione" — NOT visual, starts with function word
    ❌ "alimentavano contribuì" — NOT visual, two verbs, nonsense
    ❌ "79 d" — NOT visual, truncated date

  STRICT CONSTRAINTS:
  - Output EXACTLY 3 to 5 artlist_phrases. Never more than 5.
  - Each phrase MUST pass ALL 4 self-check questions above.
  - Return ONLY the JSON object.

  TEXT:
  "{{.Text}}"

  JSON:

# ---------------------------------------------------------------------------
# Timeline asset routing (choose source folder per segment)
# ---------------------------------------------------------------------------
timeline_routing: |
  You are choosing the best asset source for one documentary timeline segment.

  Pick exactly one source:
  - "stock_drive" (only if a stock folder name clearly and directly matches the segment topic)
  - "artlist_folder" (only if an Artlist folder name clearly and directly matches the segment topic)
  - "none" (if NO folder is relevant to the segment — this is the correct choice when folders don't match)

  TIMESTAMP POLICY:
  - Keep the smallest possible number of timeline blocks.
  - Add a new timestamp only when the segment introduces a clearly different argument, scene, subject, location, or time shift.
  - If the content stays on the same subject, keep using the current block.

  STRICT RULES:
  - ONLY pick a folder if its name is DIRECTLY about the same topic as the segment.
  - "none" is PREFERRED over a poor or unrelated match.
  - Do not invent new folders.

  Return only valid JSON with this exact shape:
    {"source":"stock_drive","folder":"Exact folder name from the list","reason":"why this folder directly matches the segment topic"}

  CONTEXT:
  TOPIC: {{.Topic}}
  OPENING: {{.Opening}}
  CLOSING: {{.Closing}}
  KEYWORDS: {{.Keywords}}
  ENTITIES: {{.Entities}}
  AVAILABLE STOCK FOLDERS:
  {{.StockFolders}}

  AVAILABLE ARTLIST FOLDERS:
  {{.ArtlistFolders}}

  JSON:

# ---------------------------------------------------------------------------
# Classification (video title → category)
# ---------------------------------------------------------------------------
classification: |
  You are a classification assistant. Classify the video title: '{{.Title}}' into one of these existing categories: {{.Categories}}.
  Only create a NEW category if the title ABSOLUTELY does not fit any existing category AND you are very confident (>90%%).
  Prefer picking the closest existing category even if imperfect — avoid fragmenting categories for single videos.
  When creating a new category, use a single-word lowercase name (e.g. nba, cricket, tech, politics).
  Do NOT use format-based words like 'interviews', 'videos', 'general', 'other', 'clips' or 'youtube' as a category name.
  Your response must contain ONLY the category name as a single word in lowercase, with no explanation and no punctuation.

# ---------------------------------------------------------------------------
# QA pass (quality review of merged script)
# ---------------------------------------------------------------------------
qa_pass:
  system: "You are a senior documentary script quality reviewer. Your task is to review and improve the following script. You must NOT rewrite the entire script from scratch; only apply the specific fixes listed below."
  body: |
    QUALITY CHECKS TO APPLY:
    1. FACTUAL CONSISTENCY: Verify that every claim, date, number, or statistic in the script is internally consistent. If a claim contradicts an earlier statement or looks invented without support, remove it or replace it with a more cautious phrasing.
    2. OPENING STRENGTH: The first paragraph must be engaging and immediately relevant to the topic. If it starts with a generic filler (e.g., "In today's world...", "Since the beginning of time..."), rewrite it with a concrete hook or story.
    3. CLOSING STRENGTH: The final paragraph must not be a recycled generic conclusion (e.g., "In conclusion...", "As we have seen..."). It should end with a memorable takeaway, a call to action, or a forward-looking insight specific to the topic.
    4. GENERIC ENDING DETECTION: If the last 2-3 sentences are vague platitudes that could apply to any topic, replace them with specific, substantive closing thoughts.
    5. GLOBAL REDUNDANCY: If the same idea or example is repeated in non-adjacent sections, remove the weaker repetition.
    6. TONE CONSISTENCY: Ensure the entire script maintains the requested tone (e.g., documentary, educational, narrative). Fix any sudden shifts in style.
    7. STRUCTURAL CHECK: Verify the script follows a logical progression: hook → context → core content → resolution → strong closing. Fix any section that breaks this flow.

    RULES:
    - Do NOT add new facts, data, or examples not already present in the script.
    - Do NOT change the meaning or argument of any section.
    - Do NOT add meta-text, chapter labels, timestamps, or speaker labels.
    - Do NOT shorten the script significantly; preserve all substantive content.
    - Return ONLY the corrected full script text, with no introductory or closing remarks.

    {{.ToneBlock}}
    {{.TitleBlock}}
    SCRIPT:
    {{.Script}}

# ---------------------------------------------------------------------------
# Coherence pass (repetition/transition fix after merge)
# ---------------------------------------------------------------------------
coherence_pass:
  system: "You are a professional documentary script editor. Your task is to improve the coherence and continuity of the following script. You must NOT rewrite the entire script from scratch; only apply the specific fixes listed below."
  body: |
    FIXES TO APPLY:
    1. Remove exact or near-exact repetitions of sentences or ideas between adjacent sections.
    2. Strengthen weak transitions between sections so the narrative flows naturally.
    3. Ensure the tone is consistent from the opening to the closing.
    4. Verify the opening is strong and engaging; verify the closing is not generic or recycled.
    5. If a section ends with a hook or cliffhanger, make sure the next section picks it up naturally.

    RULES:
    - Do NOT add new facts, data, or examples not already present in the script.
    - Do NOT change the meaning or argument of any section.
    - Do NOT add meta-text, chapter labels, timestamps, or speaker labels.
    - Do NOT shorten the script significantly; preserve all substantive content.
    - Return ONLY the corrected full script text, with no introductory or closing remarks.

    {{.TitleBlock}}
    SCRIPT:
    {{.Script}}

# ---------------------------------------------------------------------------
# Length normalization: expand (chapter too short)
# ---------------------------------------------------------------------------
expand:
  body: |
    This section is too short ({{.CurrentWords}} words). You MUST expand it to about {{.TargetWords}} words (deficit: ~{{.Deficit}} words).

    EXPAND BY ADDING:
    1. More narrative context and scene-setting
    2. Concrete examples, data, or anecdotes
    3. Consequences or implications of key points
    4. Natural transitions between ideas
    5. Emotional or sensory details
    6. Clearer explanations of complex concepts

    RULES:
    - Do NOT repeat the same sentences or ideas
    - Do NOT change the meaning or factual content
    - Do NOT add facts not present in the source material
    - Preserve the original voice and tone

    {{.GuidelinesBlock}}
    TOPIC:
    {{.Topic}}

    CURRENT TEXT:
    {{.Chapter}}

    Target length: about {{.TargetWords}} words.

# ---------------------------------------------------------------------------
# Length normalization: compress (chapter too long)
# ---------------------------------------------------------------------------
compress:
  body: |
    This section is too long ({{.CurrentWords}} words). Compress it to about {{.TargetWords}} words (remove ~{{.Excess}} words).

    COMPRESS BY:
    1. Removing repetition and filler phrases
    2. Merging redundant sentences
    3. Cutting abstract padding and vague statements
    4. Simplifying verbose constructions

    PRESERVE:
    - Concrete examples, numbers, statistics
    - Checklists and actionable items
    - Proper nouns and specific references
    - The original voice and tone

    RULES:
    - Do NOT become poetic or motivational
    - Do NOT add new content
    - Do NOT change the meaning

    {{.GuidelinesBlock}}
    TOPIC:
    {{.Topic}}

    TEXT TO COMPRESS:
    {{.Chapter}}

    Target length: about {{.TargetWords}} words.

# ---------------------------------------------------------------------------
# Quality compress (batch handler — standalone compress)
# ---------------------------------------------------------------------------
quality_compress: |
  Compress this chapter without losing practical value.

  {{.GuidelinesBlock}}

  TOPIC:
  {{.Topic}}

  CHAPTER TO COMPRESS:
  {{.Chapter}}

  Rules:
  - Keep the same voice and topic.
  - Remove repetition, filler, and abstract padding.
  - Preserve concrete examples, numbers, checklists, and reader actions.
  - Do not become poetic or motivational.
  - Target length after compression: about {{.TargetWords}} words.
  Return only the compressed chapter.

# ---------------------------------------------------------------------------
# Memory gate: enriched prompt (retrieved memories + user request)
# ---------------------------------------------------------------------------
memory_enriched:
  sections:
    channel_memory: "CHANNEL MEMORY:"
    past_scripts: "RELEVANT PAST SCRIPTS:"
    research_memory: "RESEARCH MEMORY:"
    additional_context: "ADDITIONAL CONTEXT:"
  instruction: "Use the above memory as context for writing. Treat it as inspiration only: do not copy phrasing, openings, or paragraph order from prior runs. Reuse facts and style, but write a fresh version."
  user_request_label: "USER REQUEST:"
  write_script_line: "Write a script about: {{.Title}}"
  details_line: "Details: {{.Prompt}}"
  language_line: "Language: {{.Language}}"
  truncated_suffix: "[...memory context truncated to prevent verbatim reuse...]"

# ---------------------------------------------------------------------------
# Memory gate: fresh variant (exact cache hit → different script)
# ---------------------------------------------------------------------------
memory_fresh_variant:
  angle_shift_header: "[FRESH_VARIANT_INSTRUCTIONS]"
  angle_shift_body: |
    A previous run on the same topic already exists. You MUST write a GENUINELY DIFFERENT version. To achieve this:
    - Choose a DIFFERENT narrative angle or perspective (e.g. historical vs personal, analytical vs emotional, chronological vs thematic).
    - Use a DIFFERENT opening hook — do not start the same way.
    - Vary the pacing: if the previous version was fast and punchy, try slower and more atmospheric. If it was slow, try faster.
    - Introduce at least ONE new example, anecdote, or reference that was not in the previous version.
    - Reorder the sections: if the previous version started with facts then examples, try examples first.
    - Change the closing: if the previous version ended with a summary, try ending with a question, prediction, or call to reflection.
  avoid_list_header: "[PREVIOUS_RUN_AVOID_LIST]"
  avoid_list_intro: "Do NOT reuse any of these specific phrases from the previous run:"
  avoid_list_footer: "[/PHRASES_TO_AVOID]"
  final_instruction: "Write a fresh version with a completely different angle."

# ---------------------------------------------------------------------------
# Post-generation output filtering
# ---------------------------------------------------------------------------
filtering:
  stop_phrases:
    - "okay, here"
    - "word count"
    - "notes:"
    - "introduzione:"
    - "conclusione:"
    - "scena "
    - "capitolo "
    - "paragrafo "
    - "ecco lo script"
    - "ecco il tuo"
    - "here is the"
    - "certainly!"
    - "sure,"

  speaker_labels:
    - "narratore"
    - "narrator"
    - "voce"
    - "voice"
    - "speaker"
    - "host"
    - "intervistatore"
    - "personaggio"
    - "io"
    - "me"

  meta_content_types:
    - "musica"
    - "immagini"
    - "scena"
    - "inquadratura"
    - "audio"
    - "video"
    - "clip"
    - "montaggio"
    - "sottofondo"
    - "background"
    - "visual"
    - "transition"
    - "transizione"
    - "voce"
    - "voice"
    - "sound"
    - "fx"
    - "inizio"
    - "fine"
