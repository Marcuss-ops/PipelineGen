# Alerting Rules for Velox Go-Live
# SLO: 99.9% availability, p99 < 500ms, Error Rate < 0.1%

groups:
  - name: velox_critical
    interval: 30s
    rules:
      # CRITICAL: High Error Rate
      - alert: VeloxHighErrorRate
        expr: |
          (
            sum(rate(stock_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(stock_requests_total[5m]))
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          team: backend
          service: velox-go
        annotations:
          summary: "🚨 Velox Go error rate > 1%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          runbook_url: "https://wiki.velox.io/runbooks/high-error-rate"
          action: "Considera rollback: ./scripts/emergency_rollback.sh"

      # CRITICAL: High Latency p99
      - alert: VeloxHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(stock_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: critical
          team: backend
          service: velox-go
        annotations:
          summary: "🚨 Velox Go p99 latency > 1s"
          description: "p99 latency is {{ $value }}s"
          runbook_url: "https://wiki.velox.io/runbooks/high-latency"
          action: "Verifica load e considera scale-up"

      # CRITICAL: Service Down
      - alert: VeloxGoDown
        expr: up{job="velox-go"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
          service: velox-go
        annotations:
          summary: "🔥 Velox Go backend DOWN!"
          description: "Go backend has been down for more than 1 minute"
          runbook_url: "https://wiki.velox.io/runbooks/service-down"
          action: "ESEGUI: ./scripts/emergency_rollback.sh"

      # WARNING: Error Rate approaching threshold
      - alert: VeloxErrorRateWarning
        expr: |
          (
            sum(rate(stock_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(stock_requests_total[5m]))
          ) > 0.005
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Velox Go error rate > 0.5%"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # WARNING: Latency p95 high
      - alert: VeloxLatencyP95Warning
        expr: |
          histogram_quantile(0.95,
            sum(rate(stock_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Velox Go p95 latency > 500ms"
          description: "p95 latency is {{ $value }}s"

      # INFO: Low throughput (may indicate issues)
      - alert: VeloxLowThroughput
        expr: sum(rate(stock_requests_total[5m])) < 10
        for: 10m
        labels:
          severity: info
          team: backend
          service: velox-go
        annotations:
          summary: "ℹ️ Velox Go throughput low"
          description: "Throughput is {{ $value }} req/s"

  - name: velox_slo
    interval: 1m
    rules:
      # SLO: Availability 99.9%
      - alert: VeloxSLOAvailability
        expr: |
          (
            1 - (
              sum(rate(stock_requests_total{status=~"5.."}[1h]))
              /
              sum(rate(stock_requests_total[1h]))
            )
          ) < 0.999
        for: 5m
        labels:
          severity: critical
          team: backend
          service: velox-go
          slo: availability
        annotations:
          summary: "🚨 SLO Breach: Availability < 99.9%"
          description: "Current availability: {{ $value | humanizePercentage }}"
          action: "Pagina il on-call engineer immediatamente"

      # SLO: Error Rate < 0.1%
      - alert: VeloxSLOErrorRate
        expr: |
          (
            sum(rate(stock_requests_total{status=~"5.."}[1h]))
            /
            sum(rate(stock_requests_total[1h]))
          ) > 0.001
        for: 10m
        labels:
          severity: critical
          team: backend
          service: velox-go
          slo: error-rate
        annotations:
          summary: "🚨 SLO Breach: Error Rate > 0.1%"
          description: "Current error rate: {{ $value | humanizePercentage }}"

      # SLO: Latency p99 < 500ms
      - alert: VeloxSLOLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(stock_request_duration_seconds_bucket[1h])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: critical
          team: backend
          service: velox-go
          slo: latency
        annotations:
          summary: "🚨 SLO Breach: p99 Latency > 500ms"
          description: "Current p99: {{ $value }}s"

  - name: velox_system
    interval: 30s
    rules:
      # WARNING: High memory usage
      - alert: VeloxHighMemory
        expr: go_memstats_heap_inuse_bytes / 1024 / 1024 > 1024
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Velox Go memory usage > 1GB"
          description: "Current heap: {{ $value | humanize }}MB"

      # WARNING: High goroutine count
      - alert: VeloxHighGoroutines
        expr: go_goroutines > 1000
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Velox Go goroutines > 1000"
          description: "Current goroutines: {{ $value }}"
          action: "Possibile goroutine leak, verifica codice"

      # WARNING: High GC pause
      - alert: VeloxHighGCPause
        expr: rate(go_gc_duration_seconds_sum[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Velox Go GC pause high"
          description: "GC pause: {{ $value }}s"
          action: "Considera tuning GOGC"

  - name: velox_deprecation
    interval: 5m
    rules:
      # ── Zero-Legacy §07 deprecation counters (PR 9, June 2026) ─────────
      # Backing metrics (Prometheus name): curate_legacy_invocations_total,
      # legacy_array_to_output_invocations_total. Spec asked for _per_day
      # suffix; canonical increment naming is _total (OpenMetrics); ops
      # derive per-day via increase(...[1d]). See metrics.go.

      # CRITICAL (long-term gate): MediaCurator.Curate zeroed for 30 days.
      # Removal deadline per DL-CURATIONTYPES-001: 2026-09-27.
      # Steady-state gate is "zero for 30 consecutive calendar days" — the
      # for:30d below is the dashboard-level stale-detection; the actual
      # deadline is tracked manually via the TemporalCounter rate().
      - alert: CurateLegacyNonZeroDaily
        expr: increase(curate_legacy_invocations_total[1d]) > 0
        for: 1h
        labels:
          severity: warning
          team: scripts
          service: velox-go
          deprecation: DL-CURATIONTYPES-001
          ticket: Wave-12 owner ticket
        annotations:
          summary: "🟡 DL-CURATIONTYPES-001 still producing legacy /curate calls"
          description: |
            curate_legacy_invocations_total increased by {{ $value }} in the
            past 24h. The deprecated MediaCurator.Curate entry point is
            still being exercised. Removal deadline: 2026-09-27
            (90-day grace). Migrate callers to SourceCurate +
            GenerateOneUseCase pipeline. Triggered for source
            label: {{ $labels.source }}.

      # INFO: zero-invocation signal — celebrate migration completion. The
      # gate is "== 0 for 30 consecutive calendar days" not "stays 0";
      # operators periodically cross-check this alert's silence as the
      # canonical evidence the deadlines can collapse.
      - alert: CurateLegacyZeroInvocations
        expr: increase(curate_legacy_invocations_total[7d]) == 0
        for: 7d
        labels:
          severity: info
          team: scripts
          service: velox-go
          deprecation: DL-CURATIONTYPES-001
        annotations:
          summary: "✅ curate_legacy_invocations_total silently zero for 7d"
          description: |
            No legacy /curate calls in last 7 calendar days. Continue
            silence check for 30 consecutive calendar days before
            removing DL-CURATIONTYPES-001 entirely.

      # CRITICAL (contract regression fresh path):
      # legacy_array_to_output_invocations_total{source="fresh"} should
      # ALWAYS be zero — the fresh-generation decoder is DecodeModelOutput
      # only (PR 1 enforces V1 on the wire side via Ollama JSON-mode
      # + v1OutputInstruction suffix). Non-zero on the fresh label is a
      # canonical V1 contract regression: the model is emitting legacy
      # array shape and the engine is forced to fall back.
      - alert: LegacyArrayToOutputFreshRegression
        expr: increase(legacy_array_to_output_invocations_total{source="fresh"}[1h]) > 0
        for: 5m
        labels:
          severity: critical
          team: scripts
          service: velox-go
          deprecation: DL-COMPAT-LEGACYDECODER-001
        annotations:
          summary: "🔥 V1 contract regression — legacy decoder required on fresh-generation path"
          description: |
            legacy_array_to_output_invocations_total{source="fresh"}
            incremented by {{ $value }} in the last hour. The fresh
            ollama-output decoder is required to fall back to the legacy
            array shape, meaning the V1 contract is being violated by the
            model. Investigate the model / prompt side; consider rolling
            back the model to the prior version. Removal deadline:
            2026-12-31 (180-day grace).

      # INFO (cache path tolerance): legacy cache replays of pre-V1 rows
      # are LEGITIMATE during the migration window (PR 1 contract: new
      # writes are V1-only, but old cache rows must still decode). This
      # alert fires only on sustained high volume (>1000/day) — a
      # dashboard signal that the cache eviction sweep isn't keeping
      # pace with migration.
      - alert: LegacyArrayToOutputCacheReplayHigh
        expr: increase(legacy_array_to_output_invocations_total{source="cache"}[1d]) > 1000
        for: 1h
        labels:
          severity: info
          team: scripts
          service: velox-go
          deprecation: DL-COMPAT-LEGACYDECODER-001
        annotations:
          summary: "ℹ️ Legacy cache replay daily rate > 1000"
          description: |
            {{ $value }} legacy cache replays in the past 24h. Consider
            shrinking the memory-cache TTL (gemmamemory.Service) or
            proactively evicting pre-V1 rows. Removal deadline threshold:
            0 invocations for 60 consecutive days. Source label: cache.

  - name: velox_canary
    interval: 15s
    rules:
      # CRITICAL: Canary error rate high
      - alert: VeloxCanaryHighErrorRate
        expr: |
          (
            sum(rate(stock_requests_total{backend="go",status=~"5.."}[2m]))
            /
            sum(rate(stock_requests_total{backend="go"}[2m]))
          ) > 0.05
        for: 1m
        labels:
          severity: critical
          team: backend
          service: velox-go
          canary: "true"
        annotations:
          summary: "🚨 CANARY ALERT: Error rate > 5%"
          description: "Canary error rate: {{ $value | humanizePercentage }}"
          action: "ROLLBACK IMMEDIATO: ./scripts/emergency_rollback.sh"

  - name: velox_orphan_sweeper
    interval: 5m
    rules:
      # WARNING (P0 #4 commit B/2, July 2026) — OrphanSweeper is the
      # background reconciliation loop for upload_intents stale rows.
      # A non-zero rate is a rare-but-real signal: the canonical path
      # is ZERO (the voiceover pipeline should complete every upload
      # without leaving rows at 'pending'/'uploaded' beyond their
      # TTLs). A persistent non-zero rate means upstream flakiness
      # in the voiceover pipeline stage — investigate the stage
      # failure logs.
      - alert: OrphanSweeperModerateReconcile
        expr: increase(orphan_sweeper_reconciled_total[1h]) > 5
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
        annotations:
          summary: "⚠️ Orphan sweeper reconciliations > 5/h"
          description: |
            orphan_sweeper_reconciled_total increased by {{ $value }} in the
            past hour. The voiceover pipeline is leaving intent rows
            stale past their TTL — investigate the pipeline stage
            failure logs. Outcome label: {{ $labels.outcome }}.

      # CRITICAL (P0 #4 commit B/2, July 2026) — Sustained high rate
      # indicates a systemic issue (Drive API outage / DB write
      # stall). Page on-call immediately.
      - alert: OrphanSweeperHighReconcile
        expr: increase(orphan_sweeper_reconciled_total[1h]) > 50
        for: 5m
        labels:
          severity: critical
          team: backend
          service: velox-go
        annotations:
          summary: "🚨 Orphan sweeper reconciliations > 50/h"
          description: |
            orphan_sweeper_reconciled_total increased by {{ $value }} in the
            past hour — sustained high rate. The voiceover pipeline is
            in a recovery loop. Pattern hints: outcome="pending_timeout"
            suggests DB writes are failing; outcome="uploaded_cleanup"
            suggests Drive API is flapping. Outcome label:
            {{ $labels.outcome }}. Page on-call.

  - name: velox_voiceover
    interval: 30s
    rules:
      # CRITICAL: voiceover job failures in the last 5 minutes.
      # voiceover_jobs_total{status="failed"} is a counter — any
      # increase means at least one voiceover pipeline execution
      # terminated with StatusFailed (any stage: TTS, audio post,
      # publish, finalize). A single failure may be a transient
      # backoff, but sustained failures signal a systemic issue.
      - alert: VoiceoverJobsFailed
        expr: increase(voiceover_jobs_total{status="failed"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          team: backend
          service: velox-go
          pipeline: voiceover
        annotations:
          summary: "🚨 Voiceover job failures detected"
          description: |
            voiceover_jobs_total{status="failed"} increased by
            {{ $value }} in the last 5 minutes. At least one
            voiceover pipeline execution terminated with
            StatusFailed. Check the voiceover pipeline stage logs
            (ProcessSegmentUseCase.Execute) for the failing stage.

      # CRITICAL: Drive upload failures in the voiceover pipeline.
      # drive_upload_failures_total is incremented ONLY when
      # VoiceoverPublisher.Publish returns a non-nil error. More
      # than 3 failures in 5 minutes suggests a Drive API outage
      # or token-expiry issue — the orphan sweeper will clean up
      # any stale rows, but sustained failures block the pipeline.
      - alert: VoiceoverDriveUploadFailures
        expr: increase(drive_upload_failures_total[5m]) > 3
        for: 2m
        labels:
          severity: critical
          team: backend
          service: velox-go
          pipeline: voiceover
        annotations:
          summary: "🚨 Voiceover Drive upload failures > 3 in 5m"
          description: |
            drive_upload_failures_total increased by {{ $value }}
            in the last 5 minutes. Drive uploads in the voiceover
            pipeline are failing at an elevated rate. Check Drive
            API health and token validity. The orphan sweeper will
            recover stale rows, but sustained failures will block
            the pipeline.

      # CRITICAL: TTS synthesis failures in the voiceover pipeline.
      # tts_failures_total is incremented when TTSProvider.Synthesize
      # returns an error (after all retries + circuit breaker). More
      # than 5 failures in 5 minutes means the TTS backend (edge-tts
      # or the Python bridge) is likely down — check the circuit
      # breaker state (it may have opened) and the Python process.
      - alert: VoiceoverTTSFailures
        expr: increase(tts_failures_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
          team: backend
          service: velox-go
          pipeline: voiceover
        annotations:
          summary: "🚨 Voiceover TTS failures > 5 in 5m"
          description: |
            tts_failures_total increased by {{ $value }} in the
            last 5 minutes. TTS synthesis is failing at an
            elevated rate. Check: (1) edge-tts / Python bridge
            health, (2) the TTS circuit breaker state (may have
            opened), (3) CPU/memory on the TTS host.

      # CRITICAL: voiceover translation failures in the promo path.
      # TranslationFailuresTotal is incremented from the translator
      # closure in build_bundles_voiceover.go. More than 2 failures
      # in 5 minutes means the Ollama translation backend is
      # unavailable or returning errors — promo generation will
      # silently fall back to untranslated text.
      - alert: VoiceoverTranslationFailures
        expr: increase(translation_failures_total[5m]) > 2
        for: 2m
        labels:
          severity: critical
          team: backend
          service: velox-go
          pipeline: voiceover
        annotations:
          summary: "🚨 Voiceover translation failures > 2 in 5m"
          description: |
            translation_failures_total increased by {{ $value }}
            in the last 5 minutes. The Ollama translation backend
            for voiceover promo generation is returning errors.
            Promo text will silently fall back to untranslated.
            Check Ollama server health and the translation model.

      # WARNING: voiceover stage duration p99 exceeds 60 seconds.
      # voiceover_stage_duration_seconds is a histogram partitioned
      # by stage (tts / audio_post / publish / finalize). p99 > 60s
      # on any stage indicates severe pipeline degradation — the
      # Prometheus histogram_quantile function computes the 99th
      # percentile from the bucket distribution.
      - alert: VoiceoverStageDurationHigh
        expr: |
          histogram_quantile(0.99,
            sum(rate(voiceover_stage_duration_seconds_bucket[5m])) by (le, stage)
          ) > 60
        for: 5m
        labels:
          severity: warning
          team: backend
          service: velox-go
          pipeline: voiceover
        annotations:
          summary: "⚠️ Voiceover stage p99 latency > 60s"
          description: |
            voiceover_stage_duration_seconds p99 is
            {{ $value }}s for stage {{ $labels.stage }}.
            The voiceover pipeline is experiencing severe
            latency degradation. Check the affected stage:
            - tts: edge-tts / Python bridge may be overloaded
            - publish: Drive API may be slow or throttled
            - finalize: SQLite may be under contention
