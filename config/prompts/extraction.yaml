entity_extraction: |
  You are extracting structured metadata from ONE documentary script segment for a visual production pipeline.

  DO NOT output JSON, JSON objects, or JSON arrays.
  DO NOT output markdown fences, code blocks, or backticks.
  DO NOT output scene IDs, indexes, or bindings.

  Output EXACTLY six labeled sections using "## SectionName" headers.
  Every item must start with "- ".

  ## frasi_importanti
  - [first evocative sentence verbatim from the segment]
  - [second evocative sentence verbatim from the segment]

  ## entity_senza_testo
  - VisualSubject1: precise visual search description
  - VisualSubject2: precise visual search description

  ## nomi_speciali
  - PERSON: [full person name]
  - PLACE: [specific city, country, landmark, or location]
  - ORGANIZATION: [company, institution, team, or group]

  ## parole_importanti
  - [specific technical term, object, ingredient, action, or concrete concept]

  ## artlist_phrases
  - [short visual concept phrase]

  ## noun_chunks
  - [source-grounded noun phrase copied verbatim from the segment]

  RULES FOR ENTITY PRECISION:
  1. "nomi_speciali": Extract a MAXIMUM of {{.EntityCount}} real named entities.
     - Every item MUST use exactly "TYPE: Value".
     - Allowed TYPE values: PERSON, PLACE, ORGANIZATION, EVENT, WORK, PRODUCT, OTHER.
     - Use OTHER only for a clearly named entity that does not fit the other types.
     - Never label a generic noun, adjective, verb, title, sentence fragment, or scene description as an entity.
     - Prefer complete, unambiguous names that identify one real-world subject.
     - Do not guess a type. Omit uncertain names rather than inventing entities.
  2. "parole_importanti": Extract a MAXIMUM of {{.EntityCount}} concrete, segment-specific keywords.
     - Prefer nouns and noun phrases useful for image/video retrieval.
     - Reject stop words, generic words, repeated names, dates without context, and vague abstractions.
  3. "frasi_importanti": Extract up to 5 evocative verbatim fragments that actually appear in the segment.
  4. "entity_senza_testo": Map identifiable visual subjects to concise, concrete search descriptions using "Subject: Description".
  5. "artlist_phrases": Extract EXACTLY 3 to 5 SHORT VISUAL CONCEPT PHRASES, ideally 2-4 words, suitable for stock-footage search.

  ARTLIST PHRASES MUST BE:
    - Concrete and filmable by a camera.
    - Specific to this segment and its named entities.
    - Natural search phrases, not adjacent word pairs copied mechanically from the text.
    - Free of dangling articles, apostrophe fragments, isolated dates, and verb-only sequences.

  GOOD examples for a segment about Pompeii:
    - Vesuvio erupting
    - Roman ruins excavation
    - Ancient city streets
    - Volcanic ash layer

  BAD examples:
    - pompei prosperò
    - sua posizione
    - alimentavano contribuì
    - 79 d

  SELF-CHECK for every artlist phrase:
    1. Can a camera record it?
    2. Is it more than a random adjacent word pair?
    3. Would it return relevant Artlist footage?
    4. Is it specific to this segment?

  Output ONLY the six labeled sections.

  TEXT:
  "{{.Text}}"

timeline_routing: |
  You are choosing the best asset source for one documentary timeline segment.

  Pick exactly one source:
  - "stock_drive" (only if a stock folder name clearly and directly matches the segment topic)
  - "artlist_folder" (only if an Artlist folder name clearly and directly matches the segment topic)
  - "none" (if NO folder is relevant to the segment — this is the correct choice when folders don't match)

  TIMESTAMP POLICY:
  - Keep the smallest possible number of timeline blocks.
  - Add a new timestamp only when the segment introduces a clearly different argument, scene, subject, location, or time shift.
  - If the content stays on the same subject, keep using the current block.

  STRICT RULES:
  - ONLY pick a folder if its name is DIRECTLY about the same topic as the segment.
  - "none" is PREFERRED over a poor or unrelated match.
  - Do not invent new folders.

  Return only valid JSON with this exact shape:
    {"source":"stock_drive","folder":"Exact folder name from the list","reason":"why this folder directly matches the segment topic"}

  CONTEXT:
  TOPIC: {{.Topic}}
  OPENING: {{.Opening}}
  CLOSING: {{.Closing}}
  KEYWORDS: {{.Keywords}}
  ENTITIES: {{.Entities}}
  AVAILABLE STOCK FOLDERS:
  {{.StockFolders}}

  AVAILABLE ARTLIST FOLDERS:
  {{.ArtlistFolders}}

  JSON:

classification: |
  You are a classification assistant. Classify the video title: '{{.Title}}' into one of these existing categories: {{.Categories}}.
  Only create a NEW category if the title ABSOLUTELY does not fit any existing category AND you are very confident (>90%%).
  Prefer picking the closest existing category even if imperfect — avoid fragmenting categories for single videos.
  When creating a new category, use a single-word lowercase name (e.g. nba, cricket, tech, politics).
  Do NOT use format-based words like 'interviews', 'videos', 'general', 'other', 'clips' or 'youtube' as a category name.
  Your response must contain ONLY the category name as a single word in lowercase, with no explanation and no punctuation.
