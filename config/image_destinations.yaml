# =============================================================================
# PipelineGen Image Destinations — Drive folder routing table
# (FASE 2D EXPAND, July 2026).
# =============================================================================
# Logical destination_key (e.g. "ai-images/cinematic", as set in
# config/generation_styles.yaml) -> Google Drive folder ID.
#
# Resolution order (DestinationResolver):
#   1. case-insensitive lookup of the key in this YAML
#   2. if absent OR mapped to empty string -> constructor fallback
#      (currently cfg.Drive.ImagesFolder() →
#       DefaultImagesRootFolderID = 1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy)
#
# Per-image Drive layout (AC-compliant): every image — retrieved or
# generated — lives under the single dedicated root as
# <1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy>/<SafeFolderName(subject)>/<file>
# with ImagePath = [subject] and ConflictSkip. The 17 per-style entries
# below are RETIRED: they previously mirrored
# internal/capabilities/images/storage_drive.go::aiImageDriveRootForSource;
# the style-specific roots are now unified. Keeping them with the SAME
# canonical root documents the migration; the resolver fallback covers
# any unlisted style.
# Spec: download-once — an image is downloaded once at runtime then
# reused permanently from Drive without re-download.
# =============================================================================

destinations:
  # ── Retired per-style roots → unified per-image root (single SubFolder per image)
  # Every style now points to the canonical per-image root so a new style
  # never silently re-creates a style-scoped tree. The file is retained as an
  # explicit allowlist with post-migration documentation.
  ai-images/realistic:        "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/cartoon:          "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/medieval:         "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/cyberpunk:        "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/watercolor:       "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/3d-render:        "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/sketch:           "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/cinematic:        "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/whiteboard:       "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/kawaii:           "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/anime:            "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/retro-print:      "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/heritage:         "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/papercraft:       "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/professional-doc: "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/gothic:           "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
  ai-images/oil-painting:     "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"

  # ── Default fallback key — resolves to the same per-image root via fallback
  ai-images/default: "1-jaglYikruz_OkXlg_L07ZcU-ii5fiRy"
