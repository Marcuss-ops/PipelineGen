# Canonical AI image styles.
#
# Provider/model selection is intentionally absent from individual styles:
# PipelineGen has one AI-image backend only — Google Slides through
# Chrome/Playwright — and one model, nano-banana-pro. The generated-image
# registry enforces that invariant globally.

styles:
  - name: "realistic"
    display_name: "Realistic"
    version: 2
    prompt_suffix: >-
      extremely detailed, realistic, 8k, photorealistic, cinematic lighting
    negative_prompt: >-
      text, watermark, logo, blurry, low resolution, cartoon, anime
    destination_key: "ai-images/realistic"
    enabled: true

  - name: "cartoon"
    display_name: "Cartoon"
    version: 2
    prompt_suffix: >-
      cartoon style, 2d, colorful, high quality animation, vibrant
    negative_prompt: >-
      realistic, photorealistic, 3d, text, watermark
    destination_key: "ai-images/cartoon"
    enabled: true

  - name: "medieval"
    display_name: "Medieval"
    version: 2
    prompt_suffix: >-
      medieval style, fantasy, historical, detailed oil painting, epic atmosphere
    negative_prompt: >-
      modern, futuristic, sci-fi, text, watermark, blurry
    destination_key: "ai-images/medieval"
    enabled: true

  - name: "cyberpunk"
    display_name: "Cyberpunk"
    version: 2
    prompt_suffix: >-
