      clean whiteboard animation frame, bold black marker strokes on pure
      white background, infographic style, simple icon drawings, numbered
      steps layout, arrows connecting concepts, geometric shapes, no text
      or words, flat 2d illustration, high contrast black on white,
      educational diagram aesthetic, single concept per frame
    negative_prompt: >-
      text, words, letters, realistic, 3d, shadows, gradients, color
    destination_key: "ai-images/whiteboard"
    enabled: true

  - name: "kawaii"
    display_name: "Kawaii"
