# =============================================================================
# PipelineGen Generation Styles — canonical registry (Step 3, July 2026).
# =============================================================================
# Each style defines a visual preset for AI image generation. Fields:
#
#   name              — canonical ID (required).
#   display_name      — human-readable label for UIs.
#   description       — legacy free-text suffix (superseded by prompt_suffix).
#   version           — integer, bumped when prompt_suffix or negative_prompt change.
#   prompt_suffix     — appended to the user prompt after a comma separator.
#   negative_prompt   — injected as negative prompt for providers that support it.
#   default_width     — output width override (0 = use caller value).
#   default_height    — output height override (0 = use caller value).
#   allowed_providers — restrict to these providers (empty = all allowed).
#   allowed_models    — restrict to these models (empty = all allowed).
#   destination_key   — logical Drive destination key (e.g. "ai-images/cinematic").
#   tags              — metadata labels for search and filtering.
#   enabled           — whether the style is active (omit = enabled).
# =============================================================================

styles:
  # ── realistic ──────────────────────────────────────────────────────────
  - name: "realistic"
    display_name: "Realistic"
    version: 1
    prompt_suffix: >-
      extremely detailed, realistic, 8k, photorealistic, cinematic lighting
    negative_prompt: >-
      text, watermark, logo, blurry, low resolution, cartoon, anime
    default_width: 1920
    default_height: 1080
    allowed_providers:
      - google-slides
      - flux
      - nvidia
    destination_key: "ai-images/realistic"
    tags:
      - realistic
      - photorealistic
      - 8k
    enabled: true

