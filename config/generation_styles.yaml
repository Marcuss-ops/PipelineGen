    destination_key: "ai-images/sketch"
    enabled: true

  - name: "cinematic"
    display_name: "Cinematic"
    version: 2
    prompt_suffix: >-
      cinematic movie still, dramatic natural lighting, realistic depth,
      35mm lens, detailed composition
    negative_prompt: >-
