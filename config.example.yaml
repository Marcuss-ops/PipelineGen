server:
  # 0.0.0.0 binds all interfaces and makes the server reachable on the LAN.
  # Use this only on a trusted private network; for public exposure always
  # prefer a reverse-proxy with HTTPS and leave the bind on 127.0.0.1.
  host: "0.0.0.0"
  # Canonical port is 8000 (chosen in the Operational Readiness PR — June 2026
  # Canonical port 8000 (Operational Readiness PR, June 2026).
  # Override at runtime via VELOX_PORT; see `internal/platform/config/types.go::ServerConfig` for single source of truth.). Override at runtime via
  # VELOX_PORT; SeeServerConfig in internal/platform/config/types.go
  # is the single source of truth. Makefile `doctor`/`artlist` targets and
  # scripts/velox_client.py read $VELOX_PORT with a 8000 fallback so the
  # whole stack stays consistent without editing every recipe.
  port: 8000
  gin_mode: "release"

logging:
  level: "info"
  format: "json"

storage:
  data_dir: "./data"
  # Single operational SQLite database; tests must use isolated temporary DBs.
  primary_db_path: "./data/media/media.db.sqlite"
  temp_dir: "tmp"

security:
  # CRITICAL (Operational Readiness PR, June 2026):
  # PipelineGen refuses to start when admin_token or worker_token equal
  # the literals below. Set via env vars (VELOX_ADMIN_TOKEN /
  # VELOX_WORKER_TOKEN) or edit this file before booting. See
  # internal/platform/config/config.go::Config.Validate() for
  # the exact check.
  enable_auth: true
  admin_token: "***REDACTED***"  # Use scripts/rotate_token.sh verbatim to generate the canonical 64-hex.
  worker_token: "dev-worker-token-change-me"
  delivery_hmac_secret: "dev-hmac-secret-32-bytes-minimum-change-me"
  # CORS origins - leave empty to block all cross-origin requests
  cors_origins: []
  rate_limit_enabled: true
  rate_limit_requests: 100
  # Download host whitelist - REQUIRED for security
  # Only hosts in this list can be used for downloads
  allowed_download_hosts:
    - "youtube.com"
    - "www.youtube.com"
    - "youtu.be"
    - "artlist.com"
    - "www.artlist.com"
    - "artlist.io"
    - "cdn.artlist.io"

external:
  ollama_url: "http://localhost:11434"
  ollama_model: "gemma4:e4b"
  ollama_timeout_seconds: 120
  # Local dev uses the existing SearXNG sidecar on 127.0.0.1:8080.
  # The runtime still treats this as optional and falls back cleanly
  # if the service is absent.
  searxng_url: "http://127.0.0.1:8080"
  searxng_language: "en"
  searxng_engines: "bing,mwmbl"
  ytdlp_path: "yt-dlp"
  ffmpeg_path: "ffmpeg"
  rust_muscles_path: "bin/pipelinegen-muscles"
  nvidia_api_key: ""
  nvidia_model: "stabilityai/sdxl-turbo"
  nvidia_local_nim_url: "http://localhost:8000/v1/infer"
  pixabay_api_key: ""
  pixabay_base_url: "https://pixabay.com/api"
  pexels_api_key: ""
  pexels_base_url: "https://api.pexels.com/v1"
  # Artlist scraper optimizations
  artlist_live_search_cache_ttl_hours: 24    # Level 1: in-memory cache TTL (0=disabled)
  artlist_scraper_server_url: "http://127.0.0.1:9123"             # Level 3: scraper server on host (PR-ARTLIST-CONFIG-PREFIX July 2026: bound from env VELOX_ARTLIST_SCRAPER_SERVER_URL; canonical IPv4 loopback 127.0.0.1, port 9123)
  # Artlist provider configuration (PR-CONFIG-SPLIT, July 2026).
  # acquisition_mode controls HOW assets are discovered + how the
  # pipeline talks to Artlist (manual_import | authorized_api).
  # auto_download is an ORTHOGONAL policy: whether successful searches
  # trigger automatic downloads. An operator can keep authorized_api
  # for search but set auto_download.enabled=false to enforce manual
  # curation. The two are now separate keys so the policy is explicit.
  artlist:
    acquisition_mode: "authorized_api"   # "" -> manual_import per Normalize()
    auto_download:
      enabled: false                      # OFF by default for safe local bootstrap
      daily_limit: 10                     # 10/day cap aligns with non-Enterprise quota
  # artlist_skip_transcription: false         # operator opt-in escape hatch for environments without `whisper` binary; default false (mandatory transcription preserved); see internal/platform/config/types_external.go::ArtlistSkipTranscription

paths:
  python_scripts_dir: "scripts"
  credentials_file: "credentials.json"
  token_file: "token.json"

drive:
  # Local/dev soft mode: skip the Google Drive startup probe unless
  # VELOX_DRIVE_STRICT_STARTUP_VALIDATION=true is set.
  strict_startup_validation: false
  stock_root_folder: ""
  # Drive folder for source=ai_generated stock clips (Stock/AI/<category>).
  ai_clips_root_folder: ""
  # Drive source folder for normal YouTube clips to index recursively.
  normal_clips_source_folder: ""
  clips_root_folder: ""
  youtube_subtitles_root_folder: ""
  voiceover_root_folder: ""
  artlist_root_folder: "1Dj3-BlM9LcJr3dh3I4VxEDuMBbaBwwSE"  # canonical Drive root for Artlist output (FOLLOWUP-ARTLIST-ROOT, July 2026)
  # AI-generated images need a Drive root even when the style preset is empty.
  # This points the default script image flow at the canonical realistic bucket.
  images_root_folder: "1b5iP5aHekJUL1FB9ZC-WGkWxoDULyU9X"
  books_root_folder: ""
  scripts_root_folder: ""
  video_ai_root_folder: ""
  copertine_root_folder: ""
  sound_effects_root_folder: "1vfZQHVNZab-pU2fBaj4qzR3iSz1sOVhW"
  outro_root_folder: "1MB9pTRjvHUdMXUtGOMBcvgRc-MZG2rA4"

media:
  multilingual:
    enabled: true
    source_language: "en"
    languages:
      - code: it
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: fr-FR-RemyMultilingualNeural
      - code: en
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: en-US-ChristopherNeural # Options: en-CA-LiamNeural, en-US-EricNeural
      - code: pl
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: pl-PL-MarekNeural
      - code: ru
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: ru-RU-DmitryNeural
      - code: de
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: de-DE-FlorianMultilingualNeural
      - code: es
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: es-ES-AlvaroNeural
      - code: pt-BR
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: pt-BR-AntonioNeural
      - code: fr
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: fr-FR-RemyMultilingualNeural # Options: fr-BE-GerardNeural
      - code: tr
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: tr-TR-AhmetNeural
      - code: id
        enabled: true
        translate_clips: true
        generate_tts: true
        edge_tts_voice: id-ID-ArdiNeural
    translation_policy: "auto"
    require_language_certainty: true
    require_transcript_ready: false

video:
  width: 1920
  height: 1080
  fps_num: 24
  fps_den: 1
  # Encoder policy example: libx264 is an explicit CPU policy. For GPU-required
  # production encoding use h264_nvenc; runtime NVENC failure is terminal.
  codec: "libx264"
  preset: "veryfast"
  crf: 23
  duration: 7
  keyframe_interval: 48
  audio_codec: "aac"
  audio_bitrate: "192k"
  clip_duration: 5
  chunk_duration: 25
  max_clips_per_source: 30
  search_count: 25
  overlay_opacity: 0.25
  effect_interval: 4      # 0 disables effects; negative values use the configured default
  transition_interval: 4  # 0 disables transitions; negative values use the configured default
  transition_presets:
    - "fade"
    - "fadeblack"
    - "fadewhite"
    - "slideleft"
    - "slideright"
    - "slideup"
    - "slidedown"
    - "circleclose"
    - "circleopen"
    - "horzclose"
    - "horzopen"
    - "vertclose"
    - "vertopen"
    - "dissolve"
    - "pixelize"
    - "wipeleft"
    - "wiperight"
    - "wipeup"
    - "wipedown"
    - "smoothleft"
    - "smoothright"
    - "smoothup"
    - "smoothdown"
    - "radial"
    - "hblur"
    - "fadegrays"
    - "squeezeh"
    - "squeezev"

jobs:
  catalog_sync_interval: "6h"
  maintenance_interval: "24h"
  backup_interval: "6h"
  indexing_interval: "15m"
  # YouTube clip extraction policy: max per-clip duration in seconds.
  # Canonical default is 60; raise it (e.g. 120) for longer clips.
  youtube_max_segment_duration_seconds: 60

scripts:
  # ScriptFlow capability gate. In production a missing required
  # dependency aborts the boot; in dev mode (delivery_insecure_dev=true)
  # the module is disabled and no /api/script/* route is registered.
  capability:
    enabled: true
    require_ai: true
    require_drive: true
    require_database: true
  # Concurrency caps for /api/script/legacy-batch phases
  batch_web_search_concurrency: 4     # Parallel SearXNG searches (1-16)
  batch_chapter_concurrency: 3        # Parallel Ollama chapter generations (1-10)
  # Canonical default Google Drive folder for script documents.
  # Canonical config: env PIPELINEGEN_SCRIPT_DOCS_FOLDER_ID (this yaml value
  # is overridden by the env var). Leave empty unless a docs.enabled=true
  # request must fail closed when docs.folder_id is omitted.
  script_docs_folder_id: ""

concurrency:
  max_concurrent_video_extracts: 2
  max_concurrent_script_generations: 2
  max_concurrent_nvidia_generations: 10
  max_concurrent_ollama_calls: 1
  max_concurrent_google_slides_generations: 2
  google_slides_profile_id: 0
  max_concurrent_channel_checks: 20

features:
  # Stable modules - enable as needed
  artlist_enabled: true
  youtube_enabled: false
  drive_enabled: true
  # Experimental modules - default to false
  script_clips_enabled: false
  # Keep the unified script endpoint mounted in local/dev bootstraps.
  # Script generation uses the images capability for /api/script/generate,
  # so leaving this off would disable the route entirely.
  images_enabled: true
  stock_pipeline_enabled: true
  clip_render_enabled: false
  voiceover_enabled: false
  catalog_script_vector_search: false

# NOTE (June 2026 drft-fix): the previous config.example.yaml featured
# `google_accounting_enabled` and `workflow_enabled` under `features:`.
# These are NOT part of internal/platform/config/types.go
# FeaturesConfig: google_accounting has its own top-level GoogleAccountingConfig
# section below, and `workflow_enabled` is no longer a feature flag (the
# workflow module was retired). The replacement flags
# (voiceover_enabled, catalog_script_vector_search) match the in-tree
# FeaturesConfig exactly so the yaml loader cannot silently drop fields.

google_accounting:
  enabled: false
  server_url: "http://localhost:8000"
  download_dir: "./data/google_vids"
  sessions_path: "./google-accounting/sessions"
  schedule_cron: "0 2 * * *"
# QDRANT-005A canonical configuration (AGENTS.md "Qdrant Entity Associations").
# MINIMAL config (this file): both OFF so the server boots without
# external vector-store readiness. Production deployments use
# config.production.example.yaml which has both enabled: true.
qdrant:
  enabled: false
  base_url: "http://127.0.0.1:6333"
  api_key: ""  # override via VELOX_QDRANT_API_KEY env var (AGENTS.md secrets policy)
clip_indexer:
  enabled: false

# Outbox events worker pool (asset.index.requested / drive / delivery).
# workers raised to 4 (July 2026, CPU-only server tuning) after stock
# runs observed ~75 pending with only 2 processing; monitor CPU/RAM/
# SQLite busy_timeout errors before raising further. Env override:
# VELOX_OUTBOX_WORKERS. Priority column (migration 186) lets
# script-required index requests jump the bulk-folder-sync queue.
outbox:
  workers: 4
  poll_interval_ms: 500
  batch_size: 10
  process_timeout_seconds: 300
  reclaim_interval_seconds: 60
  max_attempts: 5

# Centralized linguistic lexicons (PR-LEXICON-SSOT, July 2026).
# Each subdirectory under lexicon_root is a language tag (e.g. en, it).
# Required files per language: stopwords.txt, function_words.txt,
# entity_blocklist.txt, verb_morphology.txt, phrase_policy.txt,
# negative_particles.txt, visual_verbs.txt. Missing optional files are
# treated as empty; missing required_languages profiles make boot fail.
linguistics:
  lexicon_root: "config/lexicons"
  required_languages:
    - en
    - it
