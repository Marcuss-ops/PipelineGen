server:
  host: "127.0.0.1"  # Overridden by VELOX_HOST=0.0.0.0 in systemd
  # Canonical port is 8000 (chosen in the Operational Readiness PR — June 2026
  # Canonical port 8000 (Operational Readiness PR, June 2026).
  # Override at runtime via VELOX_PORT; see `internal/infrastructure/config/types.go::ServerConfig` for single source of truth.). Override at runtime via
  # VELOX_PORT; SeeServerConfig in internal/infrastructure/config/types.go
  # is the single source of truth. Makefile `doctor`/`artlist` targets and
  # scripts/velox_client.py read $VELOX_PORT with a 8000 fallback so the
  # whole stack stays consistent without editing every recipe.
  port: 8000
  gin_mode: "release"

logging:
  level: "debug"
  format: "json"

storage:
  data_dir: "./data"
  temp_dir: "tmp"

security:
  # CRITICAL (Operational Readiness PR, June 2026):
  # PipelineGen refuses to start when admin_token or worker_token equal
  # the literals below. Set via env vars (VELOX_ADMIN_TOKEN /
  # VELOX_WORKER_TOKEN) or edit this file before booting. See
  # internal/infrastructure/config/config.go::Config.Validate() for
  # the exact check.
  enable_auth: true
  admin_token: "test-admin-token-12345"  # Overridden by VELOX_ADMIN_TOKEN env var at runtime
  worker_token: "test-worker-token-12345"  # Overridden by VELOX_WORKER_TOKEN env var at runtime
  # CORS origins - leave empty to block all cross-origin requests
  cors_origins: []
  rate_limit_enabled: false
  rate_limit_requests: 10000
  # Download host whitelist - REQUIRED for security
  # Only hosts in this list can be used for downloads
  allowed_download_hosts:
    - "youtube.com"
    - "www.youtube.com"
    - "youtu.be"
    - "artlist.com"
    - "www.artlist.com"
    - "artlist.io"
    - "cdn.artlist.io"

external:
  ollama_url: "http://localhost:11434"
  ollama_model: "gemma4:e4b"
  ollama_embed_model: "nomic-embed-text"
  ollama_timeout_seconds: 120
  ytdlp_path: "yt-dlp"
  ffmpeg_path: "ffmpeg"
  nvidia_api_key: ""
  nvidia_model: "stabilityai/sdxl-turbo"
  nvidia_local_nim_url: "http://localhost:8000/v1/infer"
  use_vllm: false
  vllm_url: "http://localhost:8000"
  vllm_model: "gemma4:e4b"
  pixabay_api_key: ""
  pixabay_base_url: "https://pixabay.com/api"
  pexels_api_key: ""
  pexels_base_url: "https://api.pexels.com/v1"
  # Artlist scraper optimizations
  artlist_live_search_cache_ttl_hours: 24    # Level 1: in-memory cache TTL (0=disabled)
  artlist_scraper_server_url: "http://localhost:9123"             # Level 3: scraper running on host

paths:
  python_scripts_dir: "scripts"
  credentials_file: "credentials.json"
  token_file: "token.json"

drive:
  strict_startup_validation: false
  # Drive root folders are resolved via the API (folder_id in request payload).
  # Do NOT hardcode folder IDs here — they are passed per-request through
  # VerifiedArtifact.RootFolderOverride → PublishRequest.RootFolderOverride.
  stock_root_folder: "1J-zIuqroF0rkTrKxU-tmZu9e5rN20ggV"
  clips_root_folder: "1J-zIuqroF0rkTrKxU-tmZu9e5rN20ggV"

video:
  width: 1280
  height: 720
  fps: 24
  codec: "libx264"
  preset: "veryfast"
  crf: 26
  duration: 7
  keyframe_interval: 60
  audio_codec: "aac"
  audio_bitrate: "128k"
  clip_duration: 5
  chunk_duration: 25
  max_clips_per_source: 30
  search_count: 25
  overlay_opacity: 0.25
  effect_interval: 4      # 0 disables effects; negative values use the configured default
  transition_interval: 4  # 0 disables transitions; negative values use the configured default
  transition_presets:
    - "fade"
    - "fadeblack"
    - "fadewhite"
    - "slideleft"
    - "slideright"
    - "slideup"
    - "slidedown"
    - "circleclose"
    - "circleopen"
    - "horzclose"
    - "horzopen"
    - "vertclose"
    - "vertopen"
    - "dissolve"
    - "pixelize"
    - "wipeleft"
    - "wiperight"
    - "wipeup"
    - "wipedown"
    - "smoothleft"
    - "smoothright"
    - "smoothup"
    - "smoothdown"
    - "radial"
    - "hblur"
    - "fadegrays"
    - "squeezeh"
    - "squeezev"

jobs:
  catalog_sync_interval: "6h"
  maintenance_interval: "24h"
  backup_interval: "6h"
  indexing_interval: "15m"

scripts:
  # Concurrency caps for /api/script/generate-batch phases
  batch_web_search_concurrency: 4     # Parallel SearXNG searches (1-16)
  batch_chapter_concurrency: 3        # Parallel Ollama chapter generations (1-10)

features:
  # Stable modules - enable as needed
  artlist_enabled: true
  youtube_enabled: true
  drive_enabled: true
  # Experimental modules - default to false
  script_docs_enabled: true
  script_clips_enabled: true
  stock_pipeline_enabled: true
  images_enabled: true
  voiceover_enabled: false
  catalog_script_vector_search: false

# NOTE (June 2026 drft-fix): the previous config.example.yaml featured
# `google_accounting_enabled` and `workflow_enabled` under `features:`.
# These are NOT part of internal/infrastructure/config/types.go
# FeaturesConfig: google_accounting has its own top-level GoogleAccountingConfig
# section below, and `workflow_enabled` is no longer a feature flag (the
# workflow module was retired). The replacement flags
# (voiceover_enabled, catalog_script_vector_search) match the in-tree
# FeaturesConfig exactly so the yaml loader cannot silently drop fields.

google_accounting:
  enabled: false
  server_url: "http://localhost:8000"
  download_dir: "./data/google_vids"
  sessions_path: "./google-accounting/sessions"
  schedule_cron: "0 2 * * *"

# QDRANT-005A canonical configuration (AGENTS.md "Qdrant Entity Associations").
# Runtime precedence per viper: env > yaml > struct-default, so set
# VELOX_QDRANT_ENABLED=false to disable at runtime even when this file
# says true (local pipeline default). The legacy `vector_search:` block
# below uses `url:` (not `base_url:`) and is superseded by this section.
qdrant:
  enabled: true
  base_url: "http://127.0.0.1:6333"
  api_key: ""  # override via VELOX_QDRANT_API_KEY env var (AGENTS.md secrets policy)

vector_search:
  enabled: true
  url: "http://127.0.0.1:6333"
  collection: "media_assets"
