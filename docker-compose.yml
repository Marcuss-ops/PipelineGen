# PipelineGen infrastructure only. Application processes run natively via
# systemd; Docker is retained for external infrastructure lifecycles.
services:
  qdrant:
    # Legacy/admin/DR only. PostgreSQL + pgvector owns the media domain.
    # Start explicitly with: docker compose --profile legacy-qdrant up -d qdrant
    profiles:
      - legacy-qdrant
    image: qdrant/qdrant:latest
    container_name: pipelinegen-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
  artlist-scraper:
    build:
      context: ./node-scraper
      dockerfile: Dockerfile.scraper
    container_name: pipelinegen-artlist
    restart: unless-stopped
    ports:
      - "127.0.0.1:9123:9123"
    environment:
      PORT: "9123"
      PERSISTENT: "1"
      CHROME_EXECUTABLE: "/usr/bin/chromium"
      CHROME_PROFILE_DIR: "/chrome-profile"
      ARTLIST_COOKIE_FILE: "/chrome-profile/artlist_cookies.txt"
      SCROLL_TIMEOUT: "120"
      SCRAPER_CONNECT_TIMEOUT_SECONDS: "5"
    volumes:
      - artlist-chrome-profile:/chrome-profile
  searxng:
    image: searxng/searxng:latest
    container_name: pipelinegen-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:8080/"
      SEARXNG_INSTANCE_NAME: "pipelinegen-searxng"
      SEARXNG_SECRET: "${VELOX_SEARXNG_SECRET:-change-me-in-secrets}"
      SEARXNG_FORMATS: "html,json"
      SEARXNG_METHOD: "GET"
      SEARXNG_LIMITER: "false"
volumes:
  qdrant-storage:
  artlist-chrome-profile:
