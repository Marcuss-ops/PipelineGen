# docker-compose.yml — PipelineGen production stack with separated runtime roles.
#
# Services:
#
#   - pipelinegen-server : HTTP server on port 8000, mode=server (HTTP only,
#                          no background jobs). Depends on qdrant and
#                          artlist-scraper.
#
#   - pipelinegen-worker : standalone background job executor that registers
#                          against the server broker via /internal/v1/*. Contains
#                          ffmpeg, yt-dlp, and python3 for media processing jobs.
#
#   - qdrant             : vector store for semantic search (ports 6333/6334).
#
#   - artlist-scraper    : persistent Node.js Artlist scraper (port 9123).
#
# Volumes:
#   - pipelinegen-data   : SQLite DB + asset_metadata + cache + downloads.
#                          Shared by server and worker (SQLite WAL mode
#                          supports concurrent readers + one writer).
#   - qdrant-storage     : Qdrant persistence.
#
# Networking:
#   - All services share the `backend` network.
#
# Security contract (PR-B):
#   VELOX_WORKER_TOKEN MUST be set in `secrets/pipelinegen.env` and reach
#   BOTH containers via the `env_file:` block. Server reads it for
#   WorkerAuth verification on /internal/v1/*. Worker sends it as
#   `Authorization: Bearer $VELOX_WORKER_TOKEN` via jobbrokerclient.

services:
  pipelinegen-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
      args:
        VERSION: dev
        COMMIT:  unknown
    image: pipelinegen-server:latest
    container_name: pipelinegen-server
    restart: unless-stopped
    depends_on:
      - qdrant
      - artlist-scraper
    ports:
      - "8081:8000"
    volumes:
      - pipelinegen-data:/data
      - ./config.yaml:/etc/pipelinegen/config.yaml:ro
      - ./secrets/pipelinegen.env:/etc/pipelinegen/pipelinegen.env:ro
    environment:
      VELOX_HOST: "0.0.0.0"
      VELOX_PORT: "8000"
      VELOX_LOG_LEVEL: "info"
      VELOX_VECTOR_SEARCH_URL: "http://qdrant:6333"
      VELOX_VECTOR_SEARCH_COLLECTION: "media_assets"
      VELOX_ARTLIST_SCRAPER_SERVER_URL: "http://artlist-scraper:9123"
    env_file:
      - ./secrets/pipelinegen.env
    command: ["--mode", "server", "--config", "/etc/pipelinegen/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  pipelinegen-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker-runtime
      args:
        VERSION: dev
        COMMIT:  unknown
    image: pipelinegen-worker:latest
    container_name: pipelinegen-worker
    # Worker now registers against the server via /internal/v1/workers/register
    # (wired in the composition root via bootstrap.go::WireServices).
    # PR-B (June 2026): full topology split — server --mode server, worker
    # standalone. WorkerAuth on /internal/v1 enforces worker-token-only
    # access (admin token is rejected).
    restart: unless-stopped
    depends_on:
      pipelinegen-server:
        condition: service_healthy
    volumes:
      - pipelinegen-data:/data
      - ./config.yaml:/etc/pipelinegen/config.yaml:ro
      - ./secrets/pipelinegen.env:/etc/pipelinegen/pipelinegen.env:ro
    environment:
      VELOX_MASTER_URL: "http://pipelinegen-server:8000"
      VELOX_LOG_LEVEL: "info"
      VELOX_VECTOR_SEARCH_URL: "http://qdrant:6333"
      VELOX_ARTLIST_SCRAPER_SERVER_URL: "http://artlist-scraper:9123"
    env_file:
      - ./secrets/pipelinegen.env
    command: ["--config", "/etc/pipelinegen/config.yaml"]
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pipelinegen-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - backend

  artlist-scraper:
    build:
      context: ./node-scraper
      dockerfile: Dockerfile.scraper
    container_name: pipelinegen-artlist
    restart: unless-stopped
    ports:
      - "9123:9123"
    environment:
      PORT: "9123"
      PERSISTENT: "1"
    networks:
      - backend

volumes:
  pipelinegen-data:
    driver: local
  qdrant-storage:
    driver: local

networks:
  backend:
    driver: bridge
