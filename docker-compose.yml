# docker-compose.yml — PipelineGen production stack.
#
# Three services on the canonical operator stack:
#
#   - pipelinegen  : Rust? No — Go binary that runs cmd/server --mode all,
#                    serving HTTP on port 8080 plus the in-process worker/
#                    scheduler/maintenance sweepers.
#
#   - qdrant       : vector store for the four semantic vectors (text 768,
#                    transcript 768, visual 512, audio 512) over every media
#                    asset. Port 6333 (REST) + 6334 (gRPC) — both exposed
#                    so the Go binary can talk to Qdrant over REST inside
#                    the compose network.
#
#   - artlist-scraper : persistent Node.js scraper (Level 3 caching) that
#                    exposes its own JSON HTTP API to the Go binary over
#                    ARTLIST_SCRAPER_SERVER_URL. Port 9123 is the
#                    canonical scraper port per config.example.yaml
#                    comments — keep aligned.
#
# Volumes:
#   - pipelinegen-data  : SQLite DB + asset_metadata sidecars + Cache +
#                         any asset_downloads. Mounted as /data.
#   - qdrant-storage    : Qdrant persistence. Mounted at Qdrant's /qdrant/storage.
#
# Networking:
#   - All services share the `backend` network so the Go binary can talk
#     to Qdrant via http://qdrant:6333 and to the scraper via
#     http://artlist-scraper:9123 without env overrides.
#
# IMPORTANT: the env_file below MUST override the placeholder tokens in
# config.example.yaml. The container refuses to start when
# security.admin_token == "YOUR_SECURE_TOKEN_HERE" (see Validate() in
# internal/infrastructure/config/config.go).

services:
  pipelinegen:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
        COMMIT:  unknown
    image: pipelinegen:latest
    container_name: pipelinegen
    restart: unless-stopped
    depends_on:
      - qdrant
      - artlist-scraper
    ports:
      - "8080:8080"
    volumes:
      - pipelinegen-data:/data
      - ./config.yaml:/etc/pipelinegen/config.yaml:ro
      # The env_file provides VELOX_ADMIN_TOKEN / VELOX_WORKER_TOKEN
      # overrides. Place at ./secrets/pipelinegen.env (mode 0600) outside
      # the source tree. The container refuses to start when these remain
      # placeholders.
      - ./secrets/pipelinegen.env:/etc/pipelinegen/pipelinegen.env:ro
    environment:
      VELOX_HOST: "0.0.0.0"
      VELOX_PORT: "8080"
      VELOX_LOG_LEVEL: "info"
      VELOX_VECTOR_SEARCH_URL: "http://qdrant:6333"
      VELOX_VECTOR_SEARCH_COLLECTION: "media_assets"
      VELOX_ARTLIST_SCRAPER_SERVER_URL: "http://artlist-scraper:9123"
      # See docker-compose.vector.yml for the canonical Qdrant sidecar.
    env_file:
      - ./secrets/pipelinegen.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pipelinegen-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - backend

  artlist-scraper:
    build:
      context: ./node-scraper
      dockerfile: Dockerfile.scraper   # NOTE: not yet shipped — Phase 5+
    container_name: pipelinegen-artlist
    restart: unless-stopped
    ports:
      - "9123:9123"
    environment:
      PORT: "9123"
      PERSISTENT: "1"
    networks:
      - backend

volumes:
  pipelinegen-data:
    driver: local
  qdrant-storage:
    driver: local

networks:
  backend:
    driver: bridge
