# Esempio di reverse proxy Nginx HTTPS per PipelineGen.
#
# Quando si usa questa configurazione, lascia PipelineGen in ascolto solo sul
# loopback locale (127.0.0.1:8000) e non esporre direttamente la porta 8000
# su Internet. Il proxy si occupa di ricevere le richieste HTTPS sulle porte
# standard e di inoltrarle in chiaro a PipelineGen.
#
# In .env o config.yaml dovresti avere:
#   VELOX_HOST=127.0.0.1
#   VELOX_PORT=8000

# Redirect tutto il traffico HTTP su HTTPS.
server {
    listen 80;
    server_name pipeline.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pipeline.example.com;

    # Sostituisci con i percorsi dei certificati Let's Encrypt (o altri).
    ssl_certificate /etc/letsencrypt/live/pipeline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pipeline.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # PipelineGen accetta payload JSON fino a 10 MB di default.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Header originali da non rimuovere/modificare.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Header applicativi essenziali per PipelineGen.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Workspace-ID $http_x_workspace_id;

        # Timeout: /api/script/generate restituisce 202 immediatamente, ma i
        # normali endpoint possono impiegare qualche decina di secondi.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Non bufferizzare le risposte, così eventuali log/streaming passano
        # trasparenti al client.
        proxy_buffering off;
    }
}
