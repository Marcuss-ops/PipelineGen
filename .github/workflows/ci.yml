name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # verify-main (Cleanup Plan P0-4, June 2026): fail-closed local-mirror
  # gate. Mirrors the `make verify-main` target committed by P0-3 —
  # same chain, same fail-on-first-failure semantics. The daily build
  # job depends on this gate; lint, vulnerability scanning, and secret
  # scanning run independently so failures in this gate do not suppress
  # narrower safety checks. Heavier race and release gates are explicit
  # targets or live in their manual workflows.
  #
  # Failure mode: any non-zero exit from `make verify-main` aborts the
  # step. Make's native output surfaces the failing command verbatim
  # so a developer can re-run locally and see the exact same failing
  # step. NO `continue-on-error`, NO `|| true`, NO fallbacks.
  verify-main:
    name: verify-main (fail-closed local-mirror gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run `make verify-main` (fail-closed)
        # Mirror the local-mirror contract: the Makefile owns the graph
        # (`verify-push + verify-architecture`) and
        # fail-closed behavior. The first failing prerequisite aborts this
        # step; re-running `make verify-main` locally reproduces the same
        # target composition.
        run: make verify-main

  build:
    name: Build, generated docs & coverage (supplemental)
    runs-on: ubuntu-latest
    needs: verify-main

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Verify Go toolchain contract
      # Mirrors `make go-version-check` from the local dev workflow.
      # Catches a host Go that drifted BELOW go.mod's `go` directive
      # before `go mod download` prints misleading output.
      run: make go-version-check

    - name: Install dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum || { echo "❌ go.mod is out of sync. Run: go mod tidy"; exit 1; }

    - name: Run go vet
      run: go vet ./...

    - name: Run Architectural Checks
      # The historical shell ratchet (scripts/ci-architectural-checks.sh)
      # was deleted in commit 7e6965aab; its rules are owned by the Go gate
      # (cmd/archcheck). The previous conditional silently skipped the step
      # whenever the file was missing, i.e. it reported success without
      # enforcing anything. The real gate runs here now.
      run: go run ./cmd/archcheck --strict

    - name: Build all packages
      run: go build ./...

    - name: Build all binaries
      # Canonical binaries: cmd/server (long-running HTTP server),
      # cmd/admin (one-shot CLI + `admin gen-api-docs` subcommand),
      # cmd/worker (cross-host worker process). `cmd/gen-api-docs` was
      # folded into `cmd/admin gen-api-docs` (see cmd/admin/main.go).
      run: |
        go build -o /dev/null ./cmd/server/
        go build -o /dev/null ./cmd/worker/
        go build -o /dev/null ./cmd/admin/

    - name: Generate API docs
      # `admin gen-api-docs` writes the canonical markdown snapshot of the
      # currently-registered HTTP routes. CI then diffs the snapshot to
      # fail the build when a route was added without regenerating docs.
      run: |
        go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md

    - name: Verify generated docs are up to date
      # NOTE: must use `run: |` block-scalar form (NOT single-line flow).
      # The echo string contains `Run: go run ...` — a colon + space
      # inside a flow scalar confuses YAML into parsing it as a
      # nested mapping key. Block scalars handle this case correctly.
      #
      # git status --porcelain catches modified, staged, AND untracked
      # files — git diff --exit-code alone misses new untracked docs.
      run: |
        if [ -n "$(git status --porcelain docs/api/ACTIVE_API_GENERATED.md 2>/dev/null)" ]; then
          echo "❌ Generated API docs are out of date."
          echo "Run: go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md"
          exit 1
        fi

    # The race-tested unit gate is owned by the explicit manual
    # verify-race/verify-full workflows. This build job remains gated by
    # verify-main and keeps only the supplemental coverage threshold.
    - name: Run Coverage Check
      run: make coverage-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

    - name: Run govulncheck
      run: govulncheck ./...

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run `make verify-no-secrets` (fail-closed)
      # GODLIKE/06 SSOT lockstep: the `Makefile` `verify-no-secrets`
      # target is the canonical wire-in point; the script at
      # scripts/ci/ci-no-secrets-audit.sh is the canonical owner of
      # the in-house no-secrets check (one canonical owner per fact).
      # Invoking `make verify-no-secrets` here (rather than calling
      # the script directly) makes the Makefile the single source of
      # truth for how the gate is invoked — a future rename of the
      # script updates one place, and the local `make verify-main`
      # green signal matches the CI green signal bit-for-bit.
      # The 3-tier auto-detect (T1 gitleaks / T2 trufflehog / T3
      # ripgrep regex fallback) catches repo-local custom shapes
      # (VELOX_ADMIN_TOKEN 64-hex, AWS AKIA, ghp_, github_pat_, xox-,
      # PEM) that gitleaks's default ruleset does not recognise —
      # this step is a complementary detection layer, not a
      # replacement for the gitleaks step above.
      # Exit contract: 0=PASS, 1=FAIL (hit list printed + saved to
      # HIT_LOG), 2=setup error. NO `continue-on-error: true` per
      # godlike/07 NO-FAKE-AVAILABILITY: a fail is a fail.
      timeout-minutes: 5
      run: make verify-no-secrets

  # ── Black-box smoke jobs: RETIRED 2026-09-13 ─────────────────────────
  #
  # Two jobs were removed from this workflow because their entire payload was
  # deleted by commit 7e6965aab ("purge 94% shell + 87% python dust"):
  #
  #   fase-b-clip-smoke  → tests/operational/fase_b_clip_pipeline_smoke.sh
  #   smoke-runtime      → tests/operational/{startup,text_script,
  #                        failed_job}_smoke.sh via `make smoke-run-all`
  #
  # Both would have failed at "No such file or directory" on every push: a job
  # that can only fail closed is not a gate (see make/verify.mk for the
  # certification-driver precedent). Their nightly counterparts
  # (smoke-nightly, stock-live-nightly) and the manual stock-live job were
  # removed in the same change. Black-box HTTP coverage is now owned by the Go
  # suites: internal/platform/httpserver (server_clips_e2e_test.go) and
  # tests/e2e/**.
