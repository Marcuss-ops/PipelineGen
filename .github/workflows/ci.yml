name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum || { echo "❌ go.mod is out of sync. Run: go mod tidy"; exit 1; }

    - name: Run go vet
      run: go vet ./...

    - name: Run Architectural Checks
      # Check 17 (June 2026 codex/db-sql-ownership-gate) gates `database/sql`
      # imports against a 42-file grandfathered baseline. Regressions above
      # baseline exit 1; the baseline can be shrunk by followup PRs that
      # port each file off `database/sql`. See ARCHITECTURE.md §12 +
      # scripts/ci-architectural-checks.sh::Check 17 for the rationale.
      run: |
        if [ -f scripts/ci-architectural-checks.sh ]; then
          chmod +x scripts/ci-architectural-checks.sh
          bash scripts/ci-architectural-checks.sh
        else
          echo "info: scripts/ci-architectural-checks.sh not present — skipping textual rg-based check"
        fi

    - name: Run Legacy Asset AST Guardrail
      # AST-based detector for true Go references to internal/media/models.MediaAsset.
      # Replaces the previous rg-based allowlist that counted comments, strings
      # and other textual occurrences. Exits non-zero on any real dependency.
      run: go run ./scripts/ast_legacy_check

    - name: Run Legacy Detector Self-tests
      run: go test ./scripts/ast_legacy_check/...

    - name: Build all packages
      run: go build ./...

    - name: Build all binaries
      # Canonical binaries: cmd/server (long-running HTTP server),
      # cmd/admin (one-shot CLI + `admin gen-api-docs` subcommand),
      # cmd/worker (cross-host worker process). `cmd/gen-api-docs` was
      # folded into `cmd/admin gen-api-docs` (see cmd/admin/main.go).
      run: |
        go build -o /dev/null ./cmd/server/
        go build -o /dev/null ./cmd/worker/
        go build -o /dev/null ./cmd/admin/

    - name: Generate API docs
      # `admin gen-api-docs` writes the canonical markdown snapshot of the
      # currently-registered HTTP routes. CI then diffs the snapshot to
      # fail the build when a route was added without regenerating docs.
      run: |
        go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md

    - name: Verify generated docs are up to date
      # NOTE: must use `run: |` block-scalar form (NOT single-line flow).
      # The echo string contains `Run: go run ...` — a colon + space
      # inside a flow scalar confuses YAML into parsing it as a
      # nested mapping key. Block scalars handle this case correctly.
      #
      # git status --porcelain catches modified, staged, AND untracked
      # files — git diff --exit-code alone misses new untracked docs.
      run: |
        if [ -n "$(git status --porcelain docs/api/ACTIVE_API_GENERATED.md 2>/dev/null)" ]; then
          echo "❌ Generated API docs are out of date."
          echo "Run: go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md"
          exit 1
        fi

    - name: Run Unit Tests (with race detector)
      run: go test -race -v ./internal/... ./pkg/...

    - name: Run Coverage Check
      run: make coverage-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.59.1

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

    - name: Run govulncheck
      run: govulncheck ./...

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
