name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # verify-main (Cleanup Plan P0-4, June 2026): fail-closed local-mirror
  # gate. Mirrors the `make verify-main` target committed by P0-3 —
  # same chain, same fail-on-first-failure semantics. The daily
  # build and smoke jobs depend on this gate; lint, vulnerability scanning,
  # and secret scanning run independently so failures in this gate do not
  # suppress narrower safety checks. Heavier race and release
  # gates are explicit targets below or in their manual workflows.
  #
  # Failure mode: any non-zero exit from `make verify-main` aborts the
  # step. Make's native output surfaces the failing command verbatim
  # so a developer can re-run locally and see the exact same failing
  # step. NO `continue-on-error`, NO `|| true`, NO fallbacks.
  verify-main:
    name: verify-main (fail-closed local-mirror gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-scraper/package-lock.json

      - name: Run `make verify-main` (fail-closed)
        # Mirror the local-mirror contract: the Makefile owns the graph
        # (`verify-push + verify-node-native + verify-architecture`) and
        # fail-closed behavior. The first failing prerequisite aborts this
        # step; re-running `make verify-main` locally reproduces the same
        # target composition.
        run: make verify-main

  build:
    name: Build, generated docs & coverage (supplemental)
    runs-on: ubuntu-latest
    needs: verify-main

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: node-scraper/package-lock.json

    - name: Verify Go toolchain contract
      # Mirrors `make go-version-check` from the local dev workflow.
      # Catches a host Go that drifted BELOW go.mod's `go` directive
      # before `go mod download` prints misleading output.
      run: make go-version-check

    - name: Install dependencies
      run: go mod download

    - name: Verify go.mod is tidy
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum || { echo "❌ go.mod is out of sync. Run: go mod tidy"; exit 1; }

    - name: Run go vet
      run: go vet ./...

    - name: Run Architectural Checks
      # Check 17 (June 2026 codex/db-sql-ownership-gate) gates `database/sql`
      # imports against a 42-file grandfathered baseline. Regressions above
      # baseline exit 1; the baseline can be shrunk by followup PRs that
      # port each file off `database/sql`. See ARCHITECTURE.md §12 +
      # scripts/ci-architectural-checks.sh::Check 17 for the rationale.
      run: |
        if [ -f scripts/ci-architectural-checks.sh ]; then
          chmod +x scripts/ci-architectural-checks.sh
          bash scripts/ci-architectural-checks.sh
        else
          echo "info: scripts/ci-architectural-checks.sh not present — skipping textual rg-based check"
        fi

    - name: Build all packages
      run: go build ./...

    - name: Build all binaries
      # Canonical binaries: cmd/server (long-running HTTP server),
      # cmd/admin (one-shot CLI + `admin gen-api-docs` subcommand),
      # cmd/worker (cross-host worker process). `cmd/gen-api-docs` was
      # folded into `cmd/admin gen-api-docs` (see cmd/admin/main.go).
      run: |
        go build -o /dev/null ./cmd/server/
        go build -o /dev/null ./cmd/worker/
        go build -o /dev/null ./cmd/admin/

    - name: Generate API docs
      # `admin gen-api-docs` writes the canonical markdown snapshot of the
      # currently-registered HTTP routes. CI then diffs the snapshot to
      # fail the build when a route was added without regenerating docs.
      run: |
        go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md

    - name: Verify generated docs are up to date
      # NOTE: must use `run: |` block-scalar form (NOT single-line flow).
      # The echo string contains `Run: go run ...` — a colon + space
      # inside a flow scalar confuses YAML into parsing it as a
      # nested mapping key. Block scalars handle this case correctly.
      #
      # git status --porcelain catches modified, staged, AND untracked
      # files — git diff --exit-code alone misses new untracked docs.
      run: |
        if [ -n "$(git status --porcelain docs/api/ACTIVE_API_GENERATED.md 2>/dev/null)" ]; then
          echo "❌ Generated API docs are out of date."
          echo "Run: go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md"
          exit 1
        fi

    # The race-tested unit gate is owned by the explicit manual
    # verify-race/verify-full workflows. This build job remains gated by
    # verify-main and keeps only the supplemental coverage threshold.
    - name: Run Coverage Check
      run: make coverage-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        submodules: false

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.x'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

    - name: Run govulncheck
      run: govulncheck ./...

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: false

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run `make verify-no-secrets` (fail-closed)
      # GODLIKE/06 SSOT lockstep: the `Makefile` `verify-no-secrets`
      # target is the canonical wire-in point; the script at
      # scripts/ci/ci-no-secrets-audit.sh is the canonical owner of
      # the in-house no-secrets check (one canonical owner per fact).
      # Invoking `make verify-no-secrets` here (rather than calling
      # the script directly) makes the Makefile the single source of
      # truth for how the gate is invoked — a future rename of the
      # script updates one place, and the local `make verify-main`
      # green signal matches the CI green signal bit-for-bit.
      # The 3-tier auto-detect (T1 gitleaks / T2 trufflehog / T3
      # ripgrep regex fallback) catches repo-local custom shapes
      # (VELOX_ADMIN_TOKEN 64-hex, AWS AKIA, ghp_, github_pat_, xox-,
      # PEM) that gitleaks's default ruleset does not recognise —
      # this step is a complementary detection layer, not a
      # replacement for the gitleaks step above.
      # Exit contract: 0=PASS, 1=FAIL (hit list printed + saved to
      # HIT_LOG), 2=setup error. NO `continue-on-error: true` per
      # godlike/07 NO-FAKE-AVAILABILITY: a fail is a fail.
      timeout-minutes: 5
      run: make verify-no-secrets

  fase-b-clip-smoke:
    name: FASE B clip pipeline smoke (dry-mode constraint)
    # godlike/07 no-fake-availability cheap syntax + payload gate
    # for tests/operational/fase_b_clip_pipeline_smoke.sh on every
    # push + PR. Heavy server-boot end-to-end exercise remains in
    # the smoke-runtime job below in this same file (`make smoke-run-all`).
    runs-on: ubuntu-latest
    needs: verify-main
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Install jq (script runtime requirement)
        # common.sh::smoke_require jq blocks script entry without jq
        # (exit 2). sqlite3 is preinstalled on ubuntu-latest so we
        # install ONLY the missing dependency (godlike/07 narrow).
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run fase_b_clip_pipeline_smoke.sh in dry mode
        # common.sh honours SMOKE_DRY_RUN=1 (L78-83) by short-
        # circuiting token + HTTP probes. --dry exits 0 if bash
        # syntax + jq payload builders + sqlite3 query syntax
        # are all valid. Wall-clock cost: sub-second.
        env:
          SMOKE_DRY_RUN: "1"
        run: bash tests/operational/fase_b_clip_pipeline_smoke.sh --dry

  smoke-runtime:
    name: Smoke runtime — boot server + smoke-run-all (push+PR variant)
    # Mirror of the legacy .github/workflows/smoke.yml push+PR run, folded
    # into the ci.yml matrix so the same trigger fires exactly one smoke
    # gate. The nightly scheduled variant lives in .github/workflows/nightly.yml
    # (smoke-nightly job, 03:00 UTC). Manual dispatch variants live in
    # .github/workflows/manual.yml.
    runs-on: ubuntu-latest
    needs: verify-main
    permissions:
      contents: read
    # 15-min headroom: server build + 60s health-wait + 3 smoke scripts
    # (each ≤180s wall-clock) + shell-internal overhead.
    timeout-minutes: 15
    # Re-runs and rapid pushes cancel the previous run. Concurrency key
    # scoped to ref so different branches run in parallel.
    concurrency:
      group: smoke-runtime-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node-scraper/package-lock.json

      - name: Build server binary
        # Make owns the frontend preparation and server build contract so
        # smoke CI exercises the same path as local server smoke checks.
        run: |
          set -o pipefail
          make build-server 2>&1 | tee build.log

      - name: Boot server and run smoke suite
        env:
          # Secret is consumed only by this step. smoke_echo_safe in
          # common.sh ensures it is never persisted to disk unredacted.
          VELOX_ADMIN_TOKEN: ${{ secrets.VELOX_ADMIN_TOKEN }}
          # Pinned to the project-default port (overridable by `VELOX_PORT`
          # at runtime; we hard-code here so the workflow is self-documenting).
          VELOX_PORT: 8080
          # Burn-after-read on the runner: ephemeral temp dir, cleared at
          # job end. Common.sh chmod 700 + chmod 600 inside this path.
          SMOKE_LOG_DIR: ${{ runner.temp }}/smoke-logs
        run: |
          set -uo pipefail

          # Pre-create the log directory with strict ACLs BEFORE any script
          # runs. common.sh mkdir-chmods on first write, but creating up
          # front avoids a 0600-creep window if a step crashes mid-write.
          mkdir -p "$SMOKE_LOG_DIR"
          chmod 700 "$SMOKE_LOG_DIR"

          # ── Server boot (inline background + PID capture) ────────────
          # We deliberately do NOT use `actions/*` background: true steps;
          # those create zombie processes on runner GC teardown and leak
          # ports across job reruns. Inline backgrounding with a trap is
          # the canonical pattern for short-lived CI service spawning.
          ./bin/pipelinegen --mode all > server.log 2>&1 &
          SERVER_PID=$!
          # Belt-and-braces cleanup: kill server even on set -e failure,
          # signal interrupts, or normal exit. `|| true` tolerates a race
          # where the server already exited (e.g., health-wait timed out).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT INT TERM

          # ── Readiness wait (cap 60s) ─────────────────────────────────
          # `until curl -sSf` re-polls every 2s; `timeout 60` is the hard
          # ceiling. Exit 124 from `timeout` propagates as a setup error.
          echo "::group::Waiting for server /health (60s cap)"
          timeout 60 bash -c 'until curl -sSf http://127.0.0.1:8080/health > /dev/null; do sleep 2; done' || {
            echo "::error::Server failed to respond to /health within 60s — see server.log below."
            tail -n 200 server.log || true
            exit 2  # mirrors smoke lib's "setup error" exit code contract
          }
          echo "::endgroup::"
          echo "Server up — invoking smoke suite."

          # ── Invocation ──────────────────────────────────────────────
          make smoke-run-all

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-runtime-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/smoke-logs/
            build.log
            server.log
          if-no-files-found: warn
          retention-days: 14
