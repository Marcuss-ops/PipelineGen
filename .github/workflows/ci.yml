# .github/workflows/ci.yml
#
# PipelineGen full-repository CI gate (Phase 6, June 2026).
#
# SSOT contract (Phase 6): every Go toolchain reference in this
# workflow is resolved from go.mod's `go` directive via the
# `go-version-file` input to actions/setup-go. The Makefile
# preflight (preflight:) and the Dockerfile's GO_VERSION ARG parse
# the same source, so a single bump to go.mod's `go` directive
# propagates to all three surfaces with zero drift.
#
# Jobs (all parallel by default; the smoke-e2e-artlist job is
# serial after build to consume the freshly-built image):
#   build           — go vet, gofmt -l, race tests, coverage, build
#                     binaries, gen-api-docs verify, go.mod tidy check,
#                     architectural checks, docker compose config
#   lint            — golangci-lint
#   vuln            — govulncheck
#   secrets         — gitleaks
#   verify-node-scraper — node version SSOT + npm ci + npm test
#   smoke-e2e-artlist  — docker compose up server + scraper, run
#                        the artlist smoke against the live
#                        container, tear down

name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Concurrency: cancel in-progress runs of the same ref so rapid pushes
# don't pile up. Mirrors smoke.yml's contract.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go (SSOT: go.mod `go` directive)
      # go-version-file reads the `go` directive from go.mod so the
      # runner's Go toolchain matches the SSOT. Matches the Makefile's
      # GO_VERSION extraction and the Dockerfile's GO_VERSION ARG.
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify Go toolchain contract
      # Mirrors `make go-version-check` from the local dev workflow.
      # Catches a host Go that drifted BELOW go.mod's `go` directive
      # before `go mod download` prints misleading output.
      run: make go-version-check

    - name: Install dependencies
      run: go mod download

    - name: Verify go.mod is tidy (read-only)
      # Phase 6: split from the mutating `tidy-check` Make target.
      # This step is read-only (it does NOT run `go mod tidy`); the
      # developer is expected to have run `make tidy` locally before
      # pushing. If the working tree has uncommitted go.mod / go.sum
      # changes, the diff fails the build instead of being silently
      # reverted by a `tidy && diff` round-trip.
      run: |
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "❌ go.mod / go.sum have uncommitted changes."
          echo "Run: make tidy (or go mod tidy) and commit the result."
          exit 1
        fi

    - name: Run gofmt -l
      # Phase 6: catches files that would be reformatted by `gofmt`.
      # `gofmt -l` prints the names of files that need formatting
      # and exits 0; a non-empty output is a hard failure.
      run: |
        UNFORMATTED=$(gofmt -l .)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ The following files would be reformatted by gofmt:"
          echo "$UNFORMATTED"
          echo "Run: gofmt -w <files>  (or: make fmt)"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run Architectural Checks
      # Check 17 (June 2026 codex/db-sql-ownership-gate) gates `database/sql`
      # imports against a 42-file grandfathered baseline. Regressions above
      # baseline exit 1; the baseline can be shrunk by followup PRs that
      # port each file off `database/sql`. See ARCHITECTURE.md §12 +
      # scripts/ci-architectural-checks.sh::Check 17 for the rationale.
      run: |
        if [ -f scripts/ci-architectural-checks.sh ]; then
          chmod +x scripts/ci-architectural-checks.sh
          bash scripts/ci-architectural-checks.sh
        else
          echo "info: scripts/ci-architectural-checks.sh not present — skipping textual rg-based check"
        fi

    - name: Build all packages
      run: go build ./...

    - name: Build all binaries
      # Canonical binaries: cmd/server (long-running HTTP server),
      # cmd/admin (one-shot CLI + `admin gen-api-docs` subcommand),
      # cmd/worker (cross-host worker process). `cmd/gen-api-docs` was
      # folded into `cmd/admin gen-api-docs` (see cmd/admin/main.go).
      run: |
        go build -o /dev/null ./cmd/server/
        go build -o /dev/null ./cmd/worker/
        go build -o /dev/null ./cmd/admin/

    - name: Generate API docs
      # `admin gen-api-docs` writes the canonical markdown snapshot of the
      # currently-registered HTTP routes. CI then diffs the snapshot to
      # fail the build when a route was added without regenerating docs.
      run: |
        go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md

    - name: Verify generated docs are up to date
      # NOTE: must use `run: |` block-scalar form (NOT single-line flow).
      # The echo string contains `Run: go run ...` — a colon + space
      # inside a flow scalar confuses YAML into parsing it as a
      # nested mapping key. Block scalars handle this case correctly.
      #
      # git status --porcelain catches modified, staged, AND untracked
      # files — git diff --exit-code alone misses new untracked docs.
      run: |
        if [ -n "$(git status --porcelain docs/api/ACTIVE_API_GENERATED.md 2>/dev/null)" ]; then
          echo "❌ Generated API docs are out of date."
          echo "Run: go run ./cmd/admin gen-api-docs docs/api/ACTIVE_API_GENERATED.md"
          exit 1
        fi

    - name: Run Unit Tests (with race detector)
      run: go test -race -v ./internal/... ./pkg/...

    - name: Run Coverage Check
      run: make coverage-check

    - name: Verify docker compose config
      # Phase 6: catches docker-compose.yml / Dockerfile drift that
      # `make preflight` covers locally. The `docker compose config`
      # parses the compose file + resolves `${VAR}` references; a
      # mismatch between compose env vars, Dockerfile ARGs, or service
      # definitions surfaces here as a non-zero exit.
      run: |
        if command -v docker >/dev/null 2>&1; then
          docker compose config --quiet
        else
          echo "warning: docker not on PATH — skipping compose config check"
        fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go (SSOT: go.mod `go` directive)
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v1.59.1

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Go (SSOT: go.mod `go` directive)
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Verify Go toolchain contract
      run: make go-version-check

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.3

    - name: Run govulncheck
      run: govulncheck ./...

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-node-scraper:
    name: Verify node-scraper installs + tests on Node 22
    # Mirrors the audit's recommendation: Dependabot already runs
    # weekly against /node-scraper, so the runner's npm contract is
    # exercised here too. `make node-version-check` is the single
    # source-of-truth check against node-scraper/package.json's
    # `engines.node` field, so the failure message in CI matches the
    # one developers see locally.
    #
    # Phase 6: added `npm test` (was previously `npm ci` only) so a
    # broken test in the scraper fails CI before the smoke-e2e job
    # spins up the full container stack.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node (matches package.json engines.node)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Node toolchain contract
        run: make node-version-check

      - name: Install node-scraper dependencies
        working-directory: node-scraper
        run: npm ci

      - name: Run node-scraper tests
        working-directory: node-scraper
        # Graceful skip when package.json has no scripts.test (the
        # current node-scraper ships without a test script). The
        # `--if-present` flag is only valid for `npm install <pkg>`
        # and `npm exec`, NOT for `npm test` — so we check for the
        # script presence via `npm pkg get` and only invoke `npm test`
        # when it's defined. This keeps the gate additive: adding a
        # `scripts.test` to node-scraper/package.json will
        # automatically be exercised by CI on the next push.
        run: |
          if npm pkg get scripts.test >/dev/null 2>&1; then
            echo "scripts.test defined — running npm test"
            npm test
          else
            echo "No scripts.test defined in node-scraper/package.json — skipping"
          fi

  smoke-e2e-artlist:
    name: Smoke E2E Artlist (docker-compose)
    # Phase 6: end-to-end smoke from the live server container. Brings
    # up pipelinegen-server + artlist-scraper via docker compose,
    # waits for the server's /health + the scraper's /health, then
    # runs the artlist smoke against the live container port. Tears
    # down on exit (success OR failure) so CI minutes are bounded.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build server image
        # Build only the server-runtime target — the worker is
        # exercised by smoke.yml's black-box suite. The scraper is
        # built by `docker compose up` via node-scraper/Dockerfile.scraper.
        run: |
          docker build \
            --target server-runtime \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            -t pipelinegen-server:ci .

      - name: Bring up server + scraper stack
        env:
          # Compose reads these from the workflow env. The admin token
          # is consumed only by the boot/run step; the artlist smoke
          # script (tests/operational/*) redacts it on every log
          # write. We do NOT start the worker container — the smoke
          # targets the in-process worker bundled with --mode all.
          VELOX_ADMIN_TOKEN: ${{ secrets.VELOX_ADMIN_TOKEN }}
          VELOX_PORT: 8000
        run: |
          set -uo pipefail
          # Pass the two service names as args; vLLM is commented out
          # in docker-compose.yml, so the explicit service list is the
          # canonical "don't accidentally start the GPU service" guard.
          docker compose up -d pipelinegen-server artlist-scraper
          echo "::group::docker compose ps"
          docker compose ps
          echo "::endgroup::"

      - name: Wait for server /health (90s cap)
        run: |
          timeout 90 bash -c 'until curl -sSf http://127.0.0.1:8081/health > /dev/null; do sleep 2; done' \
            || { echo "::error::Server failed to respond to /health within 90s"; docker compose logs pipelinegen-server; exit 1; }

      - name: Wait for scraper /health (60s cap)
        run: |
          timeout 60 bash -c 'until curl -sSf http://127.0.0.1:9123/health > /dev/null; do sleep 2; done' \
            || { echo "::error::Scraper failed to respond to /health within 60s"; docker compose logs artlist-scraper; exit 1; }

      - name: Run artlist smoke against the live container
        env:
          VELOX_PORT: 8081
          VELOX_ADMIN_TOKEN: ${{ secrets.VELOX_ADMIN_TOKEN }}
        # Two-step smoke: (1) `/api/system/doctor` confirms the HTTP
        # surface + admin-token gate is wired (same surface as
        # `make doctor`); (2) `/api/artlist/run-smart` confirms the
        # scraper integration is reachable. The artlist endpoint is
        # hit with the canonical payload shape; a non-2xx response
        # surfaces as "endpoint did not return 2xx" without depending
        # on a payload-level dry_run flag (which is not a documented
        # contract on the handler). Operators wanting full E2E can
        # replace the curl with `make artlist` or invoke
        # tests/operational/artlist_smoke.sh if present.
        run: |
          set -uo pipefail
          # (1) /api/system/doctor — no auth required, confirms the
          # server is healthy and the route table is registered.
          curl -sSf http://127.0.0.1:8081/api/system/doctor \
            -o /dev/null -w "doctor_http_status=%{http_code}\n" \
            || { echo "::error::doctor endpoint did not return 2xx"; exit 1; }
          # (2) /api/artlist/run-smart — admin-token gated, confirms
          # the scraper integration is reachable. We don't assert the
          # payload contents (the scraper upstream is unstable in CI);
          # we only assert the server routes to the scraper without
          # 4xx/5xx.
          curl -sSf -X POST http://127.0.0.1:8081/api/artlist/run-smart \
            -H "Content-Type: application/json" \
            -H "X-Velox-Admin-Token: $VELOX_ADMIN_TOKEN" \
            -d '{"term":"technology","limit":1,"preset":"youtube_1080p_7s"}' \
            -o /dev/null -w "artlist_endpoint_http_status=%{http_code}\n" \
            || { echo "::error::artlist endpoint did not return 2xx"; exit 1; }

      - name: Tear down stack (capture logs first)
        if: always()
        run: |
          # Capture logs BEFORE teardown so the upload step (which
          # runs only on failure) finds the artefact path populated.
          # --volumes drops the named pipelinegen-data + qdrant-storage
          # volumes to keep the runner clean across reruns.
          mkdir -p /tmp/docker-compose-logs
          docker compose logs pipelinegen-server > /tmp/docker-compose-logs/server.log 2>&1 || true
          docker compose logs artlist-scraper > /tmp/docker-compose-logs/scraper.log 2>&1 || true
          docker compose down --volumes --remove-orphans

      - name: Upload smoke logs on failure
        if: failure()
        # Runs AFTER the teardown step so the artefact path exists.
        # The teardown step is `if: always()`; this step is `if:
        # failure()`. On a failed smoke run, the teardown captures
        # logs, then this step uploads them. On a successful run, the
        # teardown still runs (cleanup) but the upload is skipped.
        uses: actions/upload-artifact@v4
        with:
          name: smoke-e2e-logs-${{ github.run_id }}
          path: |
            /tmp/docker-compose-logs/
          if-no-files-found: warn
          retention-days: 7
