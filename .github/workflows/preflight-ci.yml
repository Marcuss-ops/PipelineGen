# .github/workflows/preflight-ci.yml — Qdrant preflight CI smoke
#
# Triggers: workflow_dispatch only. Promotion to push-on-main remains blocked
# until the full stack and canonical media/outbox seed producer are green.
# The retired script clips adapter is not a preflight dependency.
name: qdrant-preflight

on:
  workflow_dispatch:
    inputs:
      url:
        description: "PipelineGen server URL (default http://127.0.0.1:8081)"
        required: false
        default: "http://127.0.0.1:8081"
      qdrant_url:
        description: "Qdrant base URL (default http://127.0.0.1:16333)"
        required: false
        default: "http://127.0.0.1:16333"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: build-preflight-binary
        run: |
          go build -o ./bin/admin ./cmd/admin/
          ls -la ./bin/admin

      - name: start-docker-compose-stack
        run: |
          docker compose up -d qdrant pipelinegen-server
          for i in $(seq 1 60); do
            HTTP=$(curl -sS -m 2 -o /dev/null -w '%{http_code}' http://localhost:8081/healthz 2>/dev/null || echo 000)
            QDRANT=$(curl -sS -m 2 -o /dev/null -w '%{http_code}' http://localhost:16333/healthz 2>/dev/null || echo 000)
            if [ "$HTTP" = "200" ] && [ "$QDRANT" = "200" ]; then
              echo "stack GREEN after ${i}s"
              break
            fi
            sleep 1
          done
          if [ "$HTTP" != "200" ] || [ "$QDRANT" != "200" ]; then
            echo "stack NOT GREEN: server :8081=$HTTP / qdrant :16333=$QDRANT"
            docker compose logs --tail=100
            exit 1
          fi

      - name: run-preflight
        env:
          VELOX_ADMIN_TOKEN: ${{ secrets.VELOX_ADMIN_TOKEN }}
          VELOX_WORKER_TOKEN: ${{ secrets.VELOX_WORKER_TOKEN }}
        run: |
          ./bin/admin qdrant-preflight \
            --url=${{ github.event.inputs.url || 'http://127.0.0.1:8081' }} \
            --qdrant-url=${{ github.event.inputs.qdrant_url || 'http://127.0.0.1:16333' }}

      - name: tear-down-stack
        if: always()
        run: |
          docker compose down --volumes || true
