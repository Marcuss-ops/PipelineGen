# .github/workflows/smoke.yml
#
# Black-box smoke suite for PipelineGen.
#
# Semantics-of-truth: the smoke scripts under tests/operational/ were
# stabilised at commit 473e22c3 ("test(operational): add black-box runtime
# smoke checks"). This workflow runs against the CURRENT checkout so that
# regressions are caught as the codebase evolves; we deliberately do NOT
# pin to 473e22c3 via `git checkout` because that would mask drift in the
# server contract and create a permanent maintenance foot-gun. Future
# semantic updates to the suite should bump the source-of-truth commit
# reference in this comment.
#
# Pipeline:
#   1. Build the server binary (cmd/server).
#   2. Boot it in-line (background + PID + trap) inside one step.
#   3. Wait for /health to return 2xx (`timeout 60s` cap).
#   4. Invoke `make smoke-run-all` which chains:
#        - tests/operational/startup_smoke.sh    (health/ready/doctor)
#        - tests/operational/text_script_smoke.sh (POST → poll → assertions)
#        - tests/operational/failed_job_smoke.sh  (error-path coverage)
#      Each script sources tests/operational/lib/common.sh which:
#        - sets umask 077 (new log files default to 0600);
#        - chmod 700 on $SMOKE_LOG_DIR; chmod 600 on each label.txt;
#        - token-redacts every payload before writing to disk.
#   5. On failure, upload $SMOKE_LOG_DIR as an artefact for forensic review.
#
# The "0600-mode artefact" requirement is satisfied LOCAL to the runner
# via common.sh. GitHub Actions zips the artefact for upload, which flattens
# Unix file modes on download — this is a GitHub-side limitation, not a
# workflow defect. The redaction guarantee (smoke_echo_safe in common.sh)
# is what actually protects credentials; the 0600 mode is posture only.

name: Smoke Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly run at 03:00 UTC — catches regressions triggered by external
    # dependency drift (Ollama model updates, Qdrant rotation, etc.)
    - cron: '0 3 * * *'
  workflow_dispatch:

# Concurrency group keyed on the ref so re-runs and rapid pushes cancel the
# previous smoke run. `cancel-in-progress: true` keeps CI minutes bounded.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-run:
    name: Run black-box smoke suite
    runs-on: ubuntu-latest
    # Mirror ci.yml's minimal-permissions pattern. The token is read from
    # secrets and bubbled into the step env block; it never appears in
    # shell history or step output (smoke lib redacts it on every path).
    permissions:
      contents: read
    # 15-min headroom: server build + 60s health-wait + 3 smoke scripts
    # (each ≤180s wall-clock) + shell-internal overhead.
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build server binary
        # Make owns the frontend preparation and server build contract so
        # smoke CI exercises the same path as local server smoke checks.
        run: |
          set -o pipefail
          make build-server 2>&1 | tee build.log

      - name: Boot server and run smoke suite
        env:
          # Secret is consumed only by this step. smoke_echo_safe in
          # common.sh ensures it is never persisted to disk unredacted.
          VELOX_ADMIN_TOKEN: ${{ secrets.VELOX_ADMIN_TOKEN }}
          # Pinned to the project-default port (overridable by `VELOX_PORT`
          # at runtime; we hard-code here so the workflow is self-documenting).
          VELOX_PORT: 8080
          # Burn-after-read on the runner: ephemeral temp dir, cleared at
          # job end. Common.sh chmod 700 + chmod 600 inside this path.
          SMOKE_LOG_DIR: ${{ runner.temp }}/smoke-logs
        run: |
          set -uo pipefail

          # Pre-create the log directory with strict ACLs BEFORE any script
          # runs. common.sh mkdir-chmods on first write, but creating up
          # front avoids a 0600-creep window if a step crashes mid-write.
          mkdir -p "$SMOKE_LOG_DIR"
          chmod 700 "$SMOKE_LOG_DIR"

          # ── Server boot (inline background + PID capture) ────────────
          # We deliberately do NOT use `actions/*` background: true steps;
          # those create zombie processes on runner GC teardown and leak
          # ports across job reruns. Inline backgrounding with a trap is
          # the canonical pattern for short-lived CI service spawning.
          ./bin/pipelinegen --mode all > server.log 2>&1 &
          SERVER_PID=$!
          # Belt-and-braces cleanup: kill server even on set -e failure,
          # signal interrupts, or normal exit. `|| true` tolerates a race
          # where the server already exited (e.g., health-wait timed out).
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT INT TERM

          # ── Readiness wait (cap 60s) ─────────────────────────────────
          # `until curl -sSf` re-polls every 2s; `timeout 60` is the hard
          # ceiling. Exit 124 from `timeout` propagates as a setup error.
          echo "::group::Waiting for server /health (60s cap)"
          timeout 60 bash -c 'until curl -sSf http://127.0.0.1:8080/health > /dev/null; do sleep 2; done' || {
            echo "::error::Server failed to respond to /health within 60s — see server.log below."
            tail -n 200 server.log || true
            exit 2  # mirrors smoke lib's "setup error" exit code contract
          }
          echo "::endgroup::"
          echo "Server up — invoking smoke suite."

          # ── Invocation ──────────────────────────────────────────────
          # `make` returns the underlying script's exit code (0 / 1 / 2 /
          # 124). `set -uo pipefail` + the default non-`-e` shell keeps the
          # upload-on-failure step able to surface failure() regardless of
          # what code the make invocation returns. (We intentionally omit
          # `set -e` here so a non-zero from the trap-cleanup block does
          # not mask the suite's exit code.)
          make smoke-run-all

      - name: Upload smoke logs on failure
        # Conditional upload: only when the boot/run step failed. Success
        # runs produce no artefact (saves storage + keeps $SMOKE_LOG_DIR
        # ephemeral). Token redaction is enforced by common.sh for the
        # smoke script logs; `server.log` is also included so boot /
        # readiness-probe failures have full forensic coverage (the server
        # contractually does NOT log credentials — see AGENTS.md's
        # "Admin token" invariant — so server.log is safe to stage here).
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Per-run name so multiple failed runs of the same SHA don't
          # collide on the GitHub artefact namespace.
          name: smoke-logs-${{ github.run_id }}
          # Multi-path upload: $SMOKE_LOG_DIR (post-run smoke logs, 0600)
          # AND server.log (boot-trace for run-step failures). The
          # newline-separated path list is the v4 syntax for uploading
          # files + directories in one step.
          path: |
            ${{ runner.temp }}/smoke-logs/
            build.log
            server.log
          if-no-files-found: warn
          retention-days: 14
