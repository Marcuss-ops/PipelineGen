name: Dependabot Reconcile (read-only)

# Companion to the Dependabot version-update workflow. Listed open PRs
# authored by Dependabot, counts semver-major in titles (which should
# normally be suppressed by the global ignore rule), runs `go mod tidy`
# and `git diff --exit-code -- go.mod go.sum` to detect lockfile drift,
# and opens a single GitHub issue when something is off.
#
# Required by the Audit Report of June 2026 — read-only contract:
#   - never commits
#   - never modifies lockfiles
#   - never reverts/rebases Dependabot PRs
#
# Cron rationale: 08:00 UTC == 10:00 Europe/Rome in summer (CEST,
# UTC+2) and 09:00 in winter (CET, UTC+1). Dependabot's scheduled
# run is at 08:00 Europe/Rome — this lands ~2h after in summer and
# ~1h after in winter. The DST-induced drift is acceptable for a
# read-only audit; pin neither tighter.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  reconcile:
    name: Audit Dependabot PRs and go.mod drift
    runs-on: ubuntu-latest
    # Scope write privileges to this job only so any future jobs
    # added below do not silently inherit `issues: write`.
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'

      - name: Verify Go toolchain contract
        # Mirror of the local `make go-version-check`. Catches a
        # runner whose Go is older than go.mod's `go` directive
        # BEFORE `go mod tidy` can produce a misleading "dirty" verdict.
        run: make go-version-check

      - name: List open Dependabot PRs
        id: list-prs
        run: |
          gh pr list \
            --app dependabot \
            --state open \
            --json number,title,author,createdAt,labels \
            > dependabot-prs.json
          echo "Open Dependabot PRs:"
          if [ -s dependabot-prs.json ]; then
            jq -r '.[] | "  - #\(.number) \(.title)"' dependabot-prs.json
          else
            echo "  (none)"
          fi

      - name: Detect unexpected semver-major PR titles
        id: majors
        run: |
          MAJOR_COUNT=$(jq '[.[] | select(.title | test("major"; "i"))] | length' dependabot-prs.json)
          echo "major_count=$MAJOR_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$MAJOR_COUNT" -gt 0 ]; then
            echo "::warning::Found $MAJOR_COUNT open Dependabot PR(s) with semver-major in title (should normally be suppressed by the global ignore rule)"
            jq -r '.[] | select(.title | test("major"; "i")) | "  - #\(.number) \(.title)"' dependabot-prs.json
          else
            echo "No open Dependabot PRs with semver-major in title"
          fi

      - name: Verify go.mod is tidy (read-only check, no commit)
        id: tidy-check
        run: |
          go mod tidy
          if git diff --exit-code -- go.mod go.sum >/dev/null; then
            echo "tidy=clean" >> "$GITHUB_OUTPUT"
            echo "go.mod and go.sum are tidy"
          else
            echo "tidy=dirty" >> "$GITHUB_OUTPUT"
            echo "::warning::go.mod or go.sum differ after 'go mod tidy' — manual tidy PR needed"
            git --no-pager diff -- go.mod go.sum | head -200
          fi

      - name: Open drift / unexpected-major issue
        if: steps.tidy-check.outputs.tidy == 'dirty' || steps.majors.outputs.major_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prs = JSON.parse(fs.readFileSync('dependabot-prs.json', 'utf8'));
            const majors = prs.filter(p => /major/i.test(p.title));
            const dirty = '${{ steps.tidy-check.outputs.tidy }}' === 'dirty';
            const date = new Date().toISOString().slice(0, 10);
            const lines = [
              '## Dependabot reconciliation — ' + date,
              '',
              'This workflow is read-only: no commits, no lockfile changes, no reverts.',
              'Investigate the anomaly manually and file follow-up PRs as needed.',
              '',
              `- Open Dependabot PRs: **${prs.length}**`,
              `- Of which with semver-major in title: **${majors.length}**`,
              `- go.mod tidy check: **${dirty ? 'dirty' : 'clean'}**`,
              '',
            ];
            if (majors.length) {
              lines.push('### Unexpected major PRs', '');
              lines.push(...majors.map(p => `- #${p.number} ${p.title}`));
              lines.push('');
            }
            if (dirty) {
              lines.push('### go.mod drift', '');
              lines.push('`git diff -- go.mod go.sum` is non-empty after `go mod tidy`. The lockfile is out of sync with go.mod. The maintainer should open a follow-up PR that runs `go mod tidy` and reviews the diff.');
              lines.push('');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Dependabot reconciliation drift — ' + date,
              body: lines.join('\n'),
              labels: ['dependencies'],
            });
