name: One-shot validate architectural split

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: one-shot-validate-architectural-split
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] validate architectural split v1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Report start
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Architectural split validation started. Run id: ${context.runId}.`
            })

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep python3-yaml
          go mod download

      - name: Validate structure and byte parity
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci-architectural-checks.sh
          bash -n scripts/ci/architecture/bootstrap.sh
          test ! -e scripts/ci/architecture/checks/all_checks.sh
          test ! -e scripts/ci/architecture/split_monolith.py

          for helper in \
            15_file_size.sh \
            16_package_size.sh \
            43_db_chain_outside_infra.sh \
            44_application_size_cap_and_aliases_ban.sh \
            46_inline_clips_repository_map_ban.sh; do
            test -f "scripts/ci/architecture/checks/${helper}"
            bash -n "scripts/ci/architecture/checks/${helper}"
          done

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          legacy_ref = "43b01952b0d6f60c511a62c87f40ab8e976a4acb"
          legacy_path = "scripts/ci/architecture/checks/all_checks.sh"
          legacy = subprocess.check_output(["git", "show", f"{legacy_ref}:{legacy_path}"])
          legacy_lines = legacy.splitlines(keepends=True)
          first_check = next(
              i for i, line in enumerate(legacy_lines)
              if line.startswith("# ── Check 0:".encode())
          )

          manifest_path = Path("scripts/ci/architecture/checks.manifest")
          entries = [
              line.strip()
              for line in manifest_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.startswith("#")
          ]
          if len(entries) != 60:
              raise SystemExit(f"expected 60 manifest modules, found {len(entries)}")
          if len(set(entries)) != len(entries):
              raise SystemExit("manifest contains duplicate modules")

          module_root = Path("scripts/ci/architecture")
          chunks = []
          largest = 0
          for entry in entries:
              if not entry.startswith("checks/") or not entry.endswith(".sh"):
                  raise SystemExit(f"invalid manifest entry: {entry}")
              module = module_root / entry
              if not module.is_file():
                  raise SystemExit(f"missing module: {module}")
              data = module.read_bytes()
              chunks.append(data)
              lines = data.count(b"\n") + (0 if data.endswith(b"\n") else 1)
              largest = max(largest, lines)
              subprocess.run(["bash", "-n", str(module)], check=True)

          reconstructed = b"".join(chunks)
          legacy_body = b"".join(legacy_lines[first_check:])
          if reconstructed != legacy_body:
              raise SystemExit("manifest modules do not byte-reconstruct the historical check body")
          if largest > 700:
              raise SystemExit(f"largest module exceeds 700 lines: {largest}")

          print(f"module_count={len(entries)}")
          print(f"largest_module_lines={largest}")
          print(f"legacy_body_sha256={hashlib.sha256(legacy_body).hexdigest()}")
          print(f"modular_body_sha256={hashlib.sha256(reconstructed).hexdigest()}")
          PY

          for helper in \
            15_file_size.sh \
            16_package_size.sh \
            43_db_chain_outside_infra.sh \
            44_application_size_cap_and_aliases_ban.sh \
            46_inline_clips_repository_map_ban.sh; do
            git show "43b01952b0d6f60c511a62c87f40ab8e976a4acb:scripts/ci/architecture/checks/${helper}" > "/tmp/${helper}.legacy"
            cmp "/tmp/${helper}.legacy" "scripts/ci/architecture/checks/${helper}"
          done

      - name: Compare legacy and modular self-check behavior
        shell: bash
        run: |
          set -euo pipefail
          legacy="scripts/.legacy-architectural-checks.sh"
          git show 43b01952b0d6f60c511a62c87f40ab8e976a4acb:scripts/ci/architecture/checks/all_checks.sh > "${legacy}"
          trap 'rm -f "${legacy}"' EXIT

          set +e
          bash "${legacy}" --self-check > /tmp/legacy-selfcheck.out 2>&1
          legacy_rc=$?
          bash scripts/ci-architectural-checks.sh --self-check > /tmp/modular-selfcheck.out 2>&1
          modular_rc=$?
          set -e

          cmp /tmp/legacy-selfcheck.out /tmp/modular-selfcheck.out
          test "${legacy_rc}" -eq "${modular_rc}"
          echo "selfcheck_rc=${modular_rc}"
          cat /tmp/modular-selfcheck.out

      - name: Compare complete legacy and modular gate behavior
        shell: bash
        run: |
          set -euo pipefail
          legacy="scripts/.legacy-architectural-checks.sh"
          git show 43b01952b0d6f60c511a62c87f40ab8e976a4acb:scripts/ci/architecture/checks/all_checks.sh > "${legacy}"
          trap 'rm -f "${legacy}"' EXIT

          set +e
          timeout 20m bash "${legacy}" > /tmp/legacy-gate.out 2>&1
          legacy_rc=$?
          timeout 20m bash scripts/ci-architectural-checks.sh > /tmp/modular-gate.out 2>&1
          modular_rc=$?
          set -e

          if ! cmp /tmp/legacy-gate.out /tmp/modular-gate.out; then
            echo "Legacy and modular gate output differ:" >&2
            diff -u /tmp/legacy-gate.out /tmp/modular-gate.out | tail -n 300 >&2 || true
            exit 1
          fi
          if [ "${legacy_rc}" -ne "${modular_rc}" ]; then
            echo "Legacy rc=${legacy_rc}; modular rc=${modular_rc}" >&2
            exit 1
          fi
          echo "full_gate_rc=${modular_rc}"
          tail -n 80 /tmp/modular-gate.out

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Architectural split validation finished with status: ${status}. Structural byte parity, self-check parity, and complete-gate parity were executed.`
            });
