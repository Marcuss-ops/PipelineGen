name: Job Kernel Final Zero

on:
  push:
    paths:
      - .github/workflows/job-kernel-final-zero.yml

permissions:
  contents: write
  statuses: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Eliminate the final compatibility imports
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          post_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/$1" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$2" "$3" "$4")" >/dev/null
          }
          fail() {
            local message="$1"
            post_status "${TRIGGER_SHA}" failure "job-kernel-final-zero" "$message"
            exit 1
          }

          post_status "${TRIGGER_SHA}" pending "job-kernel-final-zero" "Closing final 17 compatibility imports"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/job-kernel-ast-cutover.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if "cat >/tmp/job_ast_cutover.go <<'GO'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'GO')
          body = [line[10:] if line.startswith('          ') else line for line in source[start:end]]
          Path('/tmp/job_ast_cutover.go').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY

          go run /tmp/job_ast_cutover.go
          mapfile -t changed_files < /tmp/job-ast-changed.txt

          # clip_ops_cleanup.go declares a local variable named `job`; the
          # syntax-only import cleanup cannot distinguish it from the former
          # package alias. Remove the now-unused kernel import explicitly.
          python3 <<'PY'
          from pathlib import Path
          path = Path('internal/application/clips/clip_ops_cleanup.go')
          text = path.read_text(encoding='utf-8')
          text = text.replace('\tjob "github.com/Marcuss-ops/PipelineGen/internal/kernel/job"\n', '')
          path.write_text(text, encoding='utf-8')
          PY

          gofmt -w "${changed_files[@]}" internal/application/clips/clip_ops_cleanup.go

          compile_log=/tmp/job-kernel-final-compile.log
          if ! go test -run '^$' -timeout 120s \
            ./internal/kernel/job \
            ./internal/domain/job \
            ./internal/application/clips \
            ./internal/api/assets/clips \
            >"${compile_log}" 2>&1; then
            tail -n 180 "${compile_log}"
            fail "Kernel or clips compilation failed"
          fi

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          old = 'github.com/Marcuss-ops/PipelineGen/internal/domain/job'
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          remaining = []
          for root in map(Path, ('internal', 'pkg', 'cmd')):
              if not root.exists():
                  continue
              for path in root.rglob('*.go'):
                  rel = path.as_posix()
                  if path.name.endswith('_test.go') or rel.startswith('cmd/archcheck/'):
                      continue
                  if any(part in {'vendor', 'node_modules', 'testdata'} for part in path.parts):
                      continue
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if old in line and import_line.match(line):
                          remaining.append({'file': rel, 'line': number})
          if remaining:
              raise SystemExit('compatibility imports remain: ' + json.dumps(remaining))

          registry_path = Path('architecture/job_kernel_migration.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry['reported_baseline_imports'] = 0
          registry['completed_capabilities'] = [
              'internal/domain/remote',
              'internal/application/jobs',
              'internal/application/assets',
              'internal/application/youtube',
              'internal/api',
              'internal/app',
              'internal/infrastructure',
              'cmd',
              'pkg',
          ]
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')
          Path('architecture/job_kernel_ast_report.json').write_text(json.dumps({
              'remaining_imports': 0,
              'remaining_sites': [],
              'verified_packages': [
                  'internal/kernel/job',
                  'internal/domain/job',
                  'internal/application/clips',
                  'internal/api/assets/clips',
              ],
              'known_independent_compile_debt': [
                  'internal/application/assets/providers/artlist: missing Service.RunTag and JobAdapter handler methods',
              ],
          }, indent=2) + '\n', encoding='utf-8')
          PY

          # Compile the architecture scanner that owns this ratchet.
          if ! go test -run '^$' -timeout 120s ./cmd/archcheck/... >/tmp/job-kernel-archcheck-compile.log 2>&1; then
            tail -n 160 /tmp/job-kernel-archcheck-compile.log
            fail "Archcheck compilation failed"
          fi

          rm -f architecture/job_kernel_batch_report.json architecture/job_kernel_semantic_report.json
          git rm -f .github/workflows/job-kernel-final-zero.yml
          git rm -f .github/workflows/job-kernel-ast-cutover.yml || true
          git rm -f .github/workflows/job-kernel-ast-stabilize.yml || true
          git rm -f .github/workflows/job-kernel-semantic-cutover.yml || true
          git rm -f .github/workflows/job-kernel-semantic-stabilize.yml || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(job): eliminate production compatibility imports"
          git pull --rebase origin main
          git push origin HEAD:main

          final_sha=$(git rev-parse HEAD)
          post_status "${TRIGGER_SHA}" success "job-kernel-final-zero" "Production compatibility import census is zero"
          post_status "${final_sha}" success "job-kernel-final-zero" "Zero-import ratchet compiled and published"
