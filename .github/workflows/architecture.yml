# .github/workflows/architecture.yml
#
# Single source of truth for architecture governance.
#
# Scope: the `governance` job (push + PR on main) reproduces the active
# architecture catalogs and generates the commit-bound cmd/archcheck report.
#
# REMOVED 2026-09-12 — the `finalize` job (self-mutating maintainer). It ran
# `python3 scripts/admin/architecture_p1_finalize.py`, which does not exist in
# the tree, then `gofmt -w` over ~20 paths deleted by the
# application/api/infrastructure → app/capabilities/platform migration, and
# finally `compile_one clips ./internal/api/assets/clips/...` (also deleted).
# The job therefore aborted on every run while holding `contents: write`, and
# its trigger (`any push that modifies this file`) turned each edit of this
# workflow into a guaranteed red self-mutating run. The real architecture gate
# is `go run ./cmd/archcheck` (without --strict it still fails closed on every
# hard gate; ci.yml additionally runs `--strict`). Git history retains the
# removed job if the normalization pass is ever rebuilt.
#
# Top-level `permissions: {}` denies everything by default; the job grants only
# what it needs.

name: Architecture Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  governance:
    name: Reproduce catalogs and commit-bound report (governance)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: queue_test
          POSTGRES_PASSWORD: queue_test
          POSTGRES_DB: queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U queue_test -d queue_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check RenderingGen queue snapshot and compatibility matrix
        env:
          TEST_DATABASE_URL: postgres://queue_test:queue_test@127.0.0.1:5432/queue_test?sslmode=disable
          RENDERINGGEN_REQUIRE_POSTGRES_TESTS: "1"
        run: python3 scripts/ci/check_queue_vendor.py --tests

      - name: Build Docker Go binaries with the vendored queue
        run: docker buildx build --target builder --progress=plain .

      - name: Regenerate active architecture catalogs
        run: |
          go run ./cmd/admin/regen-current-yaml
          git diff --exit-code -- architecture/current.yaml architecture/issues.yaml

      - name: Check package_hotspots.json current counts are fresh
        # scripts/regen_hotspots.py --check existed but was invoked by nothing,
        # so the registry's `current` counts had silently drifted for four
        # hotspots (app/wiring, capabilities/jobs, capabilities/scripts,
        # scripts/adapters). Freshness is asserted here, next to the other
        # generated-artifact check, instead of relying on someone running it.
        run: python3 scripts/regen_hotspots.py --check

      - name: Test governance schema and policy loading
        run: go test ./pkg/architecturecatalog ./cmd/archcheck/policy ./cmd/archcheck

      - name: Generate commit-bound architecture report
        shell: bash
        run: |
          set +e
          go run ./cmd/archcheck --root=. --policy=architecture/policy.yaml --phase=0 > "${RUNNER_TEMP}/archcheck-report.json"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "archcheck could not load or parse the repository"
            exit 2
          fi
          jq -e --arg sha "$(git rev-parse HEAD)" '.git_commit_sha == $sha' "${RUNNER_TEMP}/archcheck-report.json"

      - name: Upload full architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-report-${{ github.sha }}
          path: ${{ runner.temp }}/archcheck-report.json
          if-no-files-found: error
          retention-days: 30
