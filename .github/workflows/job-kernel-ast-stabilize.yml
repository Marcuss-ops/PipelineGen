name: Job Kernel AST Stabilize

on:
  push:
    paths:
      - .github/workflows/job-kernel-ast-stabilize.yml

permissions:
  contents: write
  statuses: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Rewrite and stabilize package by package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          post_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/$1" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$2" "$3" "$4")" >/dev/null
          }
          fail() {
            post_status "${TRIGGER_SHA}" failure "job-kernel-ast-stabilize" "$1"
            exit 1
          }
          post_status "${TRIGGER_SHA}" pending "job-kernel-ast-stabilize" "AST migration with per-package timeouts"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/job-kernel-ast-cutover.yml').read_text(encoding='utf-8').splitlines()
          # Extract the sentinel promotion Python block.
          start = next(i for i,l in enumerate(lines) if l.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          Path('/tmp/promote_errors.py').write_text('\n'.join(l[10:] if l.startswith('          ') else l for l in lines[start:end]) + '\n')
          # Extract the Go AST rewriter.
          start = next(i for i,l in enumerate(lines) if "cat >/tmp/job_ast_cutover.go <<'GO'" in l) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'GO')
          Path('/tmp/job_ast_cutover.go').write_text('\n'.join(l[10:] if l.startswith('          ') else l for l in lines[start:end]) + '\n')
          PY
          python3 /tmp/promote_errors.py
          go run /tmp/job_ast_cutover.go
          mapfile -t changed_files < /tmp/job-ast-changed.txt
          gofmt -w "${changed_files[@]}"

          if ! go test -run '^$' -timeout 90s ./internal/kernel/job ./internal/domain/job >/tmp/job-ast-foundation.log 2>&1; then
            tail -n 120 /tmp/job-ast-foundation.log
            fail "Job kernel foundation failed"
          fi

          python3 <<'PY'
          import json
          from pathlib import Path
          packages = {}
          for raw in Path('/tmp/job-ast-changed.txt').read_text().splitlines():
              if not raw.strip(): continue
              directory = str(Path(raw).parent)
              if directory in {'internal/kernel/job','internal/domain/job'}: continue
              packages.setdefault(directory, []).append(raw)
          Path('/tmp/job-ast-packages.json').write_text(json.dumps(packages, indent=2) + '\n')
          Path('/tmp/job-ast-failures.json').write_text('{}\n')
          PY

          for round in 1 2 3 4; do
            failed=0
            mapfile -t dirs < <(python3 -c 'import json; print("\n".join(sorted(json.load(open("/tmp/job-ast-packages.json")))))')
            [ "${#dirs[@]}" -gt 0 ] || break
            for dir in "${dirs[@]}"; do
              log="/tmp/job-ast-${round}-$(echo "$dir" | tr / _).log"
              if go test -run '^$' -timeout 90s "./${dir}" >"$log" 2>&1; then
                continue
              fi
              failed=1
              mapfile -t files < <(python3 - "$dir" <<'PY'
          import json,sys
          print('\n'.join(json.load(open('/tmp/job-ast-packages.json'))[sys.argv[1]]))
          PY
              )
              git checkout -- "${files[@]}"
              SUMMARY="$(tail -n 60 "$log" | head -c 8000)" python3 - "$dir" <<'PY'
          import json,os,sys
          from pathlib import Path
          p=Path('/tmp/job-ast-packages.json'); data=json.loads(p.read_text()); data.pop(sys.argv[1],None); p.write_text(json.dumps(data,indent=2)+'\n')
          f=Path('/tmp/job-ast-failures.json'); failures=json.loads(f.read_text()); failures[sys.argv[1]]=os.environ.get('SUMMARY',''); f.write_text(json.dumps(failures,indent=2)+'\n')
          PY
            done
            [ "$failed" -eq 0 ] && break
          done

          python3 <<'PY'
          import json,re
          from pathlib import Path
          OLD='github.com/Marcuss-ops/PipelineGen/internal/domain/job'
          pat=re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          remaining=[]
          for root in map(Path,('internal','pkg','cmd')):
              if not root.exists(): continue
              for path in root.rglob('*.go'):
                  rel=path.as_posix()
                  if path.name.endswith('_test.go') or rel.startswith('cmd/archcheck/'): continue
                  for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                      if OLD in line and pat.match(line): remaining.append({'file':rel,'line':n})
          migration=Path('architecture/job_kernel_migration.json'); data=json.loads(migration.read_text()); data['reported_baseline_imports']=len(remaining); migration.write_text(json.dumps(data,indent=2)+'\n')
          report={'successful_packages':sorted(json.load(open('/tmp/job-ast-packages.json'))),'failed_packages':json.load(open('/tmp/job-ast-failures.json')),'remaining_imports':len(remaining),'remaining_sites':remaining}
          Path('architecture/job_kernel_ast_report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'successful':len(report['successful_packages']),'failed':len(report['failed_packages']),'remaining':len(remaining)}))
          PY

          successes=$(python3 -c 'import json; print(len(json.load(open("architecture/job_kernel_ast_report.json"))["successful_packages"]))')
          [ "$successes" -gt 0 ] || fail "No AST package migration compiled"

          git rm -f .github/workflows/job-kernel-ast-cutover.yml || true
          git rm -f .github/workflows/job-kernel-ast-stabilize.yml
          git rm -f .github/workflows/job-kernel-semantic-cutover.yml || true
          git rm -f .github/workflows/job-kernel-semantic-stabilize.yml || true
          rm -f architecture/job_kernel_batch_report.json architecture/job_kernel_semantic_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(job): stabilize AST production cutover"
          git pull --rebase origin main
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          remaining=$(python3 -c 'import json; print(json.load(open("architecture/job_kernel_ast_report.json"))["remaining_imports"])')
          post_status "${TRIGGER_SHA}" success "job-kernel-ast-stabilize" "Stable AST migrations published; ${remaining} remain"
          post_status "${final_sha}" success "job-kernel-ast-stabilize" "Per-package AST cutover compiled"
