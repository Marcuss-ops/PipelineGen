name: Job Kernel Package Ratchet

on:
  push:
    paths:
      - .github/workflows/job-kernel-package-ratchet.yml

permissions:
  contents: write
  statuses: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Migrate and compile one package at a time
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local sha="$1" state="$2" context="$3" description="$4"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/${sha}" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "${state}" "${context}" "${description}")" >/dev/null
          }

          post_status "${TRIGGER_SHA}" pending "job-kernel-package-ratchet" "Compiling migrations package by package"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          OLD = "github.com/Marcuss-ops/PipelineGen/internal/domain/job"
          roots = [Path("internal"), Path("pkg"), Path("cmd")]
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')

          packages: dict[str, list[str]] = {}
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.go")):
                  rel = path.as_posix()
                  if path.name.endswith("_test.go") or rel.startswith("cmd/archcheck/"):
                      continue
                  if any(part in {"vendor", "node_modules", "testdata"} for part in path.parts):
                      continue
                  hit = any(OLD in line and import_line.match(line)
                            for line in path.read_text(encoding="utf-8").splitlines())
                  if hit:
                      packages.setdefault(path.parent.as_posix(), []).append(rel)

          def priority(package: str) -> tuple[int, str]:
              order = (
                  "internal/application/assets",
                  "internal/application/youtube",
                  "internal/application",
                  "internal/api",
                  "internal/app",
                  "internal/infrastructure",
                  "internal/domain",
                  "cmd",
                  "pkg",
              )
              for index, prefix in enumerate(order):
                  if package == prefix or package.startswith(prefix + "/"):
                      return index, package
              return len(order), package

          ordered = sorted(packages, key=priority)
          Path("/tmp/job-kernel-packages.json").write_text(
              json.dumps({"packages": [{"dir": p, "files": packages[p]} for p in ordered]}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"packages_with_compat_imports={len(ordered)}")
          PY

          # Promote the workspace subpackage before migrating its two consumers.
          mkdir -p internal/kernel/job/workspace
          cp internal/domain/job/workspace/*.go internal/kernel/job/workspace/
          rm -f internal/kernel/job/workspace/*_test.go
          gofmt -w internal/kernel/job/workspace/*.go
          if ! go test -run '^$' ./internal/kernel/job/workspace >/tmp/job-kernel-workspace.log 2>&1; then
            cat /tmp/job-kernel-workspace.log
            git clean -fd internal/kernel/job/workspace
            post_status "${TRIGGER_SHA}" failure "job-kernel-package-ratchet" "Canonical workspace package failed to compile"
            exit 1
          fi

          python3 <<'PY'
          import json
          from pathlib import Path
          report = {
              "canonical_workspace_promoted": True,
              "successful_packages": [],
              "failed_packages": [],
          }
          Path("/tmp/job-kernel-report.json").write_text(json.dumps(report, indent=2) + "\n")
          PY

          package_count=$(python3 -c 'import json; print(len(json.load(open("/tmp/job-kernel-packages.json"))["packages"]))')
          for ((i=0; i<package_count; i++)); do
            package_dir=$(python3 -c 'import json,sys; print(json.load(open("/tmp/job-kernel-packages.json"))["packages"][int(sys.argv[1])]["dir"])' "$i")
            mapfile -t package_files < <(python3 -c 'import json,sys; print("\n".join(json.load(open("/tmp/job-kernel-packages.json"))["packages"][int(sys.argv[1])]["files"]))' "$i")

            python3 - "$package_dir" "${package_files[@]}" <<'PY'
          import re
          import sys
          from pathlib import Path

          OLD = "github.com/Marcuss-ops/PipelineGen/internal/domain/job"
          NEW = "github.com/Marcuss-ops/PipelineGen/internal/kernel/job"
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          for raw in sys.argv[2:]:
              path = Path(raw)
              original = path.read_text(encoding="utf-8")
              lines = []
              for line in original.splitlines(keepends=True):
                  if OLD in line and import_line.match(line):
                      line = line.replace(OLD, NEW)
                  lines.append(line)
              path.write_text("".join(lines), encoding="utf-8")
          PY

            gofmt -w "${package_files[@]}"
            log_file="/tmp/job-kernel-package-${i}.log"
            if go test -run '^$' "./${package_dir}" >"${log_file}" 2>&1; then
              python3 - "$package_dir" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path('/tmp/job-kernel-report.json')
          report = json.loads(path.read_text())
          report['successful_packages'].append(sys.argv[1])
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
            else
              git checkout -- "${package_files[@]}"
              summary=$(tail -n 30 "${log_file}" | head -c 6000)
              SUMMARY="$summary" python3 - "$package_dir" <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path('/tmp/job-kernel-report.json')
          report = json.loads(path.read_text())
          report['failed_packages'].append({'package': sys.argv[1], 'compile_tail': os.environ.get('SUMMARY', '')})
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
            fi
          done

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          OLD = "github.com/Marcuss-ops/PipelineGen/internal/domain/job"
          roots = [Path("internal"), Path("pkg"), Path("cmd")]
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          remaining = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.go")):
                  rel = path.as_posix()
                  if path.name.endswith("_test.go") or rel.startswith("cmd/archcheck/"):
                      continue
                  if any(part in {"vendor", "node_modules", "testdata"} for part in path.parts):
                      continue
                  for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if OLD in line and import_line.match(line):
                          remaining.append({"file": rel, "line": line_no})

          migration_path = Path("architecture/job_kernel_migration.json")
          migration = json.loads(migration_path.read_text(encoding="utf-8"))
          migration["reported_baseline_imports"] = len(remaining)
          migration_path.write_text(json.dumps(migration, indent=2) + "\n", encoding="utf-8")

          report_path = Path('/tmp/job-kernel-report.json')
          report = json.loads(report_path.read_text())
          report['remaining_imports'] = len(remaining)
          report['remaining_sites'] = remaining
          report['migrated_packages'] = len(report['successful_packages'])
          report['failed_package_count'] = len(report['failed_packages'])
          Path('architecture/job_kernel_batch_report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps({k: report[k] for k in ('migrated_packages','failed_package_count','remaining_imports')}))
          PY

          migrated=$(python3 -c 'import json; print(json.load(open("architecture/job_kernel_batch_report.json"))["migrated_packages"])')
          remaining=$(python3 -c 'import json; print(json.load(open("architecture/job_kernel_batch_report.json"))["remaining_imports"])')
          if [ "$migrated" -eq 0 ]; then
            post_status "${TRIGGER_SHA}" failure "job-kernel-package-ratchet" "No package migration compiled"
            exit 1
          fi

          git rm .github/workflows/job-kernel-package-ratchet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(job): migrate compatibility imports package by package"
          git pull --rebase origin main
          git push origin HEAD:main

          final_sha=$(git rev-parse HEAD)
          post_status "${TRIGGER_SHA}" success "job-kernel-package-ratchet" "Migrated packages; ${remaining} imports remain"
          post_status "${final_sha}" success "job-kernel-package-ratchet" "Package-by-package migration compiled"
