name: Job Kernel Semantic Cutover

on:
  push:
    paths:
      - .github/workflows/job-kernel-semantic-cutover.yml

permissions:
  contents: write
  statuses: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Move capability constants to their owners
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          post_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/$1" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$2" "$3" "$4")" >/dev/null
          }
          fail() {
            post_status "${TRIGGER_SHA}" failure "job-kernel-semantic-cutover" "$1"
            exit 1
          }
          post_status "${TRIGGER_SHA}" pending "job-kernel-semantic-cutover" "Migrating capability-owned job symbols"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          OLD = "github.com/Marcuss-ops/PipelineGen/internal/domain/job"
          KERNEL = "github.com/Marcuss-ops/PipelineGen/internal/kernel/job"
          BASE = "github.com/Marcuss-ops/PipelineGen/internal/domain/"

          # source symbol -> (owner package, owner symbol, preferred alias)
          mapping = {
              "TypeMediaExtract": ("media", "TypeExtract", "jobmedia"),
              "TypeMediaStock": ("media", "TypeStock", "jobmedia"),
              "TypeArtlistRun": ("media", "TypeArtlistRun", "jobmedia"),
              "TypeMediaGenerate": ("media", "TypeGenerate", "jobmedia"),
              "TypeMediaReindex": ("media", "TypeReindex", "jobmedia"),
              "TypeMediaEnrich": ("media", "TypeEnrich", "jobmedia"),
              "TypeBulkUploadYouTubeClips": ("media", "TypeBulkUploadYouTubeClips", "jobmedia"),
              "TypeMediaCurate": ("media", "TypeCurate", "jobmedia"),
              "TypeClipRegister": ("media", "TypeClipRegister", "jobmedia"),
              "TypeMediaStockRLMEnrich": ("media", "TypeStockRLMEnrich", "jobmedia"),
              "TypeVoiceoverBatch": ("voiceover", "TypeBatch", "jobvoiceover"),
              "TypeVoiceoverGenerate": ("voiceover", "TypeGenerate", "jobvoiceover"),
              "TypeVoiceoverGenerateItem": ("voiceover", "TypeGenerateItem", "jobvoiceover"),
              "TypeVoiceoverPromo": ("voiceover", "TypePromo", "jobvoiceover"),
              "TypeSubtitleGenerate": ("subtitle", "TypeGenerate", "jobsubtitle"),
              "TypeRenderVideo": ("video", "TypeRender", "jobvideo"),
              "TypeVideoGenerate": ("video", "TypeGenerate", "jobvideo"),
              "TypeYouTubeUpload": ("youtube", "TypeUpload", "jobyoutube"),
              "TypeYouTubeClipExtract": ("youtube", "TypeClipExtract", "jobyoutube"),
              "TypeYouTubeClipExtractImportant": ("youtube", "TypeClipExtractImportant", "jobyoutube"),
              "TypeYouTubeRebuildST": ("youtube", "TypeRebuildSearchText", "jobyoutube"),
              "TypeCatalogSync": ("catalog", "TypeSync", "jobcatalog"),
              "TypeSystemCleanup": ("system", "TypeCleanup", "jobsystem"),
              "TypeBooksProcess": ("books", "TypeProcess", "jobbooks"),
              "TypeLessonsProcess": ("lessons", "TypeProcess", "joblessons"),
              "TypeScriptGenerate": ("script", "TypeGenerate", "jobscript"),
              "TypeScriptVoiceoverSibling": ("script", "TypeVoiceoverSibling", "jobscript"),
              "TypeScriptImageSibling": ("script", "TypeImageSibling", "jobscript"),
              "TypeScriptGenerateItem": ("script", "TypeGenerateItem", "jobscript"),
              "TypeDriveFolderSync": ("drive", "TypeFolderSync", "jobdrive"),
              "TypeImagesGenerate": ("image", "TypeImagesGenerate", "jobimage"),
              "TypeImageGenerateGoogle": ("image", "TypeGenerateGoogle", "jobimage"),
              "TypeDocumentGenerate": ("document", "TypeGenerate", "jobdocument"),
              "TypeAssetsResolve": ("asset", "TypeResolve", "jobasset"),
              "TypeAssetTextMaterialize": ("asset", "TypeTextMaterialize", "jobasset"),
          }

          import_re = re.compile(r'^(?P<indent>\s*)(?:import\s+)?(?:(?P<alias>[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?"(?P<path>[^"]+)"')
          changed = set()

          def parse_imports(lines):
              out = []
              for i, line in enumerate(lines):
                  m = import_re.match(line)
                  if not m:
                      continue
                  path = m.group('path')
                  alias = m.group('alias') or path.rsplit('/', 1)[-1]
                  out.append((i, path, alias))
              return out

          def add_imports(lines, additions):
              if not additions:
                  return lines
              # Prefer the first grouped import block.
              start = next((i for i, line in enumerate(lines) if re.match(r'^\s*import\s*\(\s*$', line)), None)
              if start is not None:
                  depth = 0
                  end = None
                  for i in range(start, len(lines)):
                      depth += lines[i].count('(') - lines[i].count(')')
                      if i > start and depth == 0:
                          end = i
                          break
                  if end is None:
                      raise RuntimeError('unterminated import block')
                  new_lines = [f'\t{alias} "{path}"\n' for path, alias in sorted(additions.items())]
                  return lines[:end] + new_lines + lines[end:]
              package_index = next(i for i, line in enumerate(lines) if line.startswith('package '))
              new_lines = [f'import {alias} "{path}"\n' for path, alias in sorted(additions.items())]
              return lines[:package_index+1] + ['\n'] + new_lines + lines[package_index+1:]

          roots = [Path('internal'), Path('pkg'), Path('cmd')]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.go')):
                  rel = path.as_posix()
                  if path.name.endswith('_test.go') or rel.startswith('cmd/archcheck/'):
                      continue
                  if any(part in {'vendor', 'node_modules', 'testdata'} for part in path.parts):
                      continue
                  original = path.read_text(encoding='utf-8')
                  lines = original.splitlines(keepends=True)
                  imports = parse_imports(lines)
                  job_imports = [(i, p, a) for i, p, a in imports if p in {OLD, KERNEL}]
                  if not job_imports:
                      continue
                  existing = {p: a for _, p, a in imports}
                  additions = {}
                  text = original
                  for _, _, job_alias in job_imports:
                      for source, (owner, target, preferred) in mapping.items():
                          pattern = re.compile(rf'\b{re.escape(job_alias)}\.{source}\b')
                          if not pattern.search(text):
                              continue
                          owner_path = BASE + owner
                          owner_alias = existing.get(owner_path)
                          if owner_alias is None:
                              owner_alias = preferred
                              additions[owner_path] = owner_alias
                              existing[owner_path] = owner_alias
                          text = pattern.sub(f'{owner_alias}.{target}', text)
                  if text == original:
                      continue
                  lines = text.splitlines(keepends=True)
                  lines = add_imports(lines, additions)
                  # Remove a job import only when its alias has no selectors left.
                  body = ''.join(lines)
                  imports_after = parse_imports(lines)
                  remove_indices = set()
                  for i, p, alias in imports_after:
                      if p not in {OLD, KERNEL}:
                          continue
                      probe = ''.join(line for j, line in enumerate(lines) if j != i)
                      if not re.search(rf'\b{re.escape(alias)}\.', probe):
                          remove_indices.add(i)
                  if remove_indices:
                      lines = [line for i, line in enumerate(lines) if i not in remove_indices]
                  updated = ''.join(lines)
                  path.write_text(updated, encoding='utf-8')
                  changed.add(rel)

          # Move the six generic FinalizeAttempt sentinels to the kernel and
          # leave transparent aliases in the compatibility package.
          kernel_errors = Path('internal/kernel/job/errors.go')
          kernel_text = kernel_errors.read_text(encoding='utf-8')
          sentinels = {
              'ErrFinalizeAttemptOutcomeInvalid': 'FinalizeAttempt: outcome not in canonical enum {Succeeded, FailedPermanent, ScheduleRetry} (fail-closed guard at fence)',
              'ErrFinalizeAttemptResultMissing': 'FinalizeAttempt: SUCCEEDED outcome requires non-empty Result (wire-consistency guard)',
              'ErrFinalizeAttemptErrorMissing': 'FinalizeAttempt: non-SUCCEEDED outcome requires non-empty ErrorMessage (silent-empty error trap)',
              'ErrFinalizeAttemptArtifactStale': 'FinalizeAttempt: artifact-state patch stale (row missing, job-id mismatch, or already-terminal state)',
              'ErrFinalizeAttemptOutboxEventMissing': 'FinalizeAttempt: outbox event missing required Type or EventKey (uniqueness invariant)',
              'ErrFinalizeAttemptDLQIncompatible': 'FinalizeAttempt: DLQPayload is only valid with FAILED_PERMANENT or SCHEDULE_RETRY outcomes (terminal-failure invariant)',
          }
          additions = []
          for name, message in sentinels.items():
              if f'var {name} ' not in kernel_text:
                  additions.append(f'\n// {name} is the canonical job-kernel sentinel.\nvar {name} = errors.New({json.dumps(message)})\n')
          if additions:
              kernel_errors.write_text(kernel_text.rstrip() + '\n' + ''.join(additions), encoding='utf-8')
              changed.add(kernel_errors.as_posix())

          compat_errors = Path('internal/domain/job/errors.go')
          compat = compat_errors.read_text(encoding='utf-8')
          for name in sentinels:
              compat = re.sub(rf'var {name} = errors\.New\([^\n]+\)', f'var {name} = kerneljob.{name}', compat)
          if 'errors.New(' not in compat:
              compat = compat.replace('\t"errors"\n\n', '')
          compat_errors.write_text(compat, encoding='utf-8')
          changed.add(compat_errors.as_posix())

          Path('/tmp/job-semantic-changed.txt').write_text('\n'.join(sorted(changed)) + '\n')
          print(f'semantic_changed_files={len(changed)}')
          PY

          mapfile -t changed_files < /tmp/job-semantic-changed.txt
          gofmt -w "${changed_files[@]}"
          mapfile -t package_dirs < <(printf '%s\n' "${changed_files[@]}" | xargs -n1 dirname | sort -u)
          package_args=()
          for dir in "${package_dirs[@]}"; do package_args+=("./${dir}"); done

          if ! go test -run '^$' "${package_args[@]}" >/tmp/job-semantic-compile.log 2>&1; then
            tail -n 160 /tmp/job-semantic-compile.log
            fail "Semantic package compilation failed"
          fi

          python3 <<'PY'
          import json, re
          from pathlib import Path
          OLD = 'github.com/Marcuss-ops/PipelineGen/internal/domain/job'
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          remaining = 0
          for root in map(Path, ('internal','pkg','cmd')):
              if not root.exists(): continue
              for path in root.rglob('*.go'):
                  rel = path.as_posix()
                  if path.name.endswith('_test.go') or rel.startswith('cmd/archcheck/'):
                      continue
                  for line in path.read_text(encoding='utf-8').splitlines():
                      if OLD in line and import_line.match(line): remaining += 1
          migration_path = Path('architecture/job_kernel_migration.json')
          data = json.loads(migration_path.read_text())
          data['reported_baseline_imports'] = remaining
          migration_path.write_text(json.dumps(data, indent=2) + '\n')
          Path('architecture/job_kernel_semantic_report.json').write_text(json.dumps({'remaining_imports': remaining}, indent=2) + '\n')
          print(f'remaining_imports={remaining}')
          PY

          git rm .github/workflows/job-kernel-semantic-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(job): move job symbols to canonical owners"
          git pull --rebase origin main
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          post_status "${TRIGGER_SHA}" success "job-kernel-semantic-cutover" "Capability-owned symbols migrated"
          post_status "${final_sha}" success "job-kernel-semantic-cutover" "Semantic job migration compiles"
