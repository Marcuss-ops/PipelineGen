name: Verify Restored Artlist Adapter

on:
  push:
    paths:
      - .github/workflows/verify-artlist-adapter.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: verify-restored-artlist-adapter
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile and test Artlist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/$1" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$2" "$3" "$4")" >/dev/null
          }

          fail_log() {
            local log="$1"
            local first
            first=$(grep -m1 -E '\.go:[0-9]+(:[0-9]+)?:|undefined:|cannot use|not enough arguments|too many arguments|FAIL' "${log}" || tail -n 1 "${log}" || true)
            first=$(printf '%s' "${first}" | sed -E 's/[^A-Za-z0-9._:/-]+/_/g' | cut -c1-78)
            [ -n "${first}" ] || first=unknown_artlist_error
            post_status "${TRIGGER_SHA}" failure "artlist-adapter-error/${first}" "First Artlist error"
            post_status "${TRIGGER_SHA}" failure "artlist-adapter/verify" "Artlist adapter verification failed"
            exit 1
          }

          post_status "${TRIGGER_SHA}" pending "artlist-adapter/verify" "Compiling restored Artlist adapter"
          git fetch origin main
          git reset --hard origin/main

          if ! go test -run '^$' ./internal/application/assets/providers/artlist >/tmp/artlist-compile.log 2>&1; then
            tail -n 160 /tmp/artlist-compile.log
            fail_log /tmp/artlist-compile.log
          fi
          post_status "${TRIGGER_SHA}" success "artlist-adapter/compile" "Artlist package compiles"

          if ! go test ./internal/application/assets/providers/artlist >/tmp/artlist-tests.log 2>&1; then
            tail -n 160 /tmp/artlist-tests.log
            fail_log /tmp/artlist-tests.log
          fi
          post_status "${TRIGGER_SHA}" success "artlist-adapter/tests" "Artlist tests pass"

          git rm .github/workflows/verify-artlist-adapter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove completed Artlist verifier"
          git pull --rebase origin main
          git push origin HEAD:main

          final_sha=$(git rev-parse HEAD)
          post_status "${TRIGGER_SHA}" success "artlist-adapter/verify" "Restored Artlist adapter is green"
          post_status "${final_sha}" success "artlist-adapter/verify" "Restored Artlist adapter is green"
