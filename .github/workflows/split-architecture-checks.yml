name: Split Architecture Checks

on:
  push:
    paths:
      - .github/workflows/split-architecture-checks.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split check groups and publish
        shell: bash
        run: |
          set -euo pipefail

          apply_split() {
            git fetch origin main
            git reset --hard origin/main

            python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          source_path = root / "scripts/ci/architecture/checks/all_checks.sh"
          checks_dir = source_path.parent
          module_names = (
              "30_database.sh",
              "40_api.sh",
              "50_jobs.sh",
              "60_governance.sh",
          )

          text = source_path.read_text(encoding="utf-8")
          already_split = all((checks_dir / name).is_file() for name in module_names)
          already_split = already_split and all(
              f'"{name}"' in text for name in module_names
          )
          if already_split:
              print("architecture checks are already split")
          else:
              lines = text.splitlines(keepends=True)
              original = "".join(lines)

              def find_echo(pattern: str, start: int = 0) -> int:
                  compiled = re.compile(pattern)
                  for index in range(start, len(lines)):
                      if compiled.search(lines[index]):
                          block_start = index
                          while block_start > 0:
                              previous = lines[block_start - 1]
                              if previous.strip() == "" or previous.lstrip().startswith("#"):
                                  block_start -= 1
                                  continue
                              break
                          return block_start
                  raise RuntimeError(f"missing check boundary: {pattern}")

              def find_comment(pattern: str, start: int = 0) -> int:
                  compiled = re.compile(pattern)
                  for index in range(start, len(lines)):
                      if compiled.search(lines[index]):
                          block_start = index
                          while block_start > 0 and lines[block_start - 1].strip() == "":
                              block_start -= 1
                          return block_start
                  raise RuntimeError(f"missing check boundary: {pattern}")

              start_30 = find_echo(r'^\s*echo\s+"=== Check 30\b')
              start_40 = find_echo(r'^\s*echo\s+"=== Check 4[0-9]\b', start_30 + 1)
              start_50 = find_echo(r'^\s*echo\s+"=== Check 50\b', start_40 + 1)
              start_60 = find_comment(r'^\s*#\s*===\s*Check 60:\s*forbid t\.Skip\b', start_50 + 1)

              boundaries = (start_30, start_40, start_50, start_60, len(lines))
              if list(boundaries) != sorted(boundaries) or len(set(boundaries)) != len(boundaries):
                  raise RuntimeError(f"invalid split boundaries: {boundaries}")

              prefix = lines[:start_30]
              groups = {
                  "30_database.sh": lines[start_30:start_40],
                  "40_api.sh": lines[start_40:start_50],
                  "50_jobs.sh": lines[start_50:start_60],
                  "60_governance.sh": lines[start_60:],
              }

              reconstructed = "".join(prefix)
              reconstructed += "".join(groups["30_database.sh"])
              reconstructed += "".join(groups["40_api.sh"])
              reconstructed += "".join(groups["50_jobs.sh"])
              reconstructed += "".join(groups["60_governance.sh"])
              if reconstructed != original:
                  raise RuntimeError("split changed the original check stream")

              prefix_text = "".join(prefix)
              old_root = 'REPO_ROOT="$(cd "${SCRIPT_DIR}/.." && pwd)"'
              new_root = 'REPO_ROOT="$(cd "${SCRIPT_DIR}/../../../.." && pwd)"'
              if old_root not in prefix_text:
                  raise RuntimeError("expected pre-split REPO_ROOT resolution not found")
              prefix_text = prefix_text.replace(old_root, new_root, 1)

              loader = '''\n# Check groups are sourced in their original canonical order.\nCHECKS_DIR="${SCRIPT_DIR}"\nfor CHECK_MODULE in \\\n  "30_database.sh" \\\n  "40_api.sh" \\\n  "50_jobs.sh" \\\n  "60_governance.sh"\ndo\n  CHECK_PATH="${CHECKS_DIR}/${CHECK_MODULE}"\n  if [ ! -f "${CHECK_PATH}" ]; then\n    echo "CI: architectural check module missing: ${CHECK_PATH}" >&2\n    exit 1\n  fi\n  # shellcheck source=/dev/null\n  source "${CHECK_PATH}"\ndone\n'''

              source_path.write_text(prefix_text.rstrip("\n") + "\n" + loader, encoding="utf-8")
              for name, content_lines in groups.items():
                  content = "".join(content_lines)
                  if not content.endswith("\n"):
                      content += "\n"
                  (checks_dir / name).write_text(content, encoding="utf-8")

              print("split boundaries:", boundaries)
              for name in module_names:
                  count = len((checks_dir / name).read_text(encoding="utf-8").splitlines())
                  print(f"{name}: {count} lines")
          PY

            bash -n scripts/ci/architecture/checks/all_checks.sh
            bash -n scripts/ci/architecture/checks/30_database.sh
            bash -n scripts/ci/architecture/checks/40_api.sh
            bash -n scripts/ci/architecture/checks/50_jobs.sh
            bash -n scripts/ci/architecture/checks/60_governance.sh
            bash scripts/ci/architecture/checks/all_checks.sh --self-check

            rm -f .github/workflows/split-architecture-checks.yml

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              scripts/ci/architecture/checks/all_checks.sh \
              scripts/ci/architecture/checks/30_database.sh \
              scripts/ci/architecture/checks/40_api.sh \
              scripts/ci/architecture/checks/50_jobs.sh \
              scripts/ci/architecture/checks/60_governance.sh \
              .github/workflows/split-architecture-checks.yml

            if git diff --cached --quiet; then
              echo "No split changes to publish"
              return 0
            fi
            git commit -m "refactor(ci): split architecture check groups"
          }

          for attempt in 1 2 3 4 5; do
            echo "publish attempt ${attempt}"
            apply_split
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Unable to publish split after 5 fast-forward attempts" >&2
          exit 1
