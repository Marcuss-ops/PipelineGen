name: One-shot semantic split of architectural checks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-split-ci-architectural-checks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-split-ci-architectural-checks
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore monolith as splitter input
        shell: bash
        run: |
          set -euo pipefail
          monolith="scripts/ci/architecture/checks/all_checks.sh"
          entrypoint="scripts/ci-architectural-checks.sh"
          if [ ! -f "${monolith}" ]; then
            echo "CI: extracted architectural-check monolith is missing: ${monolith}" >&2
            exit 1
          fi
          cp "${monolith}" "${entrypoint}"
          bash -n "${entrypoint}"

      - name: Generate and validate semantic modules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/architecture/split_monolith.py
          test -s scripts/ci/architecture/checks.manifest
          bash -n scripts/ci-architectural-checks.sh
          module_count="$(grep -c '^checks/.*\.sh$' scripts/ci/architecture/checks.manifest)"
          test "${module_count}" -gt 1
          echo "generated_modules=${module_count}"

      - name: Commit split directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/ci-architectural-checks.sh scripts/ci/architecture .github/workflows/one-shot-split-ci-architectural-checks.yml
          git diff --cached --check
          git commit -m "refactor(ci): split architectural checks into sourced modules"
          git pull --rebase origin main
          bash -n scripts/ci-architectural-checks.sh
          git push origin HEAD:main
