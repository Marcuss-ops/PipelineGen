name: One-shot semantic split of architectural checks

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-split-ci-architectural-checks
  cancel-in-progress: true

jobs:
  split:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] split architectural checks v4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report start
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Semantic split started. Run id: ${context.runId}.`
            })

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Restore monolith as splitter input
        shell: bash
        run: |
          set -euo pipefail
          monolith="scripts/ci/architecture/checks/all_checks.sh"
          entrypoint="scripts/ci-architectural-checks.sh"
          test -f "${monolith}"
          cp "${monolith}" "${entrypoint}"
          bash -n "${entrypoint}"

      - name: Generate and validate semantic modules
        id: generate
        shell: bash
        run: |
          set +e
          python3 scripts/ci/architecture/split_monolith.py > /tmp/split-output.txt 2>&1
          rc=$?
          cat /tmp/split-output.txt
          if [ "${rc}" -eq 0 ]; then
            test -s scripts/ci/architecture/checks.manifest || rc=$?
            bash -n scripts/ci-architectural-checks.sh || rc=$?
          fi
          if [ "${rc}" -eq 0 ]; then
            module_count="$(grep -c '^checks/.*\.sh$' scripts/ci/architecture/checks.manifest)"
            if [ "${module_count}" -le 1 ]; then
              echo "expected more than one generated module" | tee -a /tmp/split-output.txt
              rc=1
            else
              echo "module_count=${module_count}" >> "${GITHUB_OUTPUT}"
            fi
          fi
          exit "${rc}"

      - name: Commit split directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/ci-architectural-checks.sh scripts/ci/architecture .github/workflows/one-shot-split-ci-architectural-checks.yml
          git diff --cached --check
          git commit -m "refactor(ci): split architectural checks into sourced modules"
          git pull --rebase origin main
          bash -n scripts/ci-architectural-checks.sh
          git push origin HEAD:main

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ job.status }}';
            const modules = '${{ steps.generate.outputs.module_count }}' || 'unknown';
            let diagnostic = '';
            try {
              diagnostic = fs.readFileSync('/tmp/split-output.txt', 'utf8').trim();
            } catch (_) {}
            if (diagnostic.length > 5000) diagnostic = diagnostic.slice(-5000);
            const suffix = diagnostic ? `\n\nDiagnostic:\n\`\`\`text\n${diagnostic}\n\`\`\`` : '';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Semantic split workflow finished with status: ${status}. Generated modules: ${modules}.${suffix}`
            });
