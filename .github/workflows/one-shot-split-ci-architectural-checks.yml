name: One-shot semantic split of architectural checks

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-split-ci-architectural-checks
  cancel-in-progress: true

jobs:
  split:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] split architectural checks v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report start
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Semantic split started on the canonical all_checks.sh blob.'
            })

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore monolith as splitter input
        shell: bash
        run: |
          set -euo pipefail
          monolith="scripts/ci/architecture/checks/all_checks.sh"
          entrypoint="scripts/ci-architectural-checks.sh"
          test -f "${monolith}"
          cp "${monolith}" "${entrypoint}"
          bash -n "${entrypoint}"

      - name: Generate and validate semantic modules
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/architecture/split_monolith.py | tee /tmp/split-output.txt
          test -s scripts/ci/architecture/checks.manifest
          bash -n scripts/ci-architectural-checks.sh
          module_count="$(grep -c '^checks/.*\.sh$' scripts/ci/architecture/checks.manifest)"
          test "${module_count}" -gt 1
          echo "module_count=${module_count}" >> "${GITHUB_OUTPUT}"

      - name: Commit split directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/ci-architectural-checks.sh scripts/ci/architecture .github/workflows/one-shot-split-ci-architectural-checks.yml
          git diff --cached --check
          git commit -m "refactor(ci): split architectural checks into sourced modules"
          git pull --rebase origin main
          bash -n scripts/ci-architectural-checks.sh
          git push origin HEAD:main

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const modules = '${{ steps.generate.outputs.module_count }}' || 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Semantic split workflow finished with status: ${status}. Generated modules: ${modules}.`
            });
