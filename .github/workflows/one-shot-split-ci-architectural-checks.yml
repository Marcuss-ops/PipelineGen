name: One-shot semantic split of architectural checks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-split-ci-architectural-checks.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-split-ci-architectural-checks
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate semantic check modules
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/architecture/split_monolith.py

      - name: Run the modular production gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m bash scripts/ci-architectural-checks.sh

      - name: Commit split directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/ci-architectural-checks.sh scripts/ci/architecture .github/workflows/one-shot-split-ci-architectural-checks.yml
          git diff --cached --check
          git commit -m "refactor(ci): split architectural checks into sourced modules"
          git pull --rebase origin main
          bash -n scripts/ci-architectural-checks.sh
          git push origin HEAD:main
