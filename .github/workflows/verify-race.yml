name: Verify Race

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for race-detector verification"
        required: false
        default: "manual race verification"
        type: string

permissions:
  contents: read

jobs:
  verify-race:
    name: verify-race (explicit race gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            node-scraper/package-lock.json
            web/package-lock.json

      - name: Run `make verify-race` (fail-closed)
        # This is intentionally manual and separate from verify-main. The
        # race detector is an explicit heavier gate, with concurrency bounded
        # by the Makefile's VERIFY_JOBS setting.
        run: make verify-race
