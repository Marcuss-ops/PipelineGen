name: One-shot consolidate architectural checks

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: one-shot-consolidate-architecture-checks
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.event_name != 'issues' || github.event.issue.title == '[automation] consolidate architectural checks into four modules v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install validation dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep

      - name: Consolidate and publish directly to main
        shell: bash
        run: |
          set -euo pipefail

          generate_split() {
            git fetch origin main
            git reset --hard origin/main

            python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          arch = root / "scripts/ci/architecture"
          checks = arch / "checks"
          manifest_path = arch / "checks.manifest"
          bootstrap_path = arch / "bootstrap.sh"
          entrypoint_path = root / "scripts/ci-architectural-checks.sh"
          all_checks_path = checks / "all_checks.sh"
          requested = ["30_database.sh", "40_api.sh", "50_jobs.sh", "60_governance.sh"]

          if all_checks_path.exists() and all((checks / name).exists() for name in requested):
              print("four-module architecture split already present")
          else:
              if not manifest_path.is_file() or not bootstrap_path.is_file():
                  raise SystemExit("expected semantic split manifest/bootstrap are missing")

              entries = []
              for raw in manifest_path.read_text(encoding="utf-8").splitlines():
                  value = raw.strip()
                  if not value or value.startswith("#"):
                      continue
                  if not value.startswith("checks/") or not value.endswith(".sh"):
                      raise SystemExit(f"invalid manifest entry: {value}")
                  if value in entries:
                      raise SystemExit(f"duplicate manifest entry: {value}")
                  entries.append(value)
              if not entries:
                  raise SystemExit("architecture manifest is empty")

              bootstrap = bootstrap_path.read_text(encoding="utf-8").rstrip("\n") + "\n"
              generated_parts = []
              for relative in entries:
                  path = arch / relative
                  if not path.is_file():
                      raise SystemExit(f"missing generated check module: {relative}")
                  generated_parts.append(path.read_text(encoding="utf-8").rstrip("\n") + "\n")
              assembled = bootstrap + "".join(generated_parts)
              lines = assembled.splitlines(keepends=True)

              def find_echo(pattern: str, start: int = 0) -> int:
                  rx = re.compile(pattern)
                  for index in range(start, len(lines)):
                      if rx.search(lines[index]):
                          block = index
                          while block > 0:
                              previous = lines[block - 1]
                              if previous.strip() == "" or previous.lstrip().startswith("#"):
                                  block -= 1
                                  continue
                              break
                          return block
                  raise SystemExit(f"missing split boundary: {pattern}")

              def find_comment(pattern: str, start: int = 0) -> int:
                  rx = re.compile(pattern)
                  for index in range(start, len(lines)):
                      if rx.search(lines[index]):
                          block = index
                          while block > 0 and lines[block - 1].strip() == "":
                              block -= 1
                          return block
                  raise SystemExit(f"missing split boundary: {pattern}")

              start_30 = find_echo(r'^\s*echo\s+"=== Check 30\b')
              start_40 = find_echo(r'^\s*echo\s+"=== Check 4[0-9]\b', start_30 + 1)
              start_50 = find_echo(r'^\s*echo\s+"=== Check 50\b', start_40 + 1)
              start_60 = find_comment(r'^\s*#\s*===\s*Check 60:\s*forbid t\.Skip\b', start_50 + 1)
              boundaries = (start_30, start_40, start_50, start_60, len(lines))
              if list(boundaries) != sorted(boundaries) or len(set(boundaries)) != len(boundaries):
                  raise SystemExit(f"invalid split boundaries: {boundaries}")

              prefix = lines[:start_30]
              groups = {
                  "30_database.sh": lines[start_30:start_40],
                  "40_api.sh": lines[start_40:start_50],
                  "50_jobs.sh": lines[start_50:start_60],
                  "60_governance.sh": lines[start_60:],
              }
              reconstructed = "".join(prefix) + "".join("".join(groups[name]) for name in requested)
              if reconstructed != assembled:
                  raise SystemExit("consolidation changed manifest execution order")

              prefix_text = "".join(prefix)
              old_root_block = '''# The canonical entrypoint resolves these paths, but assigns them here so
          # the wave-tracker lookup above keeps its original pre-REPO_ROOT behavior.
          SCRIPT_DIR="${ARCH_CI_ENTRYPOINT_DIR}"
          REPO_ROOT="${ARCH_CI_REPO_ROOT}"
          '''
              if old_root_block not in prefix_text:
                  raise SystemExit("bootstrap root-assignment block not found")
              prefix_text = prefix_text.replace(old_root_block, "", 1)

              standalone_header = '''#!/usr/bin/env bash
          set -euo pipefail

          if [ -n "${BASH_SOURCE[0]:-}" ]; then
            SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          else
            echo "CI: cannot resolve architectural checks directory from BASH_SOURCE[0]" >&2
            exit 1
          fi
          REPO_ROOT="$(cd "${SCRIPT_DIR}/../../../.." && pwd)"

          '''
              prefix_text = standalone_header + prefix_text

              helper_old = 'bash "$(dirname "$0")/ci/architecture/checks/'
              helper_new = 'bash "${SCRIPT_DIR}/'
              helper_replacements = 0
              normalized_groups = {}
              for name in requested:
                  content = "".join(groups[name])
                  helper_replacements += content.count(helper_old)
                  normalized_groups[name] = content.replace(helper_old, helper_new)
              if helper_replacements == 0:
                  raise SystemExit("expected helper path references were not found")

              loader = '''
          # Check groups are sourced in their original canonical order.
          for CHECK_MODULE in \\
            "30_database.sh" \\
            "40_api.sh" \\
            "50_jobs.sh" \\
            "60_governance.sh"
          do
            CHECK_PATH="${SCRIPT_DIR}/${CHECK_MODULE}"
            if [ ! -f "${CHECK_PATH}" ]; then
              echo "CI: architectural check module missing: ${CHECK_PATH}" >&2
              exit 1
            fi
            # shellcheck source=/dev/null
            source "${CHECK_PATH}"
          done
          '''

              entrypoint = '''#!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          CHECKS_ENTRYPOINT="${SCRIPT_DIR}/ci/architecture/checks/all_checks.sh"

          if [ ! -f "${CHECKS_ENTRYPOINT}" ]; then
            echo "CI: architectural checks entrypoint missing: ${CHECKS_ENTRYPOINT}" >&2
            exit 1
          fi

          exec bash "${CHECKS_ENTRYPOINT}" "$@"
          '''

              for relative in entries:
                  (arch / relative).unlink()
              manifest_path.unlink()
              bootstrap_path.unlink()

              all_checks_path.write_text(prefix_text.rstrip("\n") + "\n" + loader, encoding="utf-8")
              for name in requested:
                  content = normalized_groups[name]
                  if not content.endswith("\n"):
                      content += "\n"
                  (checks / name).write_text(content, encoding="utf-8")
              entrypoint_path.write_text(entrypoint, encoding="utf-8")

              print("split boundaries:", boundaries)
              print("helper path replacements:", helper_replacements)
              for name in requested:
                  print(name, len((checks / name).read_text(encoding="utf-8").splitlines()))
          PY

            bash -n scripts/ci-architectural-checks.sh
            bash -n scripts/ci/architecture/checks/all_checks.sh
            bash -n scripts/ci/architecture/checks/30_database.sh
            bash -n scripts/ci/architecture/checks/40_api.sh
            bash -n scripts/ci/architecture/checks/50_jobs.sh
            bash -n scripts/ci/architecture/checks/60_governance.sh
            bash scripts/ci-architectural-checks.sh --self-check

            generated_left=$(find scripts/ci/architecture/checks -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sh' -print)
            if [ -n "${generated_left}" ]; then
              echo "unexpected per-check generated modules remain:" >&2
              echo "${generated_left}" >&2
              return 1
            fi

            rm -f .github/workflows/one-shot-consolidate-architecture-checks.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A scripts/ci-architectural-checks.sh scripts/ci/architecture .github/workflows/one-shot-consolidate-architecture-checks.yml
            if git diff --cached --quiet; then
              echo "no consolidation changes"
              return 0
            fi
            git commit -m "refactor(ci): consolidate checks into four modules"
          }

          for attempt in 1 2 3 4 5; do
            echo "publish attempt ${attempt}"
            if generate_split && git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "failed to publish four-module consolidation" >&2
          exit 1

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Four-module consolidation finished with status: ${{ job.status }}.`
            });
