name: Job Kernel AST Cutover

on:
  push:
    paths:
      - .github/workflows/job-kernel-ast-cutover.yml

permissions:
  contents: write
  statuses: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Rewrite job imports and symbols through Go AST
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          post_status() {
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/statuses/$1" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"state":sys.argv[1],"context":sys.argv[2],"description":sys.argv[3]}))' "$2" "$3" "$4")" >/dev/null
          }
          fail_log() {
            local log="$1" stage="$2"
            local summary
            summary=$(grep -m1 -E 'undefined:|import cycle|cannot use|redeclared|build failed|FAIL' "$log" 2>/dev/null | tr -cs 'A-Za-z0-9_.:/- ' '-' | cut -c1-95)
            [ -n "$summary" ] || summary="${stage}-failed"
            post_status "${TRIGGER_SHA}" failure "job-kernel-ast-cutover/${summary}" "$stage failed"
            post_status "${TRIGGER_SHA}" failure "job-kernel-ast-cutover" "$stage failed"
            tail -n 180 "$log"
            exit 1
          }
          post_status "${TRIGGER_SHA}" pending "job-kernel-ast-cutover" "Rewriting job symbols through Go AST"
          git fetch origin main
          git reset --hard origin/main

          python3 <<'PY'
          import json, re
          from pathlib import Path

          kernel = Path('internal/kernel/job/errors.go')
          text = kernel.read_text(encoding='utf-8')
          sentinels = {
              'ErrFinalizeAttemptOutcomeInvalid': 'FinalizeAttempt: outcome not in canonical enum {Succeeded, FailedPermanent, ScheduleRetry} (fail-closed guard at fence)',
              'ErrFinalizeAttemptResultMissing': 'FinalizeAttempt: SUCCEEDED outcome requires non-empty Result (wire-consistency guard)',
              'ErrFinalizeAttemptErrorMissing': 'FinalizeAttempt: non-SUCCEEDED outcome requires non-empty ErrorMessage (silent-empty error trap)',
              'ErrFinalizeAttemptArtifactStale': 'FinalizeAttempt: artifact-state patch stale (row missing, job-id mismatch, or already-terminal state)',
              'ErrFinalizeAttemptOutboxEventMissing': 'FinalizeAttempt: outbox event missing required Type or EventKey (uniqueness invariant)',
              'ErrFinalizeAttemptDLQIncompatible': 'FinalizeAttempt: DLQPayload is only valid with FAILED_PERMANENT or SCHEDULE_RETRY outcomes (terminal-failure invariant)',
          }
          for name, message in sentinels.items():
              if f'var {name} ' not in text:
                  text += f'\n// {name} is the canonical job-kernel sentinel.\nvar {name} = errors.New({json.dumps(message)})\n'
          kernel.write_text(text, encoding='utf-8')

          compat = Path('internal/domain/job/errors.go')
          text = compat.read_text(encoding='utf-8')
          for name in sentinels:
              text = re.sub(rf'var {name} = errors\.New\([^\n]+\)', f'var {name} = kerneljob.{name}', text)
          if 'errors.New(' not in text:
              text = text.replace('\t"errors"\n\n', '')
          compat.write_text(text, encoding='utf-8')
          PY

          cat >/tmp/job_ast_cutover.go <<'GO'
          package main

          import (
            "fmt"
            "go/ast"
            "go/format"
            "go/parser"
            "go/token"
            "os"
            "path/filepath"
            "sort"
            "strconv"
            "strings"
          )

          const oldPath = "github.com/Marcuss-ops/PipelineGen/internal/domain/job"
          const kernelPath = "github.com/Marcuss-ops/PipelineGen/internal/kernel/job"
          const domainBase = "github.com/Marcuss-ops/PipelineGen/internal/domain/"

          type destination struct { owner, symbol, alias string }

          var symbols = map[string]destination{
            "TypeMediaExtract": {"media", "TypeExtract", "jobmedia"},
            "TypeMediaStock": {"media", "TypeStock", "jobmedia"},
            "TypeArtlistRun": {"media", "TypeArtlistRun", "jobmedia"},
            "TypeMediaGenerate": {"media", "TypeGenerate", "jobmedia"},
            "TypeMediaReindex": {"media", "TypeReindex", "jobmedia"},
            "TypeMediaEnrich": {"media", "TypeEnrich", "jobmedia"},
            "TypeBulkUploadYouTubeClips": {"media", "TypeBulkUploadYouTubeClips", "jobmedia"},
            "TypeMediaCurate": {"media", "TypeCurate", "jobmedia"},
            "TypeClipRegister": {"media", "TypeClipRegister", "jobmedia"},
            "TypeMediaStockRLMEnrich": {"media", "TypeStockRLMEnrich", "jobmedia"},
            "TypeVoiceoverBatch": {"voiceover", "TypeBatch", "jobvoiceover"},
            "TypeVoiceoverGenerate": {"voiceover", "TypeGenerate", "jobvoiceover"},
            "TypeVoiceoverGenerateItem": {"voiceover", "TypeGenerateItem", "jobvoiceover"},
            "TypeVoiceoverPromo": {"voiceover", "TypePromo", "jobvoiceover"},
            "TypeSubtitleGenerate": {"subtitle", "TypeGenerate", "jobsubtitle"},
            "TypeRenderVideo": {"video", "TypeRender", "jobvideo"},
            "TypeVideoGenerate": {"video", "TypeGenerate", "jobvideo"},
            "TypeYouTubeUpload": {"youtube", "TypeUpload", "jobyoutube"},
            "TypeYouTubeClipExtract": {"youtube", "TypeClipExtract", "jobyoutube"},
            "TypeYouTubeClipExtractImportant": {"youtube", "TypeClipExtractImportant", "jobyoutube"},
            "TypeYouTubeRebuildST": {"youtube", "TypeRebuildSearchText", "jobyoutube"},
            "TypeCatalogSync": {"catalog", "TypeSync", "jobcatalog"},
            "TypeSystemCleanup": {"system", "TypeCleanup", "jobsystem"},
            "TypeBooksProcess": {"books", "TypeProcess", "jobbooks"},
            "TypeLessonsProcess": {"lessons", "TypeProcess", "joblessons"},
            "TypeScriptGenerate": {"script", "TypeGenerate", "jobscript"},
            "TypeScriptVoiceoverSibling": {"script", "TypeVoiceoverSibling", "jobscript"},
            "TypeScriptImageSibling": {"script", "TypeImageSibling", "jobscript"},
            "TypeScriptGenerateItem": {"script", "TypeGenerateItem", "jobscript"},
            "TypeDriveFolderSync": {"drive", "TypeFolderSync", "jobdrive"},
            "TypeImagesGenerate": {"image", "TypeImagesGenerate", "jobimage"},
            "TypeImageGenerateGoogle": {"image", "TypeGenerateGoogle", "jobimage"},
            "TypeDocumentGenerate": {"document", "TypeGenerate", "jobdocument"},
            "TypeAssetsResolve": {"asset", "TypeResolve", "jobasset"},
            "TypeAssetTextMaterialize": {"asset", "TypeTextMaterialize", "jobasset"},
          }

          func importAlias(spec *ast.ImportSpec, path string) string {
            if spec.Name != nil { return spec.Name.Name }
            return filepath.Base(path)
          }

          func main() {
            changed := map[string]bool{}
            roots := []string{"internal", "pkg", "cmd"}
            for _, root := range roots {
              _ = filepath.WalkDir(root, func(path string, d os.DirEntry, err error) error {
                if err != nil { return nil }
                clean := filepath.ToSlash(path)
                if d.IsDir() {
                  base := d.Name()
                  if base == "vendor" || base == "node_modules" || base == "testdata" || clean == "cmd/archcheck" { return filepath.SkipDir }
                  return nil
                }
                if !strings.HasSuffix(path, ".go") || strings.HasSuffix(path, "_test.go") || strings.HasPrefix(clean, "cmd/archcheck/") { return nil }
                fset := token.NewFileSet()
                file, parseErr := parser.ParseFile(fset, path, nil, parser.ParseComments)
                if parseErr != nil { return fmt.Errorf("parse %s: %w", path, parseErr) }

                existing := map[string]string{}
                jobAliases := map[string]*ast.ImportSpec{}
                for _, spec := range file.Imports {
                  p, _ := strconv.Unquote(spec.Path.Value)
                  alias := importAlias(spec, p)
                  existing[p] = alias
                  if p == oldPath || p == kernelPath { jobAliases[alias] = spec }
                }
                if len(jobAliases) == 0 { return nil }

                needed := map[string]string{}
                didChange := false
                ast.Inspect(file, func(n ast.Node) bool {
                  sel, ok := n.(*ast.SelectorExpr)
                  if !ok { return true }
                  ident, ok := sel.X.(*ast.Ident)
                  if !ok { return true }
                  if _, ok := jobAliases[ident.Name]; !ok { return true }
                  dst, ok := symbols[sel.Sel.Name]
                  if !ok { return true }
                  ownerPath := domainBase + dst.owner
                  alias := existing[ownerPath]
                  if alias == "" { alias = dst.alias; existing[ownerPath] = alias; needed[ownerPath] = alias }
                  ident.Name = alias
                  sel.Sel.Name = dst.symbol
                  didChange = true
                  return true
                })

                // Every surviving generic job selector belongs to the kernel.
                for _, spec := range jobAliases {
                  p, _ := strconv.Unquote(spec.Path.Value)
                  if p == oldPath { spec.Path.Value = strconv.Quote(kernelPath); didChange = true }
                }

                if len(needed) > 0 {
                  var decl *ast.GenDecl
                  for _, d := range file.Decls {
                    if gd, ok := d.(*ast.GenDecl); ok && gd.Tok == token.IMPORT { decl = gd; break }
                  }
                  if decl == nil {
                    decl = &ast.GenDecl{Tok: token.IMPORT, Lparen: token.Pos(1)}
                    file.Decls = append([]ast.Decl{decl}, file.Decls...)
                  }
                  paths := make([]string, 0, len(needed))
                  for p := range needed { paths = append(paths, p) }
                  sort.Strings(paths)
                  for _, p := range paths {
                    decl.Specs = append(decl.Specs, &ast.ImportSpec{Name: ast.NewIdent(needed[p]), Path: &ast.BasicLit{Kind: token.STRING, Value: strconv.Quote(p)}})
                  }
                  didChange = true
                }

                // Remove job imports whose alias has no selectors after the rewrite.
                used := map[string]bool{}
                ast.Inspect(file, func(n ast.Node) bool {
                  sel, ok := n.(*ast.SelectorExpr)
                  if !ok { return true }
                  if ident, ok := sel.X.(*ast.Ident); ok { used[ident.Name] = true }
                  return true
                })
                for _, d := range file.Decls {
                  gd, ok := d.(*ast.GenDecl)
                  if !ok || gd.Tok != token.IMPORT { continue }
                  specs := gd.Specs[:0]
                  for _, raw := range gd.Specs {
                    spec := raw.(*ast.ImportSpec)
                    p, _ := strconv.Unquote(spec.Path.Value)
                    alias := importAlias(spec, p)
                    if (p == oldPath || p == kernelPath) && !used[alias] { didChange = true; continue }
                    specs = append(specs, raw)
                  }
                  gd.Specs = specs
                }
                decls := file.Decls[:0]
                for _, d := range file.Decls {
                  if gd, ok := d.(*ast.GenDecl); ok && gd.Tok == token.IMPORT && len(gd.Specs) == 0 { continue }
                  decls = append(decls, d)
                }
                file.Decls = decls

                if !didChange { return nil }
                out, createErr := os.Create(path)
                if createErr != nil { return createErr }
                if formatErr := format.Node(out, fset, file); formatErr != nil { out.Close(); return formatErr }
                if closeErr := out.Close(); closeErr != nil { return closeErr }
                changed[clean] = true
                return nil
              })
            }
            changed["internal/kernel/job/errors.go"] = true
            changed["internal/domain/job/errors.go"] = true
            list := make([]string, 0, len(changed))
            for path := range changed { list = append(list, path) }
            sort.Strings(list)
            _ = os.WriteFile("/tmp/job-ast-changed.txt", []byte(strings.Join(list, "\n")+"\n"), 0o644)
            fmt.Printf("changed_files=%d\n", len(list))
          }
          GO

          go run /tmp/job_ast_cutover.go
          mapfile -t changed_files < /tmp/job-ast-changed.txt
          gofmt -w "${changed_files[@]}"
          mapfile -t dirs < <(printf '%s\n' "${changed_files[@]}" | xargs -n1 dirname | sort -u)
          package_args=()
          for dir in "${dirs[@]}"; do package_args+=("./${dir}"); done

          compile_log=/tmp/job-ast-compile.log
          if ! go test -run '^$' "${package_args[@]}" >"${compile_log}" 2>&1; then
            fail_log "${compile_log}" compile
          fi

          python3 <<'PY'
          import json, re
          from pathlib import Path
          OLD = 'github.com/Marcuss-ops/PipelineGen/internal/domain/job'
          import_line = re.compile(r'^\s*(?:import\s+)?(?:(?:[A-Za-z_][A-Za-z0-9_]*|\.|_)\s+)?["`]')
          remaining = []
          for root in map(Path, ('internal','pkg','cmd')):
              if not root.exists(): continue
              for path in root.rglob('*.go'):
                  rel = path.as_posix()
                  if path.name.endswith('_test.go') or rel.startswith('cmd/archcheck/'):
                      continue
                  for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if OLD in line and import_line.match(line): remaining.append({'file': rel, 'line': line_no})
          migration = Path('architecture/job_kernel_migration.json')
          data = json.loads(migration.read_text())
          data['reported_baseline_imports'] = len(remaining)
          migration.write_text(json.dumps(data, indent=2) + '\n')
          Path('architecture/job_kernel_ast_report.json').write_text(json.dumps({'remaining_imports': len(remaining), 'remaining_sites': remaining}, indent=2) + '\n')
          if remaining:
              raise SystemExit(f'{len(remaining)} compatibility imports remain after AST cutover')
          PY

          rm -f architecture/job_kernel_batch_report.json architecture/job_kernel_semantic_report.json
          git rm -f .github/workflows/job-kernel-semantic-cutover.yml || true
          git rm -f .github/workflows/job-kernel-semantic-stabilize.yml || true
          git rm .github/workflows/job-kernel-ast-cutover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(job): complete production cutover to canonical owners"
          git pull --rebase origin main
          git push origin HEAD:main
          final_sha=$(git rev-parse HEAD)
          post_status "${TRIGGER_SHA}" success "job-kernel-ast-cutover" "Production compatibility imports reached zero"
          post_status "${final_sha}" success "job-kernel-ast-cutover" "AST cutover compiled and published"
