title = "PipelineGen gitleaks allowlist — BUILD-03 classification (2026-10-16)"

# The 2026-10-10/16 secret audit reported 17 findings from the full-tree scan
# (`gitleaks detect --source . --no-git`). Every one was classified manually:
# all 17 are false positives (test fixtures, deterministic idempotency keys,
# Google Drive folder IDs and the public jwt.io demo token). NO real credential
# was found, so no rotation is required. Each entry below allowlists exactly one
# observed literal — new secret-shaped strings are still reported. Do NOT widen
# these patterns into file or rule-level exclusions.

[allowlist]
description = "Single-finding, literal-anchored allowlist (see per-entry classification)"
