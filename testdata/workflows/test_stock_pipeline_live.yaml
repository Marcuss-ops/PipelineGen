name: test_stock_pipeline_live

# Manual-only trigger per docs/operations/stock-e2e-runbook.md §6 ("Policy
# for live batteries (binding)"). The live battery hits yt-dlp + Drive
# writes, which write to the media SSOT and to external storage --
# side-effect-heavy, so it NEVER belongs in PR/push scheduling. The DSL
# interprets this triggers line as the only allowed trigger shape: any line
# that introduces an automatic trigger is a policy violation.
triggers: [workflow_dispatch]

defaults:
  mode: verify
  output_dir: /tmp/stock-pipeline-live-test

steps:
  - id: preflight_token
    type: env_check
    requires_var: VELOX_ADMIN_TOKEN
    on_missing: fail
    note: |
      Bearer token is REQUIRED for /api/stock-pipeline/run and
      /api/jobs/<id>/full. The script falls back to .env lookup
      but exit-2 if neither resolves.

  - id: preflight_server
    type: http
    endpoint: "GET http://localhost:${VELOX_PORT:-8000}/health"
    expect_status: 200
    timeout_seconds: 5
    on_fail: fail
    note: |
      Server MUST boot with VELOX_FEATURE_STOCK_PIPELINE_ENABLED=true
      for this battery's /run + /jobs/... routes to be mounted.

  - id: preflight_db
    type: file_check
    path: "${DB_PATH:-data/media/media.db.sqlite}"
    on_missing: fail
    note: |
      Canonical SQLite media_assets + outbox_events source.

  - id: live_battery
    uses: shell.bash
    # Canonical live driver. The former scripts/tests/stock_pipeline_live_test.sh
    # was deleted by commit 7e6965aab; the tracked replacement is the 10-step
    # pipeline E2E battery (`make verify-pipeline-e2e-live`).
    command: bash ${LIVE_BATTERY_PATH:-tests/operational/pipeline_live_e2e.sh}
    env:
      DRIVE_ROOT_FOLDER_ID: "${DRIVE_ROOT_FOLDER_ID:-}"
      STOCK_DIRECT_URL: "${STOCK_DIRECT_URL:-}"
      VIDEO_URL: "${VIDEO_URL:-}"
      PIPELINE_E2E_YT_QUERY: "${PIPELINE_E2E_YT_QUERY:-Muhammad Ali boxing}"
      PIPELINE_E2E_STOCK_QUERY: "${PIPELINE_E2E_STOCK_QUERY:-city skyline technology b-roll}"
      PIPELINE_E2E_POLL_TIMEOUT_SECONDS: "${PIPELINE_E2E_POLL_TIMEOUT_SECONDS:-600}"
    # The battery's terminal summary line is `<n>/10 PASS` (or
    # `<n>/10 PASS — the gate requires 10/10`), and it exits 0 only at 10/10.
    # The substring anchors the summary; the exit code is the hard gate.
    wait:
      interval_ms: 10000
      # Budget for two job polls (YouTube extract + Stock) at up to 600s each
      # plus the >100 KB download + ffprobe leg.
      timeout_seconds: 1800
      success_substring: "/10 PASS"
      success_exit_code: 0
      failure_substring: "PASS — the gate requires 10/10"
      failure_exit_code_min: 1
    on_pass: continue
    on_fail: fail
    note: |
      Run the live 10-step battery: YouTube discovery -> metadata ->
      clips/process -> Drive hierarchy -> catalog retrieval, then Stock
      /run -> /search-and-run -> Drive artifact -> catalog retrieval +
      real download -> idempotent replay. Requires VELOX_ADMIN_TOKEN (or
      TOKEN_FILE), DRIVE_ROOT_FOLDER_ID and STOCK_DIRECT_URL; artifacts
      persist under tests/operational/results/pipeline-live/.

  - id: report_verdict
    type: shell.bash
    # The battery does NOT write a `verdict_line.txt`; its terminal summary
    # (`n/10 PASS`, the failing-step list and the retained-artifact dir) is
    # printed on stdout and captured in the run log. Surface it via `tail|grep`
    # on whichever log file the operator's `tee` captures.
    command: |
      set +e
      log_file=$(ls -1t ${defaults.output_dir}/*.log 2>/dev/null | head -n 1)
      if [ -z "$log_file" ]; then
        echo "WARN: no log file under ${defaults.output_dir} (operator should inspect artifacts dir)"
        exit 0
      fi
      echo "-> verdict line from $log_file:"
      grep -E '^(failed  :|[0-9]+/10 PASS)' "$log_file" | tail -n 2
      echo
      echo "-> last 10 lines of $log_file (for ticket paste):"
      tail -n 10 "$log_file"
    note: |
      Surface the canonical verdict for ticket paste. Operator can inspect
      tests/operational/results/pipeline-live/ to triage any FAIL line per
      docs/operations/stock-e2e-runbook.md §2.
